<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ใกล้บ้าน vs ไกลบ้าน | แนะให้แนว</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cost-game-data.js"></script>
<style>
/* เกมเทียบค่าใช้จ่าย 4 ปี: คอลัมน์เดียวขนาดมือถือ เขียวสนแบบแนะให้แนว  ฝั่งเอกชน = ส้ม  ฝั่งรัฐ = ฟ้า */
:root{
  /* โทนสดใส: มินต์-เทอร์คอยส์ + เหลืองมะม่วง  ทาง A = ส้มปะการัง  ทาง B = ฟ้าสด */
  --pine:#0B8F7A; --pine-d:#0B5D63; --pine-soft:#DDF7EF; --ink:#1E2A33; --muted:#52606B; --ground:#FFF8EC;
  --line:#E6DFD2; --amber:#FFC23C; --amber-soft:#FFF0C7; --warn:#A33A12; --warn-soft:#FFE6DA;
  --priv:#E8590C; --priv-soft:#FFEADF; --pub:#1C7ED6; --pub-soft:#E1F0FF;
  --display:'Sarabun','Noto Sans Thai','Leelawadee UI','Thonburi','Tahoma',sans-serif; --body:'Sarabun','Noto Sans Thai','Leelawadee UI','Thonburi','Tahoma',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-y:scroll;scrollbar-gutter:stable;overflow-anchor:none;touch-action:manipulation;background:#FFF8EC}
body,#app{overflow-anchor:none}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{margin:0;background:var(--ground) radial-gradient(circle at 100% 0,#FFE9B8 0,transparent 260px) no-repeat;color:var(--ink);font:16px/1.6 var(--body);min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) 48px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.35}
p{margin:6px 0}
.muted{color:var(--muted);font-size:14px}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 3px 0 #F0E6D3,0 6px 18px rgba(30,42,51,.06)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:14px;box-shadow:0 4px 0 #E09A00;background:var(--amber);color:var(--ink);font:700 18px var(--display);cursor:pointer;text-align:center;text-decoration:none;padding:12px}
.btn.pine{background:var(--pine);color:#fff;box-shadow:0 4px 0 #06695A}
.btn.ghost{background:#fff;border:2px solid var(--pine);color:var(--pine);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer;min-height:44px;padding:0 4px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
input{min-height:48px;font:17px var(--body);padding:0 12px;border:1px solid #C9D4CE;border-radius:10px;color:var(--ink);width:100%}
.note{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:15px}
.tip{background:var(--pine-soft);color:var(--pine-d);border-radius:12px;padding:10px 12px;font-size:15px}
.hero{background:linear-gradient(135deg,#0B8F7A 0%,#12B5A0 55%,#3FC1C9 100%);color:#fff;border-radius:0 0 22px 22px;margin:-16px -16px 0;padding:20px 20px 24px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600}
.pill.priv{background:var(--priv-soft);color:var(--priv)} .pill.pub{background:var(--pub-soft);color:var(--pub)}
.step{font-size:13px;color:var(--muted);font-weight:600}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;font:16px var(--body);color:var(--ink);text-align:left;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--pine);background:var(--pine-soft)}
.opt .ic{font-size:26px;width:36px;text-align:center;flex-shrink:0}
.opt small{display:block;color:var(--muted);font-size:13px}
.opt.priv[aria-pressed="true"]{border-color:var(--priv);background:var(--priv-soft)}
.opt.pub[aria-pressed="true"]{border-color:var(--pub);background:var(--pub-soft)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side{border-radius:14px;padding:12px;min-height:86px}
.side.priv{background:var(--priv-soft);border:2px solid var(--priv)}
.side.pub{background:var(--pub-soft);border:2px solid var(--pub)}
.side b{font-family:var(--display);font-weight:700;font-size:20px;display:block;font-variant-numeric:tabular-nums}
.side .lb{font-size:13px;color:var(--muted)}
.flip{background:linear-gradient(140deg,#0B5D63 0%,#0B8F7A 100%);color:#fff;box-shadow:inset 0 0 0 3px rgba(255,194,60,.55);border-radius:14px;padding:20px;text-align:center;font-family:var(--display);font-size:20px}
.ans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ans button{min-height:56px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:600;font:15px var(--body);cursor:pointer;color:var(--ink)}
.ans .a1{border-color:var(--priv);color:var(--priv);background:var(--priv-soft)} .ans .a2{border-color:var(--pub);color:var(--pub);background:var(--pub-soft)}
.bar{height:26px;border-radius:8px;background:#E6ECE8;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:8px;transition:width .8s}
.bar.priv>i{background:var(--priv)} .bar.pub>i{background:var(--pub)}
.big{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.2}
.ev{border-radius:16px;padding:16px;background:#FFFBF0;border:2px dashed var(--amber)}
.ev .ic{font-size:34px}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--amber)}
table.br{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.br th,table.br td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
table.br th:first-child,table.br td:first-child{text-align:left}
table.br thead th{font-family:var(--display);font-weight:700}
.talk{border:3px solid var(--pine);box-shadow:0 6px 0 var(--pine-soft);border-radius:18px;background:#fff;padding:16px}
.src{font-size:12px;color:var(--muted);line-height:1.5}
.src a{color:var(--muted)}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:#fff;font:15px var(--body);cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.demo~.stack>.hero{margin-top:0;border-radius:22px}
.demo{background:var(--amber);color:var(--ink);text-align:center;font-size:14px;font-weight:600;border-radius:10px;padding:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.show{opacity:1}
.enter{animation:none}
@keyframes enter{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.noprint{display:none!important} body{background:#fff}}
</style>
</head>
<body>
<div id="app" aria-live="polite"><p class="muted">กำลังโหลด…</p></div>
<div id="toast" role="status"></div>
<script>
const SUPABASE_URL = "https://ikkhjslmtjwrxzxvtokb.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlra2hqc2xtdGp3cnh6eHZ0b2tiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NDMzNjksImV4cCI6MjA5OTMxOTM2OX0.3OR_9mEv82Ns1LLjx5nnRwJYzrtKFtWCWd1bPuQfNKU";
const EMAIL_DOMAIN = "guidance-pcw.local";
const sb = supabase.createClient(SUPABASE_URL, ANON_KEY);
const C = window.CG, baht = C.baht;
const DEMO = new URLSearchParams(location.search).has("demo");
const $ = document.getElementById("app");
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const GUESS = {private:"เอกชนใกล้บ้านถูกกว่า", public:"รัฐ (อยู่หอ) ถูกกว่า", same:"พอ ๆ กัน"};
let profile = null, G = null;

function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),3500)}
function errText(e){const m=(e&&e.message)||"";if(/Failed to fetch|NetworkError|network/i.test(m))return "เน็ตหลุด ลองใหม่อีกครั้งนะ";return m||"เกิดข้อผิดพลาด ลองใหม่อีกครั้ง"}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newGame(){
  return {screen:"intro", saved:false, pre:null, track:null, priv:null, pub:null, housing:null, cA:defCustom(), cB:defCustom(),
    my:Object.assign({}, C.DEFAULTS), preset:"mix", reveal:0, picks:[], events:[], evShown:0,
    reason:null, post:null, talk:null,
    goal:null, q:{pre:[null,null,null,null,null],post:[null,null,null,null,null]}, self:{preCost:null,preTalk:null,postCost:null,postTalk:null}, goalMet:null, preDone:false, postDone:false};
}

/* ---------- เข้าสู่ระบบ ---------- */
async function boot(){
  G = newGame();
  if(DEMO){profile={display_name:"โหมดสาธิต",class_room:"ฉายขึ้นจอ"};return render()}
  const {data:{session}} = await sb.auth.getSession();
  if(!session){G.screen="login";return render()}
  const {data:p} = await sb.from("profiles").select("id,display_name,role,class_room").eq("id",session.user.id).maybeSingle();
  if(!p){await sb.auth.signOut();G.screen="login";G.msg="ไม่พบข้อมูลผู้ใช้";return render()}
  profile = p;
  if(p.role!=="student"){G.screen="notStudent";return render()}
  const {data:row} = await sb.from("cost_game_plays").select("pre_guess,play_count,pre_score,post_score,goal").eq("academic_year",C.YEAR).maybeSingle();
  if(row){G.pre=row.pre_guess;G.playCount=row.play_count;G.preDone=row.pre_score!=null;G.postDone=row.post_score!=null;G.preScore=row.pre_score;G.postScore=row.post_score;G.goal=row.goal}
  render();
}
async function doLogin(ev){
  ev.preventDefault();
  const u=document.getElementById("liUser").value.trim(), pw=document.getElementById("liPass").value;
  if(!u||!pw){G.msg="กรอกรหัสนักเรียนและรหัสผ่านก่อนนะ";return render()}
  document.getElementById("btnLogin").disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:u+"@"+EMAIL_DOMAIN,password:pw});
  if(error){G.msg=/fetch/i.test(error.message)?"เน็ตหลุด ลองใหม่อีกครั้งนะ":"รหัสนักเรียนหรือรหัสผ่านไม่ถูกต้อง";return render()}
  boot();
}
async function logout(){await sb.auth.signOut();location.reload()}

/* ---------- ขั้นตอนเกม ---------- */
function go(s){G.screen=s;render();window.scrollTo(0,0)}
function pickGuess(k){
  if(G.pre&&G.preDone){return go("track")}
  G.preTry=G.pre||k;go("pretest");
}
/* แบบทดสอบก่อน-หลัง 5 ข้อ (ข้อชุดเดียวกัน) + ประเมินตนเอง 2 ข้อ */
const QUIZ=[
 {q:"คิดค่าใช้จ่ายเรียนมหาวิทยาลัย 4 ปี ควรนับอะไรบ้างให้ครบ?",o:["ค่าเทอมอย่างเดียว","ค่าเทอม + ที่พัก + ค่ากิน + ค่าเดินทาง","ค่าเทอม + ค่าหอ เท่านั้น"],a:1},
 {q:"\"ค่าเทอมเหมาจ่าย\" หมายถึงอะไร?",o:["รวมค่ากิน ค่าหอ ค่ารถ ไว้หมดแล้ว","จ่ายครั้งเดียวจบทั้ง 4 ปี","รวมค่าเรียนกับค่าธรรมเนียมหลักต่อเทอม แต่ยังไม่รวมค่ากิน ที่พัก และเดินทาง"],a:2},
 {q:"ถ้าไป-กลับจากบ้านทุกวัน ค่าที่คนมักลืมนับคืออะไร?",o:["ค่าเดินทางที่สะสมตลอด 4 ปี และเวลาที่เสียบนรถ","ค่าหนังสือเรียน","ค่าชุดนักศึกษา"],a:0},
 {q:"วิธีเทียบ 2 ทางให้ยุติธรรมที่สุดคือข้อไหน?",o:["เทียบเฉพาะค่าเทอมต่อเทอม","นับหมวดค่าใช้จ่ายเดียวกันและนับ 4 ปีเท่ากันทั้งสองทาง","เลือกทางที่ค่าเทอมถูกที่สุดเลย"],a:1},
 {q:"ถ้ายอดรวม 2 ทางต่างกันน้อยมาก (ไม่ถึง 5%) ควรทำอย่างไร?",o:["เลือกทางที่ถูกกว่าทันที","จับสลากเลือก","ดูเรื่องอื่นประกอบ เช่น เวลา ความปลอดภัย ความถนัด แล้วคุยกับที่บ้าน"],a:2}];
const GOALS={know_cost:"รู้ว่า 4 ปีต้องจ่ายอะไรบ้าง",compare:"เทียบ 2 ทางให้ได้อย่างยุติธรรม",talk_parents:"มีตัวเลขไปคุยกับที่บ้าน",choose:"ตัดสินใจเลือกทางให้ได้"};
const SELF_COST="ฉันคิดค่าใช้จ่ายเรียน 4 ปีได้ครบทุกหมวด", SELF_TALK="ฉันพร้อมเอาตัวเลขไปคุยกับผู้ปกครอง";
const LV=["ยังไม่ได้เลย","ได้นิดหน่อย","ได้ค่อนข้างดี","ได้ดีมาก"];
const quizScore=a=>a.reduce((n,v,i)=>n+(v===QUIZ[i].a?1:0),0);
function setQ(w,i,j){G.q[w][i]=j;render()}
function setSelf(k,v){G.self[k]=v;render()}
function pickGoal(k){G.goal=k;render()}
function pickGoalMet(k){G.goalMet=k;render()}
const quizHtml=w=>QUIZ.map((it,i)=>`<div class="stack" style="gap:6px"><b>${i+1}. ${it.q}</b>${it.o.map((t,j)=>`<button class="opt" aria-pressed="${G.q[w][i]===j}" onclick="setQ('${w}',${i},${j})"><span>${t}</span></button>`).join("")}</div>`).join("");
const rateHtml=(label,k)=>`<div class="stack" style="gap:6px"><b>${label}</b><div class="chips">${LV.map((t,i)=>`<button class="chip" aria-pressed="${G.self[k]===i+1}" onclick="setSelf('${k}',${i+1})">${t}</button>`).join("")}</div></div>`;
async function submitPre(){
  const pre={goal:G.goal,score:quizScore(G.q.pre),self_cost:G.self.preCost,self_talk:G.self.preTalk};
  G.preScore=pre.score;
  if(DEMO){G.pre=G.preTry;G.preDone=true;return go("track")}
  G.preSaving=true;render();
  const {data,error}=await sb.rpc("cost_game_start",{p_guess:G.preTry,p_year:C.YEAR,p_pre:pre});
  G.preSaving=false;
  if(error){G.pre=G.preTry;G.offline=true;G.preDone=true;toast(errText(error)+" — เล่นต่อได้ ค่อยส่งผลตอนจบ")}
  else{G.pre=data.pre_guess;G.preDone=true;G.preScore=data.pre_score!=null?data.pre_score:pre.score}
  go("track");
}
/* ---------- กรอกเอง (ทาง A / B) : เก็บชื่อที่พิมพ์ไว้ในเครื่องเท่านั้น ส่งขึ้นระบบเฉพาะยอดรวมกับรหัส custom_a / custom_b ---------- */
function defCustom(){return {name:"",sem:"",fixed:"",h:"dorm_out",rent:"",dfee:"",trip:"",py:"",hrs:""}}
const CLIM={sem:500000,fixed:500000,rent:100000,dfee:200000,trip:20000,py:24,hrs:48};
const cnum=(v,max)=>{v=Number(v);return isFinite(v)&&v>0?Math.min(v,max):0};
const cfill=v=>String(v??"").trim()!=="";
function setC(w,k,v){G["c"+w][k]=v}
function pickCustom(w){if(w==="A"){G.priv="custom_a"}else{G.pub="custom_b";G.housing=G.cB.h}render()}
function setCH(h){G.cB.h=h;G.housing=h;render()}
function regCustom(w){
  const c=G["c"+w],name=String(c.name||"").trim().slice(0,40);
  if(!name)return "ใส่ชื่อมหาวิทยาลัย/สาขาก่อนนะ";
  if(!cfill(c.sem)||cnum(c.sem,CLIM.sem)<=0)return "ใส่ค่าเทอมต่อเทอม (มากกว่า 0)";
  const sem=cnum(c.sem,CLIM.sem),fixed=0;
  if(w==="A"){
    C.U.custom_a={name,short:name,place:"ข้อมูลกรอกเอง",type:"custom",zone:"near",housing:["home"],seniors:"-",src:"custom",dormSrc:"custom",rentSrc:"custom"};
    C.P.custom_a={u:"custom_a",name:"กรอกเอง",sem,fixed,field:"custom"};
    return "";
  }
  const u={name,short:name,place:"ข้อมูลกรอกเอง",type:"custom",zone:"near",housing:[c.h],seniors:"-",src:"custom",dormSrc:"custom",rentSrc:"custom",utilOut:0};
  if(c.h==="dorm_in"){
    if(!cfill(c.dfee))return "ใส่ค่าหอต่อเทอม (ถ้าไม่มี ใส่ 0)";
    u.dormIn={fee:cnum(c.dfee,CLIM.dfee),util:0,label:"ค่าหอที่กรอกเอง"};
  }else if(c.h==="dorm_out"){
    if(!cfill(c.rent))return "ใส่ค่าที่พักต่อเดือน (รวมน้ำไฟ ถ้าไม่มี ใส่ 0)";
    u.rent=cnum(c.rent,CLIM.rent);
  }
  if(c.h!=="home"){
    if(!cfill(c.trip)||!cfill(c.py)||!cfill(c.hrs))return "ใส่ค่ากลับบ้านต่อครั้ง จำนวนครั้งต่อปี และเวลาต่อเที่ยว (ไม่กลับเลย ใส่ 0)";
    u.zone="far";u.trip={cost:cnum(c.trip,CLIM.trip),hours:cnum(c.hrs,CLIM.hrs)};u.tripPerYear=cnum(c.py,CLIM.py);
  }
  C.U.custom_b=u;
  C.P.custom_b={u:"custom_b",name:"กรอกเอง",sem,fixed,field:"custom"};
  G.housing=c.h;
  return "";
}
function nextFromPriv(){if(G.priv==="custom_a"){const e=regCustom("A");if(e)return toast(e)}go("pub")}
function nextFromPub(){if(G.pub==="custom_b"){const e=regCustom("B");if(e)return toast(e)}go("home")}
const cfld=(w,k,label,ph,text)=>`<label>${label}<input ${text?'type="text" maxlength="40" autocomplete="off"':'type="number" inputmode="decimal" min="0"'} value="${esc(G["c"+w][k])}" placeholder="${esc(ph||"")}" oninput="setC('${w}','${k}',this.value)"></label>`;
const CNOTE=`<p class="muted" style="margin:0">ชื่อที่พิมพ์อยู่แค่ในเครื่องเรา ไม่ถูกส่งขึ้นระบบ ระบบเก็บเฉพาะยอดรวม</p>`;
function customFormA(){return `<section class="card stack" style="gap:8px"><h3 style="font-size:17px">✏️ กรอกข้อมูลทาง A เอง</h3>
  ${cfld("A","name","ชื่อมหาวิทยาลัย / สาขา","เช่น ม.… คณะ…",true)}
  ${cfld("A","sem","ค่าเทอมต่อเทอม (บาท)","เช่น 20000")}

function pickTrack(k){G.track=k;const t=C.TRACKS[k];G.priv=t.priv.length===1?t.priv[0]:null;G.pub=null;G.housing=null;go("priv")}
function pickPriv(k){G.priv=k;render()}
function pickPub(k){G.pub=k;const u=C.U[C.P[k].u];G.housing=u.housing.includes("dorm_in")?"dorm_in":u.housing[0];render()}
function pickHousing(h){G.housing=h;render()}
function setPreset(k){const p=C.COMMUTE_PRESETS.find(x=>x.k===k);G.preset=k;G.my.commute=p.v;render()}
function setMy(k,v){v=Number(v);if(!isFinite(v)||v<0)v=0;G.my[k]=Math.min(v,k==="hours"?8:2000);if(k==="commute")G.preset=null;}
function startReveal(){
  ["commute","hours","lunch","dormFood","homeFood"].forEach(k=>{const el=document.getElementById("in_"+k);if(el)setMy(k,el.value)});
  G.reveal=0;G.picks=[];G.base=totals(false);go("reveal")
}

function sideParams(withEvents){
  const init={both:0,months:C.K.dormMonths,tripMult:1,share:false,forceIn:false};
  const pv=Object.assign({},init,G.my), pb=Object.assign({},init,G.my);
  if(withEvents){
    G.events.slice(0,G.evShown).forEach(e=>{
      if(e.side==="home"||e.side==="both")e.fx(pv);
      if(e.side==="both"||(e.side==="home"&&G.housing==="home")||(e.side==="dorm"&&G.housing!=="home"))e.fx(pb);
    });
  }
  return {pv,pb};
}
function totals(withEvents){
  const {pv,pb}=sideParams(withEvents);
  return {a:C.calc(G.priv,"home",pv), b:C.calc(G.pub,G.housing,pb)};
}
const CATS=[["tuition","ค่าเทอม 4 ปี","📚"],["stay","ค่าที่พัก 4 ปี","🛏️"],["food","ค่ากิน 4 ปี","🍚"],["travel","ค่าเดินทาง / กลับบ้าน 4 ปี","🚌"]];
function guessCat(choice){
  const [k]=CATS[G.reveal], a=G.base.a[k], b=G.base.b[k];
  const truth=Math.abs(a-b)<=Math.max(a,b)*0.05?"same":(a>b?"priv":"pub");
  G.picks.push({choice,truth});G.showAns=true;render();
}
function nextCat(){G.showAns=false;G.reveal++;if(G.reveal>=CATS.length){drawEvents();return go("events")}render()}
function drawEvents(){
  /* เลือกเฉพาะการ์ดที่มีผลกับคู่นี้จริง: หอในไม่โดนสัญญา/หารห้อง/จับฉลาก  ทาง B ไป-กลับ ไม่มีการ์ดฝั่งหอ */
  const u=C.U[C.P[G.pub].u], noIn=["contract","share","dormlotto"];
  const home=C.EVENTS.filter(e=>e.side==="home"), both=C.EVENTS.filter(e=>e.side==="both");
  const dorm=C.EVENTS.filter(e=>e.side==="dorm"&&!(G.housing==="dorm_in"&&noIn.includes(e.k))&&!(e.k==="dormlotto"&&!u.dormIn));
  const pick=[shuffle(home)[0], shuffle(both)[0]];
  pick.push(G.housing==="home"?shuffle(home.filter(e=>e!==pick[0]))[0]:shuffle(dorm)[0]);
  G.events=shuffle(pick);G.evShown=0;
}
function flipEvent(){G.evShown++;render()}
function pickReason(k){G.reason=k;render()}
function pickPost(k){G.post=k;render()}
function pickTalk(k){G.talk=k;render()}
async function finish(){
  const t=totals(true);
  G.final=t;
  if(!G.postDone)G.postScore=quizScore(G.q.post);
  if(DEMO){G.saved=true;return go("card")}
  const payload={track:G.track,private_prog:G.priv,public_prog:G.pub,housing:G.housing,total_private:t.a.total,total_public:t.b.total,
    events:G.events.map(e=>e.k),top_reason:G.reason,post_choice:G.post,talk_home:G.talk};
  if(!G.postDone)Object.assign(payload,{post_score:G.postScore,self_cost_post:G.self.postCost,self_talk_post:G.self.postTalk,goal_met:G.goalMet});
  G.saving=true;render();
  try{
    if(G.offline){const r=await sb.rpc("cost_game_start",{p_guess:G.preTry||G.pre,p_year:C.YEAR,p_pre:{goal:G.goal,score:quizScore(G.q.pre),self_cost:G.self.preCost,self_talk:G.self.preTalk}});if(r.error)throw r.error;G.offline=false}
    const {error}=await sb.rpc("cost_game_finish",{p:payload,p_year:C.YEAR});
    if(error)throw error;
    G.saved=true;
  }catch(e){G.saveErr=errText(e)}
  G.saving=false;go("card");
}
function again(){const o=G;G=newGame();Object.assign(G,{pre:o.pre,preDone:o.preDone,postDone:o.postDone||!!o.saved,goal:o.goal,preScore:o.preScore,postScore:o.postScore,q:o.q,self:o.self,goalMet:o.goalMet});go("track")}

    <label>ค่ากิน 3 มื้อ/วัน ตอนอยู่หอ<input id="in_dormFood" type="number" inputmode="numeric" min="0" value="${G.my.dormFood}" onchange="setMy('dormFood',this.value)"></label>
    <label>ค่ากับข้าวที่บ้าน (ส่วนของเรา)/วัน<input id="in_homeFood" type="number" inputmode="numeric" min="0" value="${G.my.homeFood}" onchange="setMy('homeFood',this.value)"></label>
    <p class="muted" style="margin:0">ค่ากับข้าวที่บ้านนับทั้งสองทาง เพราะตอนอยู่หอก็กลับบ้านช่วงปิดเทอม</p></section>
  <button class="btn" onclick="startReveal()">เปิดการ์ดค่าใช้จ่าย</button></div>`,

reveal:()=>{const i=G.reveal,[k,lab,ic]=CATS[i],a=G.base.a[k],b=G.base.b[k];
  const dots=`<div class="dots" aria-label="การ์ดใบที่ ${i+1} จาก ${CATS.length}">${CATS.map((_,j)=>`<i class="${j<=i?"on":""}"></i>`).join("")}</div>`;
  let body;
  if(!G.showAns){body=`<div class="flip"><div style="font-size:40px">${ic}</div>${lab}</div>
    <p style="margin:0;text-align:center">ทายก่อนเปิด: ทางไหนจ่าย <b>มากกว่า</b>?</p>
    <div class="ans"><button class="a1" onclick="guessCat('priv')">ทาง A<br>ใกล้บ้าน</button><button onclick="guessCat('same')">พอ ๆ กัน</button><button class="a2" onclick="guessCat('pub')">ทาง B</button></div>`}
  else{const pk=G.picks[i],ok=pk.choice===pk.truth;
    body=`<div class="${ok?"tip":"note"}" role="status"><b>${ok?"ทายถูก!":"พลาดไปนิด"}</b> ${pk.truth==="same"?"สองทางพอ ๆ กัน":pk.truth==="priv"?"ทาง A จ่ายมากกว่า":"ทาง B จ่ายมากกว่า"}</div>
    <div class="vs"><div class="side priv"><span class="lb">ทาง A ${lab}</span><b>${baht(a)}</b></div><div class="side pub"><span class="lb">ทาง B ${lab}</span><b>${baht(b)}</b></div></div>
    ${explain(k)}
    <button class="btn" onclick="nextCat()">${i===CATS.length-1?"ไปเจอเหตุการณ์สุ่ม":"เปิดใบถัดไป"}</button>`}
  return `<div class="stack"><div class="row between"><span class="step">ขั้นที่ 6 จาก 6 · นักสืบค่าใช้จ่าย</span>${dots}</div>
  <p class="muted" style="margin:0"><span class="pill priv">A</span> ${esc(prName(G.priv))}<br><span class="pill pub">B</span> ${esc(prName(G.pub))} · ${C.HOUSING[G.housing]}</p>${body}</div>`},

events:()=>{const t=totals(true);const n=G.evShown,all=G.events.length;
  const cards=G.events.slice(0,n).map(e=>`<div class="ev row" style="gap:12px"><span class="ic" aria-hidden="true">${e.icon}</span><div><b>${esc(e.t)}</b><p class="muted" style="margin:0">${esc(e.d)}</p><span class="pill ${e.side==="home"?"priv":e.side==="dorm"?"pub":""}" style="${e.side==="both"?"background:#eee":""}">${e.side==="home"?"โดนคนไป-กลับ":e.side==="dorm"?"โดนคนอยู่หอ":"เท่ากันทั้งสองทาง"}</span></div></div>`).join("");
  return `<div class="stack"><h2 style="font-size:22px">เหตุการณ์สุ่มระหว่าง 4 ปี</h2>
  <p class="muted" style="margin:0">ชีวิตจริงไม่ได้เป๊ะตามแผน เปิดการ์ดทีละใบ ดูว่ายอดรวมขยับยังไง</p>
  ${totalsBox(t)}
  ${cards}
  ${n<all?`<button class="btn" onclick="flipEvent()">เปิดการ์ดเหตุการณ์ใบที่ ${n+1}/${all}</button>`:`<button class="btn pine" onclick="go('result')">ดูผลรวม 4 ปี</button>`}</div>`},

result:()=>{const t=totals(true),a=t.a,b=t.b,max=Math.max(a.total,b.total)||1,d=a.total-b.total,ad=Math.abs(d);
  const close=ad<=Math.max(a.total,b.total)*0.05;
  const win=close?"พอ ๆ กัน (ต่างกันไม่ถึง 5%)":d>0?"ทาง B จ่ายน้อยกว่า":"ทาง A (ใกล้บ้าน) จ่ายน้อยกว่า";
  const score=G.picks.filter(p=>p.choice===p.truth).length;
  return `<div class="stack"><h2 style="font-size:22px">ผลรวม 4 ปี</h2>
  <section class="card stack" style="gap:10px">
    <div><div class="row between"><span><span class="pill priv">A</span> ${esc(C.U[C.P[G.priv].u].short)}</span><b>${baht(a.total)} บาท</b></div><div class="bar priv"><i style="width:${a.total/max*100}%"></i></div></div>
    <div><div class="row between"><span><span class="pill pub">B</span> ${esc(C.U[C.P[G.pub].u].short)}</span><b>${baht(b.total)} บาท</b></div><div class="bar pub"><i style="width:${b.total/max*100}%"></i></div></div>
    <p class="big" style="margin:4px 0 0">${win}</p>
    ${close?"":`<p style="margin:0">ต่างกัน <b>${baht(ad)} บาท</b> ≈ เดือนละ <b>${baht(ad/48)} บาท</b> ตลอด 4 ปี</p>`}
    <p style="margin:0">เวลาเดินทางรวม: A <b>${baht(a.hours)} ชม.</b> (≈ ${baht(a.hours/24)} วันเต็ม) · B <b>${baht(b.hours)} ชม.</b></p>
  </section>
  ${breakdown(a,b)}
  <div class="tip">คำทายแรกของเรา: <b>${GUESS[G.pre]||"-"}</b> · ทายการ์ดถูก ${score}/${CATS.length} ใบ</div>
  <section class="card stack" style="gap:10px"><h3 style="font-size:17px">นอกจากเงิน อะไรสำคัญที่สุดสำหรับเรา? (เลือก 1)</h3>
    <div class="chips">${C.REASONS.map(r=>`<button class="chip" aria-pressed="${G.reason===r.k}" onclick="pickReason('${r.k}')">${esc(r.t)}</button>`).join("")}</div></section>
  <section class="card stack" style="gap:10px"><h3 style="font-size:17px">ถ้าต้องเลือกวันนี้ เราจะเลือก</h3>
    ${[["private","ทาง A ใกล้บ้าน (ไป-กลับ)","priv"],["public","ทาง B","pub"],["unsure","ยังไม่แน่ใจ ขอคุยกับที่บ้านก่อน",""]].map(([k,tx,c])=>`<button class="opt ${c}" aria-pressed="${G.post===k}" onclick="pickPost('${k}')"><span>${tx}</span></button>`).join("")}</section>
  <section class="card stack" style="gap:10px"><h3 style="font-size:17px">จะเอาการ์ดสรุปไปคุยกับที่บ้านไหม?</h3>
    <div class="chips">${[["yes","คุยแน่นอน"],["maybe","อาจจะ"],["no","ไม่คุย"]].map(([k,tx])=>`<button class="chip" aria-pressed="${G.talk===k}" onclick="pickTalk('${k}')">${tx}</button>`).join("")}</div></section>
  ${G.postDone?"":`<section class="card stack" style="gap:12px"><h3 style="font-size:17px">ทบทวนหลังเล่น (ข้อชุดเดิม)</h3>${quizHtml("post")}${rateHtml(SELF_COST,"postCost")}${rateHtml(SELF_TALK,"postTalk")}
    <div class="stack" style="gap:6px"><b>เป้าหมายที่เลือกไว้ "${esc(GOALS[G.goal]||"-")}" ทำได้แค่ไหน?</b><div class="chips">${[["yes","ได้แล้ว"],["some","ได้บางส่วน"],["no","ยังไม่ได้"]].map(([k,t])=>`<button class="chip" aria-pressed="${G.goalMet===k}" onclick="pickGoalMet('${k}')">${t}</button>`).join("")}</div></div></section>`}
  <button class="btn pine" ${G.reason&&G.post&&G.talk&&(G.postDone||(G.q.post.every(v=>v!==null)&&G.self.postCost&&G.self.postTalk&&G.goalMet))&&!G.saving?"":"disabled"} onclick="finish()">${G.saving?"กำลังส่ง…":"ส่งคำตอบ + รับการ์ดคุยกับบ้าน"}</button></div>`},

card:()=>{const t=G.final,a=t.a,b=t.b,d=a.total-b.total,ad=Math.abs(d),close=ad<=Math.max(a.total,b.total)*0.05;
  const pa=C.P[G.priv],pb=C.P[G.pub],ub=C.U[pb.u],reason=C.REASONS.find(r=>r.k===G.reason);
  const lines=[];
  if(close){lines.push(`ลองคิดค่าใช้จ่ายครบ 4 ปีแล้ว สองทางรวมแล้วพอ ๆ กัน (ประมาณ ${baht(a.total)} กับ ${baht(b.total)} บาท) เลยอยากชวนดูเรื่องอื่นประกอบด้วย`)}
  else if(d>0){lines.push(`ลองคิดครบ 4 ปีแล้ว ทั้งค่าเทอม ค่ากิน ค่ารถ และค่าหอ เรียน ${ub.short} ${G.housing==="dorm_in"?"อยู่หอใน":G.housing==="home"?"ไป-กลับ":"อยู่หอนอก"} รวมประมาณ ${baht(b.total)} บาท น้อยกว่า ${C.U[C.P[G.priv].u].short} ประมาณ ${baht(ad)} บาท`)}
  else{lines.push(`ลองคิดครบ 4 ปีแล้ว เรียน ${C.U[C.P[G.priv].u].short} ไป-กลับจากบ้าน ประหยัดกว่าประมาณ ${baht(ad)} บาท เรื่องเงินพ่อแม่คิดถูก แต่ขอชวนดูเรื่องเวลาเดินทางด้วย`)}
  if(a.hours>b.hours)lines.push(`ถ้าไป-กลับ จะใช้เวลาบนรถรวมประมาณ ${baht(a.hours)} ชั่วโมงใน 4 ปี (≈ ${baht(a.hours/24)} วันเต็ม) อยากเอาเวลานี้ไปอ่านหนังสือหรือพักผ่อนบ้าง`);
  if(G.reason==="safety"||G.reason==="family")lines.push(`ถ้าห่วงเรื่องความปลอดภัย เราลองไปดูหอในของ ${ub.short} ด้วยกันไหม หรือตกลงกันว่าจะโทรหาที่บ้านทุกวัน`);
  else lines.push(`สิ่งที่ให้ความสำคัญมากที่สุดคือ "${reason?reason.t:"-"}" อยากให้เราคุยเรื่องนี้ด้วยกัน`);
  lines.push(`มีแผน B เตรียมไว้แล้ว และพร้อมฟังเหตุผลของพ่อแม่ด้วย`);
  return `<div class="stack">
  ${G.saved?`<div class="tip noprint">${DEMO?"โหมดสาธิต: ไม่ได้บันทึกผล":"ส่งคำตอบแล้ว ขอบคุณนะ"}</div>`:`<div class="note noprint" role="alert">ยังส่งผลไม่สำเร็จ: ${esc(G.saveErr||"")} <button class="link" onclick="finish()">ส่งอีกครั้ง</button></div>`}
  ${G.preScore!=null&&G.postScore!=null?`<div class="tip noprint">ความรู้เรื่องค่าใช้จ่าย: ก่อนเล่น <b>${G.preScore}/5</b> → หลังเล่น <b>${G.postScore}/5</b> ${G.postScore>G.preScore?"เก่งขึ้นแล้ว":G.postScore===G.preScore?"เท่าเดิม ลองเล่นอีกรอบเพื่อดูตัวเลขอื่น":"ลองอ่านการ์ดสรุปอีกรอบนะ"}</div>`:""}
  <p class="muted noprint" style="margin:0">แคปหน้าจอการ์ดนี้ไปให้ที่บ้านดูได้เลย</p>
  <article class="talk stack" style="gap:10px">
    <div class="row between"><b style="font-family:var(--display);font-size:18px">เทียบค่าใช้จ่ายเรียน 4 ปี</b><span class="muted">${esc(profile.class_room||"")}</span></div>
    <div class="vs">
      <div class="side priv"><span class="pill priv">A ไป-กลับจากบ้าน</span><p style="margin:4px 0 0;font-size:14px">${esc(C.U[pa.u].name)}<br>${esc(pa.name)}</p><b>${baht(a.total)} บาท</b></div>
      <div class="side pub"><span class="pill pub">B ${G.housing==="home"?"ไป-กลับ":G.housing==="dorm_in"?"หอใน":"หอนอก"}</span><p style="margin:4px 0 0;font-size:14px">${esc(ub.name)}<br>${esc(pb.name)}</p><b>${baht(b.total)} บาท</b></div>
    </div>
    ${breakdown(a,b,true)}
    <p style="margin:0"><b>${close?"รวมแล้วพอ ๆ กัน":d>0?`ทาง B ประหยัดกว่า ${baht(ad)} บาท (≈ ${baht(ad/48)} บาท/เดือน)`:`ทาง A ประหยัดกว่า ${baht(ad)} บาท (≈ ${baht(ad/48)} บาท/เดือน)`}</b></p>
    ${G.events.length?`<p class="muted" style="margin:0">รวมเหตุการณ์สุ่ม: ${G.events.map(e=>esc(e.t)).join(", ")}</p>`:""}
    <div style="border-top:1px solid var(--line);padding-top:8px"><b>ประโยคชวนคุยกับที่บ้าน</b><ol style="margin:4px 0 0;padding-left:20px">${lines.map(l=>`<li>${esc(l)}</li>`).join("")}</ol></div>
    ${srcLine([C.U[pa.u].src,ub.src,ub.dormSrc||"dormIn",ub.rentSrc||"rent"].concat(ub.tripSrc?[ub.tripSrc]:[]))}
    <p class="src">ค่าเทอมคิด 8 เทอม ภาคปกติ · ค่ากิน ค่ารถ ค่าน้ำไฟ ค่ากลับบ้าน เป็นค่าประมาณที่ปรับเองในเกม · ไม่รวมค่าหนังสือ อุปกรณ์ ค่าชุด ซึ่งจ่ายพอ ๆ กันทั้งสองทาง · ก่อนตัดสินใจจริงให้ดูประกาศค่าเทอมล่าสุดของมหาวิทยาลัย</p>
  </article>
  <div class="grid2 noprint"><button class="btn ghost" onclick="again()">ลองคู่อื่น</button><button class="btn ghost" onclick="window.print()">พิมพ์ / บันทึก PDF</button></div></div>`}
};

function explain(k){
  const pv=C.P[G.priv],pb=C.P[G.pub],ub=C.U[pb.u],m=G.my;
  const x={
    tuition:`A: ${baht(pv.sem)} × 8 เทอม${pv.summer?" + ภาคฤดูร้อน "+baht(pv.summer):""}${pv.fixed?" + จ่ายครั้งเดียว "+baht(pv.fixed):""} · B: ${baht(pb.sem)} × 8 เทอม${pb.summer?" + ภาคฤดูร้อน "+baht(pb.summer):""}${pb.fixed?" + จ่ายครั้งเดียว "+baht(pb.fixed):""}`,
    stay:G.housing==="home"?"ทั้งสองทางอยู่บ้าน ไม่มีค่าหอ":G.housing==="dorm_in"?`หอใน ${baht(ub.dormIn.fee)} บาท/เทอม × 8${ub.dormIn.util?` + ค่าไฟ ~${ub.dormIn.util}/เดือน`:""}`:`หอนอก ~${baht(ub.rent)} บาท/เดือน ${(ub.utilOut!=null?ub.utilOut:C.K.utilOut)?` + น้ำไฟ ~${ub.utilOut!=null?ub.utilOut:C.K.utilOut}`:" (รวมน้ำไฟแล้ว)"} × ${C.K.dormMonths} เดือน/ปี${ub.firstYearIn?" (ปี 1 อยู่หอใน)":""}`,
    food:`อยู่บ้าน: ข้าวที่มหาวิทยาลัย ${m.lunch}/วัน × ${C.K.studyDays} วันเรียน + กับข้าวที่บ้าน ${m.homeFood}/วัน · อยู่หอ: ${m.dormFood}/วัน × ${C.K.dormDays} วัน`,
    travel:`ไป-กลับ: ${m.commute} บาท/วัน × ${C.K.studyDays} วันเรียน/ปี · อยู่หอ: ค่ากลับบ้าน${ub.zone==="far"?` ~${baht(ub.trip?ub.trip.cost:C.K.tripFar)}/ครั้ง ปีละ ${ub.tripPerYear!=null?ub.tripPerYear:C.K.tripFarPerYear} ครั้ง`:` ~${C.K.tripMid}/ครั้ง เดือนละ ${C.K.tripMidPerMonth} ครั้ง`}`
  };
  return `<p class="muted" style="margin:0">วิธีคิด: ${esc(x[k])}</p>`;
}
function totalsBox(t){return `<div class="vs"><div class="side priv"><span class="lb">ทาง A รวม 4 ปี</span><b>${baht(t.a.total)}</b></div><div class="side pub"><span class="lb">ทาง B รวม 4 ปี</span><b>${baht(t.b.total)}</b></div></div>`}
function breakdown(a,b,compact){
  const rows=[...CATS.map(([k,l])=>[l.replace(" 4 ปี",""),a[k],b[k]]),...(a.other||b.other?[["อื่น ๆ (เหตุการณ์)",a.other,b.other]]:[])];
  return `<table class="br" ${compact?"":"style='background:#fff;border-radius:12px'"}><thead><tr><th>หมวด (บาท)</th><th style="color:var(--priv)">A</th><th style="color:var(--pub)">B</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${r[0]}</td><td>${baht(r[1])}</td><td>${baht(r[2])}</td></tr>`).join("")}
  <tr><td><b>รวม</b></td><td><b>${baht(a.total)}</b></td><td><b>${baht(b.total)}</b></td></tr></tbody></table>`;
}

sb.auth.onAuthStateChange((ev)=>{if(!DEMO&&ev==="SIGNED_OUT"&&G&&G.screen!=="login"){G=newGame();G.screen="login";render()}});
boot();
</script>
</body>
</html>
