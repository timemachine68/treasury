<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>โปรไฟล์ของฉัน | แนะให้แนว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#22313A; --ink-soft:#5B6B72; --board:#EFF3F1; --card:#FFFFFF;
  --pine:#0F6B5C; --pine-deep:#0A4F44; --pine-tint:#E2F0EC;
  --note:#FFD34D; --note-deep:#8A6D00; --line:#DCE4E1; --danger:#C0392B;
  --radius:14px; --shadow:0 2px 10px rgba(34,49,58,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:var(--board);color:var(--ink);font-size:16px;line-height:1.55;min-height:100vh}
h1,h2,h3,.brand{font-family:'Mitr',sans-serif;font-weight:600}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
:focus-visible{outline:3px solid var(--note);outline-offset:2px;border-radius:6px}

.wrap{max-width:520px;margin:0 auto;padding:0 16px 64px}
header.app{background:var(--pine);color:#fff;padding:14px 0}
header.app .wrap{display:flex;align-items:center;gap:12px;padding-bottom:0;flex-wrap:wrap}
.brand{font-size:1.15rem;display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--note);color:var(--pine-deep);display:grid;place-items:center;font-size:1.05rem;flex:none}
.brand small{display:block;font-family:'Sarabun';font-weight:400;font-size:.72rem;opacity:.85}
.spacer{flex:1}
.iconbtn{background:rgba(255,255,255,.14);border:none;color:#fff;border-radius:999px;padding:7px 14px;font-size:.85rem}

.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px 18px;margin:18px 0}
.panel h2{font-size:1rem;color:var(--pine-deep);margin-bottom:14px}
.field{margin-bottom:13px}
.field label{display:block;font-size:.83rem;font-weight:700;margin-bottom:5px}
.field input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px}
.field.readonly input{background:var(--board);color:var(--ink-soft)}

.avatar-row{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:6px}
.avatar-frame{position:relative;width:128px;height:128px}
.avatar{width:128px;height:128px;border-radius:50%;object-fit:cover;background:var(--pine-tint);
  display:grid;place-items:center;font-family:'Mitr';font-size:2.4rem;color:var(--pine-deep);border:3px solid var(--pine-tint)}
.avatar-edit{position:absolute;bottom:2px;right:2px;width:36px;height:36px;border-radius:50%;background:var(--pine);
  color:#fff;border:3px solid #fff;display:grid;place-items:center;font-size:1rem;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.avatar-name{font-family:'Mitr';font-size:1.1rem;color:var(--ink);text-align:center}
.pill{display:inline-block;border-radius:999px;padding:3px 12px;font-size:.75rem;font-weight:700;background:var(--pine-tint);color:var(--pine-deep)}
.avatar-hint{font-size:.78rem;color:var(--ink-soft);text-align:center}
.avatar-actions{display:flex;gap:8px;justify-content:center;margin-top:4px}

.btn{border:none;border-radius:9px;padding:10px 16px;font-size:.9rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--pine);color:#fff;width:100%}
.btn.primary:hover{background:var(--pine-deep)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink-soft)}
.btn.danger{background:#fff;border:1.5px solid #EAC7C2;color:var(--danger)}
.btn.sm{padding:6px 13px;font-size:.8rem}
.btn:disabled{opacity:.55;cursor:wait}

.login-stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(160deg,var(--pine) 0%,var(--pine-deep) 60%),var(--pine)}
.login-card{background:#fff;border-radius:20px;padding:30px 26px;max-width:400px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.login-card .logo-big{width:58px;height:58px;border-radius:16px;background:var(--note);color:var(--pine-deep);display:grid;place-items:center;font-size:1.5rem;font-weight:600;margin:0 auto 12px}
.login-card h1{text-align:center;font-size:1.25rem;color:var(--pine-deep)}
.login-card .sub{text-align:center;font-size:.83rem;color:var(--ink-soft);margin-bottom:20px}
.login-card .btn{padding:12px;font-size:1rem}
.msg{border-radius:10px;padding:10px 13px;font-size:.85rem;margin-bottom:12px;display:none}
.msg.err{display:block;background:#FBEAE7;color:var(--danger)}
.msg.ok{display:block;background:var(--pine-tint);color:var(--pine-deep)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:11px 20px;border-radius:999px;font-size:.88rem;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
#toast.show{opacity:1}
.loading{text-align:center;padding:40px;color:var(--ink-soft)}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="loginStage" class="login-stage hidden">
  <div class="login-card">
    <div class="logo-big">🙂</div>
    <h1>โปรไฟล์ของฉัน</h1>
    <div class="sub">ใช้บัญชีเดียวกับคลังแนะแนว</div>
    <div id="liMsg" class="msg"></div>
    <div class="field"><label>ชื่อผู้ใช้ / รหัสนักเรียน</label><input id="liUser" autocomplete="username"></div>
    <div class="field"><label>รหัสผ่าน</label><input id="liPass" type="password" autocomplete="current-password"></div>
    <button id="btnLogin" class="btn primary">เข้าสู่ระบบ</button>
  </div>
</div>

<div id="appStage" class="hidden">
  <header class="app"><div class="wrap">
    <div class="brand"><span class="logo">🙂</span><span>โปรไฟล์ของฉัน<small>แนะให้แนว</small></span></div>
    <div class="spacer"></div>
    <a class="iconbtn" href="index.html" title="กลับหน้าหลัก" style="text-decoration:none">🏠</a>
    <button class="iconbtn" id="btnLogout">ออกจากระบบ</button>
  </div></header>

  <div class="wrap">
    <div class="panel">
      <div class="avatar-row">
        <div class="avatar-frame">
          <div class="avatar" id="avatarImg">…</div>
          <button class="avatar-edit" id="btnPickPhoto" title="เปลี่ยนรูป">📷</button>
          <input type="file" id="photoInput" accept="image/*" class="hidden">
        </div>
        <div class="avatar-name" id="pName">—</div>
        <span class="pill" id="pRole">—</span>
        <div class="avatar-hint" id="photoHint">แตะไอคอนกล้องเพื่อเปลี่ยนรูป · ระบบจะย่อขนาดให้อัตโนมัติ</div>
        <div class="avatar-actions hidden" id="photoActions">
          <button class="btn primary sm" id="btnSavePhoto">บันทึกรูปใหม่</button>
          <button class="btn ghost sm" id="btnCancelPhoto">ยกเลิก</button>
        </div>
        <button class="btn ghost sm hidden" id="btnRemovePhoto">ลบรูปโปรไฟล์</button>
      </div>
    </div>

    <div class="panel">
      <h2>ข้อมูลของฉัน</h2>
      <div class="field readonly"><label>ชื่อผู้ใช้ / รหัสนักเรียน</label><input id="fUsername" readonly></div>
      <div class="field readonly"><label>ห้องเรียน</label><input id="fRoom" readonly></div>
      <div class="field readonly"><label>สถานะบัญชี</label><input id="fRole" readonly></div>
      <div class="avatar-hint" style="text-align:left;margin-top:2px">แก้ไขชื่อ/ห้องเรียนไม่ได้เองนะคะ — ถ้าข้อมูลผิด แจ้งครูแนะแนวให้แก้ไขให้ได้เลยค่ะ</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const SUPABASE_URL = "https://ikkhjslmtjwrxzxvtokb.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlra2hqc2xtdGp3cnh6eHZ0b2tiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NDMzNjksImV4cCI6MjA5OTMxOTM2OX0.3OR_9mEv82Ns1LLjx5nnRwJYzrtKFtWCWd1bPuQfNKU";
const EMAIL_DOMAIN = "guidance-pcw.local";
const sb = supabase.createClient(SUPABASE_URL, ANON_KEY);
const BUCKET = "profile-photos";

const ROLE_LABEL = {admin:"ผู้ดูแล", teacher:"ครู", student:"นักเรียน"};

let profile = null, pendingPhoto = null;

const $ = id => document.getElementById(id);
function toast(t){ $("toast").textContent=t; $("toast").classList.add("show"); setTimeout(()=>$("toast").classList.remove("show"),2600); }
function msg(id,t,cls){ const el=$(id); el.textContent=t; el.className="msg "+cls; }

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ $("loginStage").classList.remove("hidden"); return; }
  const {data:p} = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
  if(!p){ await sb.auth.signOut(); $("loginStage").classList.remove("hidden"); return toast("ไม่พบข้อมูลผู้ใช้"); }
  profile = p;
  $("loginStage").classList.add("hidden");
  $("appStage").classList.remove("hidden");
  renderInfo();
  loadAvatar();
}
$("btnLogin").onclick = async ()=>{
  const u=$("liUser").value.trim(), p=$("liPass").value;
  if(!u||!p) return msg("liMsg","กรอกชื่อผู้ใช้และรหัสผ่านก่อนนะคะ","err");
  $("btnLogin").disabled = true;
  const {error} = await sb.auth.signInWithPassword({email:u+"@"+EMAIL_DOMAIN, password:p});
  $("btnLogin").disabled = false;
  if(error) return msg("liMsg","เข้าสู่ระบบไม่สำเร็จ: ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง","err");
  location.reload();
};
$("liPass").addEventListener("keydown", e=>{ if(e.key==="Enter") $("btnLogin").click(); });
$("btnLogout").onclick = async ()=>{ await sb.auth.signOut(); location.reload(); };

function renderInfo(){
  $("pName").textContent = profile.display_name || profile.username || "—";
  $("pRole").textContent = ROLE_LABEL[profile.role] || profile.role;
  $("fUsername").value = profile.username || profile.student_id || "—";
  $("fRoom").value = profile.class_room || "—";
  $("fRole").value = ROLE_LABEL[profile.role] || profile.role;
  $("avatarImg").textContent = (profile.display_name||"?").trim().charAt(0).toUpperCase();
}

/* ═══════════ รูปโปรไฟล์ ═══════════ */
async function loadAvatar(){
  if(!profile.avatar_path){ $("btnRemovePhoto").classList.add("hidden"); return; }
  const {data, error} = await sb.storage.from(BUCKET).createSignedUrl(profile.avatar_path, 3600);
  if(error) return; // ไม่มีรูปหรือดึงไม่สำเร็จ ปล่อยเป็นตัวอักษรย่อไป
  $("avatarImg").innerHTML = `<img src="${data.signedUrl}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`;
  $("btnRemovePhoto").classList.remove("hidden");
}

// ครอปเป็นสี่เหลี่ยมจัตุรัส (กลางภาพ) แล้วย่อเหลือ size×size ก่อนอัปโหลด
// รูปมือถือ 3-8MB → เหลือ ~15-40KB ต่อรูป (avatar ไม่จำเป็นต้องละเอียดเกิน 400px)
function compressAvatar(file, size = 400, quality = 0.85){
  return new Promise((resolve)=>{
    if(!file.type.startsWith("image/")){ resolve(file); return; }
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      const side = Math.min(img.width, img.height);
      const sx = (img.width - side) / 2, sy = (img.height - side) / 2;
      const canvas = document.createElement("canvas");
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
      canvas.toBlob(blob=>{
        if(!blob){ resolve(file); return; }
        resolve(new File([blob], "avatar.jpg", {type:"image/jpeg"}));
      }, "image/jpeg", quality);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

$("btnPickPhoto").onclick = ()=> $("photoInput").click();
$("photoInput").addEventListener("change", async ()=>{
  const f = $("photoInput").files[0];
  if(!f) return;
  $("photoHint").textContent = "กำลังย่อขนาดรูป…";
  pendingPhoto = await compressAvatar(f);
  $("photoHint").textContent = `ขนาดไฟล์หลังย่อ: ${(pendingPhoto.size/1024).toFixed(0)} KB — กด "บันทึกรูปใหม่" เพื่อยืนยัน`;
  $("avatarImg").innerHTML = `<img src="${URL.createObjectURL(pendingPhoto)}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`;
  $("photoActions").classList.remove("hidden");
});
$("btnCancelPhoto").onclick = ()=>{
  pendingPhoto = null; $("photoInput").value = "";
  $("photoActions").classList.add("hidden");
  $("photoHint").textContent = "แตะไอคอนกล้องเพื่อเปลี่ยนรูป · ระบบจะย่อขนาดให้อัตโนมัติ";
  loadAvatar();
};
$("btnSavePhoto").onclick = async ()=>{
  if(!pendingPhoto) return;
  $("btnSavePhoto").disabled = true;
  $("photoHint").textContent = "กำลังอัปโหลด…";
  const path = profile.id + "/avatar_" + crypto.randomUUID() + ".jpg";
  const {error:upErr} = await sb.storage.from(BUCKET).upload(path, pendingPhoto, {upsert:true});
  if(upErr){ $("btnSavePhoto").disabled = false; return toast("อัปโหลดรูปไม่สำเร็จ: "+upErr.message); }
  const {error:rpcErr} = await sb.rpc("update_my_avatar", {new_path: path});
  $("btnSavePhoto").disabled = false;
  if(rpcErr){ await sb.storage.from(BUCKET).remove([path]); return toast("บันทึกรูปไม่สำเร็จ: "+rpcErr.message); }
  const oldPath = profile.avatar_path;
  if(oldPath && oldPath !== path) await sb.storage.from(BUCKET).remove([oldPath]);
  profile.avatar_path = path;
  pendingPhoto = null; $("photoInput").value = "";
  $("photoActions").classList.add("hidden");
  $("photoHint").textContent = "แตะไอคอนกล้องเพื่อเปลี่ยนรูป · ระบบจะย่อขนาดให้อัตโนมัติ";
  toast("บันทึกรูปโปรไฟล์แล้ว ✅");
  loadAvatar();
};
$("btnRemovePhoto").onclick = async ()=>{
  if(!confirm("ลบรูปโปรไฟล์นี้ใช่ไหม?")) return;
  const oldPath = profile.avatar_path;
  const {error} = await sb.rpc("update_my_avatar", {new_path: null});
  if(error) return toast("ลบไม่สำเร็จ: "+error.message);
  if(oldPath) await sb.storage.from(BUCKET).remove([oldPath]);
  profile.avatar_path = null;
  renderInfo();
  $("btnRemovePhoto").classList.add("hidden");
  toast("ลบรูปโปรไฟล์แล้ว");
};

boot();
</script>
</body>
</html>
