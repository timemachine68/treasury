<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ทดสอบพิมพ์ภาษาไทย · แนะให้แนว</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@500&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--pine:#0F6B5C;--deep:#0A4F44;--tint:#E2F0EC;--ink:#22313A;--soft:#5B6B72;--board:#EFF3F1;--line:#DCE4E1;--danger:#B3261E}
*{box-sizing:border-box}
body{margin:0;font-family:'Sarabun',sans-serif;background:var(--board);color:var(--ink);font-size:17px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-family:'Mitr',sans-serif;font-weight:500;font-size:26px;color:var(--deep);margin:0 0 4px}
.lead{color:var(--soft);margin:0 0 16px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.box b{display:block;margin-bottom:6px}
input,textarea{width:100%;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
textarea{min-height:70px}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.row button{flex:1 1 140px;min-height:48px;border-radius:12px;border:1.5px solid var(--pine);background:#fff;color:var(--pine);font:inherit;font-weight:700}
.row button.on{background:var(--pine);color:#fff}
.row button.bad.on{background:var(--danger);border-color:var(--danger)}
.live{font-size:14px;color:var(--soft);margin-top:6px;word-break:break-all}
.go{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--pine);color:#fff;font:inherit;font-weight:700;font-size:18px}
pre{white-space:pre-wrap;word-break:break-all;background:#fff;border:1px dashed var(--pine);border-radius:12px;padding:12px;font-size:14px;margin:12px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>ทดสอบพิมพ์ภาษาไทย</h1>
  <p class="lead">พิมพ์คำว่า <b>สวัสดีครับ ต้นกล้า</b> ในแต่ละช่อง แล้วกดว่าพิมพ์ได้หรือไม่ได้ จากนั้นกด "สรุปผล" แล้วส่งข้อความที่ได้ให้ครู</p>
  <div id="boxes"></div>
  <button class="go" id="go">สรุปผล</button>
  <pre id="out" hidden></pre>
</div>
<script>
const TESTS = [
  {id:"a", name:"ช่องที่ 1 ช่องธรรมดา", html:'<input id="f_a" type="text">'},
  {id:"b", name:"ช่องที่ 2 ช่องจำกัด 20 ตัวอักษร", html:'<input id="f_b" type="text" maxlength="20">'},
  {id:"c", name:"ช่องที่ 3 ช่องแบบหน้าโปรไฟล์", html:'<input id="f_c" type="text" inputmode="text" lang="th" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">'},
  {id:"d", name:"ช่องที่ 4 ช่องข้อความยาว", html:'<textarea id="f_d"></textarea>'}
];
const R = {};
const $ = id => document.getElementById(id);
$("boxes").innerHTML = TESTS.map(t => `<div class="box"><b>${t.name}</b>${t.html}
  <div class="live" id="l_${t.id}">ยังไม่ได้พิมพ์</div>
  <div class="row"><button data-t="${t.id}" data-v="ok">พิมพ์ได้</button><button class="bad" data-t="${t.id}" data-v="bad">พิมพ์ไม่ได้</button></div></div>`).join("");
TESTS.forEach(t => {
  const el = $("f_" + t.id);
  el.addEventListener("input", e => { $("l_" + t.id).textContent = "ตอนนี้มี " + el.value.length + " ตัวอักษร: " + el.value + " (" + (e.inputType || "-") + ")"; });
});
document.querySelectorAll(".row button").forEach(b => b.onclick = () => {
  R[b.dataset.t] = b.dataset.v;
  b.parentNode.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
});
$("go").onclick = () => {
  const lines = TESTS.map(t => t.name + ": " + (R[t.id] === "ok" ? "พิมพ์ได้" : R[t.id] === "bad" ? "พิมพ์ไม่ได้" : "ไม่ได้ทดสอบ") + " | ได้ข้อความ: " + $("f_" + t.id).value);
  lines.push("เครื่อง/เบราว์เซอร์: " + navigator.userAgent);
  const o = $("out"); o.hidden = false; o.textContent = lines.join("\n");
  const sel = getSelection(), r = document.createRange(); r.selectNodeContents(o); sel.removeAllRanges(); sel.addRange(r);
  try { navigator.clipboard.writeText(lines.join("\n")); } catch (e) {}
};
</script>
</body>
</html>
