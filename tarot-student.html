<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>การ์ดสำรวจใจ | แนะให้แนว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">

<style>
/* Layout: one phone-width column floating over a fixed night-lake scene; every screen is a single panel. */
:root{
  --night:#1D2A4D; --lake:#26355F; --lake2:#34467A;
  --cream:#F6F1E4; --lav:#B9A7E0; --lav-soft:#E4DAF7; --mint:#BFEBD7; --lilac:#D9CCF2; --glow:#FFF3B0; --peach:#F4A98C;
  --panel:rgba(20,30,60,.78); --panel-line:rgba(185,167,224,.55);
  --font-display:'Mali','Sarabun',sans-serif; --font-body:'Sarabun','Mali',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--night);color:var(--cream);font-family:var(--font-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px;min-height:100vh}
.scene{position:fixed;inset:0;z-index:0;pointer-events:none}
.scene svg{width:100%;height:100%;display:block}
#app{position:relative;z-index:1;max-width:460px;margin:0 auto}
.panel{background:var(--panel);border:1.5px solid var(--panel-line);border-radius:28px;padding:22px;animation:rise .4s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:38px;font-weight:700}
h2{font-size:22px;font-weight:600}
p{margin:8px 0}
.sub{color:var(--lav-soft);font-size:14.5px}
.center{text-align:center}
.pill{display:inline-block;padding:4px 14px;border-radius:999px;border:1.5px solid var(--lav);color:var(--lav-soft);font-size:13px;font-weight:600}
.btn{display:block;width:100%;min-height:54px;margin-top:18px;border:0;border-radius:999px;background:var(--mint);color:var(--night);font:700 17px var(--font-body);cursor:pointer;box-shadow:0 5px 0 #86BCA4;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #86BCA4}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--cream);border:1.5px solid var(--lav);box-shadow:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--glow);outline-offset:3px}
input[type=text],textarea{width:100%;margin-top:8px;padding:12px 14px;border-radius:16px;border:2px solid var(--panel-line);background:rgba(246,241,228,.08);color:var(--cream);font:inherit}
input::placeholder,textarea::placeholder{color:#B7B3CC}
textarea{min-height:112px;resize:vertical}
.lvl{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;margin-top:10px;padding:12px 16px;border:3px solid transparent;border-radius:20px;color:var(--night);text-align:left;font:inherit;cursor:pointer}
.lvl[aria-pressed=true]{border-color:var(--cream);box-shadow:0 0 0 3px rgba(246,241,228,.25)}
.lvl .badge{flex-shrink:0;width:48px;height:48px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;font:700 17px var(--font-display)}
.lvl b{display:block;font-size:16px}.lvl small{display:block;font-size:13px}
.lvl.l3{background:var(--mint)}.lvl.l6{background:var(--lilac)}
.note{margin-top:14px;padding:12px 14px;border-radius:16px;background:rgba(255,243,176,.12);border:1px solid rgba(255,243,176,.35);font-size:14px;line-height:1.65}
.progress{height:10px;border-radius:999px;background:rgba(246,241,228,.15);overflow:hidden;margin:6px 0 16px}
.progress i{display:block;height:100%;background:var(--lav);border-radius:999px;transition:width .3s}
.opt{display:flex;gap:12px;align-items:center;width:100%;min-height:72px;margin-top:12px;padding:14px 16px;border:2px solid var(--panel-line);border-radius:20px;background:rgba(246,241,228,.07);color:var(--cream);font:inherit;text-align:left;cursor:pointer}
.opt:hover{border-color:var(--glow);background:rgba(246,241,228,.12)}
.back-link{background:none;border:0;color:var(--lav-soft);font:inherit;font-size:14.5px;cursor:pointer;padding:8px 0;min-height:44px}
.letters{display:flex;gap:10px;justify-content:center;margin:14px 0 4px}
.letter{width:62px;height:62px;border:0;border-radius:20px;color:var(--night);font:700 30px var(--font-display);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.bar{margin:14px 0}
.bar .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--lav-soft);font-weight:600}
.bar .track{position:relative;height:12px;border-radius:999px;background:rgba(246,241,228,.15);margin-top:6px}
.bar .fill{position:absolute;left:0;top:0;height:100%;border-radius:999px;background:var(--lav)}
.bar .dot{position:absolute;top:-4px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--cream);border:3px solid var(--night)}
.cardwrap{display:inline-block;padding:5px;border-radius:22px;background:var(--cream)}
.card{display:block}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.back-card{padding:0;border:0;background:none;border-radius:16px;cursor:pointer;transition:transform .15s}
.back-card.on{transform:translateY(-8px);filter:drop-shadow(0 0 10px var(--glow))}
.back-card svg{width:100%;height:auto;display:block}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px;align-items:start}
.slot{font-size:12.5px;font-weight:700;text-align:center;min-height:36px;line-height:1.4;margin-bottom:6px}
.slot-btn{display:block;width:100%;padding:0;border:0;background:none;border-radius:16px;cursor:pointer}
.slot-btn svg{width:100%;height:auto;display:block}
.slot-btn.sel{outline:3px solid var(--glow);outline-offset:3px}
.detail{margin-top:18px;padding:16px;border-radius:20px;background:rgba(246,241,228,.08);border:1.5px dashed var(--lav);animation:rise .35s ease both}
.lens{margin-top:10px;padding:12px 14px;border-radius:14px;background:rgba(185,167,224,.16);font-size:14.5px;line-height:1.65}
.q{margin-top:10px;padding:14px;border-radius:14px;background:rgba(191,235,215,.16);font:600 17px/1.6 var(--font-display)}
.chip{display:block;width:100%;margin-top:10px;padding:12px 14px;border:2px solid var(--panel-line);border-radius:16px;background:rgba(246,241,228,.07);color:var(--cream);font:inherit;text-align:left;cursor:pointer}
.chip.on{border-color:var(--glow);background:rgba(255,243,176,.14)}
.chip small{display:block;color:var(--lav-soft);font-size:13.5px}
label.sw{display:flex;gap:12px;align-items:flex-start;margin-top:16px;font-size:14.5px;line-height:1.6;cursor:pointer}
label.sw input{flex-shrink:0;width:22px;height:22px;margin-top:3px;accent-color:var(--mint)}
details{margin-top:16px;font-size:13px;color:var(--lav-soft)}
pre{white-space:pre-wrap;word-break:break-all;background:rgba(0,0,0,.3);border-radius:12px;padding:10px;font-size:11.5px;color:var(--cream)}
.mini{display:flex;gap:12px;align-items:center;margin-bottom:6px}

[hidden]{display:none!important}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--cream);color:var(--night);padding:11px 20px;border-radius:999px;font-size:.9rem;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>

<g fill="#F6F1E4" opacity=".8"><circle cx="40" cy="60" r="1.8"/><circle cx="120" cy="36" r="1.4"/><circle cx="190" cy="100" r="1.6"/><circle cx="70" cy="160" r="1.4"/><circle cx="230" cy="52" r="1.2"/><circle cx="360" cy="230" r="1.6"/><circle cx="160" cy="210" r="1.2"/><circle cx="26" cy="250" r="1.4"/></g>

</svg>
</div>
<main id="app"></main>
<div id="toast" role="status"></div>
<script>

const PP_ITEMS=["ฉันบอกได้ว่าตัวเองสนใจเรื่องอะไรเป็นพิเศษ","ฉันบอกได้ว่าตัวเองถนัดหรือทำได้ดีในเรื่องใดบ้าง","ฉันรู้ว่าสิ่งใดสำคัญกับชีวิตของฉัน เช่น ความมั่นคง ความสร้างสรรค์ การช่วยเหลือผู้อื่น","ฉันรู้ว่าจะหาข้อมูลสายการเรียนหรืออาชีพที่สนใจได้จากที่ไหน","ฉันอธิบายได้ว่าเส้นทางการเรียนต่อหรืออาชีพที่สนใจต้องเตรียมตัวอย่างไร","ฉันเคยหาข้อมูลหรือพูดคุยกับผู้รู้เกี่ยวกับเส้นทางที่สนใจแล้วอย่างน้อยหนึ่งครั้ง","ฉันเลือกเส้นทางการเรียนต่อหรืออาชีพที่เหมาะกับตัวเองได้","ฉันมีเส้นทางที่สนใจอย่างน้อยหนึ่งทางที่เลือกเพราะความต้องการของตัวเอง","เมื่อมีหลายทางเลือก ฉันเปรียบเทียบข้อดีข้อเสียก่อนตัดสินใจได้","ฉันตั้งเป้าหมายระยะสั้น (ภายในหนึ่งภาคเรียน) เพื่อเข้าใกล้เส้นทางที่เลือกได้","ฉันรู้ว่าต้องเตรียมตัวอะไรบ้างในปีการศึกษานี้","ฉันวางแผนขั้นตอนเพื่อไปให้ถึงเป้าหมายได้","ถ้าแผนแรกไม่เป็นไปตามที่หวัง ฉันมีทางเลือกสำรองอย่างน้อยหนึ่งทาง","เมื่อรู้สึกลังเลหรือกังวลเรื่องอนาคต ฉันรู้ว่าจะขอคำปรึกษาจากใครได้","แม้ความเห็นของคนรอบตัวต่างจากของฉัน ฉันก็อธิบายเหตุผลของการเลือกของตัวเองได้"];
const PP_SCALE=["ไม่ตรงกับฉันเลย","ตรงเล็กน้อย","ตรงปานกลาง","ตรงมาก","ตรงที่สุด"];
function reset(keepLevel){S={screen:"welcome",level:keepLevel||guessLevel(),q:0,ans:[],type:[],computed:"",deck:[],picks:[],flipped:[false,false,false],active:-1,res:-1,note:"",share:false,action:-1,saving:false,msg:""}}
function guessLevel(){const m=profile&&profile.class_room&&String(profile.class_room).match(/ม\.?\s*(\d)/);const g=m?+m[1]:0;return (g===3||g===6)?g:0}
const $=document.getElementById("app");
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mbti=()=>S.type.join("");
const group=()=>S.type[1]+S.type[2];
const li=()=>S.level===3?1:2;
const firstName=()=>String((profile&&profile.display_name)||"").trim().split(/\s+/)[0]||"เธอ";
function counts(){const c={};QS.forEach((q,i)=>{const l=S.ans[i];if(l)c[l]=(c[l]||0)+1});return c}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),3200)}
function go(s){S.screen=s;render();window.scrollTo({top:0,behavior:"smooth"})}
function render(){$.innerHTML=({login,consent,welcome,prepost,survey,result,pick,reveal,reflect,done,final})[S.screen]()}
const fmtDate=d=>new Date(d).toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"2-digit"});

/* ---------- เข้าสู่ระบบ + ความยินยอม ---------- */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){S={screen:"login",msg:""};return render()}
  const {data:p}=await sb.from("profiles").select("id,display_name,role,class_room").eq("id",session.user.id).maybeSingle();
  if(!p){await sb.auth.signOut();S={screen:"login",msg:"ไม่พบข้อมูลผู้ใช้"};return render()}
  profile=p;
  reset();
  const {data:c,error}=await sb.from("tarot_consents").select("consented").eq("student_id",p.id).maybeSingle();
  if(error){S.screen="welcome";S.msg="โหลดข้อมูลไม่สำเร็จ: "+error.message;return render()}
  if(!(c&&c.consented)){S.screen="consent";return render()}
  await loadHistory();
  render();
}
async function loadHistory(){
  const {data:ss}=await sb.from("tarot_sessions").select("id,level,mbti,cards,created_at").eq("student_id",profile.id).order("created_at",{ascending:false}).limit(5);
  history=ss||[];
  const {data:g}=await sb.from("tarot_prepost_config").select("round_label,instrument_version,pre_open,post_open").eq("id",1).maybeSingle();
  cfg=g||null;myPP=[];
  if(cfg){const {data:pp}=await sb.from("tarot_prepost").select("phase").eq("student_id",profile.id).eq("round_label",cfg.round_label);myPP=(pp||[]).map(x=>x.phase)}
  if(history.length){
    const {data:rs}=await sb.from("tarot_reflections").select("session_id,body,shared_with_teacher").in("session_id",history.map(h=>h.id));
    const m={};(rs||[]).forEach(r=>m[r.session_id]=r);history.forEach(h=>h.refl=m[h.id]||null);
  }
}
async function doLogin(){
  const u=document.getElementById("liUser").value.trim(),p=document.getElementById("liPass").value,b=document.getElementById("btnLogin"),m=document.getElementById("liMsg");
  if(!u||!p){m.textContent="กรอกรหัสนักเรียนและรหัสผ่านก่อนนะ";m.hidden=false;return}
  b.disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:u+"@"+EMAIL_DOMAIN,password:p});
  b.disabled=false;
  if(error){m.textContent="เข้าสู่ระบบไม่สำเร็จ: รหัสนักเรียนหรือรหัสผ่านไม่ถูกต้อง";m.hidden=false;return}
  boot();
}
async function logout(){await sb.auth.signOut();location.reload()}
async function giveConsent(){
  const b=document.getElementById("btnConsent");b.disabled=true;
  const {error}=await sb.from("tarot_consents").upsert({student_id:profile.id,consented:true,consented_by:"student",text_version:CONSENT_VERSION,recorded_at:new Date().toISOString()},{onConflict:"student_id"});
  if(error){b.disabled=false;return toast("บันทึกไม่สำเร็จ: "+error.message)}
  await loadHistory();go("welcome");
}
async function withdrawConsent(){
  if(!S.confirmWithdraw){S.confirmWithdraw=true;return render()}
  const {error}=await sb.from("tarot_consents").update({consented:false}).eq("student_id",profile.id);
  if(error)return toast("ถอนไม่สำเร็จ: "+error.message);
  S.confirmWithdraw=false;toast("ถอนความยินยอมแล้ว ข้อมูลที่เคยบันทึกยังอยู่ แจ้งครูถ้าต้องการให้ลบ");go("consent")
}

<div class="center">${creature(110)}</div>
<h1 class="center">การ์ดสำรวจใจ</h1>
<p class="center sub">ใช้บัญชีเดียวกับคลังแนะแนว</p>

function consent(){return `<div class="panel">
<h2>ก่อนเริ่ม อ่านสักนิดนะ</h2>

<label class="sw"><input type="checkbox" id="cbConsent" onchange="document.getElementById('btnConsent').disabled=!this.checked"><span>ฉันอ่านแล้ว และยินยอมให้เก็บข้อมูลตามที่ระบุ</span></label>

function welcome(){
const ok=!!S.level;
const ppPhase=cfg&&((cfg.pre_open&&!myPP.includes("pre"))?"pre":(cfg.post_open&&!myPP.includes("post"))?"post":"");
const ppBox=ppPhase?`<div class="note" style="margin-top:16px"><b>${ppPhase==="pre"?"แบบสำรวจก่อนเริ่มกิจกรรม":"แบบสำรวจหลังทำกิจกรรม"}</b><br>15 ข้อ ใช้เวลาไม่ถึง 5 นาที ไม่มีถูกผิด ไม่มีผลต่อคะแนน<button class="btn" ${ok?"":"disabled"} onclick="startPP('${ppPhase}')">ทำแบบสำรวจ</button>${ok?"":"<span class='sub'>เลือกชั้นด้านบนก่อนนะ</span>"}</div>`:(cfg&&(cfg.pre_open||cfg.post_open)?`<div class="sub" style="margin-top:12px">ทำแบบสำรวจรอบนี้ครบแล้ว ขอบคุณนะ</div>`:"");
const hist=history.length?`<details style="margin-top:16px" open><summary>การเล่นครั้งก่อนของฉัน</summary>${history.map(h=>`<div class="lens" style="margin-top:8px"><b>${fmtDate(h.created_at)} · ม.${h.level} · ${h.mbti}</b><br>${(h.cards||[]).map(c=>esc(c.card)).join(" · ")}${h.refl?`<br><span class="sub">บันทึก${h.refl.shared_with_teacher?" (แชร์ครูแล้ว)":" (ส่วนตัว)"}: ${esc(h.refl.body)}</span>`:""}</div>`).join("")}</details>`:"";
return `<div class="panel">
<div class="center"><span class="pill">คาบแนะแนว · 50 นาที</span></div>
<div class="center" style="margin-top:6px">${creature(120)}</div>
<h1 class="center">การ์ดสำรวจใจ</h1>
<p class="center sub">สวัสดี ${esc(firstName())} ไพ่ไม่ได้ทำนายอนาคต แต่ชวนเธอถามใจตัวเอง</p>
${S.msg?`<div class="note">${esc(S.msg)}</div>`:""}
<p style="margin-top:16px;font-weight:600">เธอเรียนอยู่ชั้นไหน?</p>
<button type="button" class="lvl l3" aria-pressed="${S.level===3}" onclick="setLevel(3)"><span class="badge">ม.3</span><span><b>เลือกเส้นทางหลังจบ ม.ต้น</b><small>สำรวจสิ่งที่ชอบและสิ่งที่ถนัด</small></span></button>
<button type="button" class="lvl l6" aria-pressed="${S.level===6}" onclick="setLevel(6)"><span class="badge">ม.6</span><span><b>เลือกคณะและอนาคต</b><small>ต่อยอดสู่ TCAS และอาชีพ</small></span></button>

function startPP(ph){S.ppPhase=ph;S.pp=PP_ITEMS.map(()=>0);S.ppSaving=false;go("prepost")}
function prepost(){
const n=S.pp.filter(Boolean).length,ph=S.ppPhase==="pre"?"ก่อนเริ่ม":"หลังทำกิจกรรม";
const rows=PP_ITEMS.map((t,i)=>`<fieldset class="lens" style="margin-top:10px;border:0"><legend style="font-weight:600">${i+1}. ${esc(t)}</legend><div style="display:flex;gap:6px;margin-top:8px">${[1,2,3,4,5].map(v=>`<button type="button" class="chip ${S.pp[i]===v?"on":""}" style="flex:1;width:auto;margin:0;padding:10px 0;text-align:center" aria-pressed="${S.pp[i]===v}" aria-label="${v} ${PP_SCALE[v-1]}" onclick="setPP(${i},${v})">${v}</button>`).join("")}</div></fieldset>`).join("");
return `<div class="panel"><h2>แบบสำรวจ${ph}</h2><p class="sub">อ่านแต่ละข้อแล้วเลือกว่า "ตรงกับเธอแค่ไหนในตอนนี้" ไม่มีคำตอบถูกหรือผิด และไม่มีผลต่อคะแนนในรายวิชา</p>
<div class="note">1 = ${PP_SCALE[0]} · 2 = ${PP_SCALE[1]} · 3 = ${PP_SCALE[2]} · 4 = ${PP_SCALE[3]} · 5 = ${PP_SCALE[4]}</div>
${rows}<p class="sub" style="margin-top:12px">ตอบแล้ว ${n} จาก ${PP_ITEMS.length} ข้อ</p>
<button class="btn" id="btnPP" ${n<PP_ITEMS.length||S.ppSaving?"disabled":""} onclick="savePP()">ส่งคำตอบ</button>
<button class="btn ghost" onclick="go('welcome')">ไว้ทีหลัง</button></div>`}
function setPP(i,v){S.pp[i]=v;const y=window.scrollY;render();window.scrollTo(0,y)}
async function savePP(){
  if(S.ppSaving||S.pp.some(v=>!v))return;S.ppSaving=true;render();
  const total=S.pp.reduce((a,b)=>a+b,0);
  const {error}=await sb.from("tarot_prepost").insert({student_id:profile.id,round_label:cfg.round_label,instrument_version:cfg.instrument_version,phase:S.ppPhase,level:S.level,items:S.pp,total});
  S.ppSaving=false;
  if(error){
    if(error.code==="23505"){toast("รอบนี้เธอทำไปแล้ว");await loadHistory();return go("welcome")}
    render();return toast("ส่งไม่สำเร็จ ครูอาจปิดรอบแล้ว หรือเน็ตมีปัญหา ลองใหม่อีกครั้งนะ")}
  await loadHistory();toast("ส่งแล้ว ขอบคุณนะ");go("welcome")
}
function setLevel(l){S.level=l;render()}

function survey(){const i=S.q,q=QS[i],k=li();
return `<div class="panel"><button class="back-link" onclick="back()">← ย้อนกลับ</button>

<span class="pill">ม.${S.level} · ข้อ ${i+1} / ${QS.length}</span>
<h2 style="margin-top:12px">${q[k]}</h2>
<button class="opt" onclick="choose('${q[3][0]}')">${q[3][k]}</button>
<button class="opt" onclick="choose('${q[4][0]}')">${q[4][k]}</button>
<div class="mini" style="margin-top:14px">${creature(64)}<span class="sub">ไม่มีคำตอบถูกผิด เลือกอันที่ "ใกล้เคียงที่สุด" ก็พอ</span></div></div>`}
function choose(l){S.ans[S.q]=l;if(S.q<QS.length-1){S.q++;render()}else{S.type=DIMS.map(d=>(counts()[d[1]]||0)>=2?d[1]:d[2]);S.computed=S.type.join("");go("result")}}
function back(){if(S.q>0){S.q--;S.ans.length=S.q;render()}else go("welcome")}
function flip(i){const d=DIMS[i];S.type[i]=S.type[i]===d[1]?d[2]:d[1];render()}

function result(){const t=TYPES[mbti()],c=counts();

const lt=S.type.map((l,i)=>`<button class="letter" aria-label="ตัวอักษร ${l} แตะเพื่อสลับ" style="background:${COLORS[l]}" onclick="flip(${i})">${l}</button>`).join("");
const now=S.level===3?"ตอนนี้ ":"";
return `<div class="panel center">
<p class="sub">${esc(firstName())} ${now}มีแนวโน้มเป็น…</p>
<div class="letters">${lt}</div>
<p class="sub" style="font-size:13px">แตะตัวอักษรเพื่อปรับได้ ถ้ารู้สึกว่ายังไม่ตรงกับเธอ</p>
<h2 style="margin-top:12px;font-size:28px">${t[1]}</h2>
<div style="margin-top:12px" class="cardwrap">${cardSVG(t[0],150)}</div>
<p class="sub">ไพ่ประจำตัวของเธอ · ${CARDS[t[0]][0]}</p>
<div style="text-align:left">${bars}
<p><b>จุดแข็งที่เห็นตอนนี้:</b> ${t[2]}</p>
<p><b>ชวนสังเกต:</b> ${t[3]}</p></div>
<div class="note" style="text-align:left">นี่คือผลเบื้องต้นจากแบบสั้น 12 ข้อ ไม่ใช่ผลวินิจฉัย และไม่ได้บอกว่าเธอเป็นคนแบบไหนตลอดไป ใช้เป็นเลนส์ส่องดูตัวเองเฉยๆ นะ</div>
<button class="btn" onclick="startPick()">ไปปูไพ่ 3 ใบกัน</button></div>`}

function startPick(){S.deck=shuffle([...Array(22).keys()]).slice(0,12);S.picks=[];S.flipped=[false,false,false];S.active=-1;go("pick")}
function pickCard(i){const k=S.picks.indexOf(i);if(k>=0)S.picks.splice(k,1);else if(S.picks.length<3)S.picks.push(i);render()}
function pick(){
const g=S.deck.map(i=>`<button type="button" class="back-card ${S.picks.includes(i)?"on":""}" aria-pressed="${S.picks.includes(i)}" aria-label="ไพ่คว่ำ" onclick="pickCard(${i})">${backSVG()}</button>`).join("");
return `<div class="panel"><h2>เลือกไพ่ 3 ใบ</h2>
<p class="sub">หายใจลึกๆ แล้วเลือกใบที่รู้สึก "ใช่" โดยไม่ต้องคิดมาก<br>เลือกแล้ว <b>${S.picks.length}/3</b></p>
<div class="grid">${g}</div>
<button class="btn" ${S.picks.length<3?"disabled":""} onclick="go('reveal')">เปิดไพ่</button></div>`}

function openCard(k){S.flipped[k]=true;S.active=k;render()}
function reveal(){
const row=[0,1,2].map(k=>`<div><div class="slot">${POS[k]}</div>${S.flipped[k]
?`<button type="button" class="slot-btn ${S.active===k?"sel":""}" aria-label="อ่านไพ่ ${POS[k]} อีกครั้ง" onclick="S.active=${k};render()">${cardSVG(S.picks[k])}</button>`
:`<button type="button" class="slot-btn" aria-label="เปิดไพ่ ${POS[k]}" onclick="openCard(${k})">${backSVG()}</button>`}</div>`).join("");
let d="";if(S.active>=0){const c=CARDS[S.picks[S.active]];d=`<div class="detail"><span class="pill">${POS[S.active]}</span>
<h2 style="margin-top:10px">${c[0]}</h2><div class="sub" style="letter-spacing:.4px">${c[1].toUpperCase()} · ${c[2]}</div>
<p>${c[3]}</p>
<div class="lens"><b>ลองสังเกตตัวเอง</b><br>${LENS[group()][S.active]}</div>
<div class="q">${c[4]}</div>
<div class="q" style="background:rgba(185,167,224,.18)">${LEVELQ[S.level][S.active]}</div></div>`}
const all=S.flipped.every(Boolean);
return `<div class="panel"><h2>ไพ่ของเธอ</h2><p class="sub">แตะไพ่ที่คว่ำอยู่เพื่อเปิดทีละใบ แล้วแตะซ้ำเพื่ออ่านอีกรอบได้</p>
<div class="row3">${row}</div>${d}
<button class="btn" ${all?"":"disabled"} onclick="go('reflect')">ไปเขียนบันทึก</button></div>`}

function reflect(){
const opts=S.picks.map((p,k)=>`<button type="button" class="chip ${S.res===k?"on":""}" aria-pressed="${S.res===k}" onclick="S.res=${k};render()"><b>${POS[k]} · ${CARDS[p][0]}</b><small>${CARDS[p][4]}</small></button>`).join("");
return `<div class="panel"><h2>คำถามไหนโดนใจที่สุด?</h2>
<p class="sub">เลือก 1 ข้อ แล้วเขียนตอบสั้นๆ 2–3 ประโยคก็พอ (เว้นว่างได้)</p>${opts}
<textarea id="note" maxlength="1500" placeholder="เขียนอะไรก็ได้ที่คิดออก…" oninput="S.note=this.value">${esc(S.note)}</textarea>
<label class="sw"><input type="checkbox" id="share" ${S.share?"checked":""} onchange="S.share=this.checked"><span>ให้ครูอ่านบันทึกนี้ได้ <span class="sub">(ถ้าไม่ติ๊ก บันทึกจะเก็บไว้ให้เธออ่านคนเดียว ครูมองไม่เห็น)</span></span></label>
<button class="btn" ${S.res<0?"disabled":""} onclick="go('done')">ต่อไป</button></div>`}

function done(){
const chips=ACTIONS[S.level].map((a,i)=>`<button type="button" class="chip ${S.action===i?"on":""}" aria-pressed="${S.action===i}" onclick="S.action=${i};render()">${a}</button>`).join("");
return `<div class="panel"><h2>ก่อนคาบหน้า ลองทำสักอย่าง</h2><p class="sub">เลือก 1 ข้อที่เป็นไปได้จริงที่สุด</p>${chips}
<button class="btn" id="btnSave" ${S.action<0?"disabled":""} onclick="save()">บันทึกผล</button></div>`}

async function save(){
  if(S.saving)return;S.saving=true;
  const b=document.getElementById("btnSave");if(b){b.disabled=true;b.textContent="กำลังบันทึก…"}
  const row={student_id:profile.id,level:S.level,mbti:mbti(),mbti_adjusted:S.computed!==mbti(),survey_answers:S.ans,
    cards:S.picks.map((p,k)=>({position:POS[k],card:CARDS[p][1],index:p})),resonated_position:S.res,next_action:ACTIONS[S.level][S.action]};
  const {data:ses,error}=await sb.from("tarot_sessions").insert(row).select("id").single();
  if(error){S.saving=false;if(b){b.disabled=false;b.textContent="บันทึกผล"}return toast("บันทึกไม่สำเร็จ: "+error.message)}
  const body=S.note.trim();
  if(body){
    const {error:e2}=await sb.from("tarot_reflections").insert({session_id:ses.id,student_id:profile.id,body,shared_with_teacher:!!S.share});
    if(e2)toast("บันทึกผลแล้ว แต่เก็บบันทึกสะท้อนคิดไม่สำเร็จ: "+e2.message);
  }
  S.saving=false;S.savedNote=!!body;
  await loadHistory();go("final");
}
function final(){return `<div class="panel center"><div>${creature(120)}</div><h1 style="font-size:30px">เก่งมากเลย ${esc(firstName())}</h1>
<p>บันทึกเข้าระบบเรียบร้อยแล้ว<br>ไพ่ใบที่ทักเธอวันนี้คือ <b>${CARDS[S.picks[S.res]][0]}</b></p>
${S.savedNote?`<p class="sub">${S.share?"ครูอ่านบันทึกของเธอได้":"บันทึกของเธอเป็นส่วนตัว ครูมองไม่เห็น"}</p>`:""}
<div class="note" style="text-align:left">ผลนี้เป็นแค่จุดเริ่มต้นของการคุยกับตัวเอง ไม่ใช่คำตัดสิน เปลี่ยนใจได้เสมอ</div>
<button class="btn" onclick="reset(S.level);go('welcome')">กลับหน้าแรก</button></div>`}

reset();
boot();
</script>
</body>
</html>
