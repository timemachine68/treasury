<style>
:root{
  --ink:#22313A;--ink-soft:#5B6B72;--board:#EFF3F1;--card:#FFFFFF;
  --pine:#0F6B5C;--pine-deep:#0A4F44;--pine-tint:#E2F0EC;
  --note:#FFD34D;--note-deep:#8A6D00;--line:#DCE4E1;--danger:#C0392B;
  --nat:#4E9BB9;--nat-bg:#E1EFF5;--nat-fg:#22617A;
  --tcas:#F28C6B;--tcas-bg:#FDE6DD;--tcas-fg:#9A3F22;
  --gui:#0F6B5C;--gui-bg:#E2F0EC;--gui-fg:#0A4F44;
  --oth:#8E7CC3;--oth-bg:#EEEAF7;--oth-fg:#4E3F86;
  --radius:14px;--shadow:0 2px 10px rgba(34,49,58,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Sarabun',sans-serif;font-size:16px;line-height:1.6;color:var(--ink);background:var(--board);min-height:100vh}
h1,h2,h3,.brand,.tab{font-family:'Mitr',sans-serif}
a{color:var(--pine)}
.hidden{display:none!important}

header{background:var(--pine);color:#fff}
.top{max-width:960px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--note);color:var(--pine-deep);display:grid;place-items:center;font-family:'Mitr';font-weight:600;font-size:1.15rem;flex:none}
.brand{line-height:1.25;min-width:0}
.brand b{display:block;font-weight:500;font-size:1.1rem}
.brand span{font-size:.82rem;opacity:.85;font-family:'Sarabun'}
.top .login{margin-left:auto;flex:none;color:#fff;text-decoration:none;font-size:.85rem;border:1.5px solid rgba(255,255,255,.55);border-radius:99px;padding:6px 14px;white-space:nowrap}
.top .login:hover{background:rgba(255,255,255,.12)}

.hero{max-width:960px;margin:0 auto;padding:4px 16px 18px}
.hero h1{font-size:1.5rem;font-weight:500}
.hero p{opacity:.9;font-size:.95rem}
.sharebar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.btn{font:inherit;font-weight:600;font-size:.9rem;border-radius:99px;padding:8px 16px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;min-height:40px}
.btn:hover{border-color:var(--pine)}
.btn.primary{background:var(--pine);border-color:var(--pine);color:#fff}
.btn.fb{background:#1877F2;border-color:#1877F2;color:#fff}
.btn.onpine{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.5);color:#fff}
.btn.sm{font-size:.84rem;padding:6px 12px;min-height:36px}
.btn[disabled]{opacity:.55;cursor:wait}

nav.tabs{max-width:960px;margin:0 auto;padding:0 16px;display:flex;gap:6px;transform:translateY(-1px)}
.tab{font-size:.95rem;font-weight:500;border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:12px 12px 0 0;padding:9px 18px;cursor:pointer}
.tab.on{background:var(--board);color:var(--pine-deep)}

main{max-width:960px;margin:0 auto;padding:18px 16px 40px}
.state{text-align:center;color:var(--ink-soft);padding:48px 12px}
.state .big{font-size:2.2rem;margin-bottom:6px}

.news{display:grid;gap:14px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border-left:5px solid var(--pine);padding:16px 18px;scroll-margin-top:12px}
.card.pin{border-left-color:var(--note)}
.card.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px var(--note)}100%{box-shadow:var(--shadow)}}
.card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.badge{display:inline-block;font-size:.75rem;font-weight:700;border-radius:99px;padding:1px 10px;background:var(--pine-tint);color:var(--pine-deep)}
.badge.pin{background:#FFF3C4;color:var(--note-deep)}
.card h2{font-size:1.12rem;font-weight:500;line-height:1.45;color:var(--pine-deep)}
.card .body{margin-top:6px;white-space:pre-line;word-wrap:break-word;overflow-wrap:anywhere}
.card .body.clamp{max-height:9.6em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.more{font:inherit;font-weight:600;font-size:.88rem;color:var(--pine);background:none;border:0;cursor:pointer;padding:4px 0}
.card .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.card .foot{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:.8rem;color:var(--ink-soft);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{font:inherit;font-size:.86rem;font-weight:600;border-radius:99px;padding:5px 14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--pine));display:inline-block}
.chip.on{background:var(--pine);border-color:var(--pine);color:#fff}
.cat-national{--c:var(--nat);--cb:var(--nat-bg);--cf:var(--nat-fg)}
.cat-tcas{--c:var(--tcas);--cb:var(--tcas-bg);--cf:var(--tcas-fg)}
.cat-guidance{--c:var(--gui);--cb:var(--gui-bg);--cf:var(--gui-fg)}
.cat-other{--c:var(--oth);--cb:var(--oth-bg);--cf:var(--oth-fg)}
.month{margin:18px 0 8px;font-family:'Mitr';font-weight:500;color:var(--pine-deep);font-size:1.02rem}
.month:first-child{margin-top:0}
.ev{background:#fff;border-radius:12px;box-shadow:var(--shadow);display:flex;gap:12px;padding:10px 14px;margin-bottom:8px;border-left:5px solid var(--c)}
.ev.past{opacity:.55}
.ev.now{box-shadow:0 0 0 2px var(--c)}
.ev .d{flex:none;width:52px;text-align:center;line-height:1.15;padding-top:2px}
.ev .d b{display:block;font-family:'Mitr';font-weight:500;font-size:1.35rem;color:var(--cf)}
.ev .d span{font-size:.75rem;color:var(--ink-soft)}
.ev .t{min-width:0;flex:1}
.ev .t strong{font-weight:600;display:block;line-height:1.4}
.ev .t .s{font-size:.82rem;color:var(--ink-soft);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.ev .t .s .badge{background:var(--cb);color:var(--cf)}
.ev .t .note{font-size:.85rem;color:var(--ink-soft);margin-top:4px;white-space:pre-line}
.ev .t a{font-size:.85rem;font-weight:600}

footer{text-align:center;color:var(--ink-soft);font-size:.82rem;padding:0 16px 30px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:9;max-width:calc(100% - 32px);text-align:center}
@media (max-width:520px){
  .hero h1{font-size:1.25rem}
  .brand span{display:none}
  .card{padding:14px}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo" aria-hidden="true">แ</div>
    <div class="brand"><b>แนะให้แนว</b><span>งานแนะแนว โรงเรียนพูลเจริญวิทยาคม</span></div>
    <a class="login" href="index.html">เข้าสู่ระบบ</a>
  </div>
  <div class="hero">
    <h1>ข่าวประชาสัมพันธ์</h1>
    <p>ทุนการศึกษา การรับสมัครเรียนต่อ และกำหนดการสอบ</p>
    <div class="sharebar">
      <a class="btn fb sm" id="btnFb" target="_blank" rel="noopener">แชร์ไป Facebook</a>
      <button type="button" class="btn onpine sm" id="btnCopy">คัดลอกลิงก์หน้านี้</button>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button type="button" class="tab on" id="tabNews" role="tab" aria-selected="true">ข่าว</button>
    <button type="button" class="tab" id="tabCal" role="tab" aria-selected="false">ปฏิทินกำหนดการ</button>
  </nav>
</header>

<main>
  <section id="pNews">
    <div class="state" id="newsState"><div class="big">⏳</div>กำลังโหลดข่าว…</div>
    <div class="news" id="newsList"></div>
  </section>
  <section id="pCal" class="hidden">
    <div class="filters" id="calFilters"></div>
    <div class="state" id="calState"><div class="big">⏳</div>กำลังโหลดกำหนดการ…</div>
    <div id="calList"></div>
  </section>
</main>
<footer>งานแนะแนว โรงเรียนพูลเจริญวิทยาคม · สอบถามเพิ่มเติมที่ห้องแนะแนว</footer>
<div class="toast hidden" id="toast" role="status"></div>

<script>
(function(){
'use strict';
var SUPABASE_URL='https://ikkhjslmtjwrxzxvtokb.supabase.co';
var SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlra2hqc2xtdGp3cnh6eHZ0b2tiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NDMzNjksImV4cCI6MjA5OTMxOTM2OX0.3OR_9mEv82Ns1LLjx5nnRwJYzrtKFtWCWd1bPuQfNKU';
var PAGE_URL='https://timemachine68.github.io/treasury/news.html';
var MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
var MONF=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
var CAT_LABEL={national:'สอบระดับชาติ',tcas:'TCAS',guidance:'งานแนะแนว',other:'อื่น ๆ'};
var $=function(id){return document.getElementById(id);};
var news=[], events=[], calLoaded=false, cat='all';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function safeUrl(u){u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:'';}
function linkify(t){
  return esc(t).replace(/https?:\/\/[^\s<]+/g,function(u){
    var tail=''; var m=u.match(/[).,;!?]+$/); if(m){tail=m[0];u=u.slice(0,-tail.length);}
    return '<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+u+'</a>'+tail;
  });
}
function toast(m){var t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.add('hidden');},2600);}
function thDateTime(s){var d=new Date(s);if(isNaN(d))return '';return d.getDate()+' '+MON[d.getMonth()]+' '+(d.getFullYear()+543);}
function pd(s){var p=String(s||'').split('-');return new Date(+p[0],(+p[1]||1)-1,+p[2]||1);}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function thRange(a,b){
  var x=pd(a); if(!b||b===a) return x.getDate()+' '+MON[x.getMonth()]+' '+(x.getFullYear()+543);
  var y=pd(b);
  if(x.getFullYear()===y.getFullYear()&&x.getMonth()===y.getMonth()) return x.getDate()+'–'+y.getDate()+' '+MON[y.getMonth()]+' '+(y.getFullYear()+543);
  return x.getDate()+' '+MON[x.getMonth()]+(x.getFullYear()!==y.getFullYear()?' '+(x.getFullYear()+543):'')+' – '+y.getDate()+' '+MON[y.getMonth()]+' '+(y.getFullYear()+543);
}

async function rpc(name,args){
  var r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
  var j=null; try{j=await r.json();}catch(e){}
  if(!r.ok) throw new Error((j&&j.message)||('HTTP '+r.status));
  return j||[];
}
async function fileUrl(id){
  var r=await fetch(SUPABASE_URL+'/functions/v1/public-file',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({kind:'news',id:id})});
  var j=null; try{j=await r.json();}catch(e){}
  if(!r.ok||!j||!j.url) throw new Error((j&&j.error)||'เปิดไฟล์ไม่สำเร็จ');
  return j.url;
}

/* ---------- แชร์ ---------- */
function shareUrl(id){return PAGE_URL+(id?'#n='+id:'');}
function fbUrl(u){return 'https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(u);}
async function copy(t){
  try{await navigator.clipboard.writeText(t);return true;}
  catch(e){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand('copy');}catch(_){}a.remove();return ok;}
}
$('btnFb').href=fbUrl(PAGE_URL);
$('btnCopy').onclick=async function(){toast(await copy(PAGE_URL)?'คัดลอกลิงก์แล้ว':'คัดลอกไม่สำเร็จ');};

/* ---------- ข่าว ---------- */
function renderNews(){
  var st=$('newsState');
  if(!news.length){st.innerHTML='<div class="big">📭</div>ยังไม่มีข่าวประชาสัมพันธ์ในตอนนี้';st.classList.remove('hidden');$('newsList').innerHTML='';return;}
  st.classList.add('hidden');
  $('newsList').innerHTML=news.map(function(n){
    var body=n.content?String(n.content):'';
    var long=body.length>420||(body.match(/\n/g)||[]).length>6;
    var link=safeUrl(n.external_url);
    var acts='';
    if(n.has_file) acts+='<button type="button" class="btn primary sm" data-file="'+esc(n.id)+'">📎 '+esc(n.file_name||'เปิดไฟล์แนบ')+'</button>';
    if(link) acts+='<a class="btn primary sm" href="'+esc(link)+'" target="_blank" rel="noopener noreferrer">🔗 ดูรายละเอียด / สมัคร</a>';
    acts+='<a class="btn fb sm" href="'+esc(fbUrl(shareUrl(n.id)))+'" target="_blank" rel="noopener">แชร์</a>';
    acts+='<button type="button" class="btn sm" data-copy="'+esc(n.id)+'">คัดลอกลิงก์ข่าวนี้</button>';
    return '<article class="card'+(n.is_pinned?' pin':'')+'" id="n-'+esc(n.id)+'">'+
      (n.is_pinned?'<div class="tags"><span class="badge pin">📌 ข่าวสำคัญ</span></div>':'')+
      '<h2>'+esc(n.title)+'</h2>'+
      (body?'<div class="body'+(long?' clamp':'')+'">'+linkify(body)+'</div>'+(long?'<button type="button" class="more" data-more>อ่านต่อ ▾</button>':''):'')+
      '<div class="acts">'+acts+'</div>'+
      '<div class="foot"><span>งานแนะแนว</span><span>ลงข่าว '+esc(thDateTime(n.created_at))+'</span></div>'+
    '</article>';
  }).join('');
}
$('newsList').addEventListener('click',async function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(b.hasAttribute('data-more')){var body=b.previousElementSibling;var open=body.classList.toggle('clamp');b.textContent=open?'อ่านต่อ ▾':'ย่อ ▴';return;}
  if(b.dataset.copy){toast(await copy(shareUrl(b.dataset.copy))?'คัดลอกลิงก์ข่าวแล้ว':'คัดลอกไม่สำเร็จ');return;}
  if(b.dataset.file){
    var w=window.open('about:blank','_blank'); b.disabled=true;
    try{var u=await fileUrl(b.dataset.file); if(w) w.location.href=u; else location.href=u;}
    catch(err){if(w) w.close(); toast(err.message);}
    b.disabled=false;
  }
});
function focusHash(){
  var m=location.hash.match(/^#n=([0-9a-f-]{36})$/i); if(!m) return;
  showTab('news');
  var el=$('n-'+m[1]);
  if(!el){toast('ข่าวนี้ไม่ได้เผยแพร่แล้ว');return;}
  var body=el.querySelector('.body.clamp'); if(body){body.classList.remove('clamp');var mb=el.querySelector('[data-more]');if(mb)mb.textContent='ย่อ ▴';}
  el.scrollIntoView({behavior:'smooth',block:'start'}); el.classList.add('flash');
}

/* ---------- ปฏิทิน ---------- */
function renderFilters(){
  var have={}; events.forEach(function(e){have[e.category]=1;});
  var keys=['all'].concat(['tcas','national','guidance','other'].filter(function(k){return have[k];}));
  $('calFilters').innerHTML=keys.map(function(k){
    return '<button type="button" class="chip'+(k==='all'?'':' cat-'+k)+(cat===k?' on':'')+'" data-cat="'+k+'">'+(k==='all'?'ทั้งหมด':'<i></i>'+CAT_LABEL[k])+'</button>';
  }).join('');
}
function renderCal(){
  renderFilters();
  var t=todayStr();
  var list=events.filter(function(e){return cat==='all'||e.category===cat;});
  var st=$('calState');
  if(!list.length){st.innerHTML='<div class="big">🗓️</div>ยังไม่มีกำหนดการในหมวดนี้';st.classList.remove('hidden');$('calList').innerHTML='';return;}
  st.classList.add('hidden');
  var html='', lastKey='', firstUpcoming=null;
  list.forEach(function(e){
    var s=pd(e.start_date), key=s.getFullYear()+'-'+s.getMonth();
    if(key!==lastKey){html+='<h3 class="month">'+MONF[s.getMonth()]+' '+(s.getFullYear()+543)+'</h3>';lastKey=key;}
    var end=e.end_date||e.start_date, past=end<t, now=e.start_date<=t&&end>=t;
    if(!past&&!firstUpcoming) firstUpcoming=e.id;
    var link=safeUrl(e.link_url);
    var c=CAT_LABEL[e.category]?e.category:'other';
    html+='<div class="ev cat-'+c+(past?' past':'')+(now?' now':'')+'" id="e-'+esc(e.id)+'">'+
      '<div class="d"><b>'+s.getDate()+'</b><span>'+MON[s.getMonth()]+'</span></div>'+
      '<div class="t"><strong>'+esc(e.title)+'</strong>'+
      '<div class="s"><span class="badge">'+CAT_LABEL[c]+'</span><span>'+esc(thRange(e.start_date,e.end_date))+'</span>'+(now?'<span>· กำลังดำเนินการ</span>':past?'<span>· ผ่านไปแล้ว</span>':'')+'</div>'+
      (e.note?'<div class="note">'+linkify(e.note)+'</div>':'')+
      (link?'<a href="'+esc(link)+'" target="_blank" rel="noopener noreferrer">🔗 ดูรายละเอียด</a>':'')+
      '</div></div>';
  });
  $('calList').innerHTML=html;
  return firstUpcoming;
}
$('calFilters').addEventListener('click',function(e){var b=e.target.closest('[data-cat]');if(!b)return;cat=b.dataset.cat;renderCal();});
async function loadCal(){
  if(calLoaded) return; calLoaded=true;
  try{
    events=await rpc('public_calendar');
    var first=renderCal();
    if(first){var el=$('e-'+first); if(el) el.scrollIntoView({block:'center'});}
  }catch(err){calLoaded=false;$('calState').innerHTML='<div class="big">⚠️</div>โหลดกำหนดการไม่สำเร็จ ลองรีเฟรชหน้าอีกครั้ง';}
}

/* ---------- แท็บ ---------- */
function showTab(k){
  var isNews=k==='news';
  $('pNews').classList.toggle('hidden',!isNews); $('pCal').classList.toggle('hidden',isNews);
  $('tabNews').classList.toggle('on',isNews); $('tabCal').classList.toggle('on',!isNews);
  $('tabNews').setAttribute('aria-selected',isNews); $('tabCal').setAttribute('aria-selected',!isNews);
  if(!isNews) loadCal();
}
$('tabNews').onclick=function(){showTab('news');};
$('tabCal').onclick=function(){showTab('cal');};
window.addEventListener('hashchange',focusHash);

(async function init(){
  if(location.hash==='#calendar') showTab('cal');
  try{ news=await rpc('public_news'); renderNews(); focusHash(); }
  catch(err){ $('newsState').innerHTML='<div class="big">⚠️</div>โหลดข่าวไม่สำเร็จ ลองรีเฟรชหน้าอีกครั้ง'; }
})();
})();
</script>
