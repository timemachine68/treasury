<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>มอนสเตอร์ใจป่วน AR – แนะแนว ม.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{--ink:#161a35;--glass:rgba(20,24,52,.72);--line:rgba(255,255,255,.16);--a:#8b7bff;--b:#ff6b9d;--c:#ffc93c;--ok:#3ddc97}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;overflow:hidden;background:#0d1030;color:#fff;touch-action:none;user-select:none;
    font-family:"Prompt","Noto Sans Thai",system-ui,sans-serif}
  #bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;
    background:radial-gradient(120% 90% at 30% 10%,#3a2f8f 0%,#171a4a 45%,#0a0c26 100%)}
  #gl{position:fixed;inset:0;width:100%;height:100%}
  .hud{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;
    justify-content:space-between;align-items:flex-start;pointer-events:none}
  .chip{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);
    border-radius:18px;padding:8px 12px;pointer-events:auto}
  .slots{display:flex;gap:6px;margin-top:6px}
  .slot{width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:17px;filter:grayscale(1) opacity(.45)}
  .slot.on{filter:none;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 12px rgba(139,123,255,.8)}
  .ttl{font-size:13px;font-weight:600;opacity:.9}
  .side{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  #radar{width:84px;height:84px;border-radius:50%;background:var(--glass);border:1px solid var(--line)}
  .ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:#fff;font-size:20px;pointer-events:auto}
  #cross{position:fixed;left:50%;top:42%;width:92px;height:92px;margin:-46px 0 0 -46px;z-index:4;pointer-events:none;
    border:3px dashed rgba(255,255,255,.55);border-radius:50%;transition:.18s;opacity:.7}
  #cross.lock{border:4px solid var(--c);transform:scale(1.2);opacity:1;box-shadow:0 0 22px var(--c),inset 0 0 18px rgba(255,201,60,.5)}
  #prompt{position:fixed;left:50%;top:calc(42% + 62px);transform:translateX(-50%);z-index:4;pointer-events:none;
    background:var(--c);color:var(--ink);font-weight:700;padding:6px 16px;border-radius:99px;font-size:15px;white-space:nowrap}
  #hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);z-index:4;
    background:var(--glass);border:1px solid var(--line);padding:9px 16px;border-radius:99px;font-size:14px;white-space:nowrap;pointer-events:none}
  .full{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;
    background:radial-gradient(120% 90% at 50% 0%,rgba(80,60,200,.55),rgba(8,10,34,.94));overflow:auto;touch-action:pan-y}
  .hero{max-width:430px;width:100%;text-align:center}
  .hero h1{font-size:34px;line-height:1.15;margin:6px 0 4px;background:linear-gradient(90deg,#fff,#cdbfff,#ffc2dc);-webkit-background-clip:text;color:transparent}
  .hero p{margin:6px 0;opacity:.9;line-height:1.6;font-size:15.5px}
  .crew{font-size:44px;letter-spacing:6px;margin-top:6px;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px)}}
  .how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;text-align:center}
  .how div{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:16px;padding:10px 6px;font-size:13px;line-height:1.4}
  .how b{display:block;font-size:22px}
  input[type=text]{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.1);
    color:#fff;font:inherit;font-size:16px;text-align:center;outline:none;user-select:text}
  input::placeholder{color:rgba(255,255,255,.55)}
  .btn{display:block;width:100%;margin-top:10px;padding:14px;border-radius:16px;border:0;font:inherit;font-weight:700;font-size:17px;cursor:pointer;
    color:var(--ink);background:linear-gradient(90deg,var(--c),#ffa94d);box-shadow:0 6px 18px rgba(255,170,60,.35)}
  .btn.ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid var(--line);box-shadow:none;font-weight:500;font-size:15px}
  .btn:active{transform:scale(.98)}
  .tiny{font-size:12px;opacity:.7;margin-top:10px}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:64vh;overflow:auto;touch-action:pan-y;
    padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);border-radius:28px 28px 0 0;

    border-top:1px solid var(--line);animation:up .28s cubic-bezier(.2,.9,.3,1.1)}
  @keyframes up{from{transform:translateY(60%);opacity:0}}
  .sheet.tall{max-height:86vh}
  .row{display:flex;align-items:center;gap:10px}
  .badge{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap}
  .pw{flex:1;height:10px;background:rgba(255,255,255,.15);border-radius:9px;overflow:hidden}
  .pw i{display:block;height:100%;background:linear-gradient(90deg,#ff5a4e,#ffb84d);transition:width .6s}
  .say{margin:12px 0 4px;padding:12px 14px;border-radius:18px 18px 18px 4px;background:rgba(255,255,255,.12);line-height:1.6;font-size:16px}
  .opt{display:flex;gap:10px;width:100%;text-align:left;margin-top:9px;padding:12px 14px;border-radius:16px;font:inherit;font-size:15.5px;line-height:1.5;
    color:#fff;background:rgba(255,255,255,.09);border:1.5px solid var(--line);cursor:pointer}
  .opt:active{transform:scale(.985)}
  .opt .k{flex:none;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-size:13px;font-weight:700}
  .opt.great{border-color:var(--ok);background:rgba(61,220,151,.16)}
  .opt.picked{border-color:var(--c)}
  .opt.dim{opacity:.55}
  .fb{margin-top:10px;padding:11px 13px;border-radius:14px;background:rgba(255,201,60,.14);border:1px solid rgba(255,201,60,.4);line-height:1.6;font-size:15px}
  h2{margin:0;font-size:21px}
  .card-img{width:100%;border-radius:18px;margin-top:10px;display:block}
  .bars{display:grid;gap:7px;margin:10px 0}
  .bars div{display:flex;gap:8px;align-items:center;font-size:13.5px}
  .bars b{width:110px;font-weight:500}
  .bars span{flex:1;height:10px;background:rgba(255,255,255,.15);border-radius:9px;overflow:hidden}
  .bars i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b))}
  .mc{display:flex;gap:12px;padding:10px;border-radius:16px;background:rgba(255,255,255,.08);margin-top:8px;font-size:14px;line-height:1.5}
  .mc .e{font-size:30px;flex:none}
  p{margin:6px 0;line-height:1.6}
</style>

<body>
<video id="bg" playsinline muted autoplay></video>
<canvas id="gl"></canvas>

<div class="hud" id="hud" hidden>
  <div class="chip"><div class="ttl" id="hello">นักล่า</div><div class="slots" id="slots"></div></div>
  <div class="side">
    <canvas id="radar" width="168" height="168"></canvas>
    <button class="ib" id="btnBook" aria-label="สมุดมอนสเตอร์">📖</button>
    <button class="ib" id="btnSnd" aria-label="เสียง">🔊</button>
  </div>
</div>
<div id="cross" hidden></div>
<div id="prompt" hidden>แตะเพื่อท้าทาย!</div>
<div id="hint" hidden></div>

<div class="full" id="intro">
  <div class="hero">
    <div class="crew">🔥💜🧡💚💙</div>
    <h1>มอนสเตอร์ใจป่วน</h1>
    <p>มอนสเตอร์อารมณ์ 5 ตัวหลุดเข้ามาในห้องเรียนของคุณ! ใช้กล้องตามหา แล้ว <b>"ปราบด้วยใจเย็น"</b> เพื่อให้พวกมันมาเป็นเพื่อนคุณ</p>
    <div class="how">
      <div><b>🔎</b>หมุนตัวหามอนสเตอร์</div>
      <div><b>🪄</b>เลือกคาถาใจเย็น</div>
      <div><b>🐾</b>ได้เพื่อนคู่ใจ + พลัง</div>
    </div>
    <input type="text" id="nick" placeholder="ชื่อเล่นของนักล่า" maxlength="16" autocomplete="off">
    <button class="btn" id="btnStart">📷 เริ่มล่า (เปิดกล้อง)</button>
    <button class="btn ghost" id="btnNoCam">เล่นแบบไม่ใช้กล้อง (ลากนิ้วเพื่อมอง)</button>
    <div class="tiny">🔒 กล้องใช้แสดงภาพสดเท่านั้น ไม่บันทึกภาพ • คำตอบเก็บในเครื่องคุณเท่านั้น</div>
  </div>
</div>
<div class="sheet" id="sheet" hidden></div>

function tone(f,d=.12,type="sine",delay=0,vol=.12){
  if(!G.snd||!AC) return;
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+delay;
  o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);
}

const OUTLINE=new THREE.MeshBasicMaterial({color:0x161a35,side:THREE.BackSide});

function buildMonster(def){
  const g=new THREE.Group(),tone=new THREE.Color(def.color);
  const mat=new THREE.MeshToonMaterial({color:tone});
  const body=new THREE.Mesh(new THREE.SphereGeometry(.5,32,24),mat);body.scale.set(1,.92,1);g.add(body);
  const ol=new THREE.Mesh(body.geometry,OUTLINE);ol.scale.setScalar(1.07);body.add(ol);
  const belly=new THREE.Mesh(new THREE.SphereGeometry(.27,24,16),new THREE.MeshToonMaterial({color:tone.clone().lerp(new THREE.Color(0xffffff),.55)}));
  belly.position.set(0,-.2,.24);belly.scale.set(1,.9,.5);body.add(belly);
  const eyeM=new THREE.MeshToonMaterial({color:0xffffff}),pupM=new THREE.MeshBasicMaterial({color:0x161a35});
  const eyes=[],brows=[];
  [-1,1].forEach(s=>{
    const eye=new THREE.Mesh(new THREE.SphereGeometry(.14,20,16),eyeM);eye.position.set(s*.17,.13,.4);
    const pup=new THREE.Mesh(new THREE.SphereGeometry(.07,16,12),pupM);pup.position.set(0,0,.11);eye.add(pup);body.add(eye);eyes.push(eye);
    const br=new THREE.Mesh(new THREE.BoxGeometry(.16,.035,.03),pupM);br.position.set(s*.17,.32,.44);br.rotation.z=s*def.brow*-1;body.add(br);brows.push(br);
  });
  if(def.id==="lazy") eyes.forEach(e=>e.scale.y=.45);
  const mouth=new THREE.Mesh(new THREE.TorusGeometry(.09,.022,8,20,Math.PI),pupM);
  mouth.position.set(0,-.1,.47);mouth.rotation.z=SADLIKE[def.id]?0:Math.PI;body.add(mouth);
  [-1,1].forEach(s=>{const f=new THREE.Mesh(new THREE.SphereGeometry(.13,12,10),mat);f.position.set(s*.22,-.47,.12);f.scale.set(1,.6,1.3);g.add(f);});
  if(def.id==="anger"){[-1,1].forEach(s=>{const h=new THREE.Mesh(new THREE.ConeGeometry(.1,.26,12),new THREE.MeshToonMaterial({color:0xffe08a}));
    h.position.set(s*.26,.46,0);h.rotation.z=-s*.5;body.add(h);});}
  if(def.id==="shy"){[-1,1].forEach(s=>{const c=new THREE.Mesh(new THREE.CircleGeometry(.08,16),new THREE.MeshBasicMaterial({color:0xff7a9c,transparent:true,opacity:.8}));
    c.position.set(s*.3,-.02,.43);c.rotation.y=s*.5;body.add(c);});}
  if(def.id==="worry"){const d=emojiSprite("💦",.3);d.position.set(.45,.4,.3);g.add(d);}
  if(def.id==="lazy"){const z=emojiSprite("💤",.34);z.position.set(.4,.6,.2);g.add(z);}
  if(def.id==="sad"){const d=emojiSprite("💧",.24);d.position.set(-.2,-.02,.5);g.add(d);}
  const hit=new THREE.Mesh(new THREE.SphereGeometry(.85,8,8),new THREE.MeshBasicMaterial({visible:false}));g.add(hit);
  g.userData={def:def,body:body,mat:mat,mouth:mouth,eyes:eyes,brows:brows,hit:hit,ph:Math.random()*6.28,orig:tone.clone(),calm:false,fx:null,az:0,d:3,y:0,ang:0};
  return g;
}
function setCalm(g,on){

  u.mouth.rotation.z=on?Math.PI:(SADLIKE[u.def.id]?0:Math.PI);

const zee=new THREE.Vector3(0,0,1),q1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5));
const eul=new THREE.Euler(),q0=new THREE.Quaternion();
let alpha0=null,dYaw=0,dPitch=0;
function onOri(e){
  if(e.alpha==null||e.beta==null) return;
  G.gyro=true;
  if(alpha0===null) alpha0=e.alpha;
  const D=Math.PI/180,orient=((screen.orientation&&screen.orientation.angle)||window.orientation||0)*D;
  eul.set(e.beta*D,(e.alpha-alpha0)*D,-e.gamma*D,"YXZ");
  camera.quaternion.setFromEuler(eul);camera.quaternion.multiply(q1);camera.quaternion.multiply(q0.setFromAxisAngle(zee,-orient));
}
let drag=null,moved=0;

  if(!G.gyro){dYaw+=dx*.005;dPitch=Math.max(-1.3,Math.min(1.3,dPitch+dy*.005));camera.rotation.set(dPitch,dYaw,0,"YXZ");}
  drag={x:e.clientX,y:e.clientY};

const ray=new THREE.Raycaster(),v3=new THREE.Vector3(),fwd=new THREE.Vector3();
function targets(){return G.state==="hunt"?monsters:G.state==="crystals"?crystals:[];}
function onTap(x,y){
  if(G.state!=="hunt"&&G.state!=="crystals") return;
  scene.updateMatrixWorld(true);
  ray.setFromCamera({x:x/innerWidth*2-1,y:-(y/innerHeight)*2+1},camera);
  const hits=ray.intersectObjects(targets().map(m=>m.userData.hit),false);
  const t=hits.length?hits[0].object.parent:G.lock;
  if(t){sfx.tap();if(G.state==="hunt")startBattle(t);else pickCrystal(t);}
}
function updateLock(){
  camera.getWorldDirection(fwd);let best=null,ba=.17;
  targets().forEach(m=>{v3.copy(m.position).normalize();const a=Math.acos(Math.max(-1,Math.min(1,fwd.dot(v3))));if(a<ba){ba=a;best=m;}});
  if(best&&best!==G.lock) sfx.lock();
  G.lock=best;
  const on=!!best&&(G.state==="hunt"||G.state==="crystals");
  $("cross").classList.toggle("lock",on);$("prompt").hidden=!on;
  if(on) $("prompt").textContent=G.state==="hunt"?"แตะเพื่อท้าทาย "+best.userData.def.emoji:"แตะเพื่อเลือก ✨";
}
function updateRadar(){
  const c=$("radar").getContext("2d"),S=168,R=76;c.clearRect(0,0,S,S);
  c.strokeStyle="rgba(255,255,255,.25)";c.lineWidth=2;c.beginPath();c.arc(S/2,S/2,R,0,7);c.stroke();c.beginPath();c.arc(S/2,S/2,R/2,0,7);c.stroke();
  camera.getWorldDirection(fwd);const yaw=Math.atan2(fwd.x,-fwd.z);
  c.fillStyle="#fff";c.beginPath();c.moveTo(S/2,S/2-10);c.lineTo(S/2-7,S/2+7);c.lineTo(S/2+7,S/2+7);c.fill();
  targets().forEach(m=>{
    const az=Math.atan2(m.position.x,-m.position.z),rel=az-yaw,d=m.userData.d||2.5;
    const r=Math.min(R,18+d*13),px=S/2+Math.sin(rel)*r,py=S/2-Math.cos(rel)*r;
    const col=m.userData.def?m.userData.def.color:m.userData.col;
    c.fillStyle="#"+col.toString(16).padStart(6,"0");
    c.beginPath();c.arc(px,py,8+Math.sin(performance.now()/250)*1.5,0,7);c.fill();
  });
}

let tPrev=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-tPrev)/1000);tPrev=now;const t=now/1000;
  if(G.state==="intro") return;
  monsters.forEach(m=>{
    if(m===G.cur) return;
    const u=m.userData;u.az+=Math.sin(t*.3+u.ph)*.0015;
    m.position.copy(polar(u.az,u.d,u.y+Math.sin(t*1.6+u.ph)*.09));
    u.body.scale.set(1,.92+Math.sin(t*3+u.ph)*.035,1);
    m.rotation.y=Math.atan2(-m.position.x,-m.position.z);
  });
  if(G.cur){
    const m=G.cur,u=m.userData;let dy=Math.sin(t*2)*.05,dx=0;
    if(u.fx&&now<u.fx.until){
      if(u.fx.t==="great") dy+=Math.abs(Math.sin((u.fx.until-now)/110))*.28;
      if(u.fx.t==="bad") dx=Math.sin(now/22)*.07;
      if(u.fx.t==="ok") dy+=Math.abs(Math.sin((u.fx.until-now)/150))*.1;
    }
    m.position.set(dx,.8+dy,-2.5);m.scale.setScalar(.8);u.body.scale.set(1,.92+Math.sin(t*3)*.04,1);
  }
  pets.forEach((p,i)=>{const u=p.userData;u.ang+=dt*.45;
    p.position.set(Math.sin(u.ang)*1.6,.2+Math.sin(t*1.5+i)*.25+(i%2)*.4,-Math.cos(u.ang)*1.6);
    p.rotation.y=Math.atan2(-p.position.x,-p.position.z);});
  crystals.forEach((c,i)=>{c.userData.core.rotation.y+=dt*.8;c.userData.core.position.y=Math.sin(t*1.8+i)*.06;});
  for(let i=fxs.length-1;i>=0;i--){const s=fxs[i],u=s.userData;u.life-=dt;u.v.y-=2.4*dt;s.position.addScaledVector(u.v,dt);
    s.material.opacity=Math.max(0,u.life);if(u.life<=0){scene.remove(s);fxs.splice(i,1);}}
  updateLock();updateRadar();
  renderer.render(scene,camera);
}

  showSheet(`
    <div class="row"><span class="badge">${d.emoji} ${d.name} • ${d.feel}</span><span class="pw"><i style="width:${left}%"></i></span><span class="badge">รอบ ${G.round+1}/2</span></div>

    <div id="fbx"></div>`);

function answer(btn,d,r){
  if(guard()) return;
  const rr=+btn.dataset.r,o=r.o.find(x=>x.r===rr);
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(+b.dataset.r===2)b.classList.add("great");if(b!==btn&&+b.dataset.r!==2)b.classList.add("dim");});
  btn.classList.add("picked");
  G.score+=rr;const m=G.cur,now=performance.now();
  scene.updateMatrixWorld(true);const wp=new THREE.Vector3();m.getWorldPosition(wp);
  if(rr===2){sfx.great();m.userData.fx={t:"great",until:now+900};burst(wp,["⭐","💖","✨"],12);}
  else if(rr===1){sfx.ok();m.userData.fx={t:"ok",until:now+600};burst(wp,["✨"],5);}
  else{sfx.bad();m.userData.fx={t:"bad",until:now+700};burst(wp,["💢"],4);}
  const last=G.round>=1,tamed=G.score>=3;
  document.querySelector(".pw i").style.width=(tamed&&last?0:Math.max(0,4-G.score)/4*100)+"%";
  const lbl=rr===2?"✨ คาถาได้ผลสุด ๆ":rr===1?"🙂 ได้ผลบ้าง":"🌀 ยังไม่ค่อยได้ผล";
  $("fbx").innerHTML=`<div class="fb"><b>${lbl}</b><br>${o.f}</div>
    <button class="btn" id="nx">${last?(tamed?"🎉 ดูผลการปราบ":"ดูผลรอบนี้"):"ไปรอบต่อไป ➜"}</button>`;
  openedAt=Date.now();
  $("nx").onclick=()=>{if(guard())return;openedAt=Date.now();if(!last){G.round++;renderRound(false);}else finishBattle(tamed);};
  $("sheet").scrollTop=$("sheet").scrollHeight;
}
function finishBattle(tamed){
  const m=G.cur,d=m.userData.def,stars=G.score>=4?2:1;
  openedAt=Date.now();
  if(tamed){
    sfx.tame();setCalm(m,true);scene.updateMatrixWorld(true);const wp=new THREE.Vector3();m.getWorldPosition(wp);burst(wp,["⭐","💖","🎉","✨"],22);
    G.tamed[d.id]=stars;if(!G.orderTamed.includes(d.id))G.orderTamed.push(d.id);save();renderSlots();
    showSheet(`<div style="text-align:center"><div style="font-size:46px">${d.emoji}</div>
      <h2>ปราบ${d.name}สำเร็จ! ${"⭐".repeat(stars)}</h2>
      <p>${d.name} สงบลงแล้ว และขอเป็นเพื่อนคู่ใจของเธอ 💖</p></div>
      <div class="mc"><div class="e">🎁</div><div><b>ได้รับ: ${d.gift}</b><br>${d.learn}</div></div>
      <button class="btn" id="go">${Object.keys(G.tamed).length>=5?"🔮 ไปห้องปลดล็อกตัวตน":"ออกล่าตัวต่อไป ➜"}</button>`);
    $("go").onclick=()=>{if(guard())return;releaseTamed(m);};
  }else{
    showSheet(`<div style="text-align:center"><div style="font-size:46px">💨</div><h2>${d.name}หนีไปได้!</h2>
      <p>ไม่เป็นไรนะ นักล่าเก่ง ๆ ก็พลาดได้ ${d.name}ซ่อนตัวอยู่ใกล้ ๆ ลองกลับไปท้าทายใหม่ แล้วเลือกคาถาที่ <b>ใจเย็นและพูดดี ๆ</b> ดูนะ</p></div>
      <button class="btn" id="go">ลองใหม่อีกครั้ง ➜</button>`);
    $("go").onclick=()=>{if(guard())return;releaseEscaped(m);};
  }
}
function leaveCamera(m){camera.remove(m);m.userData.fx=null;m.rotation.set(0,0,0);}
function releaseTamed(m){
  leaveCamera(m);const i=monsters.indexOf(m);if(i>=0)monsters.splice(i,1);
  m.scale.setScalar(.38);m.userData.ang=Math.random()*6.28;scene.add(m);pets.push(m);
  G.cur=null;hideSheet();
  if(Object.keys(G.tamed).length>=5) startCrystals();
  else{G.state="hunt";$("cross").hidden=false;hint("หมุนตัวหามอนสเตอร์ตัวต่อไป • ดูทิศบนเรดาร์");}
}
function releaseEscaped(m){
  leaveCamera(m);setCalm(m,false);m.userData.az=Math.random()*6.28;m.scale.setScalar(1);scene.add(m);G.cur=null;
  G.state="hunt";$("cross").hidden=false;hideSheet();hint("หามอนสเตอร์ที่หนีไป แล้วท้าทายใหม่!");
}

/* ===== ห้องปลดล็อกตัวตน (คริสตัล) ===== */
function startCrystals(){
  G.state="crystals";G.picks=[];
  Object.keys(TYPES).forEach((k,i)=>{
    const T=TYPES[k],az=i/6*Math.PI*2+.3,g=new THREE.Group();
    const core=new THREE.Mesh(new THREE.OctahedronGeometry(.4),new THREE.MeshToonMaterial({color:T.c,emissive:T.c,emissiveIntensity:.35}));
    const ol=new THREE.Mesh(core.geometry,OUTLINE);ol.scale.setScalar(1.08);core.add(ol);g.add(core);
    const em=emojiSprite(T.e,.42);em.position.y=.8;g.add(em);
    const lb=labelSprite(T.a,"#"+T.c.toString(16).padStart(6,"0"));lb.position.y=-.7;g.add(lb);
    const hit=new THREE.Mesh(new THREE.SphereGeometry(.8,8,8),new THREE.MeshBasicMaterial({visible:false}));g.add(hit);
    g.position.copy(polar(az,2.8,.25+(i%3)*.35-.3));g.userData={key:k,core:core,hit:hit,d:2.8,col:T.c,badge:null};
    scene.add(g);crystals.push(g);
  });
  $("cross").hidden=false;
  showSheet(`<div style="text-align:center"><div style="font-size:40px">🔮</div><h2>ห้องปลดล็อกตัวตน</h2>
    <p>เพื่อนทั้ง 5 มอบพลังให้แล้ว! ตอนนี้มีคริสตัล 6 ลูกลอยอยู่รอบตัว แต่ละลูกคือ "สิ่งที่คนเราชอบทำ"<br>
    แตะเลือก <b>3 ลูกที่อยากลองมากที่สุด</b> ตามลำดับ (ลูกแรก = อยากที่สุด)</p>
    <p style="font-size:13px;opacity:.75">ไม่มีถูกผิด เลือกตามใจจริง ๆ นะ</p></div>
    <button class="btn" id="go">เริ่มเลือกคริสตัล</button>`);
  $("go").onclick=()=>{if(guard())return;hideSheet();hint("แตะคริสตัล 3 ลูก • แตะซ้ำเพื่อยกเลิก");};
  openedAt=Date.now();
}
function pickCrystal(c){
  const u=c.userData,i=G.picks.indexOf(u.key);
  if(i>=0){G.picks.splice(i,1);}else{if(G.picks.length>=3)return;G.picks.push(u.key);burst(c.position,["✨"],6);sfx.great();}
  crystals.forEach(k=>{const n=G.picks.indexOf(k.userData.key);
    if(k.userData.badge){k.remove(k.userData.badge);k.userData.badge=null;}
    k.scale.setScalar(n>=0?1.3:1);
    if(n>=0){const b=emojiSprite(["🥇","🥈","🥉"][n],.45);b.position.set(.55,.5,0);k.add(b);k.userData.badge=b;}});
  hint(G.picks.length<3?"เลือกแล้ว "+G.picks.length+"/3":"");
  if(G.picks.length===3){G.state="result";$("cross").hidden=true;$("prompt").hidden=true;hint("");setTimeout(showResult,700);}
}

/* ===== ผลลัพธ์ + การ์ด ===== */
function computeResult(){
  const w={R:0,I:0,A:0,S:0,E:0,C:0};G.picks.forEach((k,i)=>w[k]+=3-i);
  const main=G.picks[0],second=G.picks[1];
  let bestId=G.orderTamed[0],bs=-1;
  G.orderTamed.forEach(id=>{if((G.tamed[id]||0)>bs){bs=G.tamed[id];bestId=id;}});
  const mon=MON.find(m=>m.id===bestId)||MON[0];
  return {w:w,main:main,second:second,mon:mon,title:TYPES[main].n+"สาย"+mon.trait};
}
function drawCard(res){
  const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const hex=n=>"#"+n.toString(16).padStart(6,"0");
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,"#241b6b");g.addColorStop(.6,"#4b2a8f");g.addColorStop(1,hex(TYPES[res.main].c));
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle="rgba(255,255,255,.07)";for(let i=0;i<24;i++){x.beginPath();x.arc((i*197)%W,(i*311)%H,30+(i*13)%60,0,7);x.fill();}
  const F="Prompt,'Noto Sans Thai',sans-serif",EM="system-ui,'Apple Color Emoji','Noto Color Emoji'";
  x.textAlign="center";x.fillStyle="#fff";
  x.font="600 40px "+F;x.fillText("การ์ดนักล่ามอนสเตอร์ใจป่วน",W/2,110);
  x.font="500 34px "+F;x.globalAlpha=.8;x.fillText("ของ "+(G.name||"นักล่านิรนาม"),W/2,162);x.globalAlpha=1;
  x.font="220px "+EM;x.fillText(TYPES[res.main].e,W/2,420);
  x.font="700 80px "+F;x.fillText(res.title,W/2,545);
  x.font="500 38px "+F;x.globalAlpha=.9;x.fillText(TYPES[res.main].a,W/2,605);x.globalAlpha=1;
  x.font="76px "+EM;x.fillText(MON.map(m=>m.emoji).join("   "),W/2,730);
  x.font="500 32px "+F;x.fillText("เพื่อนคู่ใจ 5 ตัว ปราบด้วยใจเย็น",W/2,785);
  Object.entries(res.w).sort((a,b)=>b[1]-a[1]).forEach(([k,v],i)=>{
    const y=850+i*58;x.textAlign="left";x.font="500 30px "+F;x.fillStyle="#fff";x.fillText(TYPES[k].e+" "+TYPES[k].n,150,y);
    x.fillStyle="rgba(255,255,255,.2)";x.fillRect(450,y-24,480,24);x.fillStyle=hex(TYPES[k].c);x.fillRect(450,y-24,480*v/6,24);});
  x.fillStyle="#fff";x.textAlign="center";x.font="500 32px "+F;x.fillText("พลังพิเศษ: "+res.mon.gift,W/2,1245);
  x.font="400 26px "+F;x.globalAlpha=.75;x.fillText("โรงเรียนพูลเจริญวิทยาคม • กิจกรรมแนะแนว ม.1",W/2,1305);x.globalAlpha=1;
  return c;
}
function showResult(){
  const res=computeResult(),url=drawCard(res).toDataURL("image/png"),T=TYPES[res.main],T2=TYPES[res.second];
  const bars=Object.entries(res.w).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div><b>${TYPES[k].e} ${TYPES[k].n}</b><span><i style="width:${v/6*100}%"></i></span></div>`).join("");
  openedAt=Date.now();
  showSheet(`<div style="text-align:center"><span class="badge">🧭 ผลของ ${esc(G.name||"นักล่า")}</span><h2 style="margin-top:8px">${T.e} ${res.title}</h2></div>
    <img class="card-img" src="${url}" alt="การ์ดตัวตน">
    <p><b>${T.n}:</b> ชอบ${T.a}<br><span style="opacity:.8">อาชีพที่อาจเหมาะ: ${T.jobs}</span></p>
    <p>เสริมด้วย <b>${T2.n}</b> • พลังพิเศษ <b>${res.mon.gift}</b> จาก${res.mon.name}</p>
    <div class="bars">${bars}</div>
    <p style="font-size:13.5px;opacity:.8">ผลนี้เป็นแค่จุดเริ่มต้นของการรู้จักตัวเอง ความสนใจเปลี่ยนได้เมื่อเราลองสิ่งใหม่ ๆ ไม่ได้ตัดสินว่าต้องเป็นอาชีพไหน — เอาการ์ดไปคุยกับครูแนะแนวได้เลย</p>
    <a id="dl" class="btn" download="monster-quest-card.png" href="${url}" style="text-decoration:none;text-align:center">💾 บันทึกการ์ด</a>
    <button class="btn ghost" id="again">🔄 เริ่มเล่นใหม่</button>`,true);
  $("again").onclick=()=>{try{localStorage.removeItem(KEY);}catch(e){}location.reload();};sfx.tame();
}

/* ===== สมุดมอนสเตอร์ ===== */
function openBook(){
  if(G.state!=="hunt"&&G.state!=="crystals") return;
  const prev=G.state;G.state="book";openedAt=Date.now();
  showSheet(`<h2>📖 สมุดมอนสเตอร์</h2>`+MON.map(m=>G.tamed[m.id]?
    `<div class="mc"><div class="e">${m.emoji}</div><div><b>${m.name}</b> ${"⭐".repeat(G.tamed[m.id])}<br>${m.learn}</div></div>`:
    `<div class="mc"><div class="e">❓</div><div><b>ยังไม่เจอ</b><br>ตามหาตัวนี้ในห้องแล้วปราบให้ได้!</div></div>`).join("")+
    `<button class="btn ghost" id="cl">ปิด</button>`,true);
  $("cl").onclick=()=>{if(guard())return;hideSheet();G.state=prev;};
}

/* ================= เริ่มเกม ================= */
async function start(useCam){
  G.name=$("nick").value.trim();save();
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  if(useCam){
    try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});$("bg").srcObject=st;G.cam=true;}
    catch(e){alert("เปิดกล้องไม่ได้ ระบบจะเปลี่ยนเป็นโหมดไม่ใช้กล้องให้นะ");}
  }
  try{
    if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
      const r=await DeviceOrientationEvent.requestPermission();if(r==="granted")addEventListener("deviceorientation",onOri);
    }else addEventListener("deviceorientation",onOri);
  }catch(e){}
  $("intro").hidden=true;$("hud").hidden=false;$("cross").hidden=false;
  const rest=MON.filter(m=>!G.tamed[m.id]);
  MON.filter(m=>G.tamed[m.id]).forEach(m=>{const p=buildMonster(m);setCalm(p,true);p.scale.setScalar(.38);p.userData.ang=Math.random()*6.28;scene.add(p);pets.push(p);});
  rest.forEach((m,i)=>spawnMonster(m,(i/rest.length)*Math.PI*2+Math.random()*.7+.4));
  renderSlots();
  G.state="hunt";
  if(!rest.length) startCrystals();
  else{hint("📱 หมุนตัวช้า ๆ หามอนสเตอร์ • ดูทิศบนเรดาร์");
    setTimeout(()=>{if(!G.gyro&&G.state==="hunt") hint("👆 ลากนิ้วบนจอเพื่อมองรอบห้อง");},1500);}
}
$("btnStart").onclick=()=>start(true);
$("btnNoCam").onclick=()=>start(false);
$("btnBook").onclick=openBook;
$("btnSnd").onclick=e=>{G.snd=!G.snd;e.currentTarget.textContent=G.snd?"🔊":"🔇";};
load();if(G.name)$("nick").value=G.name;
if(Object.keys(G.tamed).length) $("btnStart").textContent="📷 เล่นต่อ ("+Object.keys(G.tamed).length+"/5)";
requestAnimationFrame(frame);
</script>
</body>
</html>
