<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แอป PA · เก็บผลงานและเกียรติบัตร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#EFF3F1;--surface:#fff;--ink:#22313A;--muted:#5B6B72;--line:#DCE4E1;--accent:#0F6B5C;--accent-ink:#fff;--warn:#7A5F00;--warn-bg:#FFF3CE;--ok:#0A4F44;--ok-bg:#E2F0EC;--info:#3d5382;--info-bg:#e9eef8;--danger:#C0392B;--shadow:0 2px 10px rgba(34,49,58,.08)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 'Sarabun','Noto Sans Thai','Leelawadee UI',Tahoma,system-ui,sans-serif}
h2,h3{margin:0 0 .5rem;line-height:1.3}h2{font-size:1.4rem}h3{font-size:1.1rem}p{margin:.35rem 0}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:.7rem;align-items:center;padding:.6rem 1rem .2rem;max-width:760px;margin:0 auto}
.logo{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:10px;padding:.15rem .55rem;letter-spacing:.5px}
.brand .t{font-weight:700;line-height:1.2}.brand .s{font-size:.8rem;color:var(--muted);min-height:1.1em}
#nav{display:flex;gap:.35rem;overflow-x:auto;padding:.3rem 1rem .6rem;max-width:760px;margin:0 auto;scrollbar-width:none}#nav::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:.35rem .9rem;font:inherit;font-size:.95rem;min-height:40px;cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
main{max-width:760px;margin:0 auto;padding:1rem 1rem 4rem}
.stack{display:flex;flex-direction:column;gap:.9rem}.stack.sm{gap:.6rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1rem;box-shadow:var(--shadow)}
.hero{border-color:var(--accent)}
.row{display:flex;gap:.6rem;align-items:center}.row.wrap{flex-wrap:wrap}.row.between{justify-content:space-between}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}@media(max-width:520px){.two{grid-template-columns:1fr}}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.6rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.75rem .9rem}.sv{font-size:1.5rem;font-weight:700;line-height:1.2}.sl{font-size:.85rem;color:var(--muted)}
.eyebrow{font-size:.85rem;color:var(--muted)}.big{font-size:1.7rem;font-weight:700;line-height:1.2}.hint{font-size:.85rem;color:var(--muted)}.lbl{font-size:.9rem;color:var(--muted);font-weight:600}
.fld{display:flex;flex-direction:column;gap:.25rem;margin:.55rem 0}
input[type=text],input[type=url],input[type=number],select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.5rem .65rem;min-height:44px}
textarea{resize:vertical;overflow:hidden;line-height:1.5}
input:focus,textarea:focus,select:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:inherit;font-size:.98rem;min-height:44px;padding:.45rem 1rem;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}.btn.danger{color:var(--danger);border-color:var(--danger)}.btn.ghost{background:transparent}.btn.sm{min-height:38px;padding:.25rem .8rem;font-size:.9rem}.btn:disabled{opacity:.6}
.iconbtn{flex:0 0 auto;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:1rem;cursor:pointer}
.linkbtn{all:unset;cursor:pointer;display:block;width:100%;padding:.35rem 0}.linkbtn:focus-visible{outline:2px solid var(--accent)}
.chip{display:inline-block;font-size:.75rem;font-weight:600;border-radius:999px;padding:.05rem .55rem;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.info{background:var(--info-bg);color:var(--info)}
.issues{list-style:none;margin:.3rem 0 0;padding:0}.issues li{border-top:1px solid var(--line)}.issues li:first-child{border-top:0}
.more{margin-top:.5rem}.more summary{cursor:pointer;color:var(--muted);font-size:.9rem;min-height:36px}
.checks{display:flex;flex-direction:column}.chk{display:flex;gap:.5rem;align-items:center;min-height:40px}.chk input{width:20px;height:20px}
.area{margin:.8rem 0 0;color:var(--accent)}
.ind{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.ind summary{list-style:none;cursor:pointer;display:flex;gap:.6rem;align-items:center;padding:.65rem .8rem;min-height:52px}.ind summary::-webkit-details-marker{display:none}
.ino{font-weight:700;color:var(--accent);flex:0 0 2.2rem}.ititle{flex:1;font-size:.95rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ibody{padding:.2rem .9rem .9rem;border-top:1px solid var(--line)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem;margin:.4rem 0}
.ph{position:relative;display:flex;flex-direction:column;gap:.35rem;border:1px solid var(--line);border-radius:12px;padding:.4rem}.ph img{width:100%;height:120px;object-fit:cover;border-radius:8px;background:var(--bg)}.ph .iconbtn{position:absolute;top:.5rem;right:.5rem;width:34px;height:34px;background:var(--surface)}
.lrow{display:grid;grid-template-columns:1fr 1.4fr auto;gap:.4rem;margin:.4rem 0}@media(max-width:520px){.lrow{grid-template-columns:1fr auto}.lrow input:nth-child(2){grid-column:1/2}}
.cat{margin-top:.9rem;padding-top:.6rem;border-top:1px dashed var(--line)}.cat-t{font-weight:600;font-size:.95rem}.cat-s{color:var(--muted);font-size:.9rem;white-space:nowrap}
.wrow{display:grid;grid-template-columns:1fr auto auto;gap:.4rem;align-items:center;margin:.4rem 0}@media(max-width:520px){.wrow{grid-template-columns:1fr auto}.wrow .hm{grid-column:1/2}}
.hm{display:flex;align-items:center;gap:.25rem;color:var(--muted);font-size:.85rem}.hm input{width:56px;text-align:center;padding:.5rem .2rem}
.yr{width:90px!important}.total{margin-top:.9rem;padding-top:.7rem;border-top:2px solid var(--line);font-weight:600}
.note{font-size:.88rem;border-radius:10px;padding:.5rem .7rem}.note.warn{background:var(--warn-bg);color:var(--warn)}
.li{display:grid;grid-template-columns:2.6rem 1fr auto;gap:.4rem;align-items:start}.li .no{padding-top:.5rem;color:var(--accent);font-weight:700}.mv{display:flex;flex-direction:column;gap:.25rem}
.qbox{border:1px solid var(--line);border-radius:12px;padding:.6rem;display:flex;flex-direction:column;gap:.5rem}.calc{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center}.calc input{width:96px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:20}
.dlg{background:var(--surface);color:var(--ink);border-radius:16px;padding:1.1rem;max-width:420px;width:100%}.acts{display:flex;gap:.5rem;justify-content:flex-end;margin-top:.9rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:12px;z-index:30;max-width:90vw;font-size:.95rem}

.lbl{white-space:nowrap}.fld .lbl{white-space:normal}

.code{display:inline-block;font-size:.75rem;font-weight:700;color:var(--accent);background:var(--ok-bg);border-radius:8px;padding:.05rem .5rem;align-self:flex-start}
select.place{font-size:14px;min-height:40px}
.lrow{grid-template-columns:auto 1fr 1.4fr auto auto}@media(max-width:520px){.lrow{grid-template-columns:auto 1fr auto}.lrow input,.lrow select{grid-column:1/-1}}
.opts{display:grid;gap:.6rem;margin:.5rem 0}.opt{text-align:left;font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:.7rem .9rem;display:flex;flex-direction:column;gap:.15rem;cursor:pointer;min-height:44px}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;background:var(--ok-bg)}

.plan{margin:.7rem 0;padding:.6rem .7rem;border:1px dashed var(--line);border-radius:12px}.prow{display:grid;grid-template-columns:auto 1fr auto;gap:.5rem;align-items:start;margin:.4rem 0}.prow input[type=checkbox]{width:22px;height:22px;margin-top:.75rem}.pbody{display:flex;flex-direction:column;gap:.15rem}

h2,h3,.brand .t{font-family:'Mitr','Sarabun',sans-serif;font-weight:500}
#top{background:var(--accent);color:#fff;border-bottom:0}
#top .brand .s{color:#d7efe8}#top .logo{background:#FFD34D;color:#0A4F44}
.brand{max-width:860px}#nav,main{max-width:860px}
.tab{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}.tab.on{background:#fff;color:var(--accent);border-color:#fff}
.hdr-r{margin-left:auto;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#years select{min-height:38px;width:auto;background:#fff;color:var(--ink);border:0;font-weight:600}
#who{font-size:.85rem;color:#d7efe8}.back{color:#fff;font-size:.85rem;font-weight:600;text-decoration:underline;min-height:38px;display:inline-flex;align-items:center}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.7rem}@media(max-width:520px){.three{grid-template-columns:1fr}}
input[type=date]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.5rem .65rem;min-height:44px}
.dlg{max-height:90vh;overflow:auto}.dlg.wide{max-width:680px}.acts .left{margin-right:auto}
#busy{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);background:#FFD34D;color:#3d3000;font-weight:600;padding:.5rem 1rem;border-radius:999px;z-index:40;box-shadow:var(--shadow)}
.note.ok{background:var(--ok-bg);color:var(--ok)}.linkbtn.inl{display:inline;width:auto;padding:0;color:var(--accent);text-decoration:underline;font-weight:600}
.tr h3{margin:0}.trh{flex:1;min-width:220px}.chips{gap:.35rem;margin:.5rem 0}.small{font-size:.9rem;margin:.3rem 0;overflow-wrap:anywhere}
.files{display:grid;gap:.5rem;margin:.6rem 0}.fc{display:grid;grid-template-columns:88px 1fr;gap:.6rem;align-items:center;border:1px solid var(--line);border-radius:12px;padding:.4rem}
.fc img,.fc .miss{width:88px;height:66px;object-fit:cover;border-radius:8px;background:var(--bg)}.fcn{font-size:.9rem;overflow-wrap:anywhere}.fca{gap:.3rem;margin-top:.2rem}
.pdf{width:88px;height:66px;border-radius:8px;border:1px solid var(--line);background:#fdecea;color:#b3261e;font-weight:700;cursor:pointer;font:inherit}
.miss{display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--muted);text-align:center;height:120px;border-radius:8px;background:var(--bg)}
.btn.danger.ghost{background:transparent}.chk.sm{min-height:36px;font-size:.9rem}.chk.sm input{width:18px;height:18px}
.indpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:0 .4rem}
.topic{border-top:1px dashed var(--line);padding-top:.6rem;margin-top:.6rem}.tno{color:var(--accent)}
</style>
</head>

/* ===== PA 1/ส Word generator (ย้ายมาจากแอป "ข้อตกลง PA รายปี" — ไม่แก้ยกเว้นเพิ่มข้อ 1.4) — builds the .docx parts from one year's data ===== */
var PADocx = (function () {
  var FONT = "TH SarabunPSK";
  var PH_RE = /(\[รอข้อมูลจริง[^\]]*\])/;
  var seg = null;
  try { if (typeof Intl !== "undefined" && Intl.Segmenter) seg = new Intl.Segmenter("th", { granularity: "word" }); } catch (e) { seg = null; }

  function zw(s) {
    if (!seg) return s;
    return s.replace(/[฀-๿]+/g, function (m) {
      var out = [];
      var it = seg.segment(m)[Symbol.iterator]();
      for (var r = it.next(); !r.done; r = it.next()) out.push(r.value.segment);
      return out.join("​");
    });
  }
  function xesc(s) {
    return String(s == null ? "" : s)
      .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function tw(cm) { return Math.round(cm * 567); }

  /* ---- hours ---- */
  function parseHours(s) {
    s = String(s || "").trim();
    if (!s) return null;
    var m = s.match(/^(?:(\d+)\s*ชั่วโมง)?\s*(?:(\d+)\s*นาที)?$/);
    if (!m || (m[1] == null && m[2] == null)) return null;
    return (parseInt(m[1] || "0", 10) * 60) + parseInt(m[2] || "0", 10);
  }
  function fmtHours(min) {
    var h = Math.floor(min / 60), m = min % 60, out = [];
    if (h) out.push(h + " ชั่วโมง");
    if (m || !h) out.push(m + " นาที");
    return out.join(" ");
  }
  /* one period (คาบ) = 50 minutes; periods win over a typed hours string */
  var PERIOD_MIN = 50;
  function parsePeriods(s) {
    s = String(s == null ? "" : s).replace(/คาบ/g, "").trim();
    if (!s || !/^\d+(\.\d+)?$/.test(s)) return null;
    var n = Number(s);
    return n > 0 ? n : null;
  }
  function rowMin(r) {
    if (!r) return null;
    var p = parsePeriods(r.periods);
    if (p != null) return Math.round(p * PERIOD_MIN);
    if (r.periods != null && String(r.periods).trim() !== "") return null;

  function rowText(r) { var m = rowMin(r); return m == null ? "[รอข้อมูลจริง]" : fmtHours(m); }

    }
    return t;
  }
  function totalText(rows) { var t = sumHours(rows || []); return t == null ? "[รอข้อมูลจริง]" : fmtHours(t); }

  function lines(s) { return String(s || "").split(/\n/).map(function (x) { return x.trim(); }).filter(Boolean); }

  /* ---- xml pieces ---- */
  function run(text, o) {
    o = o || {};
    var sz = (o.size || 16) * 2;
    var rpr = '<w:rFonts w:ascii="' + FONT + '" w:hAnsi="' + FONT + '" w:cs="' + FONT + '" w:eastAsia="' + FONT + '"/>' +
      (o.b ? "<w:b/><w:bCs/>" : "") + (o.hl ? '<w:highlight w:val="yellow"/>' : "") +

  }

      out += run(parts[i], { b: o && o.b, size: o && o.size, hl: isPh });
    }
    return out;
  }
  function pPr(o) {

    return "<w:p>" + pPr(o) + r + "</w:p>";
  }
  function pageBreak() { return '<w:p><w:r><w:br w:type="page"/></w:r></w:p>'; }

  function cell(width, paras, o) {
    o = o || {};

      '</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="85" w:type="dxa"/><w:right w:w="85" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>' +

  }
  function row(cellsXml, header) { return "<w:tr>" + (header ? "<w:trPr><w:tblHeader/></w:trPr>" : "") + cellsXml + "</w:tr>"; }

  /* ---- the form ---- */
  function body(d) {

/* ---------------- XML utilities ---------------- */
function topLevel(body) {
  const out = []; const re = /<(\/?)w:(p|tbl|sectPr)\b[^>]*?(\/?)>/g; let m, depth = 0, start = -1, tag = '';
  while ((m = re.exec(body))) {
    const closing = m[1] === '/', selfc = m[3] === '/', t = m[2];
    if (depth === 0) {
      if (closing) continue;
      if (selfc) { out.push({ tag: t, xml: m[0] }); continue; }
      start = m.index; tag = t; depth = 1;
    } else {
      if (t !== tag) continue;
      if (closing) { depth--; if (depth === 0) out.push({ tag, xml: body.slice(start, m.index + m[0].length) }); }
      else if (!selfc) depth++;
    }
  }
  return out;
}
function plain(x, paras) {
  x = x.replace(/<w:drawing>[\s\S]*?<\/w:drawing>/g, '')
       .replace(/<mc:AlternateContent>[\s\S]*?<\/mc:AlternateContent>/g, '')
       .replace(/<w:pict>[\s\S]*?<\/w:pict>/g, '')
       .replace(/<w:tab\/>/g, '\t').replace(/<w:br\/>/g, ' ');
  if (paras) x = x.replace(/<\/w:p>/g, '\n');

}

function workloadTables(st) {

    } else {

        items.forEach(it => rows.push(itemRow(it.name, fmtItem(it.min))));

/* ---------------- checks for the dashboard ---------------- */
function pct(total, done) { const t = num(total), d = num(done); if (!(t > 0) || !isFinite(d)) return NaN; return Math.round(d / t * 1000) / 10; }

function analyze(st) {
  const issues = []; let withEvidence = 0, photoCount = 0, linkCount = 0, planTotal = 0, planDone = 0;
  const c = st.cover;

  if (missingCover.length) issues.push({ level: 'warn', tab: 'info', text: 'ข้อมูลผู้จัดทำยังไม่ครบ: ' + missingCover.join(', ') });
  for (const sem of st.semesters) {
    const label = `ภาคเรียนที่ ${sem.term}/${sem.year}`;
    if (!sem.items.length) issues.push({ level: 'warn', tab: 'work', text: `${label} ยังไม่มีรายการภาระงาน` });
    else if (sem.importedTotal != null && sem.importedTotal !== semMin(sem)) issues.push({ level: 'warn', tab: 'work', text: `${label}: ยอดรวมในไฟล์เดิม (${fmtTotal(sem.importedTotal)}) ไม่ตรงกับผลบวกรายการ (${fmtTotal(semMin(sem))})` });
  }

    const it = st.indicators[d.id]; const ph = it.items.filter(x => x.type === 'photo'), lk = it.items.filter(x => x.type === 'link');
    photoCount += ph.length; linkCount += lk.length;
    const has = it.items.length > 0 || evidenceLines(it).length > 0 || (st.trainings || []).some(t => (t.indicators || []).includes(d.id));
    const pl = it.plan || [], pd = pl.filter(p => p.done).length; planTotal += pl.length; planDone += pd;
    if (pl.length > pd) issues.push({ level: 'info', tab: 'ind', ref: d.id, text: `ตัวชี้วัด ${d.id}: ยังต้องเก็บหลักฐานอีก ${pl.length - pd} รายการ` });
    if (has) withEvidence++; else issues.push({ level: 'warn', tab: 'ind', ref: d.id, text: `ตัวชี้วัด ${d.id} ยังไม่มีหลักฐาน` });
    if (!lines(it.action || '').length) issues.push({ level: 'warn', tab: 'ind', ref: d.id, text: `ตัวชี้วัด ${d.id} ยังไม่ได้เขียนการดำเนินงาน` });
    const nc = ph.filter(x => !(x.caption || '').trim()).length;
    if (nc) issues.push({ level: 'info', tab: 'ind', ref: d.id, text: `ตัวชี้วัด ${d.id}: รูป ${nc} รูปยังไม่มีคำอธิบาย` });

  ch.quant.forEach((q, i) => { if (isNaN(pct(q.total, q.achieved))) issues.push({ level: 'info', tab: 'ch', text: `ผลเชิงปริมาณข้อ ${i + 1} ยังไม่ได้กรอกจำนวนนักเรียนจริง` }); });

function evidenceLines(it) {

function bumpYears(t) {

    title: c.title, problem: bumpYears(c.problem),
    methods: c.methods.map(m => ({ id: uid('m'), text: bumpYears(m.text) })),
    quant: c.quant.map(q => ({ id: uid('q'), text: bumpYears(q.text), target: q.target, total: '', achieved: '' })),
    qual: c.qual.map(q => ({ id: uid('u'), text: bumpYears(q.text) }))

async function driveCall(payload) {
  let lastMsg = 'ทำรายการไม่สำเร็จ ลองใหม่อีกครั้งค่ะ';
  for (let i = 0; i < 3; i++) {
    let retry = false;
    try {
      const { data: { session: s } } = await sb.auth.getSession();
      if (!s) { const err = new Error('หมดเวลาเข้าสู่ระบบ กรุณาโหลดหน้าใหม่แล้วเข้าสู่ระบบอีกครั้งค่ะ'); err.fatal = true; throw err; }
      const res = await fetch(DRIVE_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({}, payload, { token: s.access_token })) });
      const j = await res.json();
      if (j.ok) return j;
      lastMsg = j.error || lastMsg;
      if (/คำสั่งไม่ถูกต้อง/.test(lastMsg)) lastMsg = 'ที่เก็บไฟล์ Drive ยังไม่ได้อัปเดตเป็นรุ่นที่รองรับแอป PA (ดูคู่มือ tools/drive-submission/README.md)';
      retry = !!j.busy;
    } catch (e) {
      if (e.fatal) throw e;
      lastMsg = 'เชื่อมต่อที่เก็บไฟล์ไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่ค่ะ'; retry = true;
    }
    if (!retry) throw new Error(lastMsg);
    await sleep(1500 * (i + 1));
  }
  throw new Error(lastMsg);
}
function bufToB64(buf) {
  const u = new Uint8Array(buf); let s = '';
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));

}

// อัปโหลด 1 ไฟล์ → คืน { id: pa_evidence.id, driveFileId }
async function upload(o) {
  if (o.buf.byteLength > 10 * 1048576) throw new Error('ไฟล์ใหญ่เกิน 10 MB ค่ะ');
  const j = await driveCall({ action: 'pa_upload', cycleId: o.cycleId || null, trainingId: o.trainingId || null, kind: o.kind, indicator: o.indicator || '',
    itemId: o.itemId || '', mime: o.mime, fileName: o.fileName || 'หลักฐาน', data: bufToB64(o.buf), width: o.w || null, height: o.h || null });
  await Cache.put('files', j.id, { buf: o.buf, mime: o.mime });

}
// โหลดไฟล์จาก Drive (ทีละไม่เกิน 3 ไฟล์ กันสคริปต์ยุ่ง)
let running = 0; const waiters = [];
async function slot(fn) { while (running >= 3) await new Promise(r => waiters.push(r)); running++; try { return await fn(); } finally { running--; const w = waiters.shift(); if (w) w(); } }
const inflight = new Map();
async function fileBytes(evId) {

  const c = await Cache.get('files', evId); if (c) return c;
  if (inflight.has(evId)) return inflight.get(evId);

}

function copyPlanToReport() {

async function doExportAgreement() {
  if (!window.JSZip) return toast('โหลดตัวสร้างไฟล์ไม่สำเร็จ');
  const run = async () => {
    const b = $('#btnAgree'); if (b) { b.disabled = true; b.textContent = 'กำลังสร้างไฟล์…'; }
    try {
      await flush();
      const blob = await window.PADocx.build(window.JSZip, agreementDoc(S)).generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', compression: 'DEFLATE' });
      const st = await saveFile(`PA1_ข้อตกลง_${S.cover.fy}.docx`, blob);
      if (st === 'saved') toast('ส่งออกข้อตกลงแล้ว — ช่องที่ยังไม่มีข้อมูลจะมีแถบสีเหลือง "[รอข้อมูลจริง]"');
    } catch (e) { toast('ส่งออกไม่สำเร็จ: ' + (e.message || e)); }
    if (b) { b.disabled = false; b.textContent = 'ส่งออกข้อตกลง (Word)'; }
  };
  const n = checkAgreement(S).length;
  if (n) modal('ข้อตกลงยังไม่ครบ', h('p', {}, `ยังมี ${n} จุดที่ว่าง (ดูรายการที่หัวแท็บข้อตกลงต้นปี) ส่งออกตอนนี้ได้ ช่องที่ว่างจะเว้นไว้ให้เติมใน Word`), [{ label: 'ยกเลิก' }, { label: 'ส่งออกอยู่ดี', kind: 'primary', fn: run }]);
  else await run();
}

/* ---------- เล่มตามปีงบ ---------- */
async function loadCycles() {
  const r = await sb.from('pa_cycles').select('id,fiscal_year,updated_at').is('deleted_at', null).order('fiscal_year', { ascending: false });
  if (r.error) throw r.error; CYCLES = r.data;
}
async function fetchAllRows(build) {
  let out = [];
  for (let from = 0; ; from += 1000) { const r = await build().range(from, from + 999); if (r.error) throw r.error; out = out.concat(r.data); if (r.data.length < 1000) break; }
  return out;
}
async function openCycle(id) {
  busy('กำลังโหลดเล่ม…');
  try {
    const r = await sb.from('pa_cycles').select('id,fiscal_year,updated_at,data').eq('id', id).single();
    if (r.error) throw r.error;
    CY = { id: r.data.id, fiscal_year: r.data.fiscal_year, updated_at: r.data.updated_at }; conflict = false; dirty = false;
    const raw = r.data.data || {};
    let st, migrated = false;
    if (raw.pendingAgreement) { st = PA.fromAgreementDoc(Object.assign({}, raw.pendingAgreement, { fiscalYear: r.data.fiscal_year }), null); migrated = true; }   // ย้ายมาจากแอปข้อตกลงเดิม
    else st = PA.normalize(Object.keys(raw).length ? raw : PA.emptyState(r.data.fiscal_year));
    st.cover.fy = String(r.data.fiscal_year); st.started = true; delete st.trainings;
    // ร่างที่ยังไม่ได้ขึ้นระบบ (เน็ตหลุด/ปิดหน้าเร็ว)
    const draft = await Cache.get('drafts', CY.id);
    if (draft && draft.base === CY.updated_at && draft.at > (st.updatedAt || 0)) { st = PA.normalize(draft.state); dirty = true; toast('พบข้อมูลที่ยังไม่ได้บันทึกขึ้นระบบ กำลังบันทึกต่อให้'); }
    else if (draft) await Cache.del('drafts', CY.id);
    S = st;
    if (migrated) { dirty = true; S.updatedAt = Date.now(); toast('ย้ายข้อตกลง PA จากแอปเดิมเข้าเล่มนี้แล้ว'); }
    // จับคู่รูปกับไฟล์ในระบบ (กันกรณีอัปโหลดเสร็จแต่ยังไม่ได้บันทึกเล่ม)
    const ev = await fetchAllRows(() => sb.from('pa_evidence').select('id,item_id').eq('cycle_id', CY.id).is('deleted_at', null).order('id'));
    const byItem = {}; ev.forEach(e => { if (e.item_id) byItem[e.item_id] = e.id; });
    INDICATORS.forEach(d => S.indicators[d.id].items.forEach(it => { if (it.type === 'photo' && !it.ev && byItem[it.id]) { it.ev = byItem[it.id]; dirty = true; } }));
    await loadTrainings();
    try { localStorage.setItem('pa_last_fy', String(CY.fiscal_year)); } catch (e) { /* ignore */ }
    if (dirty) flush();
    setStatus(dirty ? 'กำลังบันทึก…' : 'บันทึกขึ้นระบบแล้ว');
  } finally { busy(); }
}
async function loadTrainings() {
  const [tr, ev] = await Promise.all([
    fetchAllRows(() => sb.from('pa_trainings').select('*').is('deleted_at', null).order('start_date', { ascending: false }).order('id')),
    fetchAllRows(() => sb.from('pa_evidence').select('id,training_id,kind,mime,width,height,file_name,is_shared,drive_file_id').not('training_id', 'is', null).is('deleted_at', null).order('created_at').order('id'))
  ]);
  const map = {}; tr.forEach(t => { t.files = []; map[t.id] = t; });
  ev.forEach(e => { const t = map[e.training_id]; if (t) t.files.push({ ev: e.id, kind: e.kind, mime: e.mime, w: e.width, h: e.height, name: e.file_name, is_shared: e.is_shared, url: e.is_shared ? `https://drive.google.com/file/d/${e.drive_file_id}/view` : '' }); });
  TR = tr; sortTR();
}
async function ensureCycle(fy, data) {
  await loadCycles();
  const have = CYCLES.find(c => c.fiscal_year === fy);
  if (have) return have.id;
  const r = await sb.from('pa_cycles').insert({ fiscal_year: fy, data: data || {} }).select('id').single();
  if (r.error) { if (r.error.code === '23505') { await loadCycles(); const c = CYCLES.find(x => x.fiscal_year === fy); if (c) return c.id; } throw r.error; }
  await loadCycles(); return r.data.id;
}
async function switchYear(fy) {
  await flush();
  const c = CYCLES.find(x => x.fiscal_year === fy); if (!c) return;
  urlCache.forEach(u => URL.revokeObjectURL(u)); urlCache.clear();
  try { await openCycle(c.id); } catch (e) { toast(thError(e)); }
  tab = 'home'; render(); window.scrollTo(0, 0);
}

  try {
    busy('กำลังสร้างเล่ม…');
    const st = PA.normalize(PA.emptyState(fy)); st.started = true;
    const id = await ensureCycle(fy, st); await openCycle(id); tab = 'info'; render();
  } catch (e) { toast(thError(e)); } finally { busy(); }
}
// แทนที่เล่มปี fy ด้วย state + รูป (รูปเก่าของเล่มนั้นลงถังขยะ Drive)
async function applyImported(state, photos, fy) {
  await flush();
  const id = await ensureCycle(fy, {});
  if (!CY || CY.id !== id) await openCycle(id);
  const old = await fetchAllRows(() => sb.from('pa_evidence').select('id').eq('cycle_id', CY.id).is('deleted_at', null).order('id'));
  for (let i = 0; i < old.length; i++) { busy(`กำลังนำรูปเดิมออก ${i + 1}/${old.length}…`); try { await removeFile(old[i].id); } catch (e) { /* ข้าม */ } }
  const st = PA.normalize(state); st.cover.fy = String(fy); st.started = true; delete st.trainings;
  const byId = {}; photos.forEach(p => { byId[p.id] = p; });
  let ok = 0, fail = 0, k = 0; const total = photos.length;
  for (const d of INDICATORS) {
    const keep = [];
    for (const it of st.indicators[d.id].items) {
      if (it.type !== 'photo') { keep.push(it); continue; }
      delete it.ev; const p = byId[it.id];
      if (!p) { fail++; continue; }
      k++; busy(`กำลังอัปโหลดรูปขึ้น Drive ${k}/${total}…`);
      try {
        let buf = p.buf, mime = p.mime, w = it.w, hh = it.h;
        if (buf.byteLength > 600 * 1024) { const q = await shrinkBlob(new Blob([buf], { type: mime })); if (q.after < buf.byteLength) { buf = q.buf; mime = q.mime; w = q.w; hh = q.h; } }
        const up = await upload({ cycleId: CY.id, kind: 'photo', indicator: d.id, itemId: it.id, buf, mime, fileName: `${d.id}-${k}.${mime === 'image/png' ? 'png' : 'jpg'}`, w, h: hh });
        Object.assign(it, { ev: up.id, mime, w, h: hh }); keep.push(it); ok++;
      } catch (e) { fail++; }
    }
    st.indicators[d.id].items = keep;
  }
  S = st; busy(); dirty = true; S.updatedAt = Date.now(); await flush();
  tab = 'home'; render(); window.scrollTo(0, 0);
  return { ok, fail };
}
async function doImport(file, fy) {
  if (!window.JSZip) return toast('โหลดตัวอ่านไฟล์ไม่สำเร็จ');
  try {
    const r = await PA.importDocx(await file.arrayBuffer(), window.JSZip);
    const docFy = +r.state.cover.fy; const target = docFy >= 2560 && docFy <= 2650 ? docFy : fy;
    const photos = r.photos.map(p => ({ id: p.id, mime: p.mime, buf: p.bytes.buffer.slice(p.bytes.byteOffset, p.bytes.byteOffset + p.bytes.byteLength) }));
    const run = async () => {
      try { const res = await applyImported(r.state, photos, target); toast(`นำเข้าเล่มปีงบ ${target} แล้ว: ภาระงาน ${r.found.workload} รายการ, รูป ${res.ok} รูป${res.fail ? ` (ไม่สำเร็จ ${res.fail})` : ''}`); }
      catch (e) { busy(); toast('นำเข้าไม่สำเร็จ: ' + thError(e)); }
    };
    const exists = CYCLES.find(c => c.fiscal_year === target);
    if (exists) confirmBox(`แทนที่เล่มปีงบ ${target}?`, `ไฟล์นี้เป็นของปีงบ ${target} ข้อมูลเล่มปีนั้นในระบบจะถูกแทนที่ด้วยข้อมูลจากไฟล์ (การอบรมไม่ถูกแตะ)`, 'นำเข้าและแทนที่', run); else await run();
  } catch (e) { toast('อ่านไฟล์ไม่ได้: ' + (e.message || e)); }
}
async function doRestore(file) {
  if (!window.JSZip) return toast('โหลดตัวอ่านไฟล์ไม่สำเร็จ');
  try {
    const z = await window.JSZip.loadAsync(await file.arrayBuffer()); const sf = z.file('state.json'); if (!sf) throw new Error('ไม่ใช่ไฟล์สำรองของแอป PA');
    const state = JSON.parse(await sf.async('string')); const mimes = z.file('photos.json') ? JSON.parse(await z.file('photos.json').async('string')) : {};
    const photos = []; for (const id of Object.keys(mimes)) { const f = z.file('photos/' + id); if (f && /^image\/(jpeg|png)$/.test(mimes[id])) photos.push({ id, mime: mimes[id], buf: await f.async('arraybuffer') }); }
    const fy = +(state.cover && state.cover.fy); if (!(fy >= 2560 && fy <= 2650)) throw new Error('ไม่พบปีงบประมาณในไฟล์สำรอง');
    const run = async () => {
      try { const res = await applyImported(state, photos, fy); toast(`ย้ายข้อมูลเล่มปีงบ ${fy} แล้ว: รูป ${res.ok} รูป${res.fail ? ` (ไม่สำเร็จ ${res.fail})` : ''}`); }
      catch (e) { busy(); toast('กู้คืนไม่สำเร็จ: ' + thError(e)); }
    };
    const exists = CYCLES.find(c => c.fiscal_year === fy);
    if (exists) confirmBox(`แทนที่เล่มปีงบ ${fy}?`, 'ข้อมูลเล่มปีนั้นในระบบจะถูกแทนที่ด้วยไฟล์สำรอง', 'กู้คืนและแทนที่', run); else await run();
  } catch (e) { toast('กู้คืนไม่สำเร็จ: ' + (e.message || e)); }
}
// ไฟล์สำรองของแอป "ข้อตกลง PA รายปี" ({app:'pa-yearly', years:{2570:{…}}})
async function doImportAgreement(file) {
  try {
    const j = JSON.parse(await file.text());
    if (!j || j.app !== 'pa-yearly' || !j.years) throw new Error('ไม่ใช่ไฟล์สำรองของแอปข้อตกลง PA รายปี');
    const ys = Object.keys(j.years).map(Number).filter(y => y >= 2560 && y <= 2650).sort();
    if (!ys.length) throw new Error('ไม่พบปีงบในไฟล์');
    const pick = h('select', {}, ys.map(y => h('option', { value: y, selected: y === +S.cover.fy }, 'ปีงบ ' + y)));
    modal('นำเข้าข้อตกลงจากแอปเดิม', h('div', {}, field('เลือกปีงบ', pick),
      h('p', { class: 'hint' }, 'จะแทนที่: ข้อมูลผู้จัดทำ ภาระงาน ชื่อ/สภาพปัญหาประเด็นท้าทาย และข้อตกลงต้นปี ของเล่มปีนั้น · ไม่แตะ: ผลงานตามตัวชี้วัด รูป ผลประเด็นท้าทาย และการอบรม')),
      [{ label: 'ยกเลิก' }, { label: 'นำเข้า', kind: 'primary', fn: async () => {
        const fy = +pick.value; const d = Object.assign({}, j.years[fy], { fiscalYear: fy });
        try {
          await flush(); busy('กำลังนำเข้า…');
          const id = await ensureCycle(fy, {}); if (!CY || CY.id !== id) await openCycle(id);
          S = PA.fromAgreementDoc(d, S); S.cover.fy = String(fy); dirty = true; S.updatedAt = Date.now(); await flush();
          tab = 'agree'; render(); toast(`นำเข้าข้อตกลงปีงบ ${fy} แล้ว`);
        } catch (e) { toast('นำเข้าไม่สำเร็จ: ' + thError(e)); } finally { busy(); }
      } }]);
  } catch (e) { toast('อ่านไฟล์ไม่ได้: ' + (e.message || e)); }
}
async function doImportPlan(file) {
  try {
    const plan = JSON.parse(await file.text());
    if (!plan || plan.kind !== 'pa-evidence-plan' || !plan.items) throw new Error('ไม่ใช่ไฟล์แผนหลักฐานของแอปนี้');
    const run = () => { const r = PA.mergePlan(S, plan); S = r.state; S.started = true; touch(); tab = 'ind'; render(); window.scrollTo(0, 0); toast(`เพิ่มรายการหลักฐาน ${r.added} รายการ (ซ้ำจึงข้าม ${r.skipped})`); };
    if (String(plan.fy) !== String(S.cover.fy)) modal('ปีงบประมาณไม่ตรงกัน', h('p', {}, `แผนนี้เป็นของปีงบประมาณ ${plan.fy} แต่เล่มที่เปิดอยู่เป็นปี ${S.cover.fy}`), [{ label: 'ยกเลิก' }, { label: 'นำเข้าอยู่ดี', kind: 'danger', fn: run }]);
    else run();
  } catch (e) { toast('อ่านไฟล์ไม่ได้: ' + (e.message || e)); }
}
async function bytesFor(key) {
  try {
    if (String(key).startsWith('ev:')) { const r = await fileBytes(key.slice(3)); return r ? new Uint8Array(r.buf) : null; }
    for (const d of INDICATORS) { const it = S.indicators[d.id].items.find(x => x.id === key); if (it && it.ev) { const r = await fileBytes(it.ev); return r ? new Uint8Array(r.buf) : null; } }
  } catch (e) { /* ข้ามรูปที่โหลดไม่ได้ */ }
  return null;
}
async function doExport() {
  if (!window.JSZip) return toast('โหลดตัวสร้างไฟล์ไม่สำเร็จ');
  const b = $('#btnExport'); if (b) { b.disabled = true; b.textContent = 'กำลังดึงรูปและสร้างไฟล์…'; }
  try {
    await flush();
    const res = await PA.buildDocx(withTrainings(), bytesFor, window.JSZip);
    const st = await saveFile(`PA_${S.cover.fy}.docx`, new Blob([res.bytes], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' }));
    if (st === 'saved') toast(res.skipped.length ? `ส่งออกแล้ว (ข้ามรูปที่โหลดไม่ได้ ${res.skipped.length} รูป)` : 'ส่งออกไฟล์ Word แล้ว');
  } catch (e) { toast('ส่งออกไม่สำเร็จ: ' + (e.message || e)); }
  if (b) { b.disabled = false; b.textContent = 'ส่งออกเป็น Word (.docx)'; }
}
async function doBackup() {
  if (!window.JSZip) return toast('โหลดตัวสร้างไฟล์ไม่สำเร็จ');
  try {
    const z = new window.JSZip(); const data = JSON.parse(JSON.stringify(S)); const mimes = {}; let k = 0;
    const photos = []; INDICATORS.forEach(d => data.indicators[d.id].items.forEach(it => { if (it.type === 'photo') photos.push(it); }));
    for (const it of photos) { k++; busy(`กำลังรวบรวมรูป ${k}/${photos.length}…`); try { const r = await fileBytes(it.ev); if (r) { z.file('photos/' + it.id, r.buf); mimes[it.id] = r.mime; } } catch (e) { /* ข้าม */ } delete it.ev; }
    data.trainings_snapshot = fyTrainings().map(t => { const c = Object.assign({}, t); c.files = (t.files || []).map(f => ({ kind: f.kind, name: f.name })); return c; });
    z.file('state.json', JSON.stringify(data)); z.file('photos.json', JSON.stringify(mimes));
    busy('กำลังสร้างไฟล์…');
    const blob = await z.generateAsync({ type: 'blob', compression: 'DEFLATE' }); const d = new Date(); busy();
    const st = await saveFile(`PA-${S.cover.fy}-backup-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.zip`, blob);
    if (st === 'saved') { toast('สร้างไฟล์สำรองแล้ว'); return true; }
    return false;
  } catch (e) { busy(); toast('สำรองไม่สำเร็จ: ' + (e.message || e)); return false; }
}
function askNextYear() {
  const fy = (+S.cover.fy || 0) + 1;
  if (CYCLES.find(c => c.fiscal_year === fy)) { modal(`มีเล่มปีงบ ${fy} อยู่แล้ว`, h('p', {}, 'เปิดเล่มนั้นจากช่องเลือกปีด้านบนได้เลย'), [{ label: 'เปิดเล่มปี ' + fy, kind: 'primary', fn: () => switchYear(fy) }, { label: 'ปิด' }]); return; }
  modal(`เริ่มปีงบประมาณ ${fy} จากปีนี้?`,
    h('div', {}, h('p', {}, 'คัดลอก: ข้อมูลผู้จัดทำ ข้อตกลงต้นปี ข้อความตัวชี้วัด ประเด็นท้าทาย และหัวข้อ ID Plan (ปีในข้อความเลื่อนไป +1)'),
      h('p', {}, 'ไม่คัดลอก: ภาระงาน รูป ลิงก์ ตัวเลขผลจริง และเงินเดือน'),
      h('p', { class: 'note ok' }, `เล่มปี ${S.cover.fy} ยังอยู่ครบ สลับดูได้ที่ช่องเลือกปี`)),
    [{ label: 'ยกเลิก' }, { label: 'เริ่มเลย', kind: 'primary', fn: async () => {
      try { await flush(); busy('กำลังสร้างเล่มใหม่…'); const next = PA.rollover(S); delete next.trainings; const id = await ensureCycle(fy, next); await openCycle(id); tab = 'home'; render(); toast(`เริ่มปีงบประมาณ ${fy} แล้ว — กรอกภาระงานและเงินเดือนของปีใหม่`); }
      catch (e) { toast(thError(e)); } finally { busy(); }
    } }]);
}

/* ---------- shell ---------- */
function renderNav() {
  const nav = $('#nav'); nav.replaceChildren(...(CY ? TABS : TABS.slice(0, 1)).map(([k, l]) => h('button', { class: 'tab' + (k === tab ? ' on' : ''), 'aria-current': k === tab ? 'page' : null, onclick: () => go(k) }, l)));
  const ys = $('#years'); ys.replaceChildren();
  if (CYCLES.length) {
    const s = h('select', { 'aria-label': 'เลือกปีงบประมาณ' }, CYCLES.map(c => h('option', { value: c.fiscal_year, selected: CY && c.fiscal_year === CY.fiscal_year }, 'ปีงบ ' + c.fiscal_year)));
    s.addEventListener('change', () => switchYear(+s.value)); ys.append(s);
  }
}
function render() {
  const y = window.scrollY; renderNav(); const main = $('#main'); main.replaceChildren(SCREENS[CY ? tab : 'home']()); window.scrollTo(0, y);
}
function gate(title, msg) {
  $('#nav').replaceChildren(); $('#main').replaceChildren(h('section', { class: 'card hero' }, h('h2', {}, title), h('p', {}, msg), h('a', { class: 'btn primary', href: 'index.html', style: 'display:inline-flex;align-items:center;text-decoration:none' }, 'ไปหน้าคลังแนะแนว')));
}
async function boot() {
  await Cache.open();
  setStatus('กำลังโหลด…');
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return gate('กรุณาเข้าสู่ระบบก่อน', 'เข้าสู่ระบบที่หน้าคลังแนะแนวด้วยบัญชีครู แล้วเปิดหน้านี้อีกครั้ง');
    const p = await sb.from('profiles').select('id,display_name,role').eq('id', session.user.id).maybeSingle();
    ME = p.data;
    if (!ME || (ME.role !== 'teacher' && ME.role !== 'admin')) return gate('หน้านี้สำหรับครู', 'แอป PA ใช้ได้เฉพาะบัญชีครูค่ะ');
    if (/^บัญชีกลุ่มสาระ/.test(ME.display_name || '')) return gate('บัญชีนี้ใช้ร่วมกันหลายคน', 'แอป PA เก็บข้อมูลส่วนตัว (เงินเดือน ผลงาน เกียรติบัตร) จึงต้องใช้บัญชีส่วนตัวของครู ขอบัญชีส่วนตัวจากผู้ดูแลระบบนะคะ');
    $('#who').textContent = ME.display_name || '';
    sb.auth.onAuthStateChange(evt => { if (evt === 'SIGNED_OUT') gate('ออกจากระบบแล้ว', 'เข้าสู่ระบบใหม่ที่หน้าคลังแนะแนว'); });
    await loadCycles();
    if (CYCLES.length) {
      let last = 0; try { last = +localStorage.getItem('pa_last_fy'); } catch (e) { /* ignore */ }
      const pick = CYCLES.find(c => c.fiscal_year === last) || CYCLES.find(c => c.fiscal_year === curFy()) || CYCLES[0];
      await openCycle(pick.id);
    } else setStatus('');
    render();
  } catch (e) { setStatus(''); gate('โหลดข้อมูลไม่สำเร็จ', thError(e) + ' — ลองโหลดหน้าใหม่อีกครั้ง'); }
}
window.__pa = { get state() { return S; }, get trainings() { return TR; }, render, go };
document.addEventListener('DOMContentLoaded', boot);
})();
