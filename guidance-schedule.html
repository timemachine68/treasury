<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ตารางแนะแนวรายคาบ · แนะให้แนว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#22313A; --ink-soft:#5B6B72;
  --board:#EFF3F1; --card:#FFFFFF;
  --pine:#0F6B5C; --pine-deep:#0A4F44; --pine-tint:#E2F0EC;
  --note:#FFD34D; --note-deep:#8A6D00;
  --line:#DCE4E1; --danger:#C0392B;
  --radius:14px; --shadow:0 2px 10px rgba(34,49,58,.08);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;font-family:'Sarabun',sans-serif;background:var(--board);color:var(--ink);font-size:16px;line-height:1.55}
h1,h2,h3,h4,.brand{font-family:'Mitr',sans-serif;font-weight:600}
:focus-visible{outline:3px solid var(--note);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header.app{background:var(--pine);color:#fff;padding:12px 0}
header.app .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-size:20px}
.sub{font-size:14px;opacity:.85;flex:1}
main.wrap{padding:18px 16px 40px}
.btn{font-family:'Sarabun',sans-serif;font-weight:600;font-size:15px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.primary{background:var(--pine);border-color:var(--pine);color:#fff}
.btn.ghost{background:#fff}
.btn.danger{background:#fff;color:var(--danger);border-color:#EAC7C2}
.btn.sm{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.chip{font-family:'Sarabun',sans-serif;font-weight:600;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:15px}
.chip.active{background:var(--pine);color:#fff;border-color:var(--pine)}
.levels{display:flex;gap:8px;margin-bottom:12px}
.folder-tabs{display:flex;gap:6px;margin-bottom:-1px;flex-wrap:wrap}
.ftab{font-family:'Mitr',sans-serif;font-size:15px;border:1px solid var(--line);border-bottom:none;background:#E5ECE9;color:var(--ink-soft);border-radius:12px 12px 0 0;padding:8px 16px;cursor:pointer}
.ftab.active{background:#fff;color:var(--pine);border-top:4px solid var(--pine)}
.folder-body{background:#fff;border:1px solid var(--line);border-radius:0 var(--radius) var(--radius) var(--radius);padding:16px;box-shadow:var(--shadow);min-height:200px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.hint{color:var(--ink-soft);font-size:14px}
.rows{display:flex;flex-direction:column;gap:8px}
.wk{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-left:5px solid var(--pine);border-radius:12px;padding:10px 12px;background:#fff;flex-wrap:wrap;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.wk:hover{background:var(--pine-tint)}
.wk.todo{border-left-color:var(--note)}
.wk .no{font-family:'Mitr',sans-serif;font-weight:500;min-width:110px}
.wk .dt{color:var(--ink-soft);font-size:14px;min-width:170px}
.wk .inst{flex:1;min-width:180px}
.wk .inst.empty-inst{color:var(--ink-soft);font-style:italic}
.badge{font-size:13px;border-radius:999px;padding:2px 10px;background:var(--pine-tint);color:var(--pine-deep);font-weight:600;white-space:nowrap}
.badge.zero{background:#F6F1DA;color:var(--note-deep)}
.badge.mine{background:var(--note);color:#4a3b00}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.grid{width:100%;border-collapse:collapse;min-width:680px}
table.grid th,table.grid td{border:1px solid var(--line);padding:8px;vertical-align:top;text-align:center}
table.grid thead th{background:var(--board);color:var(--ink-soft);font-family:'Mitr',sans-serif;font-weight:500;font-size:15px}
table.grid th.pcell{text-align:left;width:150px;background:#fff}
tr.brk th.pcell,tr.brk td{background:#F3F6F4;color:var(--ink-soft)}
tr.brk td{font-style:italic;text-align:center}
.time{color:var(--ink-soft);font-size:13px}
.linkish{background:none;border:none;padding:0;font-family:'Mitr',sans-serif;font-size:15px;color:var(--pine);cursor:pointer;font-weight:500}
td.cell{min-width:110px;height:58px}
td.cell.editable{cursor:pointer}
td.cell.editable:hover{background:var(--pine-tint)}
.cc{display:inline-block;background:var(--pine-tint);color:var(--pine-deep);border-radius:8px;padding:2px 8px;margin:2px;font-weight:600;font-size:15px}
.cc small{display:block;font-weight:500;font-size:12px;color:var(--ink-soft)}
.cc.mine{background:var(--note);color:#4a3b00}
.empty{text-align:center;color:var(--ink-soft);padding:40px 0;font-size:16px}
.msg{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:100;width:calc(100% - 32px);max-width:560px;padding:12px 16px;border-radius:10px;box-shadow:0 4px 16px rgba(34,49,58,.25);font-weight:600}
.msg.ok{background:var(--pine-tint);color:var(--pine-deep);border:1px solid #B9D8CF}
.msg.err{background:#FBEAE7;color:var(--danger);border:1px solid #EAC7C2}
.modal-bg{position:fixed;inset:0;background:rgba(34,49,58,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-bg[hidden]{display:none}
.modal{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:440px;max-height:92vh;overflow:auto;box-shadow:var(--shadow)}
.modal.wide{max-width:720px}
.modal h3{margin:0 0 12px;color:var(--pine-deep)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-weight:600;font-size:14px;color:var(--ink-soft)}
.field input,.field select,.field textarea{font-family:'Sarabun',sans-serif;font-size:16px;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;background:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mBtns{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.wkhead{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:8px}
.wkhead .inst{font-weight:600}
.wkhead .dt{color:var(--ink-soft);font-size:14px}
.vday{margin:14px 0 6px;font-family:'Mitr',sans-serif;color:var(--pine-deep)}
.vday .out{font-family:'Sarabun',sans-serif;font-size:13px;color:var(--danger);margin-left:6px}
.vrow{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.vrow.mine{background:#FFF8DC;border-color:var(--note)}
.vp{min-width:130px}
.vc{flex:1}
.vc .note{font-size:13px;color:var(--note-deep)}
.panel{border:1.5px dashed var(--line);border-radius:12px;padding:12px;margin:12px 0;background:#FBFCFB}
.panel h4{margin:0 0 8px;color:var(--pine-deep);font-size:16px}
.pday{margin-bottom:8px}
.pday .all{font-weight:700;display:flex;gap:8px;align-items:center;margin-bottom:2px}
.pitem{display:flex;gap:8px;align-items:flex-start;padding:3px 0 3px 22px}
.pitem.done{color:var(--ink-soft)}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline select{font-family:'Sarabun',sans-serif;font-size:15px;border:1.5px solid var(--line);border-radius:9px;padding:7px 9px;max-width:100%}
.sep{height:1px;background:var(--line);margin:12px 0}
.chk{display:flex;gap:8px;align-items:center;font-size:15px;margin-bottom:12px}
@media (max-width:560px){.row2{grid-template-columns:1fr}.vrow{flex-wrap:wrap}.vp{min-width:100%}
  table.grid{min-width:600px}table.grid th.pcell{width:96px}}
</style>
</head>
<body>
<header class="app">
  <div class="wrap">
    <div class="brand">แนะให้แนว</div>
    <div class="sub">ตารางแนะแนวรายคาบ · พูลเจริญวิทยาคม</div>
    <a class="btn ghost sm" href="home.html">← หน้าแรก</a>
  </div>
</header>

<main class="wrap">
  <div class="levels">
    <button class="chip" data-level="m3">ม.3</button>
    <button class="chip" data-level="m6">ม.6</button>
  </div>
  <nav class="folder-tabs">
    <button class="ftab" data-tab="weeks">สัปดาห์ที่สถาบันเข้าแนะแนว</button>
    <button class="ftab" data-tab="grid">ตารางคาบแนะแนวของแต่ละห้อง</button>
  </nav>
  <section class="folder-body" id="view"><div class="empty">กำลังโหลด…</div></section>
  <div class="msg" id="msg" hidden></div>
</main>

<div class="modal-bg" id="modal" hidden>
  <div class="modal" id="modalBox" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h3 id="mTitle"></h3>
    <div id="mBody"></div>
    <div class="mBtns">
      <button class="btn ghost" id="mCancel">ยกเลิก</button>
      <button class="btn primary" id="mSave">บันทึก</button>
    </div>
  </div>
</div>

<script>
// ตั้งค่าเดียวกับ index.html
const SB_URL = 'https://ikkhjslmtjwrxzxvtokb.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlra2hqc2xtdGp3cnh6eHZ0b2tiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NDMzNjksImV4cCI6MjA5OTMxOTM2OX0.3OR_9mEv82Ns1LLjx5nnRwJYzrtKFtWCWd1bPuQfNKU';
const sb = supabase.createClient(SB_URL, SB_KEY);

const DAYS = ['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์'];
const MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const LV = {m3:'ม.3', m6:'ม.6'};
const S = {level:'m3', tab:'weeks', canEdit:false, myRoom:'', tok:0,
           weeks:[], periods:[], cls:[], visits:[],
           modal:null, returnTo:null, pick:false, add:false, busy:false};
let saveFn = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').replace(/^ม\.?\s*/, '').replace(/\s+/g, '');
const isMine = r => !!S.myRoom && norm(r) === S.myRoom;
const cl = r => /^\d+\/\d+$/.test(String(r).trim()) ? 'ม.' + String(r).trim() : String(r);
const roomCmp = (a, b) => String(a).localeCompare(String(b), 'th', {numeric: true});
const thDate = d => { if (!d) return ''; const [y, m, dd] = d.split('-').map(Number); return `${dd} ${MON[m-1]} ${y+543}`; };
const friendly = e => {
  if (e && e.code === '23505') return 'มีรายการนี้อยู่แล้ว ไม่ต้องเพิ่มซ้ำ';
  if (e && e.code === '42501') return 'ไม่มีสิทธิ์แก้ไขข้อมูลนี้';
  return 'ทำรายการไม่สำเร็จ: ' + (e && e.message ? e.message : 'เกิดข้อผิดพลาด');
};

function msg(t, err) {
  const el = $('#msg');
  el.hidden = false;
  el.className = 'msg ' + (err ? 'err' : 'ok');
  el.textContent = t;
  clearTimeout(msg._t);
  msg._t = setTimeout(() => el.hidden = true, 4500);
}

// วันที่จริงของวันในสัปดาห์ (คิดจากวันจันทร์ของสัปดาห์ที่วันเริ่มอยู่)
function dayDate(w, dayNo) {
  const [y, m, d] = w.date_start.split('-').map(Number);
  const start = new Date(Date.UTC(y, m - 1, d));
  const dow = (start.getUTCDay() + 6) % 7 + 1;
  const t = new Date(start.getTime() + (dayNo - dow) * 86400000);
  const iso = t.toISOString().slice(0, 10);
  return {text: `${t.getUTCDate()} ${MON[t.getUTCMonth()]} ${t.getUTCFullYear() + 543}`,
          out: iso < w.date_start || iso > w.date_end};
}

async function fetchAll(make) {
  const out = [], size = 1000;
  for (let from = 0; ; from += size) {
    const {data, error} = await make(from, from + size - 1);
    if (error) throw error;
    out.push(...data);
    if (data.length < size) break;
  }
  return out;
}

async function run(fn) {
  if (S.busy) return;
  S.busy = true;
  try { await fn(); } catch (e) { msg(friendly(e), true); } finally { S.busy = false; }
}

/* ---------- โหลดข้อมูล ---------- */
async function load() {
  const L = S.level, tok = ++S.tok;
  const [weeks, periods, cls] = await Promise.all([
    fetchAll((a, b) => sb.from('guidance_week_institutions').select('*').eq('level', L).order('week_no').range(a, b)),
    fetchAll((a, b) => sb.from('guidance_periods').select('*').eq('level', L).order('period_no').range(a, b)),
    fetchAll((a, b) => sb.from('guidance_class_periods').select('*').eq('level', L)
      .order('day_no').order('period_no').order('class_room').range(a, b))
  ]);
  let visits = [];
  if (weeks.length) {
    const ids = weeks.map(w => w.id);
    visits = await fetchAll((a, b) => sb.from('guidance_visit_slots').select('*').in('week_id', ids)
      .order('day_no').order('period_no').order('class_room').order('id').range(a, b));
  }
  if (tok !== S.tok) return false;
  cls.sort((x, y) => x.day_no - y.day_no || x.period_no - y.period_no || roomCmp(x.class_room, y.class_room));
  visits.sort((x, y) => x.day_no - y.day_no || x.period_no - y.period_no || roomCmp(x.class_room, y.class_room));
  S.weeks = weeks; S.periods = periods; S.cls = cls; S.visits = visits;
  return true;
}

async function refresh() {
  try {
    if (await load()) render();
  } catch (e) { msg('โหลดข้อมูลไม่สำเร็จ: ' + e.message, true); }
}

const P = no => S.periods.find(p => p.period_no === no) || {period_no: no, label: 'คาบ ' + no, time_text: '', is_break: false};

function render() {
  document.querySelectorAll('[data-level]').forEach(b => b.classList.toggle('active', b.dataset.level === S.level));
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === S.tab));
  S.tab === 'weeks' ? renderWeeks() : renderGrid();
  renderModal();
}

/* ---------- แท็บ: สัปดาห์ที่สถาบันเข้าแนะแนว ---------- */
function renderWeeks() {
  let tools = '';
  if (S.canEdit) {
    tools = `<div class="toolbar"><button class="btn primary sm" data-act="addWeek">+ เพิ่มสัปดาห์</button>`;
    if (S.level === 'm6' && !S.weeks.length) tools += `<button class="btn sm" data-act="weeksFromM3">ใช้สัปดาห์ชุดเดียวกับ ม.3</button>`;
    tools += `<span class="hint">แตะที่สัปดาห์เพื่อดูหรือจัดตารางของสถาบันนั้น</span></div>`;
  } else {
    tools = `<div class="toolbar"><span class="hint">แตะที่สัปดาห์เพื่อดูว่าสถาบันเข้าแนะแนวห้องไหน วันไหน คาบไหน</span></div>`;
  }
  if (!S.weeks.length) {
    $('#view').innerHTML = tools + `<div class="empty">ยังไม่มีข้อมูลสัปดาห์ของ ${LV[S.level]}</div>`;
    return;
  }
  const cnt = new Map(), mine = new Map();
  for (const v of S.visits) {
    cnt.set(v.week_id, (cnt.get(v.week_id) || 0) + 1);
    if (isMine(v.class_room)) mine.set(v.week_id, (mine.get(v.week_id) || 0) + 1);
  }
  const items = S.weeks.map(w => {
    const n = cnt.get(w.id) || 0;
    const inst = w.institution
      ? `<span class="inst">${esc(w.institution)}</span>`
      : `<span class="inst empty-inst">ยังไม่ระบุสถาบัน</span>`;
    const badge = n ? `<span class="badge">เข้า ${n} คาบ</span>` : `<span class="badge zero">ยังไม่จัดตาราง</span>`;
    const m = mine.get(w.id) ? `<span class="badge mine">มีคาบของห้องคุณ</span>` : '';
    return `<button type="button" class="wk ${w.institution ? '' : 'todo'}" data-act="openWeek" data-id="${esc(w.id)}">
      <span class="no">สัปดาห์ที่ ${w.week_no}</span>
      <span class="dt">${thDate(w.date_start)} – ${thDate(w.date_end)}</span>
      ${inst}${m}${badge}
    </button>`;
  }).join('');
  $('#view').innerHTML = tools + `<div class="rows">${items}</div>`;
}

function weekForm(w, isNew) {
  const nextNo = S.weeks.length ? Math.max(...S.weeks.map(x => x.week_no)) + 1 : 1;
  return `
    ${isNew ? `<div class="field"><label>สัปดาห์ที่</label><input id="f_no" type="number" min="1" max="60" value="${nextNo}"></div>` : ''}
    <div class="field"><label>ชื่อสถาบัน (เว้นว่างได้ถ้ายังไม่ระบุ)</label><input id="f_inst" maxlength="200" value="${esc(w?.institution || '')}"></div>
    <div class="row2">
      <div class="field"><label>วันเริ่ม</label><input id="f_ds" type="date" value="${esc(w?.date_start || '')}"></div>
      <div class="field"><label>วันสิ้นสุด</label><input id="f_de" type="date" value="${esc(w?.date_end || '')}"></div>
    </div>
    ${isNew ? '' : `<div class="sep"></div><button type="button" class="btn danger sm" data-act="delWeek" data-id="${esc(w.id)}">ลบสัปดาห์นี้</button>`}`;
}

function readWeekForm() {
  const inst = $('#f_inst').value.trim();
  const ds = $('#f_ds').value, de = $('#f_de').value;
  if (!ds || !de || de < ds) { msg('กรุณาระบุวันเริ่มและวันสิ้นสุดให้ถูกต้อง', true); return null; }
  return {institution: inst || null, date_start: ds, date_end: de};
}

/* ---------- หน้าต่างดู/จัดตารางของสัปดาห์ ---------- */
function weekHtml(w) {
  const vs = S.visits.filter(v => v.week_id === w.id);
  const inst = w.institution ? esc(w.institution) : '<span class="hint">ยังไม่ระบุสถาบัน</span>';
  let h = `<div class="wkhead"><span class="inst">${inst}</span><span class="dt">${thDate(w.date_start)} – ${thDate(w.date_end)}</span></div>`;

  if (S.canEdit) {
    h += `<div class="toolbar">
      <button class="btn primary sm" data-act="togglePick">+ เลือกจากตารางคาบของแต่ละห้อง</button>
      <button class="btn sm" data-act="toggleAdd">+ เพิ่มเอง</button>
      <button class="btn sm" data-act="editWeek" data-id="${esc(w.id)}">แก้ข้อมูลสัปดาห์</button>
    </div>`;
    if (S.pick) h += pickPanel(w, vs);
    if (S.add) h += addPanel();
    const others = S.weeks.filter(x => x.id !== w.id && S.visits.some(v => v.week_id === x.id));
    if (others.length) {
      h += `<div class="inline" style="margin-bottom:8px"><span class="hint">คัดลอกตารางจาก</span>
        <select id="cp_w">${others.map(x => {
          const n = S.visits.filter(v => v.week_id === x.id).length;
          return `<option value="${esc(x.id)}">สัปดาห์ที่ ${x.week_no}${x.institution ? ' · ' + esc(x.institution) : ''} (${n} คาบ)</option>`;
        }).join('')}</select>
        <button class="btn sm" data-act="copyWeek">คัดลอกมาที่สัปดาห์นี้</button></div>`;
    }
  }

  if (!vs.length) {
    h += `<div class="empty" style="padding:24px 0">ยังไม่ได้จัดตารางของสัปดาห์นี้</div>`;
  } else {
    for (let d = 1; d <= 5; d++) {
      const items = vs.filter(v => v.day_no === d);
      if (!items.length) continue;
      const dd = dayDate(w, d);
      h += `<div class="vday">${DAYS[d-1]} ${dd.text}${dd.out ? '<span class="out">(นอกช่วงสัปดาห์นี้)</span>' : ''}</div>`;
      for (const v of items) {
        const p = P(v.period_no);
        h += `<div class="vrow ${isMine(v.class_room) ? 'mine' : ''}">
          <div class="vp"><b>${esc(p.label)}</b> <span class="time">${esc(p.time_text || '')}</span></div>
          <div class="vc"><b>${esc(cl(v.class_room))}</b>${v.room_no ? ' · ห้อง ' + esc(v.room_no) : ''}${v.note ? `<div class="note">${esc(v.note)}</div>` : ''}</div>
          ${S.canEdit ? `<button class="btn danger sm" data-act="delVisit" data-id="${esc(v.id)}">ลบ</button>` : ''}
        </div>`;
      }
    }
    if (S.canEdit) h += `<div class="sep"></div><button class="btn danger sm" data-act="clearWeek">ล้างตารางทั้งสัปดาห์</button>`;
  }
  return h;
}

function pickPanel(w, vs) {
  const have = new Set(vs.map(v => `${v.day_no}|${v.period_no}|${norm(v.class_room)}`));
  const list = S.cls.filter(c => !P(c.period_no).is_break);
  if (!list.length) return `<div class="panel"><h4>เลือกจากตารางคาบ</h4><div class="hint">ยังไม่มีคาบของ ${LV[S.level]} ในแท็บ "ตารางคาบแนะแนวของแต่ละห้อง"</div></div>`;
  let h = `<div class="panel"><h4>เลือกคาบที่สถาบันนี้จะเข้า (${LV[S.level]})</h4>`;
  for (let d = 1; d <= 5; d++) {
    const items = list.filter(c => c.day_no === d);
    if (!items.length) continue;
    h += `<div class="pday" data-day="${d}"><label class="all"><input type="checkbox" data-change="pickDay" data-d="${d}"> ${DAYS[d-1]} ${dayDate(w, d).text}</label>`;
    for (const c of items) {
      const done = have.has(`${c.day_no}|${c.period_no}|${norm(c.class_room)}`);
      const p = P(c.period_no);
      h += `<label class="pitem ${done ? 'done' : ''}"><input type="checkbox" name="pk" value="${esc(c.id)}" ${done ? 'checked disabled' : ''}>
        <span>${esc(p.label)} (${esc(p.time_text || '')}) · <b>${esc(cl(c.class_room))}</b>${c.room_no ? ' · ห้อง ' + esc(c.room_no) : ''}${done ? ' · เพิ่มแล้ว' : ''}</span></label>`;
    }
    h += `</div>`;
  }
  h += `<div class="inline"><button class="btn primary sm" data-act="pickAdd">เพิ่มที่เลือก</button>
    <button class="btn sm" data-act="pickAll">เลือกทั้งหมด</button>
    <button class="btn sm" data-act="togglePick">ปิด</button></div></div>`;
  return h;
}

function addPanel() {
  const opts = S.periods.filter(p => !p.is_break)
    .map(p => `<option value="${p.period_no}">${esc(p.label)} (${esc(p.time_text || '')})</option>`).join('');
  return `<div class="panel"><h4>เพิ่มเอง (ห้องหรือเวลาที่ไม่อยู่ในตาราง)</h4>
    <div class="row2">
      <div class="field"><label>วัน</label><select id="ad_d">${DAYS.map((n, i) => `<option value="${i+1}">${n}</option>`).join('')}</select></div>
      <div class="field"><label>คาบ</label><select id="ad_p">${opts}</select></div>
    </div>
    <div class="row2">
      <div class="field"><label>ห้องเรียน (เช่น 3/1)</label><input id="ad_c" maxlength="40"></div>
      <div class="field"><label>เลขห้อง/สถานที่ (ไม่ใส่ก็ได้)</label><input id="ad_r" maxlength="40"></div>
    </div>
    <div class="field"><label>หมายเหตุ (ไม่ใส่ก็ได้)</label><input id="ad_n" maxlength="200"></div>
    <div class="inline"><button class="btn primary sm" data-act="addCustom">เพิ่ม</button>
    <button class="btn sm" data-act="toggleAdd">ปิด</button></div></div>`;
}

/* ---------- หน้าต่างแก้ช่องในตารางคาบ ---------- */
function cellHtml(d, p) {
  const items = S.cls.filter(c => c.day_no === d && c.period_no === p);
  let h = `<div class="hint" style="margin-bottom:8px">ห้องที่มีคาบแนะแนวในช่องนี้</div>`;
  if (!items.length) h += `<div class="empty" style="padding:12px 0">ยังไม่มีห้องในช่องนี้</div>`;
  for (const c of items) {
    h += `<div class="vrow"><div class="vc"><b>${esc(cl(c.class_room))}</b>${c.room_no ? ' · ห้อง ' + esc(c.room_no) : ''}</div>
      <button class="btn danger sm" data-act="cellDel" data-id="${esc(c.id)}">ลบ</button></div>`;
  }
  h += `<div class="sep"></div><div class="row2">
    <div class="field"><label>ห้องเรียน (เช่น 3/1)</label><input id="cl_c" maxlength="40"></div>
    <div class="field"><label>เลขห้อง/สถานที่ (ไม่ใส่ก็ได้)</label><input id="cl_r" maxlength="40"></div></div>
    <button class="btn primary sm" data-act="cellAdd">เพิ่มห้องในช่องนี้</button>`;
  return h;
}

/* ---------- ตัวจัดการหน้าต่าง ---------- */
function showModal() { $('#modal').hidden = false; }
function openModal(title, html, onSave, back) {
  S.modal = {kind: 'form'};
  S.returnTo = back || null;
  $('#modalBox').classList.remove('wide');
  $('#mTitle').textContent = title;
  $('#mBody').innerHTML = html;
  $('#mSave').hidden = false;
  $('#mCancel').textContent = 'ยกเลิก';
  saveFn = onSave;
  showModal();
}
function openView(kind, data) {
  S.modal = Object.assign({kind}, data);
  saveFn = null;
  renderModal();
  showModal();
}
function renderModal() {
  const m = S.modal;
  if (!m || m.kind === 'form') return;
  $('#modalBox').classList.add('wide');
  $('#mSave').hidden = true;
  $('#mCancel').textContent = 'ปิด';
  if (m.kind === 'week') {
    const w = S.weeks.find(x => x.id === m.id);
    if (!w) { closeModal(false); return; }
    $('#mTitle').textContent = `สัปดาห์ที่ ${w.week_no} · ${LV[S.level]}`;
    $('#mBody').innerHTML = weekHtml(w);
  } else if (m.kind === 'cell') {
    const p = P(m.p);
    $('#mTitle').textContent = `${DAYS[m.d-1]} · ${p.label} ${p.time_text || ''}`;
    $('#mBody').innerHTML = cellHtml(m.d, m.p);
  }
}
function closeModal(back = true) {
  const r = back ? S.returnTo : null;
  S.modal = null; S.returnTo = null; saveFn = null; S.pick = false; S.add = false;
  $('#modal').hidden = true;
  if (r) { S.pick = false; S.add = false; openView(r.kind, r); }
}
$('#mCancel').onclick = () => closeModal(true);
$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') closeModal(true); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(true); });
$('#mSave').onclick = async () => {
  if (!saveFn || S.busy) return;
  S.busy = true; $('#mSave').disabled = true;
  try {
    const ok = await saveFn();
    if (ok) closeModal(true);
  } catch (e) { msg(friendly(e), true); }
  finally { S.busy = false; $('#mSave').disabled = false; }
};

/* ---------- แท็บ: ตารางคาบแนะแนวของแต่ละห้อง ---------- */
function renderGrid() {
  let tools = '';
  if (S.canEdit) tools = `<div class="toolbar"><button class="btn primary sm" data-act="addPeriod">+ เพิ่มคาบ</button>
    <span class="hint">แตะช่องเพื่อเพิ่มหรือลบห้อง แตะชื่อคาบเพื่อแก้เวลา</span></div>`;
  else tools = `<div class="toolbar"><span class="hint">คาบแนะแนวปกติของแต่ละห้อง สถาบันจะเข้าในคาบเหล่านี้</span></div>`;
  if (!S.periods.length) {
    $('#view').innerHTML = tools + `<div class="empty">ยังไม่มีคาบของ ${LV[S.level]}</div>`;
    return;
  }
  const map = new Map();
  for (const c of S.cls) {
    const k = c.day_no + '-' + c.period_no;
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(c);
  }
  let h = tools + `<div class="tbl-wrap"><table class="grid"><thead><tr><th class="pcell">คาบ</th>${DAYS.map(d => `<th>${d}</th>`).join('')}${S.canEdit ? '<th></th>' : ''}</tr></thead><tbody>`;
  for (const p of S.periods) {
    const label = S.canEdit
      ? `<button class="linkish" data-act="editPeriod" data-p="${p.period_no}">${esc(p.label)}</button>`
      : `<span class="linkish" style="cursor:default">${esc(p.label)}</span>`;
    const head = `<th class="pcell">${label}<div class="time">${esc(p.time_text || '')}</div></th>`;
    const del = S.canEdit ? `<td><button class="btn danger sm" data-act="delPeriod" data-p="${p.period_no}">ลบคาบ</button></td>` : '';
    if (p.is_break) {
      h += `<tr class="brk">${head}<td colspan="5">ช่วงพัก ไม่มีการเข้าแนะแนว</td>${del}</tr>`;
      continue;
    }
    h += `<tr>${head}`;
    for (let d = 1; d <= 5; d++) {
      const items = map.get(d + '-' + p.period_no) || [];
      const chips = items.map(c => `<span class="cc ${isMine(c.class_room) ? 'mine' : ''}">${esc(cl(c.class_room))}${c.room_no ? `<small>${esc(c.room_no)}</small>` : ''}</span>`).join('');
      h += S.canEdit
        ? `<td class="cell editable" data-act="openCell" data-d="${d}" data-p="${p.period_no}">${chips}</td>`
        : `<td class="cell">${chips}</td>`;
    }
    h += `${del}</tr>`;
  }
  h += `</tbody></table></div>`;
  $('#view').innerHTML = h;
}

function periodForm(p, isNew) {
  const nextNo = S.periods.length ? Math.max(...S.periods.map(x => x.period_no)) + 1 : 1;
  return `
    <div class="row2">
      <div class="field"><label>หมายเลขคาบ (เรียงตามเลขนี้)</label>
        <input id="f_pno" type="number" min="0" max="20" value="${isNew ? nextNo : p.period_no}" ${isNew ? '' : 'disabled'}></div>
      <div class="field"><label>ชื่อคาบ</label><input id="f_label" maxlength="40" value="${esc(p?.label || 'คาบ ' + nextNo)}"></div>
    </div>
    <div class="field"><label>เวลา (เช่น 08.30–09.20 เว้นว่างได้)</label><input id="f_time" maxlength="40" value="${esc(p?.time_text || '')}"></div>
    <label class="chk"><input id="f_brk" type="checkbox" ${p?.is_break ? 'checked' : ''}> เป็นช่วงพัก (ไม่ใช้จัดตาราง)</label>`;
}

/* ---------- การกระทำทั้งหมด ---------- */
const WRITE_ACTS = new Set(['addWeek','weeksFromM3','editWeek','delWeek','togglePick','toggleAdd','pickAdd','pickAll',
  'addCustom','copyWeek','clearWeek','delVisit','addPeriod','editPeriod','delPeriod','openCell','cellAdd','cellDel']);

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  if (WRITE_ACTS.has(act) && !S.canEdit) return;
  handle(act, t);
});
document.addEventListener('change', e => {
  const t = e.target.closest('[data-change="pickDay"]');
  if (!t) return;
  const box = t.closest('.pday');
  box.querySelectorAll('input[name="pk"]:not(:disabled)').forEach(i => i.checked = t.checked);
});

function weekIdOpen() { return S.modal && S.modal.kind === 'week' ? S.modal.id : null; }

function handle(act, t) {
  switch (act) {
    case 'openWeek': S.pick = false; S.add = false; openView('week', {id: t.dataset.id}); break;

    case 'addWeek':
      openModal('เพิ่มสัปดาห์', weekForm(null, true), async () => {
        const f = readWeekForm(); if (!f) return false;
        const no = parseInt($('#f_no').value, 10);
        if (!no || no < 1 || no > 60) { msg('เลขสัปดาห์ต้องอยู่ระหว่าง 1–60', true); return false; }
        const {error} = await sb.from('guidance_week_institutions').insert({level: S.level, week_no: no, ...f});
        if (error) throw error;
        msg('เพิ่มสัปดาห์แล้ว'); await refresh(); return true;
      });
      break;

    case 'weeksFromM3': run(async () => {
      if (!confirm('สร้างสัปดาห์ของ ม.6 ตามวันที่ของ ม.3 (ยังไม่ใส่ชื่อสถาบัน) ใช่ไหม?')) return;
      const src = await fetchAll((a, b) => sb.from('guidance_week_institutions').select('*').eq('level', 'm3').order('week_no').range(a, b));
      if (!src.length) { msg('ยังไม่มีสัปดาห์ของ ม.3 ให้คัดลอก', true); return; }
      const rows = src.map(w => ({level: 'm6', week_no: w.week_no, date_start: w.date_start, date_end: w.date_end, institution: null}));
      const {error} = await sb.from('guidance_week_institutions').upsert(rows, {onConflict: 'level,week_no', ignoreDuplicates: true});
      if (error) throw error;
      msg('สร้างสัปดาห์ของ ม.6 แล้ว'); await refresh();
    }); break;

    case 'editWeek': {
      const w = S.weeks.find(x => x.id === t.dataset.id); if (!w) break;
      openModal(`แก้ข้อมูลสัปดาห์ที่ ${w.week_no}`, weekForm(w, false), async () => {
        const f = readWeekForm(); if (!f) return false;
        const {error} = await sb.from('guidance_week_institutions').update(f).eq('id', w.id);
        if (error) throw error;
        msg('บันทึกสัปดาห์แล้ว'); await refresh(); return true;
      }, {kind: 'week', id: w.id});
      break;
    }

    case 'delWeek': run(async () => {
      const w = S.weeks.find(x => x.id === t.dataset.id); if (!w) return;
      const n = S.visits.filter(v => v.week_id === w.id).length;
      if (!confirm(`ลบสัปดาห์ที่ ${w.week_no} ใช่ไหม?${n ? `\n\nตารางที่จัดไว้ ${n} คาบ จะถูกลบไปด้วย` : ''}`)) return;
      const {error} = await sb.from('guidance_week_institutions').delete().eq('id', w.id);
      if (error) throw error;
      closeModal(false); msg('ลบสัปดาห์แล้ว'); await refresh();
    }); break;

    case 'togglePick': S.pick = !S.pick; if (S.pick) S.add = false; renderModal(); break;
    case 'toggleAdd': S.add = !S.add; if (S.add) S.pick = false; renderModal(); break;
    case 'pickAll': document.querySelectorAll('#mBody input[name="pk"]:not(:disabled)').forEach(i => i.checked = true);
      document.querySelectorAll('#mBody [data-change="pickDay"]').forEach(i => i.checked = true); break;

    case 'pickAdd': run(async () => {
      const wid = weekIdOpen(); if (!wid) return;
      const ids = [...document.querySelectorAll('#mBody input[name="pk"]:checked:not(:disabled)')].map(i => i.value);
      if (!ids.length) { msg('ยังไม่ได้เลือกคาบ', true); return; }
      const rows = ids.map(id => S.cls.find(c => c.id === id)).filter(Boolean)
        .map(c => ({week_id: wid, day_no: c.day_no, period_no: c.period_no, class_room: c.class_room, room_no: c.room_no || null}));
      const {data, error} = await sb.from('guidance_visit_slots')
        .upsert(rows, {onConflict: 'week_id,day_no,period_no,class_room', ignoreDuplicates: true}).select('id');
      if (error) throw error;
      S.pick = false; msg(`เพิ่มแล้ว ${data ? data.length : rows.length} คาบ`); await refresh();
    }); break;

    case 'addCustom': run(async () => {
      const wid = weekIdOpen(); if (!wid) return;
      const room = $('#ad_c').value.trim();
      const pno = parseInt($('#ad_p').value, 10);
      if (!room) { msg('กรุณาใส่ห้องเรียน', true); return; }
      if (isNaN(pno)) { msg('ยังไม่มีคาบให้เลือก กรุณาเพิ่มคาบในแท็บตารางคาบก่อน', true); return; }
      const {error} = await sb.from('guidance_visit_slots').insert({
        week_id: wid, day_no: parseInt($('#ad_d').value, 10), period_no: pno, class_room: room,
        room_no: $('#ad_r').value.trim() || null, note: $('#ad_n').value.trim() || null});
      if (error) throw error;
      S.add = false; msg('เพิ่มแล้ว'); await refresh();
    }); break;

    case 'copyWeek': run(async () => {
      const wid = weekIdOpen(); if (!wid) return;
      const src = $('#cp_w').value;
      const rows = S.visits.filter(v => v.week_id === src)
        .map(v => ({week_id: wid, day_no: v.day_no, period_no: v.period_no, class_room: v.class_room, room_no: v.room_no, note: v.note}));
      if (!rows.length) { msg('สัปดาห์ที่เลือกยังไม่มีตาราง', true); return; }
      const {data, error} = await sb.from('guidance_visit_slots')
        .upsert(rows, {onConflict: 'week_id,day_no,period_no,class_room', ignoreDuplicates: true}).select('id');
      if (error) throw error;
      const n = data ? data.length : rows.length;
      msg(n ? `คัดลอกแล้ว ${n} คาบ` : 'ตารางนี้มีครบทุกคาบอยู่แล้ว ไม่ได้เพิ่มอะไร'); await refresh();
    }); break;

    case 'delVisit': run(async () => {
      const {error} = await sb.from('guidance_visit_slots').delete().eq('id', t.dataset.id);
      if (error) throw error;
      msg('ลบแล้ว'); await refresh();
    }); break;

    case 'clearWeek': run(async () => {
      const wid = weekIdOpen(); if (!wid) return;
      const n = S.visits.filter(v => v.week_id === wid).length;
      if (!confirm(`ล้างตารางทั้งสัปดาห์ (${n} คาบ) ใช่ไหม?`)) return;
      const {error} = await sb.from('guidance_visit_slots').delete().eq('week_id', wid);
      if (error) throw error;
      msg('ล้างตารางแล้ว'); await refresh();
    }); break;

    case 'addPeriod':
      openModal(`เพิ่มคาบของ ${LV[S.level]}`, periodForm(null, true), async () => {
        const pno = parseInt($('#f_pno').value, 10), label = $('#f_label').value.trim();
        if (isNaN(pno) || pno < 0 || pno > 20) { msg('เลขคาบต้องอยู่ระหว่าง 0–20', true); return false; }
        if (!label) { msg('กรุณาใส่ชื่อคาบ', true); return false; }
        const {error} = await sb.from('guidance_periods').insert({
          level: S.level, period_no: pno, label, time_text: $('#f_time').value.trim() || null, is_break: $('#f_brk').checked});
        if (error) throw error;
        msg('เพิ่มคาบแล้ว'); await refresh(); return true;
      });
      break;

    case 'editPeriod': {
      const pno = parseInt(t.dataset.p, 10), p = S.periods.find(x => x.period_no === pno); if (!p) break;
      openModal(`แก้ไข ${p.label}`, periodForm(p, false), async () => {
        const label = $('#f_label').value.trim();
        if (!label) { msg('กรุณาใส่ชื่อคาบ', true); return false; }
        const {error} = await sb.from('guidance_periods')
          .update({label, time_text: $('#f_time').value.trim() || null, is_break: $('#f_brk').checked})
          .eq('level', S.level).eq('period_no', pno);
        if (error) throw error;
        msg('บันทึกคาบแล้ว'); await refresh(); return true;
      });
      break;
    }

    case 'delPeriod': run(async () => {
      const pno = parseInt(t.dataset.p, 10), p = S.periods.find(x => x.period_no === pno); if (!p) return;
      const n = S.cls.filter(c => c.period_no === pno).length;
      if (!confirm(`ลบ "${p.label}" ออกจากตารางใช่ไหม?${n ? `\n\nห้องที่มีคาบแนะแนวในคาบนี้ ${n} รายการ จะถูกลบไปด้วย` : ''}`)) return;
      const {error} = await sb.from('guidance_periods').delete().eq('level', S.level).eq('period_no', pno);
      if (error) throw error;
      msg('ลบคาบแล้ว'); await refresh();
    }); break;

    case 'openCell': openView('cell', {d: parseInt(t.dataset.d, 10), p: parseInt(t.dataset.p, 10)}); break;

    case 'cellAdd': run(async () => {
      const m = S.modal; if (!m || m.kind !== 'cell') return;
      const room = $('#cl_c').value.trim();
      if (!room) { msg('กรุณาใส่ห้องเรียน', true); return; }
      const {error} = await sb.from('guidance_class_periods').insert({
        level: S.level, day_no: m.d, period_no: m.p, class_room: room, room_no: $('#cl_r').value.trim() || null});
      if (error) throw error;
      msg('เพิ่มห้องแล้ว'); await refresh();
    }); break;

    case 'cellDel': run(async () => {
      const c = S.cls.find(x => x.id === t.dataset.id); if (!c) return;
      if (!confirm(`ลบ ${cl(c.class_room)} ออกจากช่องนี้ใช่ไหม?`)) return;
      const {error} = await sb.from('guidance_class_periods').delete().eq('id', c.id);
      if (error) throw error;
      msg('ลบห้องแล้ว'); await refresh();
    }); break;
  }
}

/* ---------- เริ่มต้น ---------- */
document.querySelectorAll('[data-level]').forEach(b => b.onclick = async () => {
  if (S.level === b.dataset.level) return;
  closeModal(false);
  S.level = b.dataset.level; await refresh();
});
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); });

(async function init() {
  const {data: {session}} = await sb.auth.getSession();
  if (!session) { location.href = 'index.html'; return; }
  const {data: p, error} = await sb.from('profiles').select('role,is_guidance,class_room').eq('id', session.user.id).maybeSingle();
  if (error) msg('อ่านข้อมูลผู้ใช้ไม่สำเร็จ จึงแสดงแบบอ่านอย่างเดียว', true);
  S.canEdit = !!p && (p.role === 'admin' || (p.role === 'teacher' && p.is_guidance === true));
  S.myRoom = p && p.role === 'student' ? norm(p.class_room) : '';
  if (S.myRoom.startsWith('6/')) S.level = 'm6';
  await refresh();
})();
</script>
</body>
