<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เปลี่ยนปีการศึกษา · แนะให้แนว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#22313A; --ink-soft:#5B6B72;
  --board:#EFF3F1; --card:#FFFFFF;
  --pine:#0F6B5C; --pine-deep:#0A4F44; --pine-tint:#E2F0EC;
  --note:#FFD34D; --note-deep:#8A6D00;
  --line:#DCE4E1; --danger:#C0392B;
  --g1:#F28C6B; --g2:#F2B84B; --g3:#7FB069; --g4:#4E9BB9; --g5:#8E7CC3; --g6:#D96A9C;
  --radius:14px; --shadow:0 2px 10px rgba(34,49,58,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Sarabun',sans-serif;background:var(--board);color:var(--ink);font-size:16px;line-height:1.55;min-height:100vh}
h1,h2,h3,.brand{font-family:'Mitr',sans-serif;font-weight:600}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit;font-size:16px}
:focus-visible{outline:3px solid var(--note);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.hidden{display:none!important}

.wrap{max-width:1080px;margin:0 auto;padding:0 16px 64px}
header.app{background:var(--pine);color:#fff;padding:14px 0}
header.app .wrap{display:flex;align-items:center;gap:12px;padding-bottom:0;flex-wrap:wrap}
.brand{font-size:1.2rem;display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--note);color:var(--pine-deep);display:grid;place-items:center;font-size:1.05rem;flex:none}
.brand small{display:block;font-family:'Sarabun';font-weight:400;font-size:.72rem;opacity:.85}
.spacer{flex:1}
.userchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:999px;font-size:.85rem}
.userchip .role{background:var(--note);color:var(--pine-deep);border-radius:999px;padding:1px 9px;font-weight:700;font-size:.72rem}
.iconbtn{background:rgba(255,255,255,.14);border:none;color:#fff;border-radius:999px;padding:7px 14px;font-size:.85rem;text-decoration:none}
.iconbtn:hover{background:rgba(255,255,255,.26)}


.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-top:14px}
.panel h3{font-size:1.05rem;font-weight:500;color:var(--pine-deep);margin-bottom:4px}
.hint{font-size:.85rem;color:var(--ink-soft);margin-bottom:10px}
.empty{padding:34px 16px;text-align:center;color:var(--ink-soft)}.empty .big{font-size:2rem}
.btn{border:none;border-radius:9px;padding:10px 16px;font-size:.95rem;font-weight:600;min-height:44px;cursor:pointer}
.btn.primary{background:var(--pine);color:#fff}.btn.danger{background:var(--danger);color:#fff}.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{border-radius:10px;padding:10px 13px;font-size:.9rem;margin:12px 0}.msg.err{background:#FBEAE7;color:var(--danger)}.msg.ok{background:var(--pine-tint);color:var(--pine-deep)}.msg.warn{background:#FFF8E1;border:1px solid #F5E2A0;color:#6b5400}
table{width:100%;border-collapse:collapse;font-size:.92rem}th{text-align:left;padding:8px 10px;background:var(--board);color:var(--ink-soft);font-size:.8rem}td{padding:8px 10px;border-bottom:1px solid var(--line)}
th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}.tw{overflow-x:auto}
.tag{display:inline-block;font-size:.75rem;font-weight:700;border-radius:6px;padding:2px 8px}.tag.go{background:var(--pine-tint);color:var(--pine-deep)}.tag.end{background:#FFF3CE;color:var(--note-deep)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.kpi{background:#fff;border:1px solid var(--line);border-left:5px solid var(--pine);border-radius:12px;padding:12px 14px}.kpi .lab{font-size:.82rem;color:var(--ink-soft);font-weight:600}.kpi .num{font-family:'Mitr';font-size:1.7rem;color:var(--pine-deep)}
.field{margin:10px 0}.field label{display:block;font-size:.88rem;font-weight:700;margin-bottom:5px}.field input{width:100%;max-width:340px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px}
.login-stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--pine),var(--pine-deep))}
.login-card{background:#fff;border-radius:20px;padding:28px 24px;max-width:400px;width:100%}.login-card h1{text-align:center;color:var(--pine-deep);font-size:1.3rem;margin-bottom:14px}.login-card .btn{width:100%}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 64px}
</style>
</head>
<body>
<div id="loginStage" class="login-stage hidden"><div class="login-card"><h1>เปลี่ยนปีการศึกษา</h1><div id="loginMsg"></div>
<div class="field"><label for="u">ชื่อผู้ใช้</label><input id="u" autocomplete="username"></div>
<div class="field"><label for="p">รหัสผ่าน</label><input id="p" type="password" autocomplete="current-password"></div>
<button class="btn primary" id="btnLogin">เข้าสู่ระบบ</button></div></div>
<div id="appStage" class="hidden">
<header class="app"><div class="wrap"><div class="brand"><div class="logo">🎓</div><div>เปลี่ยนปีการศึกษา<small>แนะให้แนว · พูลเจริญวิทยาคม</small></div></div><div class="spacer"></div>
<a class="iconbtn" href="index.html">🏠 คลังแนะแนว</a><button class="iconbtn" id="btnLogout">ออกจากระบบ</button></div></header>
<div class="wrap">
<div id="denyBox" class="panel hidden"><div class="empty"><div class="big">🔒</div><b>หน้านี้เปิดให้เฉพาะครูแนะแนวและผู้ดูแลระบบ</b></div></div>
<div id="mainBox" class="hidden"><div id="view"><div class="empty">กำลังโหลด…</div></div></div>
</div></div>
<script>
const sb = supabase.createClient("https://ikkhjslmtjwrxzxvtokb.supabase.co","sb_publishable_gkUomr4OsxcNV2a6EkVgRA__gCuRM7q");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = n => Number(n || 0).toLocaleString("th-TH");
let PV = null;
async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ $("appStage").classList.add("hidden"); $("loginStage").classList.remove("hidden"); return; }
  const { data: p } = await sb.from("profiles").select("id,role,is_guidance").eq("id", session.user.id).maybeSingle();
  if(!p){ await sb.auth.signOut(); location.reload(); return; }
  $("loginStage").classList.add("hidden"); $("appStage").classList.remove("hidden");
  if(!(p.role === "admin" || (p.role === "teacher" && p.is_guidance))){ $("denyBox").classList.remove("hidden"); return; }
  $("mainBox").classList.remove("hidden");
  load();
}
async function login(){
  const u = $("u").value.trim(), p = $("p").value;
  if(!u || !p){ $("loginMsg").innerHTML = '<div class="msg err">กรอกชื่อผู้ใช้และรหัสผ่านให้ครบก่อน</div>'; return; }
  const { error } = await sb.auth.signInWithPassword({ email: u.includes("@") ? u : u + "@guidance-pcw.local", password: p });
  if(error){ $("loginMsg").innerHTML = '<div class="msg err">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>'; return; }
  boot();
}
$("btnLogin").onclick = login;
$("p").addEventListener("keydown", e => { if(e.key === "Enter") login(); });
$("btnLogout").onclick = async () => { await sb.auth.signOut(); location.reload(); };

const NEXT = { "ม.1": ["ม.2", "go"], "ม.2": ["ม.3", "go"], "ม.3": ["จบมัธยมต้น", "end"], "ม.4": ["ม.5", "go"], "ม.5": ["ม.6", "go"], "ม.6": ["จบมัธยมปลาย", "end"] };
async function load(){
  const { data, error } = await sb.rpc("rollover_preview");
  if(error){ $("view").innerHTML = '<div class="empty"><div class="big">⚠️</div>โหลดข้อมูลไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วเปิดหน้านี้ใหม่</div>'; return; }
  PV = data; render();
}
function render(){
  const d = PV, y = d.next_year, lv = d.levels || [];
  const total = lv.reduce((s, x) => s + x.n, 0);
  const grads = lv.filter(x => x.level === "ม.3" || x.level === "ม.6").reduce((s, x) => s + x.n, 0);
  const done = d.last_rollover && Number(d.last_rollover) >= y;
  let h = '<div class="panel"><h3>เปลี่ยนเป็นปีการศึกษา ' + esc(y) + '</h3><p class="hint">ปีนี้คือปีการศึกษา ' + esc(d.current_year) + ' · ใช้ห้องเดิม ไม่ต้องจัดห้องใหม่ · ข้อมูลทุกอย่างยังอยู่ ไม่มีการลบ</p>';
  h += '<div class="tw"><table><thead><tr><th>ชั้นตอนนี้</th><th class="r">นักเรียน</th><th class="r">ห้อง</th><th>หลังเปลี่ยนปี</th></tr></thead><tbody>' +
    (lv.length ? lv.map(x => { const n = NEXT[x.level] || ["-", "go"]; return `<tr><td>${esc(x.level)}</td><td class="r">${num(x.n)}</td><td class="r">${num(x.rooms)}</td><td><span class="tag ${n[1]}">${esc(n[0])}</span></td></tr>`; }).join("") : '<tr><td colspan="4" class="muted">ไม่มีนักเรียนที่ยังเรียนอยู่</td></tr>') + "</tbody></table></div>";
  h += '<div class="kpis"><div class="kpi"><div class="lab">เลื่อนชั้น</div><div class="num">' + num(total - grads) + '</div></div><div class="kpi"><div class="lab">จบการศึกษา</div><div class="num">' + num(grads) + '</div></div><div class="kpi"><div class="lab">ปิดบัญชีคนจบ (ครบ 1 ปี)</div><div class="num">' + num(d.closable) + '</div></div></div>';
  if(Number(d.odd)) h += '<div class="msg warn">มีนักเรียน ' + num(d.odd) + ' คนที่ห้องว่างหรือรูปแบบไม่ใช่ "ม.1/1" ระบบจะไม่เลื่อนชั้นคนกลุ่มนี้ ให้แก้ห้องก่อน</div>';
  h += '</div>';
  h += '<div class="panel"><h3>สิ่งที่จะเกิดขึ้น</h3><ul style="padding-left:1.2rem;font-size:.92rem;line-height:1.8"><li>นักเรียน ม.3 และ ม.6 เปลี่ยนสถานะเป็น "จบแล้ว" ยังล็อกอินและดูข้อมูลของตัวเองได้อีก 1 ปี</li><li>นักเรียน ม.1 ม.2 ม.4 ม.5 เลื่อนชั้นขึ้น 1 ชั้น เลขห้องเหมือนเดิม (เช่น ม.1/3 เป็น ม.2/3)</li><li>คนที่จบมาครบ 1 ปีแล้ว ถูกปิดล็อกอิน (ข้อมูลยังอยู่ รายงานย้อนหลังไม่หาย)</li><li>นักเรียนใหม่ ม.1 และ ม.4 ให้เพิ่มบัญชีด้วยเมนูจัดการบัญชีตามปกติ หลังกดปุ่มนี้</li><li>กดซ้ำไม่ได้ ถ้าเปลี่ยนปีนั้นไปแล้ว</li></ul></div>';
  if(done){
    h += '<div class="msg ok">เปลี่ยนเป็นปีการศึกษา ' + esc(d.last_rollover) + ' เรียบร้อยแล้ว</div>';
  } else if(!d.can_run_next){
    h += '<div class="msg warn">ยังไม่ถึงเวลาเปลี่ยนปี เริ่มทำได้ตั้งแต่ 1 เมษายน ' + esc(y - 543) + ' (ก่อนเปิดภาคเรียนปีการศึกษา ' + esc(y) + ')</div>';
  } else {
    h += '<div class="panel"><h3>ยืนยัน</h3><p class="hint">พิมพ์ข้อความด้านล่างให้ตรง แล้วกดปุ่ม</p><div class="field"><label for="cf">พิมพ์ว่า <b>เปลี่ยนปี ' + esc(y) + '</b></label><input id="cf" autocomplete="off"></div><button class="btn danger" id="go" disabled>เปลี่ยนปีการศึกษา ' + esc(y) + '</button><div id="res"></div></div>';
  }
  if(Number(d.closable) && done){
    h += '<div class="panel"><h3>ปิดบัญชีคนจบที่ครบ 1 ปี</h3><p class="hint">มี ' + num(d.closable) + ' บัญชี</p><button class="btn ghost" id="cl">ปิดบัญชีเดี๋ยวนี้</button></div>';
  }
  h += '<div class="panel"><h3>สถานะตอนนี้</h3><div class="kpis"><div class="kpi"><div class="lab">จบแล้ว (ยังล็อกอินได้)</div><div class="num">' + num(d.graduated_now) + '</div></div><div class="kpi"><div class="lab">ปิดบัญชีแล้ว</div><div class="num">' + num(d.closed) + '</div></div></div>' +
    ((d.history || []).length ? '<div class="tw" style="margin-top:12px"><table><thead><tr><th>ปีการศึกษา</th><th>วันที่ทำ</th><th class="r">เลื่อน</th><th class="r">จบ</th><th class="r">ปิดบัญชี</th></tr></thead><tbody>' +
      d.history.map(r => `<tr><td>${esc(r.academic_year)}</td><td>${esc(new Date(r.run_at).toLocaleDateString("th-TH", { dateStyle: "medium" }))}</td><td class="r">${num(r.promoted)}</td><td class="r">${num(r.graduated)}</td><td class="r">${num(r.closed)}</td></tr>`).join("") + "</tbody></table></div>" : '<p class="hint" style="margin-top:10px">ยังไม่เคยเปลี่ยนปีในระบบนี้</p>') + "</div>";
  $("view").innerHTML = h;
  const cf = $("cf"), go = $("go");
  if(cf){
    cf.oninput = () => { go.disabled = cf.value.trim() !== "เปลี่ยนปี " + y; };
    go.onclick = async () => {
      go.disabled = true; go.textContent = "กำลังเปลี่ยนปี… อย่าปิดหน้านี้";
      const { data: r, error } = await sb.rpc("rollover_commit", { p_year: y, p_confirm: cf.value.trim() });
      if(error){ $("res").innerHTML = '<div class="msg err">ไม่สำเร็จ: ' + esc(error.message) + '</div>'; go.textContent = "ลองใหม่"; go.disabled = false; return; }
      await load();
      $("view").insertAdjacentHTML("afterbegin", `<div class="msg ok">เสร็จแล้ว · เลื่อนชั้น ${num(r.promoted)} คน · จบ ${num(r.graduated)} คน · ปิดบัญชี ${num(r.closed)} คน` + (Number(r.skipped) ? ` · ข้าม ${num(r.skipped)} คน (ห้องไม่ถูกรูปแบบ)` : "") + "</div>");
    };
  }
  const cl = $("cl");
  if(cl) cl.onclick = async () => {
    cl.disabled = true;
    const { data: n, error } = await sb.rpc("close_old_graduates");
    await load();
    $("view").insertAdjacentHTML("afterbegin", error ? '<div class="msg err">ไม่สำเร็จ: ' + esc(error.message) + "</div>" : `<div class="msg ok">ปิดบัญชีแล้ว ${num(n)} บัญชี</div>`);
  };
}
boot();
</script>
</body>
</html>
