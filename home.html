<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>หน้าแรก · คลังแนะแนว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#22313A;--ink-soft:#5B6B72;--board:#EFF3F1;--card:#FFFFFF;
  --pine:#0F6B5C;--pine-deep:#0A4F44;--pine-tint:#E2F0EC;
  --note:#FFD34D;--note-deep:#8A6D00;--line:#DCE4E1;--danger:#C0392B;
  --nat:#4E9BB9;--nat-bg:#E1EFF5;--nat-fg:#22617A;
  --tcas:#F28C6B;--tcas-bg:#FDE6DD;--tcas-fg:#9A3F22;
  --gui:#0F6B5C;--gui-bg:#E2F0EC;--gui-fg:#0A4F44;
  --oth:#8E7CC3;--oth-bg:#EEEAF7;--oth-fg:#4E3F86;
  --radius:14px;--shadow:0 2px 10px rgba(34,49,58,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Sarabun',sans-serif;background:var(--board);color:var(--ink);font-size:16px;line-height:1.55;min-height:100vh}
h1,h2,h3,.brand{font-family:'Mitr',sans-serif;font-weight:600}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
a{color:var(--pine)}
:focus-visible{outline:3px solid var(--note);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
/* หัว */
header.app{background:var(--pine);color:#fff;padding:14px 0}
header.app .wrap{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.brand{font-size:1.25rem;display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:34px;object-fit:cover;border-radius:9px;flex:none}
.brand small{display:block;font-family:'Sarabun';font-weight:400;font-size:.72rem;opacity:.85}
.spacer{flex:1}
.userchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:999px;font-size:.85rem}
.userchip .role{background:var(--note);color:var(--pine-deep);border-radius:999px;padding:1px 9px;font-weight:700;font-size:.72rem}
.hbtn{display:inline-flex;align-items:center;min-height:40px;border:none;border-radius:999px;padding:0 14px;font-size:.88rem;text-decoration:none}
.hbtn.go{background:var(--note);color:var(--pine-deep);font-weight:700}
.hbtn.out{background:rgba(255,255,255,.14);color:#fff}
.hbtn.out:hover{background:rgba(255,255,255,.26)}
/* ทั่วไป */
main{padding:22px 0 64px}
.stack{display:flex;flex-direction:column;gap:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.panel-h h2{font-size:1.1rem;color:var(--pine-deep)}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.col-main{flex:999 1 520px;min-width:0}
.col-side{flex:1 1 320px;min-width:0}
.btn{border:none;border-radius:9px;padding:9px 16px;min-height:40px;font-size:.9rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none}
.btn.primary{background:var(--pine);color:#fff}
.btn.primary:hover{background:var(--pine-deep)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink-soft)}
.btn.ghost:hover{border-color:var(--pine);color:var(--pine)}
.btn.danger{background:#fff;border:1.5px solid #EAC7C2;color:var(--danger)}
.btn.sm{padding:5px 11px;min-height:34px;font-size:.8rem}
.btn:disabled{opacity:.55;cursor:wait}
.muted{color:var(--ink-soft)}
.empty{padding:26px 12px;text-align:center;color:var(--ink-soft)}
.loading{padding:22px;text-align:center;color:var(--ink-soft)}
.err-box{background:#FBEAE7;color:var(--danger);border-radius:10px;padding:10px 13px;font-size:.9rem}
.badge{font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 8px;display:inline-block;white-space:nowrap}
.cat-national{--c:var(--nat);--cb:var(--nat-bg);--cf:var(--nat-fg)}
.cat-tcas{--c:var(--tcas);--cb:var(--tcas-bg);--cf:var(--tcas-fg)}
.cat-guidance{--c:var(--gui);--cb:var(--gui-bg);--cf:var(--gui-fg)}
.cat-other{--c:var(--oth);--cb:var(--oth-bg);--cf:var(--oth-fg)}
.badge.cat{background:var(--cb);color:var(--cf)}
/* วันนี้ */
.today{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.today h1{font-size:1.55rem;color:var(--pine-deep);line-height:1.35}
.next{flex:0 1 430px;display:flex;align-items:center;gap:14px;background:var(--pine-tint);border-radius:12px;padding:14px 16px;border:none;text-align:left;color:inherit;font:inherit;width:100%}
button.next:hover{background:#D5EAE3}
.next .num{width:84px;height:84px;border-radius:12px;background:var(--pine);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.next .num b{font-family:'Mitr';font-weight:600;font-size:2rem;line-height:1}
.next .num b.word{font-size:1.15rem}
.next .num span{font-size:.85rem;margin-top:2px}
.next .lbl{font-size:.8rem;font-weight:700;color:var(--pine-deep)}
.next .ttl{font-family:'Mitr';font-weight:500;font-size:1.1rem;line-height:1.35;display:block}
/* ข่าว */
.pin{background:#FFF8DC;border:1px solid #F2DC8A;border-left:5px solid var(--note);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.pin .badge.p{background:#FFE89A;color:var(--note-deep)}
.news-item{border-bottom:1px dashed var(--line)}
.news-item:last-child{border-bottom:none}
.news-row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 2px;background:none;border:none;text-align:left;color:inherit;font:inherit;min-height:56px}
.news-row:hover .nt{color:var(--pine)}
.datebox{width:50px;flex:none;background:var(--board);border-radius:10px;padding:5px 0;display:flex;flex-direction:column;align-items:center}
.datebox b{font-family:'Mitr';font-weight:600;font-size:1.1rem;line-height:1.1;color:var(--pine-deep)}
.datebox span{font-size:.75rem;color:var(--ink-soft)}
.nt{font-size:1rem;font-weight:600;line-height:1.45;overflow-wrap:anywhere}
.nm{font-size:.8rem;color:var(--ink-soft)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-left:6px;vertical-align:middle}
.news-body{padding:0 2px 12px 62px}
.pin .news-body{padding:6px 0 0}
.news-body p{white-space:pre-line;font-size:.95rem;margin-bottom:8px;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* ใกล้ถึง */
.up{display:flex;gap:10px;align-items:center;width:100%;padding:11px 11px 11px 13px;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;background:#fff;margin-bottom:10px;text-align:left;font:inherit;color:inherit}
.up:hover{border-color:var(--c)}
.up .t{font-size:.96rem;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.up .s{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px;font-size:.78rem;color:var(--ink-soft)}
.count{flex:none;font-size:.8rem;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--board);white-space:nowrap}
.count.hot{background:var(--note);color:var(--pine-deep)}
/* ตัวกรอง */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;min-height:36px;font-size:.85rem;color:var(--ink-soft)}
.chip.active{background:var(--pine);border-color:var(--pine);color:#fff;font-weight:600}
/* ปฏิทิน */
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.cal-nav .m{font-family:'Mitr';font-weight:500;font-size:1.15rem;color:var(--pine-deep);text-align:center}
.cal{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-dow{background:var(--board)}
.cal-dow span{padding:7px 4px;font-size:.8rem;font-weight:700;color:var(--ink-soft);text-align:center}
.cell{min-height:92px;padding:5px;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:3px;border-top:1px solid var(--line);border-right:1px solid #E8EEEB;background:#fff;text-align:left;font:inherit;color:inherit;border-left:none;border-bottom:none;min-width:0}
.cell:nth-child(7n){border-right:none}
.cell.out{background:#F6F8F7;cursor:default}
.cell.sel{background:var(--pine-tint)}
.cell.today{background:#FFFBE8;box-shadow:inset 0 0 0 2px var(--note)}
.cell .d{font-size:.8rem;font-weight:700;color:var(--ink-soft);align-self:flex-start}
.cell.today .d{background:var(--note);color:var(--pine-deep);border-radius:999px;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center}
.ev{display:block;font-size:.72rem;font-weight:600;line-height:1.3;padding:2px 5px;border-radius:5px;background:var(--cb);color:var(--cf);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.cont{height:7px;padding:0;background:var(--c);opacity:.5}
.more{font-size:.72rem;font-weight:700;color:var(--ink-soft)}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--ink-soft);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.daybox{margin-top:12px;background:var(--board);border-radius:12px;padding:12px}
.daybox h3{font-size:1rem;color:var(--pine-deep);margin-bottom:8px}
/* ทางลัด */
.shortcuts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.sc{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--c,var(--pine));border-radius:12px;padding:14px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);min-height:72px}
.sc:hover{border-color:var(--c,var(--pine))}
.sc .ic{font-size:1.6rem;flex:none}
.sc b{font-family:'Mitr';font-weight:500;font-size:1rem;display:block}
.sc small{font-size:.8rem;color:var(--ink-soft)}
.sc.all{background:var(--pine);border-color:var(--pine);color:#fff}
.sc.all small{color:#fff;opacity:.9}
/* โมดัล */
.modal-back{position:fixed;inset:0;background:rgba(20,32,30,.45);display:none;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto;z-index:50}
.modal-back.show{display:flex}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.modal.wide{max-width:720px}
.mg-row{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;margin-bottom:8px;background:#fff}
.mg-row.past{opacity:.6}
.mg-row input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--pine)}
.mg-row .mt{flex:1;min-width:0;font-size:.92rem;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.mg-row .ms{font-size:.78rem;color:var(--ink-soft);font-weight:400;margin-top:2px}
.mg-list{max-height:52vh;overflow-y:auto;margin:10px 0}
.mg-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.modal h2{font-size:1.15rem;margin-bottom:14px;color:var(--pine-deep)}
.field{margin-bottom:13px}
.field label,.field .lab{display:block;font-size:.85rem;font-weight:700;margin-bottom:5px}
.field input,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.field textarea{min-height:74px;resize:vertical}
.hint{font-size:.76rem;color:var(--ink-soft);margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1 1 0;border:none;background:#fff;padding:9px 6px;min-height:42px;font-size:.86rem;color:var(--ink-soft)}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button.active{background:var(--pine);color:#fff;font-weight:600}
.foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.foot .left{margin-right:auto}
.msg{border-radius:10px;padding:10px 13px;font-size:.88rem;margin-bottom:12px}
.msg.err{background:#FBEAE7;color:var(--danger)}
.msg.ok{background:var(--pine-tint);color:var(--pine-deep)}
.detail p{margin-bottom:8px;white-space:pre-line;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:80;max-width:90vw}
#toast.bad{background:var(--danger)}
.screen{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
@media (max-width:640px){
  .today h1{font-size:1.25rem}
  .next .num{width:68px;height:68px}
  .next .num b{font-size:1.6rem}
  .cell{min-height:48px;padding:4px 2px;align-items:center}
  .cell .ev,.cell .more{display:none}
  .cell .dots{display:flex;justify-content:center}
  .news-body{padding-left:2px}
  .row2{grid-template-columns:1fr}
  .userchip{display:none}
  .mob-hide{display:none}
  .cell .d{align-self:center}
}
</style>
</head>

  {files:['quota-hub.html','quota-apply.html'],icon:'🏛',title:'โควตามหาวิทยาลัย',sub:{student:'สมัครโควตา ดูผลคัดเลือก',staff:'จัดการและคัดกรองโควตา'},c:'#F28C6B'},
  {files:['interview.html'],icon:'🗣',title:'ซ้อมสัมภาษณ์',sub:{student:'ฝึกตอบคำถาม ส่งให้ครูตรวจ',staff:'ตรวจการซ้อมของนักเรียน'},c:'#4E9BB9'}
];

var S={user:null,profile:null,staff:false,today:'',news:[],reads:{},events:[],apps:[],
  filter:'all',ym:null,selDay:null,openNews:null,editId:null,editCat:'national',pinId:null,loadErr:''};

/* ---------- ตัวช่วย ---------- */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return (n<10?'0':'')+n;}
function bkkToday(){return new Date(Date.now()+7*3600*1000).toISOString().slice(0,10);}
function tsToBkkDate(ts){if(!ts)return null;var t=new Date(ts).getTime();if(isNaN(t))return null;return new Date(t+7*3600*1000).toISOString().slice(0,10);}
function parts(d){var p=d.split('-');return {y:+p[0],m:+p[1],d:+p[2]};}
function dnum(d){var p=parts(d);return Date.UTC(p.y,p.m-1,p.d)/86400000;}
function diffDays(a,b){return dnum(a)-dnum(b);}
function ymd(y,m,d){return y+'-'+pad(m)+'-'+pad(d);}
function thDate(d){if(!d)return '';var p=parts(d);return p.d+' '+MON[p.m-1]+' '+(p.y+543);}
function thRange(a,b){
  if(!b||b===a)return thDate(a);
  var pa=parts(a),pb=parts(b);
  if(pa.y===pb.y&&pa.m===pb.m)return pa.d+'–'+pb.d+' '+MON[pb.m-1]+' '+(pb.y+543);
  if(pa.y===pb.y)return pa.d+' '+MON[pa.m-1]+' – '+pb.d+' '+MON[pb.m-1]+' '+(pb.y+543);
  return thDate(a)+' – '+thDate(b);
}
function safeUrl(u){u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:'';}
function thError(e){
  var m=(e&&e.message)||'';var c=e&&e.code;
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่';
  if(c==='23505')return 'มีกำหนดการชื่อนี้ในวันเดียวกันอยู่แล้ว';
  if(c==='42501'||/row-level security|permission denied/i.test(m))return 'ไม่มีสิทธิ์ทำรายการนี้';
  if(c==='23514')return 'ข้อมูลไม่ถูกต้อง ตรวจวันที่และลิงก์อีกครั้ง';
  if(/JWT|expired/i.test(m))return 'หมดเวลาเข้าสู่ระบบ กรุณาเข้าสู่ระบบใหม่';
  return 'เกิดข้อผิดพลาด ลองใหม่อีกครั้ง';
}
var toastT=null;
function toast(msg,bad){var t=$('toast');t.textContent=msg;t.className=bad?'bad':'';clearTimeout(toastT);toastT=setTimeout(function(){t.className='hidden';},bad?6000:3500);}
async function fetchAllRows(build){
  var out=[],size=1000;
  for(var from=0;;from+=size){
    var r=await build().range(from,from+size-1);
    if(r.error)throw r.error;
    out=out.concat(r.data||[]);
    if(!r.data||r.data.length<size)break;
  }
  return out;
}
function openModal(id){$(id).classList.add('show');}
function closeModal(id){$(id).classList.remove('show');}
function showMsg(id,text,kind){var el=$(id);if(!text){el.className='msg hidden';return;}el.className='msg '+(kind||'err');el.textContent=text;}

/* ---------- โหลดข้อมูล ---------- */
async function loadNews(){
  var r=await sb.from('announcements').select('id,title,content,file_path,file_name,external_url,is_active,is_pinned,pinned_until,created_by,creator_name,created_at')
    .eq('is_active',true).order('created_at',{ascending:false}).limit(60);
  if(r.error)throw r.error;
  S.news=r.data||[];
  S.reads={};
  var ids=S.news.map(function(n){return n.id;});
  if(ids.length){
    var rr=await sb.from('announcement_reads').select('announcement_id').eq('profile_id',S.user.id).in('announcement_id',ids);
    if(rr.error)throw rr.error;
    (rr.data||[]).forEach(function(x){S.reads[x.announcement_id]=true;});
  }
}
async function loadEvents(){
  var from=ymd(parts(S.today).y-1,1,1);
  var res=await Promise.all([
    fetchAllRows(function(){return sb.from('calendar_events').select('*').gte('start_date',from).order('start_date').order('id');}),
    sb.from('scholarships').select('id,name,status,opens_at,closes_at').not('closes_at','is',null),
    sb.from('quotas').select('id,name,university,status,opens_at,closes_at').not('closes_at','is',null)
  ]);
  if(res[1].error)throw res[1].error;
  if(res[2].error)throw res[2].error;
  var ev=res[0].map(function(e){
    return {id:e.id,manual:true,title:e.title,cat:e.category,start:e.start_date,end:e.end_date||e.start_date,
      link:safeUrl(e.link_url),note:e.note||'',raw:e};
  });
  function auto(kind,row,label,url){
    if(row.status==='draft')return;
    var close=tsToBkkDate(row.closes_at);if(!close)return;
    var open=tsToBkkDate(row.opens_at);
    if(!open||open>close)open=close;
    ev.push({id:kind+':'+row.id,manual:false,title:'เปิดรับสมัคร'+label,cat:'guidance',start:open,end:close,
      deadline:true,link:url,note:'',src:kind==='sch'?'ขึ้นอัตโนมัติจากระบบทุน':'ขึ้นอัตโนมัติจากระบบโควตา'});
  }
  (res[1].data||[]).forEach(function(s){auto('sch',s,' '+s.name,shortcutUrl(0));});
  (res[2].data||[]).forEach(function(q){auto('quo',q,' '+q.name+(q.university&&q.name.indexOf(q.university)<0?' ('+q.university+')':''),shortcutUrl(1));});
  ev.sort(function(a,b){return a.start<b.start?-1:a.start>b.start?1:(a.title<b.title?-1:1);});
  S.events=ev;
}
async function loadApps(){
  var r=await sb.from('external_systems').select('id,url,visible_to,student_grades').order('sort_order');
  if(r.error)throw r.error;
  var p=S.profile, list=r.data||[];
  if(p.role!=='admin'){
    var grp=p.role==='student'?'student':'teacher';
    list=list.filter(function(a){return (a.visible_to||[]).indexOf(grp)>=0;});
    if(p.role==='student'){
      var g=(p.class_room||'').split('/')[0].trim();
      list=list.filter(function(a){return !(a.student_grades||[]).length||(a.student_grades||[]).indexOf(g)>=0;});
    }
    var only=p.menu_permissions&&Array.isArray(p.menu_permissions.appsOnly)?p.menu_permissions.appsOnly:null;
    if(only)list=list.filter(function(a){return only.indexOf(a.id)>=0;});
  }
  S.apps=list;
}
function fileOf(url){var u=String(url||'').split('#')[0].split('?')[0];return u.slice(u.lastIndexOf('/')+1);}
function shortcutUrl(i){
  var sc=SHORTCUTS[i];
  for(var k=0;k<sc.files.length;k++){
    for(var j=0;j<S.apps.length;j++){if(fileOf(S.apps[j].url)===sc.files[k])return sc.files[k];}
  }
  return '';
}

/* ---------- คำนวณ ---------- */
function passFilter(e){return S.filter==='all'||e.cat===S.filter;}
function countInfo(e){
  var t=S.today, n=diffDays(e.start,t);
  if(n>0)return {label:n===1?'พรุ่งนี้':'อีก '+n+' วัน',days:n,hot:n<=3,word:'อีก'};
  var left=diffDays(e.end,t);
  if(e.deadline||e.end!==e.start){
    if(left===0)return {label:'วันสุดท้าย',days:0,hot:true,ongoing:true};
    return {label:'เหลือ '+left+' วัน',days:left,hot:left<=3,ongoing:true};
  }
  return {label:'วันนี้',days:0,hot:true,ongoing:true};
}
function upcomingList(){
  var t=S.today;
  return S.events.filter(function(e){return e.end>=t&&passFilter(e);})
    .sort(function(a,b){
      var ka=a.start<t?a.end:a.start, kb=b.start<t?b.end:b.start;
      return ka<kb?-1:ka>kb?1:0;
    });
}
function pinnedNews(){
  var t=S.today;
  return S.news.filter(function(n){return n.is_pinned&&(!n.pinned_until||n.pinned_until>=t);});
}
function canPin(n){return S.profile.role==='admin'||n.created_by===S.user.id;}

/* ---------- แสดงผล ---------- */
function render(){
  var p=S.profile, t=parts(S.today), dow=new Date(Date.UTC(t.y,t.m-1,t.d)).getUTCDay();
  var html='<div class="stack">';
  if(S.loadErr)html+='<div class="err-box">'+esc(S.loadErr)+' <button type="button" class="btn ghost sm" data-act="reload">ลองใหม่</button></div>';
  html+='<section class="panel today"><div style="flex:1 1 300px"><p class="muted" style="font-size:.88rem">วันนี้</p>'+
    '<h1>วัน'+DAYF[dow]+'ที่ '+t.d+' '+MONF[t.m-1]+' '+(t.y+543)+'</h1>'+
    '<p class="muted" style="font-size:.92rem;margin-top:4px">ข่าวจากงานแนะแนว และกำหนดการที่ต้องรู้ รวมไว้ที่นี่</p></div>'+
    renderNext()+'</section>';
  html+='<div class="cols"><section class="panel col-main" aria-labelledby="hNews">'+renderNews()+'</section>'+
    '<section class="panel col-side" aria-labelledby="hUp">'+renderUpcoming()+'</section></div>';
  html+='<section class="panel" aria-labelledby="hCal">'+renderCalendar()+'</section>';
  html+='<section aria-labelledby="hSc"><h2 id="hSc" style="font-size:1.1rem;color:var(--pine-deep);margin-bottom:12px">🧭 ทางลัด</h2>'+renderShortcuts()+'</section>';
  html+='</div>';
  $('root').innerHTML=html;
}
function renderNext(){
  var t=S.today;
  var list=S.events.filter(function(e){return e.end>=t;}).sort(function(a,b){
    var ka=a.start<t?a.end:a.start, kb=b.start<t?b.end:b.start;return ka<kb?-1:ka>kb?1:0;});
  if(!list.length)return '<div class="next" style="cursor:default"><div class="num"><b>–</b><span>วัน</span></div><div><span class="lbl">เรื่องที่ใกล้ที่สุด</span><span class="ttl">ยังไม่มีกำหนดการที่กำลังจะถึง</span></div></div>';
  var e=list[0], c=countInfo(e);
  var box=c.days===0?'<b class="word">'+(c.label==='วันสุดท้าย'?'วันสุด<br>ท้าย':'วันนี้')+'</b>':'<b>'+c.days+'</b><span>วัน</span>';
  var lbl=!c.ongoing?'เรื่องที่ใกล้ที่สุด':(e.end===e.start?'เรื่องที่ใกล้ที่สุด':'กำลังเปิดอยู่ · '+c.label);
  return '<button type="button" class="next" data-ev="'+esc(e.id)+'"><div class="num">'+box+'</div>'+
    '<div style="min-width:0"><span class="lbl">'+esc(lbl)+'</span>'+
    '<span class="ttl">'+esc(e.title)+'</span>'+
    '<span class="acts" style="margin-top:4px"><span class="badge cat cat-'+e.cat+'">'+CAT_LABEL[e.cat]+'</span><span class="muted" style="font-size:.8rem">'+esc(thRange(e.start,e.end))+'</span></span></div></button>';
}
function newsAttach(n){
  var out='';
  if(n.file_path)out+='<button type="button" class="btn ghost sm" data-att="'+esc(n.id)+'">📎 '+esc(n.file_name||'ไฟล์แนบ')+'</button>';
  var u=safeUrl(n.external_url);
  if(u)out+='<a class="btn ghost sm" href="'+esc(u)+'" target="_blank" rel="noopener">🔗 เปิดลิงก์</a>';
  return out;
}
function newsBody(n,inPin){
  var acts=newsAttach(n);
  if(canPin(n))acts+=n.is_pinned&&inPin?'<button type="button" class="btn ghost sm" data-unpin="'+esc(n.id)+'">เลิกปักหมุด</button>'
    :(!n.is_pinned||!inPin?'<button type="button" class="btn ghost sm" data-pin="'+esc(n.id)+'">📌 ปักหมุด</button>':'');
  return '<div class="news-body">'+(n.content?'<p>'+esc(n.content)+'</p>':'')+(acts?'<div class="acts">'+acts+'</div>':'')+'</div>';
}
function renderNews(){
  var h='<div class="panel-h"><h2 id="hNews">📢 ข่าวประชาสัมพันธ์</h2><a href="index.html#announce" style="font-size:.9rem;font-weight:600">ดูข่าวทั้งหมด</a></div>';
  var pins=pinnedNews(), pinIds={};
  pins.forEach(function(n){
    pinIds[n.id]=true;
    var unread=!S.reads[n.id];
    h+='<article class="pin" data-pinid="'+esc(n.id)+'"><div class="acts" style="justify-content:space-between"><span class="badge p">📌 ข่าวสำคัญ</span>'+
      (unread?'<span class="badge" style="background:#FDEBEA;color:var(--danger)">ใหม่</span>':'')+'</div>'+
      '<h3 style="font-weight:500;font-size:1.1rem;margin-top:6px;line-height:1.4">'+esc(n.title)+'</h3>'+
      '<p class="nm">'+esc(n.creator_name||'')+(n.creator_name?' · ':'')+esc(thDate(tsToBkkDate(n.created_at)))+
      (n.pinned_until?' · ปักหมุดถึง '+esc(thDate(n.pinned_until)):'')+'</p>'+newsBody(n,true)+'</article>';
  });
  var rest=S.news.filter(function(n){return !pinIds[n.id];}).slice(0,NEWS_N);
  if(!rest.length&&!pins.length)return h+'<div class="empty">ยังไม่มีข่าวประชาสัมพันธ์</div>';
  h+='<div>';
  rest.forEach(function(n){
    var d=tsToBkkDate(n.created_at), p=parts(d), open=S.openNews===n.id, unread=!S.reads[n.id];
    h+='<div class="news-item"><button type="button" class="news-row" data-news="'+esc(n.id)+'" aria-expanded="'+open+'">'+
      '<span class="datebox"><b>'+p.d+'</b><span>'+MON[p.m-1]+'</span></span>'+
      '<span style="flex:1;min-width:0"><span class="nt">'+esc(n.title)+'</span>'+(unread?'<span class="dot" aria-hidden="true"></span><span class="sr">ยังไม่อ่าน</span>':'')+
      '<span class="nm" style="display:block">'+esc(n.creator_name||'')+(n.file_path?' · มีไฟล์แนบ':safeUrl(n.external_url)?' · มีลิงก์':'')+'</span></span></button>'+
      (open?newsBody(n,false):'')+'</div>';
  });
  return h+'</div>';
}
function renderUpcoming(){
  var h='<div class="panel-h"><h2 id="hUp">⏰ ใกล้ถึงแล้ว</h2>'+(S.staff?'<span class="chips"><button type="button" class="btn ghost sm" data-act="manage">📋 จัดการ</button><button type="button" class="btn primary sm" data-act="add">+ เพิ่มกำหนดการ</button></span>':'')+'</div>';
  var list=upcomingList().slice(0,UPCOMING_N);
  if(!list.length)return h+'<div class="empty">'+(S.filter==='all'?'ยังไม่มีกำหนดการที่กำลังจะถึง':'ยังไม่มีกำหนดการในหมวดนี้')+'</div>';
  list.forEach(function(e){
    var c=countInfo(e);
    h+='<button type="button" class="up cat-'+e.cat+'" data-ev="'+esc(e.id)+'"><span style="flex:1;min-width:0">'+
      '<span class="t">'+esc(e.title)+'</span><span class="s"><span class="badge cat">'+CAT_LABEL[e.cat]+'</span>'+esc(thRange(e.start,e.end))+'</span>'+
      (e.src?'<span class="s">'+esc(e.src)+'</span>':'')+'</span>'+
      '<span class="count'+(c.hot?' hot':'')+'">'+esc(c.label)+'</span></button>';
  });
  return h;
}
function eventsOn(d){return S.events.filter(function(e){return passFilter(e)&&e.start<=d&&e.end>=d;});}
function renderCalendar(){
  var y=S.ym.y, m=S.ym.m;
  var h='<div class="panel-h"><h2 id="hCal">🗓 ปฏิทินกำหนดการ</h2><div class="chips" role="group" aria-label="กรองตามหมวด">';
  [['all','ทั้งหมด'],['national','สอบระดับชาติ'],['tcas','TCAS'],['guidance','งานแนะแนว'],['other','อื่น ๆ']].forEach(function(f){
    h+='<button type="button" class="chip'+(S.filter===f[0]?' active':'')+'" data-filter="'+f[0]+'" aria-pressed="'+(S.filter===f[0])+'">'+f[1]+'</button>';
  });
  h+='</div></div>';
  h+='<div class="cal-nav"><button type="button" class="btn ghost" data-act="prev" aria-label="เดือนก่อน">‹ <span class="mob-hide">เดือนก่อน</span></button>'+
    '<span class="m">'+MONF[m-1]+' '+(y+543)+'</span>'+
    '<button type="button" class="btn ghost" data-act="next" aria-label="เดือนถัดไป"><span class="mob-hide">เดือนถัดไป</span> ›</button></div>';
  h+='<div class="cal"><div class="cal-row cal-dow">'+DOW.map(function(d){return '<span>'+d+'</span>';}).join('')+'</div>';
  var off=new Date(Date.UTC(y,m-1,1)).getUTCDay(), dim=new Date(Date.UTC(y,m,0)).getUTCDate();
  var total=Math.ceil((off+dim)/7)*7;
  for(var i=0;i<total;i++){
    if(i%7===0)h+='<div class="cal-row">';
    var dn=i-off+1;
    if(dn<1||dn>dim){h+='<span class="cell out" aria-hidden="true"></span>';}
    else{
      var d=ymd(y,m,dn), evs=eventsOn(d), cls='cell'+(d===S.today?' today':'')+(d===S.selDay?' sel':'');
      var inner='<span class="d">'+dn+'</span>', dots='';
      evs.forEach(function(e,k){
        dots+='<i class="cat-'+e.cat+'"></i>';
        if(k>=MAX_IN_CELL)return;
        /* สอบระดับชาติ: ขึ้นชื่อทุกวัน; หมวดอื่น: ขึ้นชื่อวันแรกกับวันสุดท้าย วันกลางเป็นแถบสีเปล่า */
        var head=e.cat==='national'||e.start===d||e.end===d;
        inner+=head?'<span class="ev cat-'+e.cat+'">'+esc(e.title)+'</span>':'<span class="ev cont cat-'+e.cat+'" title="'+esc(e.title)+'"></span>';
      });
      if(evs.length>MAX_IN_CELL)inner+='<span class="more">+'+(evs.length-MAX_IN_CELL)+' รายการ</span>';
      if(dots)inner+='<span class="dots">'+dots+'</span>';
      var lab=dn+' '+MONF[m-1]+(evs.length?' มี '+evs.length+' รายการ':'');
      h+='<button type="button" class="'+cls+'" data-day="'+d+'" aria-label="'+esc(lab)+'">'+inner+'</button>';
    }
    if(i%7===6)h+='</div>';
  }
  h+='</div>';
  h+='<div class="legend"><span class="cat-national"><i></i>สอบระดับชาติ (TGAT/TPAT, A-Level, O-NET)</span><span class="cat-tcas"><i></i>TCAS</span>'+
    '<span class="cat-guidance"><i></i>งานแนะแนว (ทุน โควตา ช้างเผือก)</span><span class="cat-other"><i></i>อื่น ๆ</span></div>';
  if(S.selDay){
    var list=eventsOn(S.selDay);
    h+='<div class="daybox"><h3>'+esc(thDate(S.selDay))+'</h3>';
    if(!list.length)h+='<p class="muted">ไม่มีกำหนดการในวันนี้</p>';
    list.forEach(function(e){
      h+='<button type="button" class="up cat-'+e.cat+'" data-ev="'+esc(e.id)+'"><span style="flex:1;min-width:0"><span class="t">'+esc(e.title)+'</span>'+
        '<span class="s"><span class="badge cat">'+CAT_LABEL[e.cat]+'</span>'+esc(thRange(e.start,e.end))+'</span></span></button>';
    });
    h+='</div>';
  }
  return h;
}
function renderShortcuts(){
  var role=S.staff||S.profile.role!=='student'?'staff':'student';
  var h='<div class="shortcuts">';
  SHORTCUTS.forEach(function(sc,i){
    var url=shortcutUrl(i);if(!url)return;
    h+='<a class="sc" style="--c:'+sc.c+'" href="'+esc(url)+'"><span class="ic" aria-hidden="true">'+sc.icon+'</span><span><b>'+sc.title+'</b><small>'+sc.sub[role]+'</small></span></a>';
  });
  h+='<a class="sc all" href="index.html#apps"><span class="ic" aria-hidden="true">📚</span><span><b>ระบบงานทั้งหมด</b><small>คลังแนะแนวและการ์ดทุกระบบ</small></span></a>';
  return h+'</div>';
}

/* ---------- รายละเอียดกำหนดการ ---------- */
function findEvent(id){for(var i=0;i<S.events.length;i++)if(S.events[i].id===id)return S.events[i];return null;}
function showEvent(id){
  var e=findEvent(id);if(!e)return;
  var c=countInfo(e);
  $('dtTitle').textContent=e.title;
  var b='<p><span class="badge cat cat-'+e.cat+'">'+CAT_LABEL[e.cat]+'</span></p>'+
    '<p><b>วันที่:</b> '+esc(thRange(e.start,e.end))+(e.end>=S.today?' <span class="count'+(c.hot?' hot':'')+'" style="margin-left:6px">'+esc(c.label)+'</span>':' <span class="muted">(ผ่านไปแล้ว)</span>')+'</p>';
  if(e.note)b+='<p>'+esc(e.note)+'</p>';
  if(e.src)b+='<p class="muted" style="font-size:.88rem">'+esc(e.src)+'</p>';
  $('dtBody').innerHTML=b;
  var f='';
  if(e.manual&&S.staff)f+='<button type="button" class="btn danger left" data-dact="del" data-id="'+esc(e.id)+'">ลบ</button><button type="button" class="btn ghost" data-dact="edit" data-id="'+esc(e.id)+'">แก้ไข</button>';
  if(e.link)f+='<a class="btn ghost" href="'+esc(e.link)+'"'+(e.manual?' target="_blank" rel="noopener"':'')+'>'+(e.manual?'🔗 เปิดลิงก์':'ไปที่ระบบ')+'</a>';
  f+='<button type="button" class="btn primary" data-dact="close">ปิด</button>';
  $('dtFoot').innerHTML=f;
  openModal('mdDetail');
}
$('dtFoot').addEventListener('click',async function(ev){
  var b=ev.target.closest('[data-dact]');if(!b)return;
  var a=b.getAttribute('data-dact'), id=b.getAttribute('data-id');
  if(a==='close'){closeModal('mdDetail');return;}
  if(a==='edit'){closeModal('mdDetail');openEventForm(id);return;}
  if(a==='del'){
    var e=findEvent(id);if(!e)return;
    if(!confirm('ลบกำหนดการ "'+e.title+'" ใช่ไหม?\nลบแล้วกู้คืนไม่ได้'))return;
    b.disabled=true;
    var r=await sb.from('calendar_events').delete().eq('id',id).select('id');
    b.disabled=false;
    if(r.error)return toast(thError(r.error),true);
    if(!r.data||!r.data.length)return toast('ลบไม่สำเร็จ อาจถูกลบไปแล้ว ลองโหลดหน้าใหม่',true);
    closeModal('mdDetail');toast('ลบกำหนดการแล้ว');
    await refreshEvents();
  }
});

/* ---------- จัดการกำหนดการ (ดูทั้งหมด / ลบทีละหลายรายการ) ---------- */
var MG={cat:'all',past:false,sel:{}};
function mgVisible(){
  return S.events.filter(function(e){
    return e.manual&&(MG.cat==='all'||e.cat===MG.cat)&&(MG.past||e.end>=S.today);
  }).sort(function(a,b){return a.start<b.start?-1:a.start>b.start?1:0;});
}
function openManage(){MG.sel={};MG.cat='all';MG.past=false;$('mgPast').checked=false;$('mgAll').checked=false;renderManage();openModal('mdManage');}
function renderManage(){
  var cs=[['all','ทั้งหมด'],['national','สอบระดับชาติ'],['tcas','TCAS'],['guidance','งานแนะแนว'],['other','อื่น ๆ']];
  $('mgChips').innerHTML=cs.map(function(c){return '<button type="button" class="chip'+(MG.cat===c[0]?' active':'')+'" data-mgcat="'+c[0]+'">'+c[1]+'</button>';}).join('');
  var list=mgVisible(), h='';
  if(!list.length)h='<div class="empty">ไม่มีกำหนดการที่ครูเพิ่มเองในหมวดนี้</div>';
  list.forEach(function(e){
    h+='<div class="mg-row cat-'+e.cat+(e.end<S.today?' past':'')+'"><input type="checkbox" data-mgsel="'+esc(e.id)+'" aria-label="เลือก '+esc(e.title)+'"'+(MG.sel[e.id]?' checked':'')+'>'+
      '<div class="mt">'+esc(e.title)+'<div class="ms"><span class="badge cat">'+CAT_LABEL[e.cat]+'</span> '+esc(thRange(e.start,e.end))+(e.end<S.today?' · ผ่านไปแล้ว':'')+'</div></div>'+
      '<button type="button" class="btn ghost sm" data-mgedit="'+esc(e.id)+'">แก้ไข</button>'+
      '<button type="button" class="btn danger sm" data-mgone="'+esc(e.id)+'">ลบ</button></div>';
  });
  $('mgList').innerHTML=h;
  var n=Object.keys(MG.sel).length;
  $('mgDel').disabled=!n;$('mgDel').textContent=n?'ลบที่เลือก ('+n+')':'ลบที่เลือก';
  $('mgNote').textContent='แสดง '+list.length+' รายการ · รายการเปิดรับสมัครทุน/โควตาที่ระบบใส่ให้เอง ลบที่นี่ไม่ได้ (ไปแก้ที่หน้าทุน/โควตา)';
}
async function mgDelete(ids){
  if(!ids.length)return;
  var names=ids.map(function(id){var e=findEvent(id);return e?'• '+e.title:'';}).filter(Boolean);
  var msg=ids.length===1?'ลบกำหนดการ "'+(findEvent(ids[0])||{}).title+'" ใช่ไหม?':'ลบกำหนดการ '+ids.length+' รายการนี้ใช่ไหม?\n'+names.slice(0,8).join('\n')+(names.length>8?'\n… และอีก '+(names.length-8)+' รายการ':'');
  if(!confirm(msg+'\nลบแล้วกู้คืนไม่ได้'))return;
  $('mgDel').disabled=true;
  var r=await sb.from('calendar_events').delete().in('id',ids).select('id');
  if(r.error){renderManage();return toast(thError(r.error),true);}
  var done=(r.data||[]).length;
  ids.forEach(function(id){delete MG.sel[id];});
  toast(done===ids.length?'ลบกำหนดการแล้ว '+done+' รายการ':'ลบได้ '+done+' จาก '+ids.length+' รายการ ลองโหลดหน้าใหม่',done!==ids.length);
  await refreshEvents();renderManage();
}
$('mgChips').addEventListener('click',function(ev){var b=ev.target.closest('[data-mgcat]');if(!b)return;MG.cat=b.getAttribute('data-mgcat');$('mgAll').checked=false;renderManage();});
$('mgPast').onchange=function(){MG.past=this.checked;$('mgAll').checked=false;renderManage();};
$('mgAll').onchange=function(){var on=this.checked;mgVisible().forEach(function(e){if(on)MG.sel[e.id]=true;else delete MG.sel[e.id];});renderManage();};
$('mgList').addEventListener('click',function(ev){
  var one=ev.target.closest('[data-mgone]'),ed=ev.target.closest('[data-mgedit]'),cb=ev.target.closest('[data-mgsel]');
  if(one)mgDelete([one.getAttribute('data-mgone')]);
  else if(ed){closeModal('mdManage');openEventForm(ed.getAttribute('data-mgedit'));}
  else if(cb){var id=cb.getAttribute('data-mgsel');if(cb.checked)MG.sel[id]=true;else delete MG.sel[id];renderManage();}
});
$('mgDel').onclick=function(){mgDelete(Object.keys(MG.sel));};
$('mgClose').onclick=function(){closeModal('mdManage');};

/* ---------- ฟอร์มกำหนดการ ---------- */
function setCat(c){S.editCat=c;Array.prototype.forEach.call($('evCat').querySelectorAll('button'),function(b){var on=b.getAttribute('data-cat')===c;b.classList.toggle('active',on);b.setAttribute('aria-pressed',on);});}
$('evCat').addEventListener('click',function(ev){var b=ev.target.closest('[data-cat]');if(b)setCat(b.getAttribute('data-cat'));});
function openEventForm(id){
  var e=id?findEvent(id):null;
  S.editId=e?e.id:null;
  $('evHead').textContent=e?'🗓 แก้ไขกำหนดการ':'🗓 เพิ่มกำหนดการ';
  $('evTitle').value=e?e.title:'';
  setCat(e?e.cat:(S.filter!=='all'?S.filter:'national'));
  $('evStart').value=e?e.start:(S.selDay||'');
  $('evEnd').value=e&&e.end!==e.start?e.end:'';
  $('evLink').value=e?e.link:'';
  $('evNote').value=e?e.note:'';
  showMsg('evMsg','');
  openModal('mdEvent');
  setTimeout(function(){$('evTitle').focus();},30);
}
$('evCancel').onclick=function(){closeModal('mdEvent');};
$('evSave').onclick=async function(){
  var title=$('evTitle').value.replace(/\s+/g,' ').trim(), st=$('evStart').value, en=$('evEnd').value;
  var link=$('evLink').value.trim(), note=$('evNote').value.trim();
  if(!title)return showMsg('evMsg','กรอกชื่อกำหนดการก่อนนะคะ');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(st))return showMsg('evMsg','เลือกวันเริ่มก่อนนะคะ');
  if(en&&!/^\d{4}-\d{2}-\d{2}$/.test(en))return showMsg('evMsg','วันสิ้นสุดไม่ถูกต้อง');
  if(en&&en<st)return showMsg('evMsg','วันสิ้นสุดต้องไม่ก่อนวันเริ่ม');
  if(en===st)en='';
  if(link&&!/^https?:\/\//i.test(link)){
    if(/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(link))link='https://'+link;
    else return showMsg('evMsg','ลิงก์ต้องขึ้นต้นด้วย https://');
  }
  var py=+st.slice(0,4);
  if(py<2000||py>2100)return showMsg('evMsg','ปีไม่ถูกต้อง ให้เลือกวันที่จากปฏิทิน (ระบบใช้ ค.ศ. ในช่องนี้)');
  var row={title:title,category:S.editCat,start_date:st,end_date:en||null,link_url:link||null,note:note||null};
  var btn=$('evSave');btn.disabled=true;showMsg('evMsg','');
  var r=S.editId?await sb.from('calendar_events').update(row).eq('id',S.editId).select('id')
    :await sb.from('calendar_events').insert(row).select('id');
  btn.disabled=false;
  if(r.error)return showMsg('evMsg',thError(r.error));
  if(!r.data||!r.data.length)return showMsg('evMsg','บันทึกไม่สำเร็จ ไม่มีสิทธิ์หรือรายการถูกลบไปแล้ว');
  closeModal('mdEvent');
  toast(S.editId?'แก้ไขกำหนดการแล้ว':'เพิ่มกำหนดการแล้ว');
  var sp=parts(st);S.ym={y:sp.y,m:sp.m};S.selDay=st;
  await refreshEvents();
};
async function refreshEvents(){
  try{await loadEvents();S.loadErr='';}catch(e){S.loadErr='โหลดกำหนดการไม่สำเร็จ: '+thError(e);}
  render();
}

/* ---------- ข่าว ---------- */
async function markRead(id){
  if(S.reads[id])return;
  S.reads[id]=true;
  var r=await sb.from('announcement_reads').insert({profile_id:S.user.id,announcement_id:id});
  if(r.error&&r.error.code!=='23505'){delete S.reads[id];render();}
}
function findNews(id){for(var i=0;i<S.news.length;i++)if(S.news[i].id===id)return S.news[i];return null;}
async function openAttach(id,btn){
  var n=findNews(id);if(!n||!n.file_path)return;
  btn.disabled=true;
  var r=await sb.storage.from('announcements').createSignedUrl(n.file_path,3600,{download:n.file_name||true});
  btn.disabled=false;
  if(r.error)return toast('เปิดไฟล์แนบไม่สำเร็จ ลองใหม่อีกครั้ง',true);
  window.open(r.data.signedUrl,'_blank');
  markRead(id);
}
function openPin(id){
  var n=findNews(id);if(!n)return;
  S.pinId=id;$('pinNews').textContent=n.title;$('pinUntil').value='';$('pinUntil').min=S.today;showMsg('pinMsg','');
  openModal('mdPin');
}
$('pinCancel').onclick=function(){closeModal('mdPin');};
$('pinSave').onclick=async function(){
  var u=$('pinUntil').value;
  if(u&&u<S.today)return showMsg('pinMsg','วันที่ต้องไม่ก่อนวันนี้');
  await setPin(S.pinId,true,u||null,$('pinSave'));
};
async function setPin(id,on,until,btn){
  if(btn)btn.disabled=true;
  var r=await sb.from('announcements').update({is_pinned:on,pinned_until:on?until:null}).eq('id',id).select('id,is_pinned,pinned_until');
  if(btn)btn.disabled=false;
  if(r.error||!r.data||!r.data.length){
    var m=r.error?thError(r.error):'ปักหมุดได้เฉพาะข่าวของตัวเอง (ผู้ดูแลระบบปักได้ทุกข่าว)';
    if(on)showMsg('pinMsg',m);else toast(m,true);
    return;
  }
  var n=findNews(id);if(n){n.is_pinned=r.data[0].is_pinned;n.pinned_until=r.data[0].pinned_until;}
  closeModal('mdPin');toast(on?'ปักหมุดข่าวแล้ว':'เลิกปักหมุดแล้ว');render();
}

/* ---------- จับคลิกในหน้า ---------- */
$('root').addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act],[data-filter],[data-day],[data-ev],[data-news],[data-att],[data-pin],[data-unpin]');
  if(!el)return;
  if(el.hasAttribute('data-act')){
    var a=el.getAttribute('data-act');
    if(a==='add')openEventForm(null);
    else if(a==='manage')openManage();
    else if(a==='reload')location.reload();
    else if(a==='prev'||a==='next'){
      var y=S.ym.y,m=S.ym.m+(a==='next'?1:-1);
      if(m<1){m=12;y--;}if(m>12){m=1;y++;}
      S.ym={y:y,m:m};S.selDay=null;render();
    }
    return;
  }
  if(el.hasAttribute('data-filter')){S.filter=el.getAttribute('data-filter');render();return;}
  if(el.hasAttribute('data-day')){var d=el.getAttribute('data-day');S.selDay=S.selDay===d?null:d;render();return;}
  if(el.hasAttribute('data-ev')){showEvent(el.getAttribute('data-ev'));return;}
  if(el.hasAttribute('data-att')){openAttach(el.getAttribute('data-att'),el);return;}
  if(el.hasAttribute('data-pin')){openPin(el.getAttribute('data-pin'));return;}
  if(el.hasAttribute('data-unpin')){if(confirm('เลิกปักหมุดข่าวนี้ใช่ไหม?'))setPin(el.getAttribute('data-unpin'),false,null,el);return;}
  if(el.hasAttribute('data-news')){
    var id=el.getAttribute('data-news');
    S.openNews=S.openNews===id?null:id;
    if(S.openNews)markRead(id);
    render();
  }
});
/* ข่าวปักหมุด: เห็นทั้งข่าวแล้ว นับว่าอ่าน เมื่อแตะการ์ด */
$('root').addEventListener('click',function(ev){
  var pin=ev.target.closest('.pin');if(!pin||ev.target.closest('button,a'))return;
  var id=pin.getAttribute('data-pinid');
  if(id&&!S.reads[id]){markRead(id).then(render);}
});
document.addEventListener('keydown',function(ev){
  if(ev.key!=='Escape')return;
  if($('mdDetail').classList.contains('show'))closeModal('mdDetail');
  if($('mdPin').classList.contains('show'))closeModal('mdPin');
  if($('mdManage').classList.contains('show'))closeModal('mdManage');
});

/* ---------- เริ่มต้น ---------- */
function screen(html){$('root').innerHTML='<div class="screen">'+html+'</div>';}
async function init(){
  try{ sessionStorage.setItem('pcw_home_seen','1'); }catch(e){}
  try{
    var ses=await sb.auth.getSession();
    if(!ses.data.session){location.replace('index.html');return;}
    S.user=ses.data.session.user;
    var p=await sb.from('profiles').select('id,display_name,role,is_guidance,class_room,menu_permissions').eq('id',S.user.id).maybeSingle();
    if(p.error)throw p.error;
    if(!p.data){screen('<h1 style="color:var(--pine-deep)">ไม่พบข้อมูลผู้ใช้</h1><p class="muted">กรุณาติดต่อผู้ดูแลระบบ</p><a class="btn primary" href="index.html">กลับหน้าเข้าสู่ระบบ</a>');return;}
    S.profile=p.data;
    S.staff=p.data.role==='admin'||(p.data.role==='teacher'&&!!p.data.is_guidance);
    $('uName').textContent=p.data.display_name||'';
    $('uRole').textContent=S.staff&&p.data.role==='teacher'?'ครูแนะแนว':(ROLE_LABEL[p.data.role]||'')+(p.data.role==='student'&&p.data.class_room?' · '+p.data.class_room:'');
    $('uChip').classList.remove('hidden');$('btnLogout').classList.remove('hidden');
    S.today=bkkToday();
    var tp=parts(S.today);S.ym={y:tp.y,m:tp.m};
    var errs=[];
    try{await loadApps();}catch(e){errs.push('ทางลัด');}
    var r=await Promise.all([
      loadNews().then(function(){return null;},function(){return 'ข่าว';}),
      loadEvents().then(function(){return null;},function(){return 'กำหนดการ';})
    ]);
    r.forEach(function(x){if(x)errs.push(x);});
    if(errs.length)S.loadErr='โหลด'+errs.join(' / ')+'ไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่';
    render();
    sb.auth.onAuthStateChange(function(evt){if(evt==='SIGNED_OUT')location.replace('index.html');});
  }catch(e){
    screen('<h1 style="color:var(--pine-deep)">เปิดหน้านี้ไม่สำเร็จ</h1><p class="muted">'+esc(thError(e))+'</p><button type="button" class="btn primary" onclick="location.reload()">ลองใหม่</button><a href="index.html">ไปหน้าคลังแนะแนว</a>');
  }
}
$('btnLogout').onclick=async function(){this.disabled=true;await sb.auth.signOut();location.replace('index.html');};
init();
})();
</script>
</body>
</html>
