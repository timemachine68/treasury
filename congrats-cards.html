<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ตรวจการ์ดแสดงความยินดี | แนะให้แนว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="congrats-card-draw.js"></script>
<script src="card-photo-fx.js"></script>
<style>
:root{
  --ink:#22313A; --ink-soft:#5B6B72; --board:#EFF3F1; --card:#FFFFFF;
  --pine:#0F6B5C; --pine-deep:#0A4F44; --pine-tint:#E2F0EC;
  --note:#FFD34D; --note-deep:#8A6D00; --line:#DCE4E1; --danger:#C0392B;
  --radius:14px; --shadow:0 2px 10px rgba(34,49,58,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:var(--board);color:var(--ink);font-size:16px;line-height:1.55;min-height:100vh}
h1,h2,h3,.brand{font-family:'Mitr',sans-serif;font-weight:600}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:16px}
:focus-visible{outline:3px solid var(--note);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.app{background:var(--pine);color:#fff;padding:14px 0}
header.app .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-size:1.15rem;display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--note);color:var(--pine-deep);display:grid;place-items:center;flex:none}
.brand small{display:block;font-family:'Sarabun';font-weight:400;font-size:.72rem;opacity:.85}
.spacer{flex:1}
.iconbtn{background:rgba(255,255,255,.14);border:none;color:#fff;border-radius:999px;padding:7px 14px;font-size:.85rem;text-decoration:none}
main.wrap{padding:16px 16px 110px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:600;font-size:.9rem}
.chip.active{background:var(--pine);border-color:var(--pine);color:#fff}
select.sel{min-height:40px;border-radius:999px;border:1.5px solid var(--line);padding:0 12px;background:#fff;font-size:.95rem;max-width:100%}
.btn{border:none;border-radius:9px;padding:9px 14px;font-size:.92rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:44px}
.btn.primary{background:var(--pine);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.note{background:var(--note);color:var(--ink);font-weight:700}
.btn.danger{background:#fff;border:1px solid #EAC7C2;color:var(--danger)}
.btn.redfill{background:var(--danger);color:#fff}
.btn.sm{min-height:36px;padding:4px 10px;font-size:.84rem}
.btn:disabled{opacity:.55;cursor:not-allowed}
.info{background:#fff;border-radius:12px;padding:10px 14px;font-size:.9rem;color:var(--ink-soft);margin-bottom:14px}
.info b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:10px;border:2px solid transparent}
.tile.sel{border-color:var(--pine)}
.tile .head{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--ink-soft)}
.tile .head input{width:22px;height:22px;accent-color:var(--pine)}
.tile .head b{color:var(--ink);font-weight:600}
.tile canvas{width:100%;height:auto;border-radius:8px;background:var(--board);display:block;cursor:zoom-in;aspect-ratio:4/5}
.changed{background:#FFF6D6;color:var(--note-deep);border-radius:9px;padding:6px 10px;font-size:.84rem;font-weight:600}
.retnote{background:#FBEAE7;color:var(--danger);border-radius:9px;padding:6px 10px;font-size:.84rem}
.okline{background:var(--pine-tint);color:var(--pine-deep);border-radius:9px;padding:6px 10px;font-size:.84rem;font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1 1 90px}
.dock{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 0;z-index:20}
.dock .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-back.show{display:flex}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:20px}
.modal h2{color:var(--pine-deep);font-size:1.1rem;margin-bottom:10px}
.modal canvas{width:100%;height:auto;border-radius:10px;display:block;margin:8px 0}
.field input{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;margin-top:8px}
.msg{border-radius:10px;padding:10px 13px;font-size:.88rem;margin-top:10px;display:none}
.msg.err{display:block;background:#FBEAE7;color:var(--danger)}
.msg.ok{display:block;background:var(--pine-tint);color:var(--pine-deep)}
.empty{padding:50px 16px;text-align:center;color:var(--ink-soft);grid-column:1/-1}
.hint{font-size:.84rem;color:var(--ink-soft)}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;max-width:92vw;text-align:center}
#toast.show{opacity:1}
.hidden{display:none!important}
.modal.wide{max-width:1000px}
@media (min-width:780px){
  .vgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
  .vleft{position:sticky;top:0}
  .vright .fxpanel{margin-top:8px}
  #viewCv{max-height:calc(92vh - 130px);width:auto;max-width:100%;margin:8px auto}
}
.fxline{font-size:.8rem;color:var(--ink-soft);min-height:1.2em}
.fxline.warn{color:var(--note-deep);font-weight:600}
.fxline.done{color:var(--pine-deep);font-weight:600}
.fxpanel{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;background:#FAFCFB}
.fxpanel h3{font-size:.98rem;color:var(--pine-deep);margin-bottom:6px}
.fxrow{display:grid;grid-template-columns:118px 1fr 44px;align-items:center;gap:8px;font-size:.88rem;margin:6px 0}
.fxrow input[type=range]{width:100%;accent-color:var(--pine);min-height:30px}
.fxrow output{text-align:right;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.fxbg{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.fxbg .chip{min-height:36px;font-size:.84rem}
.fxbg .chip:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<header class="app"><div class="wrap">
  <div class="brand"><span class="logo">🎉</span><span>ตรวจการ์ดแสดงความยินดี ม.6<small>แนะให้แนว · พูลเจริญวิทยาคม</small></span></div>
  <div class="spacer"></div>
  <a class="iconbtn" href="survey-results.html">📊 ผลสำรวจ</a>
  <a class="iconbtn" href="index.html#survey">🏠 หน้าหลัก</a>
</div></header>

<main class="wrap" id="main"><div class="empty">กำลังโหลด…</div></main>

<div class="dock hidden" id="dock"><div class="wrap">
  <label style="display:flex;align-items:center;gap:8px;font-weight:600"><input type="checkbox" id="selAll" style="width:22px;height:22px;accent-color:var(--pine)">เลือกทั้งหมดในหน้านี้</label>
  <span id="selCount" class="hint"></span>
  <span class="spacer"></span>
  <button class="btn danger" id="btnReturnSel">ส่งกลับให้แก้</button>
  <button class="btn note" id="btnApproveSel">อนุมัติทั้งหมดที่เลือก</button>
</div></div>

<div class="modal-back" id="viewModal"><div class="modal wide">
  <h2 id="viewTitle">การ์ด</h2>
  <div class="vgrid"><div class="vleft">
  <canvas id="viewCv"></canvas>
  <div class="bar" style="margin:8px 0 0">
    <span class="hint">ขนาด</span>
    <button class="chip active" data-r="4:5">แนวตั้ง 4:5</button><button class="chip" data-r="1:1">จัตุรัส 1:1</button><button class="chip" data-r="9:16">สตอรี่ 9:16</button>
  </div>
  </div><div class="vright">
  <div class="fxpanel" id="fxPanel">
    <h3>ปรับรูป</h3>
    <label style="display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:600"><input type="checkbox" id="fxAuto" style="width:20px;height:20px;accent-color:var(--pine)"> ปรับแสงและสีอัตโนมัติ</label>
    <div class="fxbg"><span class="hint">พื้นหลัง</span>
      <button class="chip" data-bg="auto">✨ ให้ระบบเลือก</button><button class="chip" data-bg="keep">เดิม</button><button class="chip" data-bg="studio">ฉากสตูดิโอ</button><button class="chip" data-bg="blur">เบลอของเดิม</button><button class="chip" data-bg="uni">สีมหาวิทยาลัย</button><button class="chip" data-bg="white">ขาวสะอาด</button>
    </div>
    <div class="fxrow"><label for="fxZoom">ขนาดหน้า</label><input type="range" id="fxZoom" min="50" max="200" step="5"><output id="oZoom"></output></div>
    <div class="fxrow"><label for="fxDx">เลื่อนซ้าย-ขวา</label><input type="range" id="fxDx" min="-35" max="35" step="1"><output id="oDx"></output></div>
    <div class="fxrow"><label for="fxDy">เลื่อนขึ้น-ลง</label><input type="range" id="fxDy" min="-35" max="35" step="1"><output id="oDy"></output></div>
    <div class="fxrow"><label for="fxBright">ความสว่าง</label><input type="range" id="fxBright" min="-40" max="40" step="1"><output id="oBright"></output></div>
    <div class="fxrow"><label for="fxContrast">ความคมชัด</label><input type="range" id="fxContrast" min="-40" max="40" step="1"><output id="oContrast"></output></div>
    <p class="hint" id="fxHint"></p>
    <div class="acts" style="margin-top:8px">
      <button class="btn ghost sm" id="btnFxReset">คืนค่าอัตโนมัติ</button>
      <button class="btn primary sm" id="btnFxSave">บันทึกรูปนี้</button>
    </div>
  </div>
  <div class="acts" style="margin-top:12px">
    <button class="btn ghost" id="btnViewClose">ปิด</button>
    <button class="btn ghost" id="btnViewPhoto">ดูรูปต้นฉบับ</button>
    <button class="btn primary" id="btnViewDl">ดาวน์โหลด (PNG)</button>
  </div>
  <button class="btn danger" id="btnWithdraw" style="width:100%;margin-top:10px">ถอนความยินดี: นักเรียนไม่ยินยอมแล้ว</button>
  </div></div>
</div></div>

<div class="modal-back" id="retModal"><div class="modal">
  <h2>ส่งกลับให้แก้ — บอกนักเรียนว่าต้องแก้อะไร</h2>
  <p class="hint" id="retWho"></p>
  <div class="bar" style="margin-top:10px" id="retChips">
    <button class="chip" data-reason="รูปไม่เห็นหน้าชัด">รูปไม่เห็นหน้าชัด</button>
    <button class="chip" data-reason="รูปไม่เหมาะสม ขอรูปหน้าตรงชุดนักเรียน">รูปไม่เหมาะสม</button>
    <button class="chip" data-reason="ชื่อคณะ/สาขาไม่ถูกต้อง">ชื่อคณะ/สาขาไม่ถูก</button>
    <button class="chip" data-reason="ชื่อมหาวิทยาลัยไม่ถูกต้อง">ชื่อมหาวิทยาลัยไม่ถูก</button>
  </div>
  <div class="field"><input id="retNote" maxlength="300" placeholder="ข้อความถึงนักเรียน (เลือกด้านบน หรือพิมพ์เอง)"></div>
  <div id="retMsg" class="msg"></div>
  <div class="acts" style="margin-top:12px">
    <button class="btn ghost" id="btnRetCancel">ยกเลิก</button>
    <button class="btn redfill" id="btnRetSend">ส่งกลับ</button>
  </div>
</div></div>
<div id="toast"></div>

<script>
const SUPABASE_URL = "https://ikkhjslmtjwrxzxvtokb.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlra2hqc2xtdGp3cnh6eHZ0b2tiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NDMzNjksImV4cCI6MjA5OTMxOTM2OX0.3OR_9mEv82Ns1LLjx5nnRwJYzrtKFtWCWd1bPuQfNKU";
const sb = supabase.createClient(SUPABASE_URL, ANON_KEY);
const PAGE = 1000, SHOW = 60;
const TABS = [["pending","รอตรวจ"],["changed","มีการเปลี่ยน"],["approved","อนุมัติแล้ว"],["returned","ส่งกลับให้แก้"]];

let profile=null, rounds=[], round=null, items=[], tab="pending", room="all", sel=new Set(), photoCache={}, viewing=null, viewRatio="4:5", retIds=[];
let fxRows={}, autoFxCache={}, maskCache={}, editFx=null, editMask=null, editPrep=null, editPrepKey="";

const $ = id => document.getElementById(id);
const esc = s => (s??"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){ $("toast").textContent=t; $("toast").classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>$("toast").classList.remove("show"),2800); }
function roomCmp(a,b){ const x=String(a||"").match(/\d+/g)||[], y=String(b||"").match(/\d+/g)||[]; for(let i=0;i<3;i++){ const d=(+x[i]||0)-(+y[i]||0); if(d) return d; } return 0; }
async function fetchAllRows(build){
  const all=[]; let from=0;
  for(;;){
    const r = await build().range(from, from+PAGE-1);
    if(r.error) return {data:all, error:r.error};
    all.push(...(r.data||[]));
    if(!r.data || r.data.length<PAGE) break;
    from += PAGE;
  }
  return {data:all, error:null};
}
function gate(t){ $("main").innerHTML = `<div class="empty"><p style="font-size:2.2rem">🔒</p><p>${esc(t)}</p></div>`; }

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return gate("กรุณาเข้าสู่ระบบที่หน้าหลักก่อน แล้วกลับมาเปิดหน้านี้อีกครั้ง");
  const {data:p} = await sb.from("profiles").select("id,display_name,role,is_guidance").eq("id", session.user.id).maybeSingle();
  profile = p;
  if(!(p && (p.role==="admin" || (p.role==="teacher" && p.is_guidance===true)))) return gate("หน้านี้สำหรับครูแนะแนวและผู้ดูแลระบบ");
  const {data, error} = await sb.from("survey_rounds").select("*").eq("grade","ม.6").order("created_at",{ascending:false});
  if(error) return gate("โหลดรอบสำรวจไม่สำเร็จ: "+error.message);
  rounds = data||[];
  if(!rounds.length) return gate("ยังไม่มีรอบสำรวจ ม.6");
  await PCWCard.fontsReady();
  try{ PCWPhoto.preload(false); }catch(e){}
  await pickRound(rounds[0].id);
}

async function pickRound(id){
  round = rounds.find(r=>r.id===id); sel.clear(); room="all";
  $("main").innerHTML = `<div class="empty">กำลังโหลด…</div>`;
  const [rs, ad] = await Promise.all([
    fetchAllRows(()=> sb.from("survey_responses").select("id,student_id,status,photo_path,photo_consent,card_status,card_note,card_changed,card_snapshot,card_reviewed_at").eq("round_id", round.id).order("id")),
    fetchAllRows(()=> sb.from("survey_admissions").select("id,response_id,institution,campus,faculty,major,admit_round,is_chosen,survey_responses!inner(round_id)").eq("survey_responses.round_id", round.id).order("id"))
  ]);
  if(rs.error || ad.error) return gate("โหลดข้อมูลไม่สำเร็จ: "+(rs.error||ad.error).message);
  const fxr = await fetchAllRows(()=> sb.from("survey_card_photo_fx").select("response_id,photo_path,fx,mask_path,updated_at,survey_responses!inner(round_id)").eq("survey_responses.round_id", round.id).order("response_id"));
  fxRows = {}; (fxr.data||[]).forEach(f=>{ delete f.survey_responses; fxRows[f.response_id] = f; });
  const ids = [...new Set(rs.data.map(r=>r.student_id))], pmap = {};
  for(let i=0;i<ids.length;i+=150){
    const chunk = ids.slice(i,i+150);
    const pr = await fetchAllRows(()=> sb.from("profiles").select("id,username,display_name,class_room").in("id", chunk).order("id"));
    if(pr.error) return gate("โหลดรายชื่อไม่สำเร็จ: "+pr.error.message);
    pr.data.forEach(p=> pmap[p.id]=p);
  }
  const amap = {}; ad.data.forEach(a=> (amap[a.response_id]=amap[a.response_id]||[]).push(a));
  items = rs.data.map(r=>{
    const p = pmap[r.student_id]||{}, list = amap[r.id]||[], c = list.find(a=>a.is_chosen)||null;
    return { id:r.id, r, p, chosen:c, hasAdm:list.length>0, cls:p.class_room||"", name:p.display_name||"", username:p.username||"" };
  });
  render();
}

function tabOf(x){
  const s = x.r.card_status;
  if(s==="pending") return x.r.card_changed? "changed" : "pending";
  return s;   // approved / returned / null
}
function render(){
  const inRoom = items.filter(x=> room==="all" || x.cls===room);
  const counts = {}; inRoom.forEach(x=>{ const t=tabOf(x); if(t) counts[t]=(counts[t]||0)+1; });
  const study = inRoom.filter(x=> x.r.status==="มหาวิทยาลัย" || x.r.status==="ปวส./ปวช.ต่อเนื่อง" || x.hasAdm);
  const noConsent = study.filter(x=> !x.r.photo_consent).length;
  const noPhoto = study.filter(x=> x.r.photo_consent && !x.r.photo_path).length;
  const noChoice = study.filter(x=> x.r.photo_consent && x.r.photo_path && !x.chosen).length;
  const rooms = ["all", ...[...new Set(items.map(x=>x.cls).filter(Boolean))].sort(roomCmp)];
  let list = inRoom.filter(x=> tabOf(x)===tab);
  list.sort((a,b)=> roomCmp(a.cls,b.cls) || a.username.localeCompare(b.username));
  const shown = list.slice(0, SHOW*pageN);
  const canSelect = tab!=="approved";

  $("main").innerHTML = `
  <div class="bar">
    <select class="sel" id="selRound" aria-label="รอบสำรวจ">${rounds.map(r=>`<option value="${r.id}" ${r.id===round.id?"selected":""}>${esc(r.title)}${r.academic_year?" ("+esc(r.academic_year)+")":""}</option>`).join("")}</select>
    <select class="sel" id="selRoom" aria-label="ห้อง">${rooms.map(x=>`<option value="${esc(x)}" ${x===room?"selected":""}>${x==="all"?"ทุกห้อง":esc(x)}</option>`).join("")}</select>
    <span class="spacer"></span>
    <button class="btn ghost" id="btnZip" ${counts.approved?"":"disabled"}>⬇️ ดาวน์โหลดการ์ดที่อนุมัติแล้ว (ZIP)</button>
  </div>
  ${round.allow_photo? "" : `<div class="info" style="background:#FFF6D6;color:var(--note-deep)">รอบนี้ยังไม่เปิดให้นักเรียนแนบรูป นักเรียนจึงยังไม่เห็นส่วนการ์ด — เปิดได้ที่หน้า <a href="survey-results.html?round=${round.id}">ผลสำรวจ</a></div>`}
  <div class="bar">${TABS.map(([k,l])=>`<button class="chip ${tab===k?"active":""}" data-tab="${k}">${l} ${counts[k]||0}</button>`).join("")}</div>
  <p class="info">ยังทำการ์ดไม่ได้: ไม่ยินยอม <b>${noConsent}</b> คน · ยินยอมแต่ยังไม่มีรูป <b>${noPhoto}</b> คน · ยังไม่เลือกที่เรียน <b>${noChoice}</b> คน</p>
  <div class="grid" id="grid">
    ${shown.map(tileHtml).join("") || `<div class="empty">ไม่มีการ์ดในแท็บนี้</div>`}
  </div>
  ${list.length>shown.length? `<div style="text-align:center;margin-top:16px"><button class="btn ghost" id="btnMore">ดูเพิ่มอีก (เหลือ ${list.length-shown.length} คน)</button></div>`:""}
  <div id="zipMsg" class="msg"></div>`;

  $("selRound").onchange = e=> pickRound(e.target.value);
  $("selRoom").onchange = e=>{ room=e.target.value; sel.clear(); pageN=1; render(); };
  document.querySelectorAll("[data-tab]").forEach(b=> b.onclick=()=>{ tab=b.dataset.tab; sel.clear(); pageN=1; render(); });
  if($("btnMore")) $("btnMore").onclick = ()=>{ pageN++; render(); };
  $("btnZip").onclick = zipApproved;
  document.querySelectorAll("[data-sel]").forEach(c=> c.onchange=()=>{ c.checked? sel.add(c.dataset.sel) : sel.delete(c.dataset.sel); c.closest(".tile").classList.toggle("sel", c.checked); dock(shown); });

  document.querySelectorAll("[data-ret]").forEach(b=> b.onclick=()=> openReturn([b.dataset.ret]));
  document.querySelectorAll("[data-view]").forEach(c=> c.onclick=()=> openView(c.dataset.view));
  dock(shown, canSelect);
  lazyDraw();
}
let pageN = 1;

function tileHtml(x){

    <div class="fxline" data-fxline="${x.id}"></div>
    <div class="acts">
      ${t!=="approved"? `<button class="btn primary sm" data-ok="${x.id}">อนุมัติ</button>`:""}
      <button class="btn danger sm" data-ret="${x.id}">ส่งกลับให้แก้</button>

function dock(shown, canSelect=true){

  $("dock").classList.toggle("hidden", !(canSelect && shown.length));
  $("selCount").textContent = n? `เลือกแล้ว ${n} คน` : "ยังไม่ได้เลือก";

$("btnReturnSel").onclick = ()=> openReturn([...sel]);

/* ── วาดการ์ด ── */
function cardData(x){
  const c = x.chosen||{};
  return { name:x.name, cls:x.cls, inst:c.institution||"", campus:c.campus||"", prog:[c.faculty,c.major].filter(Boolean).join(" ")||" ", round:PCWCard.roundShort(c.admit_round), photo: photoCache[x.r.photo_path]||null };
}
/* ── ปรับรูป: ค่าที่ครูบันทึกไว้ (ถ้ายังเป็นรูปเดิม) หรือค่าอัตโนมัติ ── */
function savedFx(x){ const r = fxRows[x.id]; return r && r.photo_path === x.r.photo_path ? r : null; }
async function getFx(x){
  const s = savedFx(x); if(s) return s.fx;
  const img = await loadPhoto(x.r.photo_path); if(!img) return null;
  const key = x.r.photo_path;
  if(!autoFxCache[key]) autoFxCache[key] = PCWPhoto.autoFx(img).catch(()=> ({v:1, auto:false, face:null, zoom:1, dx:0, dy:0, bright:0, contrast:0, bg:"keep", noFace:true}));
  return autoFxCache[key];
}
async function loadMask(path){
  if(!path) return null;
  if(maskCache[path] !== undefined) return maskCache[path];
  maskCache[path] = null;
  const {data} = await sb.storage.from("survey-photos").download(path);
  if(!data) return null;
  const img = await new Promise(ok=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>ok(null); i.src=URL.createObjectURL(data); });
  maskCache[path] = img; return img;
}
// การ์ดพร้อมรูปที่ปรับแล้ว (maxSide เล็กสำหรับรูปย่อ เพื่อประหยัดหน่วยความจำ)
async function fxCardData(x, fx, mask){
  const d = cardData(x); if(!d.photo || !fx) return d;
  if(fx.bg && fx.bg !== "keep" && !mask) fx = Object.assign({}, fx, {bg:"keep"});
  const pr = PCWPhoto.render(d.photo, fx, mask, PCWCard.color(d));
  return Object.assign(d, PCWPhoto.cardFields(pr, fx));
}
async function fullCardData(x){
  const img = await loadPhoto(x.r.photo_path); if(!img) return cardData(x);
  const fx = await getFx(x), s = savedFx(x);
  const mask = fx && fx.bg && fx.bg !== "keep" && s ? await loadMask(s.mask_path) : null;
  return fxCardData(x, fx, mask);
}
function fxLabel(x, fx){
  const s = savedFx(x);
  if(s) return ["done","✓ ครูปรับรูปแล้ว"];
  if(!x.r.photo_path) return ["",""];
  if(!fx || fx.noFace) return ["warn","⚠️ หาใบหน้าไม่เจอ กดที่การ์ดเพื่อปรับเอง"];
  return ["","✨ ปรับรูปอัตโนมัติแล้ว"];
}
async function loadPhoto(path){
  if(!path) return null;
  if(photoCache[path]!==undefined) return photoCache[path];
  photoCache[path] = null;
  const {data} = await sb.storage.from("survey-photos").download(path);
  if(!data) return null;
  const url = URL.createObjectURL(data);
  const img = await new Promise(ok=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>ok(null); i.src=url; });
  photoCache[path] = img; return img;
}
// วาดเป็นรูปเล็กเฉพาะที่เลื่อนมาเห็น (ประหยัดหน่วยความจำเครื่อง)
let io = null;
const big = document.createElement("canvas");
let redrawTile = ()=>{};
function lazyDraw(){
  if(io) io.disconnect();
  const draw = redrawTile = async cv=>{
    const x = items.find(i=> i.id===cv.dataset.draw); if(!x || !x.chosen) return;
    let d;
    try{ d = await fullCardData(x); }catch(e){ d = cardData(x); }
    PCWCard.draw(big, d, "4:5");
    const ctx = cv.getContext("2d"); cv.width = 432; cv.height = 540;
    ctx.drawImage(big, 0, 0, cv.width, cv.height);
    const ln = document.querySelector(`[data-fxline="${x.id}"]`);
    if(ln){ const [cls, t] = fxLabel(x, savedFx(x)? savedFx(x).fx : await getFx(x)); ln.className = "fxline "+cls; ln.textContent = t; }
  };
  if(!("IntersectionObserver" in window)){ document.querySelectorAll("[data-draw]").forEach(draw); return; }
  io = new IntersectionObserver(es=> es.forEach(e=>{ if(e.isIntersecting){ io.unobserve(e.target); draw(e.target); } }), {rootMargin:"300px"});
  document.querySelectorAll("[data-draw]").forEach(c=> io.observe(c));
}

/* ── อนุมัติ / ส่งกลับ ── */
async function review(ids, action, note){

  const {data:n, error} = await sb.rpc("survey_card_review", {p_response_ids: ids, p_action: action, p_note: note||null});
  if(error){ toast("บันทึกไม่สำเร็จ: "+error.message); return false; }
  toast(action==="approve"? `อนุมัติแล้ว ${n} คน ✅` : `ส่งกลับให้แก้แล้ว ${n} คน`);
  sel.clear(); await pickRound(round.id); return true;
}

/* ── แผงปรับรูป ── */
const FX_SL = [["fxZoom","zoom",100,"oZoom",v=>v+"%"],["fxDx","dx",100,"oDx",v=>v],["fxDy","dy",100,"oDy",v=>v],["fxBright","bright",1,"oBright",v=>v],["fxContrast","contrast",1,"oContrast",v=>v]];
function syncFxUi(){
  if(!editFx) return;
  $("fxAuto").checked = editFx.auto !== false;
  FX_SL.forEach(([id,k,m,o,f])=>{ const v = Math.round((editFx[k] ?? (k==="zoom"?1:0)) * m); $(id).value = v; $(o).textContent = f(v); });
  const noFace = !editFx.face;
  document.querySelectorAll("[data-bg]").forEach(b=>{ b.classList.toggle("active", b.dataset.bg === (editFx.bg||"keep")); b.disabled = noFace && b.dataset.bg !== "keep"; });
  const s = savedFx(viewing);
  $("fxHint").textContent = noFace ? "หาใบหน้าในรูปไม่เจอ ปรับขนาดและตำแหน่งเองได้ แต่เปลี่ยนพื้นหลังไม่ได้ (หรือส่งกลับให้นักเรียนเปลี่ยนรูป)"
    : s ? "รูปนี้ครูบันทึกการปรับไว้แล้ว นักเรียนจะเห็นการ์ดตามนี้" : "ปรับอัตโนมัติแล้ว ยังไม่ได้บันทึก (กดอนุมัติจะบันทึกให้เอง)";
}
let drawQ = false;
function drawView(){
  if(drawQ) return; drawQ = true;
  requestAnimationFrame(()=>{
    drawQ = false; if(!viewing || !editFx) return;
    const d = cardData(viewing); if(!d.photo) return PCWCard.draw($("viewCv"), d, viewRatio);
    const fx = editFx.bg !== "keep" && !editMask ? Object.assign({}, editFx, {bg:"keep"}) : editFx;
    const key = JSON.stringify([fx.auto, fx.tone, fx.bright, fx.contrast, fx.bg, !!editMask, viewing.id]);
    if(key !== editPrepKey){ editPrep = PCWPhoto.render(d.photo, fx, editMask, PCWCard.color(d)); editPrepKey = key; }
    PCWCard.draw($("viewCv"), Object.assign(d, PCWPhoto.cardFields(editPrep, fx)), viewRatio);
  });
}
FX_SL.forEach(([id,k,m,o,f])=> $(id).addEventListener("input", ()=>{ if(!editFx) return; const v = +$(id).value; editFx[k] = v / m; $(o).textContent = f(v); drawView(); }));
$("fxAuto").onchange = ()=>{ if(!editFx) return; editFx.auto = $("fxAuto").checked; drawView(); };
document.querySelectorAll("[data-bg]").forEach(b=> b.onclick = async ()=>{
  if(!editFx || b.disabled) return;
  const want = b.dataset.bg;
  if(want !== "keep" && !editMask){
    const img = await loadPhoto(viewing.r.photo_path);
    $("fxHint").textContent = "กำลังแยกคนออกจากพื้นหลัง… (ครั้งแรกอาจใช้เวลาสักครู่)";
    document.querySelectorAll("[data-bg]").forEach(x=> x.disabled = true);
    try{ editMask = await PCWPhoto.maskFor(img); }
    catch(e){ editMask = null; syncFxUi(); $("fxHint").textContent = "แยกพื้นหลังไม่สำเร็จ: " + (e.message||e); return; }
  }
  let pick = want;
  if(want === "auto"){ pick = PCWPhoto.suggestBg(editMask); $("fxHint").textContent = pick === "keep" ? "ระบบเห็นว่าแยกตัวคนได้ไม่ชัด จึงคงพื้นหลังเดิมไว้ (ลองเลือกแบบอื่นเองได้)" : "ระบบเลือก" + (pick === "blur" ? "เบลอของเดิม" : "ฉากสตูดิโอ") + "ให้แล้ว ไม่ถูกใจเลือกแบบอื่นได้"; }
  editFx.bg = pick; editPrepKey = ""; syncFxUi(); drawView();
});
$("btnFxReset").onclick = async ()=>{
  if(!viewing) return;
  const img = await loadPhoto(viewing.r.photo_path); if(!img) return;
  delete autoFxCache[viewing.r.photo_path];
  editFx = JSON.parse(JSON.stringify(await getFxAuto(viewing))); editMask = null; editPrepKey = "";
  syncFxUi(); drawView(); $("fxHint").textContent = "คืนค่าอัตโนมัติแล้ว กดบันทึกถ้าต้องการใช้แบบนี้";
};
async function getFxAuto(x){
  const img = await loadPhoto(x.r.photo_path);
  if(!autoFxCache[x.r.photo_path]) autoFxCache[x.r.photo_path] = PCWPhoto.autoFx(img).catch(()=> ({v:1, auto:false, face:null, zoom:1, dx:0, dy:0, bright:0, contrast:0, bg:"keep", noFace:true}));
  return autoFxCache[x.r.photo_path];
}
$("btnFxSave").onclick = async ()=>{

  }catch(e){ toast("บันทึกไม่สำเร็จ: " + (e.message||e)); }

};
function cleanFx(fx){
  const r = (v, d=3)=> +(+v||0).toFixed(d);
  return { v:1, auto: fx.auto !== false, tone: fx.tone || null,
    face: fx.face ? {cx:r(fx.face.cx,4), cy:r(fx.face.cy,4), w:r(fx.face.w,4), h:r(fx.face.h,4)} : null,
    zoom: r(fx.zoom ?? 1), dx: r(fx.dx), dy: r(fx.dy), bright: Math.round(+fx.bright||0), contrast: Math.round(+fx.contrast||0),
    bg: ["keep","uni","white","studio","blur"].includes(fx.bg) ? fx.bg : "keep", noFace: !fx.face };
}
async function saveFx(x, fx, maskCanvas){
  const clean = cleanFx(fx), old = fxRows[x.id];
  let mask_path = null;
  if(clean.bg !== "keep"){
    mask_path = `${x.r.student_id}/fx-${x.id}.png`;
    if(maskCanvas && maskCanvas.toBlob){
      const blob = await new Promise(ok=> maskCanvas.toBlob(ok, "image/png"));
      const {error} = await sb.storage.from("survey-photos").upload(mask_path, blob, {contentType:"image/png", upsert:true});
      if(error) throw error;
      maskCache[mask_path] = maskCanvas;
    } else if(!(old && old.mask_path === mask_path)) { clean.bg = "keep"; mask_path = null; }
  }
  const row = { response_id: x.id, photo_path: x.r.photo_path, fx: clean, mask_path, updated_by: profile.id, updated_at: new Date().toISOString() };
  const {error} = await sb.from("survey_card_photo_fx").upsert(row, {onConflict:"response_id"});
  if(error) throw error;
  if(old && old.mask_path && !mask_path) await sb.storage.from("survey-photos").remove([old.mask_path]);
  fxRows[x.id] = row;
}
// ตอนอนุมัติ: บันทึกค่าปรับอัตโนมัติให้คนที่ครูยังไม่ได้ปรับ (นักเรียนจะได้การ์ดหน้าตาเดียวกับที่ครูเห็น)
async function saveAutoFx(ids){
  const list = items.filter(x=> ids.includes(x.id) && x.r.photo_path && !savedFx(x));
  for(let i=0;i<list.length;i++){
    if(list.length > 3) toast(`กำลังเตรียมรูป ${i+1} / ${list.length} …`);
    try{ const fx = await getFx(list[i]); if(fx) await saveFx(list[i], fx, null); }catch(e){ /* ข้ามได้ ใช้รูปเดิม */ }
  }
}

/* ── ดาวน์โหลด ── */
function fileName(x){ return "card_" + (String(x.cls).replace(/[^0-9]+/g,"-").replace(/^-|-$/g,"")||"x") + "_" + (x.username||"student") + ".png"; }
function saveBlob(b, name){ const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000); }
async function zipApproved(){
  const list = items.filter(x=> tabOf(x)==="approved" && x.chosen && (room==="all" || x.cls===room));
  if(!list.length) return;
  const btn = $("btnZip"), zm = $("zipMsg"); btn.disabled = true; zm.className = "msg ok";
  const zip = new JSZip(), used = {}, cv = document.createElement("canvas");
  try{
    for(let i=0;i<list.length;i++){
      zm.textContent = `กำลังทำการ์ด ${i+1} / ${list.length} …`;
      const x = list[i];
      let d; try{ d = await fullCardData(x); }catch(e){ d = cardData(x); }
      PCWCard.draw(cv, d, "4:5");
      let nm = fileName(x); if(used[nm]) nm = nm.replace(".png","_"+(i+1)+".png"); used[nm]=1;
      zip.file(nm, await new Promise(ok=> cv.toBlob(ok, "image/png")));
      await new Promise(r=> setTimeout(r,0));
    }
    zm.textContent = "กำลังรวมไฟล์ ZIP…";
    saveBlob(await zip.generateAsync({type:"blob"}), `การ์ดแสดงความยินดี_${room==="all"?"ทุกห้อง":room.replace("/","-")}.zip`);
    zm.textContent = `เสร็จแล้ว ${list.length} ใบ`;
  }catch(e){ zm.className = "msg err"; zm.textContent = "ทำไม่สำเร็จ: "+e.message; }
  btn.disabled = false;
}

boot();
</script>
</body>
</html>
