<style>
:root{
  --ink:#22313A; --ink-soft:#5B6B72;
  --board:#EFF3F1; --card:#FFFFFF;
  --pine:#0F6B5C; --pine-deep:#0A4F44; --pine-tint:#E2F0EC;
  --note:#FFD34D; --note-deep:#8A6D00;
  --line:#DCE4E1; --danger:#C0392B;
  --g1:#F28C6B; --g2:#F2B84B; --g3:#7FB069; --g4:#4E9BB9; --g5:#8E7CC3; --g6:#D96A9C;
  --radius:14px; --shadow:0 2px 10px rgba(34,49,58,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Sarabun',sans-serif;background:var(--board);color:var(--ink);font-size:16px;line-height:1.55}
h1,h2,h3,.brand{font-family:'Mitr',sans-serif;font-weight:600;margin:0}
:focus-visible{outline:3px solid var(--note);outline-offset:2px;border-radius:6px}
header.app{background:var(--pine);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
header.app .brand{font-size:18px}
header.app small{display:block;opacity:.85;font-family:'Sarabun';font-weight:400;font-size:13px}
header.app a{color:#fff}
.userchip{background:rgba(255,255,255,.14);border-radius:999px;padding:4px 12px;font-size:14px}
.userchip .role{background:var(--note);color:var(--ink);border-radius:999px;padding:0 8px;margin-left:6px;font-size:12px;font-weight:600}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px}
.search input{border:0;outline:0;font:inherit;font-size:16px;flex:1;background:transparent;min-width:0}
.results{margin:8px 0 12px;display:flex;flex-direction:column;gap:6px}
.res{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;font:inherit;text-align:left;width:100%}
.res:hover{border-color:var(--pine)}
.res .m{color:var(--ink-soft);font-size:14px}
.hero{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);border-left:6px solid var(--gc,var(--g4));padding:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:12px}

.avatar.photo{width:84px;height:112px;border-radius:14px;overflow:hidden;background:var(--pine-tint);cursor:zoom-in;position:relative;border:0;padding:0}

.zoomlb img{max-width:min(92vw,480px);max-height:78vh;border-radius:16px;background:#fff}
.hero h1{font-size:22px}
.hero .meta{color:var(--ink-soft);font-size:14px}
.badge{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600;background:var(--pine-tint);color:var(--pine-deep);margin-right:4px}
.badge.warn{background:#FFF1C2;color:var(--note-deep)}
.badge.red{background:#FBEAE7;color:var(--danger)}

.sec{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin:12px 0;overflow:hidden}
.sec>h2{font-size:17px;padding:12px 16px;background:var(--board);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.tl{border-left:3px solid var(--pine-tint);margin:8px 0 0 6px;padding-left:14px}

.tl .it:before{content:"";position:absolute;left:-21px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--pine)}
.tl .it.open:before{background:var(--note);outline:2px solid var(--note-deep)}
.detail{background:var(--board);border-radius:10px;padding:8px 12px;margin-top:6px;font-size:15px;white-space:pre-wrap;word-break:break-word}
.btn{font:inherit;font-weight:600;border-radius:9px;padding:6px 14px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:14px;color:var(--ink);text-decoration:none;display:inline-block}
.btn.primary{background:var(--pine);border-color:var(--pine);color:#fff}
.msg{border-radius:12px;padding:12px 16px;margin:12px 0}
.msg.err{background:#FBEAE7;color:var(--danger)}
.hint{color:var(--ink-soft);font-size:14px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.chk:last-child{border-bottom:0}
.chk input{margin-top:5px;width:18px;height:18px;flex:none;accent-color:var(--pine)}

.stbar{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.stbar .track{height:12px;background:var(--board);border-radius:999px;overflow:hidden}
.stbar .fill{height:100%;border-radius:999px}
.sttop{border-left:4px solid;border-radius:10px;background:var(--board);padding:8px 12px;margin:8px 0;font-size:14px}
.sttop b{font-family:'Mitr';font-weight:500}
.tagchip{display:inline-block;border-radius:999px;padding:2px 12px;font-size:13px;margin:3px 4px 3px 0}
.sumbox{background:var(--board);border-radius:10px;padding:10px 12px;font-size:14px;white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;z-index:90}
@media(max-width:560px){.stbar{grid-template-columns:110px 1fr 28px}}
.embed header.app,.embed .search,.embed .results{display:none !important}
.embed body{background:var(--board)}
.embed .wrap{padding-top:8px}
@media(max-width:560px){.hero h1{font-size:19px}.row .r{text-align:left}}
</style>

<script>

const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlra2hqc2xtdGp3cnh6eHZ0b2tiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NDMzNjksImV4cCI6MjA5OTMxOTM2OX0.3OR_9mEv82Ns1LLjx5nnRwJYzrtKFtWCWd1bPuQfNKU';

const STALE_DAYS = 14;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// วันที่ไทย (เวลาไทย UTC+7) และแสดงเป็น พ.ศ.
function todayStr(){ return new Date(Date.now() + 7*3600*1000).toISOString().slice(0,10); }
function dayNum(d){ const [y,m,dd] = String(d).slice(0,10).split('-').map(Number); return Math.round(Date.UTC(y, m-1, dd) / 86400000); }
const MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function fmtDate(d){
  if (!d) return '';
  const s = String(d).slice(0,10);
  const [y,m,dd] = s.split('-').map(Number);
  if (!y || !m || !dd) return esc(d);
  return `${dd} ${MONTHS[m-1]} ${y + 543}`;
}
function fmtTs(t){ if (!t) return ''; return fmtDate(new Date(new Date(t).getTime() + 7*3600*1000).toISOString()); }
function yearBE(y){ return y ? `ปี ${y}` : ''; }

const LEVEL = { school:'ระดับโรงเรียน', district:'ระดับอำเภอ/เขต', area:'ระดับเขตพื้นที่', province:'ระดับจังหวัด', region:'ระดับภาค', national:'ระดับชาติ', international:'ระดับนานาชาติ' };
const QSTATUS = { submitted:'ส่งใบสมัครแล้ว', under_review:'กำลังพิจารณา', shortlisted:'ผ่านเข้ารอบ', waitlisted:'บัญชีสำรอง', approved:'ได้รับโควตา', promoted:'ได้รับ (เลื่อนจากสำรอง)', rejected:'ไม่ผ่าน', withdrawn:'ยกเลิก' };
const SSTATUS = { submitted:'ส่งใบสมัครแล้ว', under_review:'กำลังพิจารณา', shortlisted:'ผ่านเบื้องต้น', approved:'ได้รับทุน', rejected:'ไม่ผ่าน', withdrawn:'ยกเลิก' };
const WP_TYPE = { work_permit:'ขออนุญาตทำงาน', internship:'ฝึกงาน' };
const WP_STATUS = { submitted:'ยื่นแล้ว', processing:'กำลังดำเนินการ', ready:'พร้อมรับเอกสาร', received:'รับเอกสารแล้ว', cancelled:'ยกเลิก' };
const IV_STATUS = { draft:'ฉบับซ้อม', submitted:'รอครูตรวจ', reviewed:'ครูตรวจแล้ว' };
const RIASEC = {
  R:{ name:'นักปฏิบัติ', emoji:'🔧', color:'#F28C6B', fac:'วิศวกรรมศาสตร์ · เกษตรศาสตร์ · วิทยาศาสตร์การกีฬา · เทคโนโลยีอุตสาหกรรม' },
  I:{ name:'นักคิดวิเคราะห์', emoji:'🔬', color:'#4E9BB9', fac:'แพทยศาสตร์ · เภสัชศาสตร์ · วิทยาศาสตร์ · วิศวกรรมคอมพิวเตอร์' },
  A:{ name:'นักสร้างสรรค์', emoji:'🎨', color:'#D96A9C', fac:'สถาปัตยกรรมศาสตร์ · นิเทศศาสตร์ · ศิลปกรรมศาสตร์ · อักษรศาสตร์/มนุษยศาสตร์' },
  S:{ name:'นักช่วยเหลือสังคม', emoji:'🤝', color:'#7FB069', fac:'ครุศาสตร์/ศึกษาศาสตร์ · พยาบาลศาสตร์ · จิตวิทยา · สังคมสงเคราะห์' },
  E:{ name:'นักบริหารจัดการ', emoji:'🚀', color:'#F2B84B', fac:'บริหารธุรกิจ · เศรษฐศาสตร์ · นิติศาสตร์ · รัฐศาสตร์ · การตลาด' },
  C:{ name:'นักจัดระเบียบ', emoji:'📋', color:'#8E7CC3', fac:'บัญชี · การเงิน · สถิติ · การจัดการ' }
};
const RKEYS = ['R','I','A','S','E','C'];
// คะแนนจุดแข็ง = แบบประเมิน + แท็กจากครู (แท็กละ 2) — สูตรเดียวกับแท็บจุดแข็งใน index.html
function riasecScores(st){
  const c = {};
  RKEYS.forEach(k => c[k] = Number(st?.assessment?.scores?.[k] || 0) + (st?.tags || []).filter(t => t.type === k).length * 2);
  return c;
}
// รางวัลที่บันทึกในระบบจุดแข็ง: note = ชื่อ|ระดับ|ปี|หมายเหตุ
function parseAwardNote(note){ const p = String(note || '').split('|'); return { title:p[0] || '', level:p[1] || '', year:p[2] || '', extra:p[3] || '' }; }
function toast(t){
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = t;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
}

function empty(icon, txt){ return `<div class="empty"><span class="e">${icon}</span>${esc(txt)}</div>`; }
function sec(id, title, count, body, extra){
  return `<section class="sec" id="s-${id}"><h2><span>${title}${extra || ''}</span><small>${esc(count)}</small></h2><div class="body">${body}</div></section>`;
}
function row(left, right){ return `<div class="row"><div>${left}</div>${right ? `<div class="r">${right}</div>` : ''}</div>`; }

// ---------- เข้าสู่ระบบ + ตรวจสิทธิ์ ----------
function showNoAccess(msg){
  $('main').style.display = 'none';
  const el = $('no-access');
  el.style.display = 'block';
  el.innerHTML = msg;
}
async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session){
    $('who').textContent = 'ยังไม่ได้เข้าสู่ระบบ';
    showNoAccess('กรุณาเข้าสู่ระบบจากหน้า <a href="index.html">คลังแนะแนว</a> ก่อน แล้วกลับมาเปิดหน้านี้อีกครั้ง');
    return;
  }
  const { data: profile } = await sb.from('profiles').select('display_name, role, is_guidance').eq('id', session.user.id).single();
  const isStaff = !!profile && (profile.role === 'admin' || (profile.role === 'teacher' && profile.is_guidance === true));
  $('who').innerHTML = `${esc(profile?.display_name || session.user.email)}<span class="role">${profile?.role === 'admin' ? 'ผู้ดูแล' : 'ครู'}</span>`;
  if (!isStaff){
    showNoAccess('<b>หน้านี้สำหรับครูแนะแนวเท่านั้น</b><br>บัญชีนี้ยังไม่มีสิทธิ์เปิดโปรไฟล์นักเรียนรวม หากคิดว่าควรมีสิทธิ์ กรุณาแจ้งผู้ดูแลระบบ');
    return;
  }
  $('main').style.display = 'block';
  bindSearch();
  const id = new URLSearchParams(location.search).get('id');
  if (id && /^[0-9a-f-]{36}$/i.test(id)) loadProfile(id);
}

// ---------- ค้นหา ----------
let searchSeq = 0, searchTimer = null;
function bindSearch(){
  $('q').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(runSearch, 300);
  });
}
async function runSearch(){
  const q = $('q').value.trim();
  const box = $('results');
  const seq = ++searchSeq;
  if (q.length < 2){ box.innerHTML = ''; return; }
  box.innerHTML = '<div class="hint">กำลังค้นหา...</div>';
  const { data, error } = await sb.rpc('student_profile_search', { p_q: q });
  if (seq !== searchSeq) return;
  if (error){ box.innerHTML = `<div class="msg err">ค้นหาไม่สำเร็จ: ${esc(error.message)}</div>`; return; }
  if (!data || data.length === 0){ box.innerHTML = '<div class="hint">ไม่พบนักเรียนที่ตรงกับคำค้น</div>'; return; }
  box.innerHTML = data.map(s => `<button class="res" data-id="${esc(s.id)}"><span><b>${esc(s.display_name)}</b> <span class="m">รหัส ${esc(s.student_id || '-')}</span></span><span class="m">${esc(s.class_room || (s.graduated_year ? 'จบปี ' + s.graduated_year : '-'))}</span></button>`).join('')
    + (data.length >= 20 ? '<div class="hint">แสดง 20 คนแรก พิมพ์เพิ่มเพื่อให้แคบลง</div>' : '');
  box.querySelectorAll('.res').forEach(b => b.addEventListener('click', () => { box.innerHTML = ''; loadProfile(b.dataset.id); }));
}

// ---------- โหลดและแสดงโปรไฟล์ ----------
let loadSeq = 0;
async function loadProfile(id){
  const seq = ++loadSeq;
  $('app').innerHTML = '<div class="empty"><span class="e">⏳</span>กำลังโหลดข้อมูล...</div>';
  const { data, error } = await sb.rpc('student_profile_360', { p_profile_id: id });
  if (seq !== loadSeq) return;
  if (error){ $('app').innerHTML = `<div class="msg err">โหลดข้อมูลไม่สำเร็จ: ${esc(error.message)}</div>`; return; }
  if (!data){ $('app').innerHTML = empty('🔎', 'ไม่พบนักเรียนคนนี้'); return; }
  render(data);
  loadAvatarPhoto(id, seq);
  history.replaceState(null, '', '?id=' + encodeURIComponent(id) + (document.documentElement.classList.contains('embed') ? '&embed=1' : ''));
}

// ---------- รูปโปรไฟล์ = รูปที่นักเรียนอัปโหลดเองเท่านั้น (profiles.avatar_path) ----------
// ครูอ่านรูปได้ตามสิทธิ์เดิมของที่เก็บ profile-photos · ไม่มีรูป/ดึงไม่ได้ = แสดงไอคอนเดิม ไม่ให้หน้าพัง
async function loadAvatarPhoto(id, seq){
  try {
    const { data: p } = await sb.from('profiles').select('avatar_path').eq('id', id).maybeSingle();
    if (!p || !p.avatar_path) return;
    const { data: u } = await sb.storage.from('profile-photos').createSignedUrl(p.avatar_path, 3600);
    if (!u || !u.signedUrl) return;
    if (seq !== loadSeq) return;                       // เปลี่ยนไปดูคนอื่นระหว่างโหลดแล้ว
    const box = $('pfAvatarBox');
    if (!box) return;
    box.innerHTML = '<button type="button" class="avatar photo" id="pfAvatar" aria-label="ขยายรูปนักเรียน"></button>';
    const im = new Image(); im.alt = ''; im.src = u.signedUrl;
    $('pfAvatar').appendChild(im);
    $('pfAvatar').addEventListener('click', () => {
      const lb = document.createElement('div');
      lb.className = 'zoomlb';
      const big = new Image(); big.alt = 'รูปนักเรียน'; big.src = u.signedUrl;
      lb.appendChild(big); lb.insertAdjacentHTML('beforeend', '<span>แตะที่ว่างเพื่อปิด</span>');
      lb.addEventListener('click', () => lb.remove());
      document.body.appendChild(lb);
    });
  } catch (e) { /* ไม่มีรูป/ดึงไม่ได้ = แสดงไอคอนเดิม */ }
}

function caseAlert(cases){
  if (!cases.length) return '';
  const latest = cases[0];            // เรียงใหม่สุดก่อน; สถานะของครั้งล่าสุดคือสถานะเคสปัจจุบัน
  const today = dayNum(todayStr());
  if (latest.status === 'นัดครั้งถัดไป' && latest.next_appointment_date && dayNum(latest.next_appointment_date) < today){
    return `<div class="alert">⚠️ <b>ต้องติดตาม</b> เคสให้คำปรึกษาเลยวันนัดแล้ว (นัดไว้ ${fmtDate(latest.next_appointment_date)})</div>`;
  }
  if (latest.status === 'ติดตามต่อ' && today - dayNum(latest.session_date) > STALE_DAYS){
    return `<div class="alert soft">🕑 <b>ควรติดตาม</b> เคส "ติดตามต่อ" ยังไม่มีบันทึกใหม่มากกว่า ${STALE_DAYS} วัน (ครั้งล่าสุด ${fmtDate(latest.session_date)})</div>`;
  }
  return '';
}

function admissionText(a){
  return [a.institution, a.faculty, a.major].filter(Boolean).map(esc).join(' ') + (a.campus ? ` (${esc(a.campus)})` : '') + (a.admit_round ? ` · รอบ ${esc(a.admit_round)}` : '');
}

function render(d){
  const s = d.student;
  const lvl = parseInt(String(s.class_room || '').replace(/^ม\.?/, ''), 10);
  const gc = `var(${GC[lvl] || '--g4'})`;
  const cases = d.cases || [];
  let h = '';

  h += `<div class="hero" style="--gc:${gc}">
    <div id="pfAvatarBox"><div class="avatar" id="pfAvatar">🎓</div></div>
    <div class="grow"><h1>${esc(s.display_name)}${s.nickname ? ` <span class="meta">(${esc(s.nickname)})</span>` : ''}</h1>
      <div class="meta">รหัสนักเรียน ${esc(s.student_id || '-')} · <span class="badge grade" style="--gc:${gc}">${esc(s.class_room || 'ไม่ระบุห้อง')}</span>${s.graduated_year ? `<span class="badge warn">จบปี ${esc(s.graduated_year)}</span>` : `<span class="badge">${esc(s.status === 'active' || !s.status ? 'กำลังเรียน' : s.status)}</span>`}${s.previous_school ? `ย้ายมาจาก ${esc(s.previous_school)}` : ''}</div>
      ${d.year_rooms.length ? `<div class="rooms">ห้องย้อนหลัง: ${d.year_rooms.map(r => `ปี ${esc(r.academic_year)} = ${esc(r.class_room)}`).join(' · ')}</div>` : ''}
    </div>
    <div><a class="btn primary" href="counseling-log.html?student=${encodeURIComponent(s.id)}">📝 บันทึกให้คำปรึกษานักเรียนคนนี้</a></div>
  </div>`;

  h += caseAlert(cases);

  // ที่เรียนต่อ: นับจากรายการ "ติด" ทั้งหมดในทุกแบบสำรวจ
  const admitCount = (d.surveys || []).reduce((n, sv) => n + (sv.admissions || []).length, 0);
  const stat = (n, label, id) => `<button class="stat" data-go="s-${id}"><span class="n ${n ? '' : 'zero'}">${n}</span><span class="l">${label}</span></button>`;
  h += `<div class="stats">
    ${stat(d.awards.length, 'ผลงาน/เกียรติบัตร', 'awards')}
    ${stat(d.scholarships.filter(x => x.status === 'approved').length, 'ทุนที่ได้รับ', 'schol')}
    ${stat(d.quotas.length, 'สมัครโควตา', 'quota')}
    ${stat(admitCount, 'ที่ติดแล้ว', 'survey')}
    ${stat(cases.length, 'ครั้งที่ปรึกษา', 'cases')}
  </div>`;

  // ผลงาน
  const awardTags = d.award_tags || [];
  const awN = d.awards.length + awardTags.length;
  h += sec('awards', '🌟 ผลงานและเกียรติบัตร', awN ? `${awN} รายการ` : 'ยังไม่มี',
    awN ? d.awards.map(a => row(
      `<div class="t">${esc(a.title)}</div><div class="s">${[esc(a.prize_name), esc(a.category), yearBE(a.academic_year)].filter(Boolean).join(' · ')}</div>`,
      `${a.level ? `<span class="badge">${esc(LEVEL[a.level] || a.level)}</span>` : ''}<span class="badge">ยืนยันแล้ว</span>`)).join('')
      + awardTags.map(t => { const p = parseAwardNote(t.note); return row(
      `<div class="t">${esc(p.title || '-')}</div><div class="s">${[p.extra ? esc(p.extra) : '', p.year ? 'ปี ' + esc(p.year) : '', t.self_recorded ? 'นักเรียนบันทึกเอง' : 'บันทึกโดย ' + esc(t.tagger_name || 'ครู')].filter(Boolean).join(' · ')}</div>`,
      p.level ? `<span class="badge warn">${esc(LEVEL[p.level] || p.level)}</span>` : ''); }).join('')
    : empty('🌟', 'ยังไม่มีผลงานหรือเกียรติบัตร'));

  // ทุน
  h += sec('schol', '💰 ทุนการศึกษา', d.scholarships.length ? `${d.scholarships.length} รายการ` : 'ยังไม่มี',
    d.scholarships.length ? d.scholarships.map(x => row(
      `<div class="t">${esc(x.name)}</div><div class="s">${[esc(x.provider), x.amount ? `${Number(x.amount).toLocaleString('th-TH')} บาท` : '', yearBE(x.academic_year)].filter(Boolean).join(' · ')}</div>`,
      `<span class="badge ${x.status === 'approved' ? '' : ['rejected', 'withdrawn'].includes(x.status) ? 'red' : 'warn'}">${esc(SSTATUS[x.status] || x.status)}</span>`)).join('')
    : empty('💰', 'ยังไม่เคยสมัครทุนการศึกษา'));

  // โควตา
  const qn = d.quotas.length;
  h += sec('quota', '🏫 สมัครโควตา', qn ? `${qn} รายการ` : 'ยังไม่มี',
    qn ? d.quotas.map(q => row(
      `<div class="t">${esc(q.name)}</div><div class="s">${[esc(q.university), esc(q.applied_faculty || q.faculty), esc(q.applied_major)].filter(Boolean).join(' · ')}</div>`,
      `${esc(QSTATUS[q.status] || q.status)}${q.rank ? ` · อันดับ ${esc(q.rank)}` : ''}${q.disqualified ? ' <span class="badge red">ไม่ผ่านเกณฑ์</span>' : ''}`)).join('')
    : empty('🏫', 'ยังไม่เคยสมัครโควตา'));

  // เรียนต่อ
  h += sec('survey', '🎓 การเรียนต่อ', '',
    (d.surveys || []).length ? d.surveys.map(sv => {
      const head = `<div class="s" style="margin:8px 0;color:var(--ink-soft);font-size:14px">${esc(sv.title)} ${yearBE(sv.academic_year)}${sv.submitted_at ? ' · ตอบเมื่อ ' + fmtTs(sv.submitted_at) : ''}</div>`;
      const adm = (sv.admissions || []);
      const body = adm.length
        ? adm.map(a => row(`<span class="badge ${a.is_chosen ? '' : 'warn'}">${a.is_chosen ? 'ที่เลือกเรียน' : 'ติดแล้ว'}</span> ${admissionText(a)}`)).join('')
        : row(`<span class="badge">${esc(sv.status || 'ตอบแล้ว')}</span> ${[esc(sv.institution), esc(sv.program)].filter(Boolean).join(' ')}${sv.tcas_round ? ` · รอบ ${esc(sv.tcas_round)}` : ''}`);
      return head + body;
    }).join('')
    : empty('🎓', 'ยังไม่ได้ตอบแบบสำรวจเรียนต่อ (ใช้กับ ม.3 และ ม.6)'));

  // งาน
  const wn = d.work_permits.length + d.work_experiences.length;
  h += sec('work', '💼 การทำงานและหนังสืออนุญาต', wn ? `${wn} รายการ` : 'ยังไม่มี',
    wn ? d.work_permits.map(w => row(
      `<div class="t">${esc(w.employer_name || '-')}</div><div class="s">${[esc(WP_TYPE[w.request_type] || ''), esc(w.job_description), (w.work_start_date ? fmtDate(w.work_start_date) : '') + (w.work_end_date ? ' – ' + fmtDate(w.work_end_date) : '')].filter(Boolean).join(' · ')}</div>`,
      `<span class="badge ${w.status === 'cancelled' ? 'red' : ''}">${esc(WP_STATUS[w.status] || w.status)}</span>`)).join('')
      + d.work_experiences.map(w => row(
      `<div class="t">${esc(w.job_title)}</div><div class="s">ประสบการณ์ที่นักเรียนบันทึกเอง${w.start_date ? ' · ' + fmtDate(w.start_date) : ''}${w.end_date ? ' – ' + fmtDate(w.end_date) : ''}</div>`)).join('')
    : empty('💼', 'ยังไม่เคยขอหนังสืออนุญาตทำงาน'));

  // TGAT
  const tgTotal = Number(d.tgat_total || d.tgat.length);
  h += sec('tgat', '📝 ฝึกข้อสอบ TGAT/TPAT', tgTotal ? `${tgTotal} ครั้ง` : 'ยังไม่มี',
    d.tgat.length ? d.tgat.map((t, i) => row(
      `<div class="t">ครั้งที่ ${tgTotal - i}${(t.subjects || []).length ? ` <span class="s" style="font-weight:400">· ${esc(t.subjects.join(' · '))}</span>` : ''}</div>`,
      `${t.percentage != null ? esc(Math.round(Number(t.percentage))) + '%' : ''}${t.max_score ? ` (${esc(t.raw_score)}/${esc(t.max_score)})` : t.question_count ? ` (${esc(t.correct_count)}/${esc(t.question_count)})` : ''} · ${fmtTs(t.completed_at)}`)).join('')
      + (tgTotal > d.tgat.length ? `<div class="hint" style="padding-top:6px">แสดง ${d.tgat.length} ครั้งล่าสุด จากทั้งหมด ${tgTotal} ครั้ง</div>` : '')
    : empty('📝', 'ยังไม่เคยฝึกข้อสอบในระบบ'));

  // งานที่มอบหมาย
  const as = d.assignments || { total: 0, done: 0, late: [], items: [] };
  const now = Date.now();
  h += sec('assign', '📚 งานที่ได้รับมอบหมาย', as.total ? `ส่งแล้ว ${as.done}/${as.total}` : 'ยังไม่มี',
    (as.items || []).length
      ? `<div class="hint" style="padding-top:6px">ติ๊กงานที่อยากให้ใส่เนื้อหาไว้ใน "สรุปสำหรับให้ AI วิเคราะห์" ด้านล่าง</div>`
        + as.items.map((a, i) => {
          const has = a.submitted && (a.text_answer || a.file_name || a.external_url);
          const late = !a.submitted && a.due_at && new Date(a.due_at).getTime() < now;
          const st = a.submitted
            ? `<span class="badge">ส่งแล้ว${a.text_answer ? ' (ข้อความ)' : a.file_name ? ' (ไฟล์)' : a.external_url ? ' (ลิงก์)' : ''}</span>`
            : late ? `<span class="badge red">ค้างส่ง</span>` : `<span class="badge warn">ยังไม่ส่ง</span>`;
          return `<label class="chk"><input type="checkbox" class="asg-pick" data-i="${i}" ${has ? 'checked' : 'disabled'} aria-label="ใส่งาน ${esc(a.title)} ในสรุป">
            <span class="grow"><span class="t" style="font-weight:600">${esc(a.title)}</span><br><span class="hint">${a.submitted ? 'ส่งเมื่อ ' + fmtTs(a.submitted_at) : a.due_at ? 'กำหนดส่ง ' + fmtTs(a.due_at) : 'ไม่มีกำหนดส่ง'}</span></span>${st}</label>`;

      : empty('📚', 'ยังไม่มีงานที่มอบหมายให้ห้องนี้'));

  // จุดแข็ง RIASEC
  const st = d.strength || {}, sc = riasecScores(st), stTags = st.tags || [];
  const smax = Math.max(8, ...Object.values(sc));
  const top3 = [...RKEYS].sort((a, b) => sc[b] - sc[a]).slice(0, 3).filter(k => sc[k] > 0);
  h += sec('strength', '🧩 จุดแข็ง (RIASEC)', st.assessment ? 'ทำแบบประเมิน ' + fmtTs(st.assessment.done_at) : stTags.length ? 'จากแท็กของครู' : 'ยังไม่มี',

      ? (st.assessment ? '' : `<div class="hint" style="padding-top:6px">⚠️ ยังไม่ได้ทำแบบประเมิน ผลนี้มาจากแท็กของครูเท่านั้น</div>`)
        + `<div style="padding-top:6px">` + RKEYS.map(k => `<div class="stbar"><span>${RIASEC[k].emoji} ${RIASEC[k].name}</span><div class="track"><div class="fill" style="width:${Math.round(sc[k] / smax * 100)}%;background:${RIASEC[k].color}"></div></div><b style="text-align:right">${sc[k]}</b></div>`).join('') + `</div>`
        + top3.map((k, i) => `<div class="sttop" style="border-color:${RIASEC[k].color}"><b>อันดับ ${i + 1}: ${RIASEC[k].emoji} ${RIASEC[k].name}</b><br>คณะ/สาขาที่น่ามอง: ${RIASEC[k].fac}</div>`).join('')
        + (stTags.length ? `<div style="margin-top:8px"><span class="hint">จุดแข็งที่ครูมองเห็น:</span><br>` + stTags.map(t => `<span class="tagchip" style="background:${RIASEC[t.type].color}22;color:${RIASEC[t.type].color}">${RIASEC[t.type].emoji} ${RIASEC[t.type].name}${t.note ? ' · ' + esc(t.note) : ''} <small>(${esc(t.tagger_name || 'ครู')})</small></span>`).join('') + `</div>` : '')

  // ฝึกซ้อมสัมภาษณ์
  const ivs = d.interviews || [];
  h += sec('iv', '🎤 ฝึกซ้อมสัมภาษณ์', ivs.length ? `${ivs.length} ครั้ง` : 'ยังไม่มี',

    : empty('🎤', 'ยังไม่เคยฝึกซ้อมสัมภาษณ์'));

  // ทะเบียนกลุ่มเปราะบาง: แสดงเฉพาะเมื่อนักเรียนอยู่ในทะเบียน
  if (d.vulnerable){
    const v = d.vulnerable;
    h += sec('vul', '🛟 ทะเบียนกลุ่มเปราะบาง', v.academic_year ? 'ปี ' + v.academic_year : '',
      row(`อยู่ในทะเบียนกลุ่มเปราะบาง${v.urgency_level ? ` · ระดับความเร่งด่วน <b>${esc(v.urgency_level)}/5</b>` : ''}`,
        `<span class="badge ${v.verified ? '' : 'warn'}">${v.verified ? 'ยืนยันแล้ว' : 'รอยืนยัน'}</span>`)

  }

  // บันทึกให้คำปรึกษา (เฉพาะครูแนะแนว)
  h += sec('cases', '💬 บันทึกให้คำปรึกษา', cases.length ? `${cases.length} ครั้ง` : 'ยังไม่มี',
    cases.length ? `<div class="tl">` + cases.map((c, i) => {
      const closed = c.status === 'ปิดเคส';
      const overdue = c.status === 'นัดครั้งถัดไป' && c.next_appointment_date && dayNum(c.next_appointment_date) < dayNum(todayStr());
      const cats = (c.categories || []).join(', ');
      return `<div class="it ${closed ? '' : 'open'}">
        <div><span class="t" style="font-weight:600">${fmtDate(c.session_date)}</span> <span class="badge ${closed ? '' : 'warn'}">${esc(c.status)}</span>${overdue ? `<span class="badge red">เลยวันนัด ${fmtDate(c.next_appointment_date)}</span>` : ''}</div>
        <div class="s" style="color:var(--ink-soft);font-size:14px">โดย ${esc(c.counselor)}${cats ? ' · ' + esc(cats) : ''}</div>
        <button class="btn" data-case="${i}">ดูเนื้อหา</button><div class="detail" id="cd-${i}" style="display:none"></div>
      </div>`;
    }).join('') + `</div>`
    : empty('💬', 'ยังไม่เคยมีบันทึกให้คำปรึกษา'),
    ' <span class="lock">🔒 เฉพาะครูแนะแนว</span>');

  // สรุปสำหรับให้ AI วิเคราะห์ (สร้างจากข้อมูลบนหน้านี้ ไม่เรียก API ใด ๆ ไม่มีค่าใช้จ่าย · ไม่รวมบันทึกให้คำปรึกษา)
  h += sec('ai', '🤖 สรุปสำหรับให้ AI วิเคราะห์', '',
    `<div class="hint" style="padding:6px 0">คัดลอกข้อความนี้ไปวางในแชท AI ฟรี (เช่น Claude.ai) เพื่อขอคำแนะนำเชิงแนะแนว · ไม่รวมบันทึกให้คำปรึกษา</div>
     <div class="sumbox" id="aiSum"></div>
     <div class="btnrow"><button class="btn primary" type="button" id="btnCopySum">📋 คัดลอกสรุปนี้</button>
       <button class="btn" type="button" id="btnOpenClaude">🔗 คัดลอกแล้วเปิด Claude.ai</button></div>`);

  $('app').innerHTML = h;
  const refreshSum = () => { const b = $('aiSum'); if (b) b.textContent = buildSummary(d); };
  refreshSum();
  document.querySelectorAll('.asg-pick').forEach(cb => cb.addEventListener('change', refreshSum));
  const copySum = (after) => {
    const text = $('aiSum').textContent || '';
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
      .then(() => { toast('คัดลอกสรุปแล้ว นำไปวางในแชท AI ได้เลยค่ะ'); if (after) after(); })
      .catch(() => { toast('คัดลอกไม่สำเร็จ ลองลากเลือกข้อความแล้วคัดลอกเองนะคะ'); if (after) after(); });
  };
  $('btnCopySum').addEventListener('click', () => copySum());
  $('btnOpenClaude').addEventListener('click', () => {
    const w = window.open('https://claude.ai/new', '_blank', 'noopener');   // เปิดก่อนเพื่อไม่ให้เบราว์เซอร์บล็อกป๊อปอัป
    copySum();
    if (!w) toast('เบราว์เซอร์บล็อกหน้าต่างใหม่ เปิด claude.ai เองได้เลยค่ะ');
  });

  document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
    const t = $(b.dataset.go); if (t) t.scrollIntoView({ behavior: 'smooth' });
  }));
  document.querySelectorAll('[data-case]').forEach(b => b.addEventListener('click', () => {
    const i = Number(b.dataset.case), c = cases[i], box = $('cd-' + i);
    if (box.style.display === 'none'){
      const lines = [];
      if (c.note) lines.push(c.note);
      if (c.other_detail) lines.push('รายละเอียดอื่น ๆ: ' + c.other_detail);
      if (c.status === 'นัดครั้งถัดไป' && c.next_appointment_date) lines.push('นัดครั้งถัดไป: ' + fmtDate(c.next_appointment_date));
      if (c.referral_to) lines.push('ส่งต่อไปที่: ' + c.referral_to + (c.referral_note ? ' — ' + c.referral_note : ''));
      box.textContent = lines.join('\n') || '(ไม่มีรายละเอียด)';
      box.style.display = 'block'; b.textContent = 'ซ่อนเนื้อหา';
    } else { box.style.display = 'none'; b.textContent = 'ดูเนื้อหา'; }
  }));
}

function buildSummary(d){
  const s = d.student, out = [], add = (t, rows) => { if (rows && rows.length){ out.push('', '── ' + t + ' ──'); rows.forEach(r => out.push('• ' + r)); } };
  const items = (d.assignments && d.assignments.items) || [];
  add('📝 งานมอบหมาย', items.map(a => `${a.title}: ${a.submitted ? 'ส่งแล้ว' : 'ยังไม่ส่ง'}`));
  const picked = [...document.querySelectorAll('.asg-pick:checked')].map(cb => items[Number(cb.dataset.i)]).filter(Boolean);
  add('✅ เนื้อหางานที่เลือกไว้', picked.map(a => {
    const p = [];
    if (a.text_answer) p.push(`คำตอบ: "${a.text_answer}"`);
    if (a.file_name) p.push('ไฟล์ที่ส่ง: ' + a.file_name);
    if (a.external_url) p.push('ลิงก์: ' + a.external_url);
    return `${a.title} (ส่งเมื่อ ${fmtTs(a.submitted_at)}) — ${p.join(' / ')}`;
  }));
  add('🎓 การเรียนต่อ', (d.surveys || []).map(sv => {
    const adm = (sv.admissions || []).map(a => [a.institution, a.faculty, a.major].filter(Boolean).join(' ') + (a.is_chosen ? ' (เลือกเรียน)' : ''));
    return `${sv.title}${sv.academic_year ? ' ปี ' + sv.academic_year : ''}: ${adm.length ? 'ติด ' + adm.join(', ') : [sv.status, sv.institution, sv.program].filter(Boolean).join(' · ') || 'ตอบแล้ว'}`;
  }));
  const sc = riasecScores(d.strength), top = [...RKEYS].sort((a, b) => sc[b] - sc[a]).slice(0, 3).filter(k => sc[k] > 0);
  const tags = (d.strength && d.strength.tags) || [];
  add('🧩 จุดแข็ง (RIASEC)', [
    top.length ? 'อันดับต้น ๆ: ' + top.map(k => `${RIASEC[k].name} (${sc[k]})`).join(', ') : '',
    tags.length ? 'แท็กจากครู: ' + tags.map(t => RIASEC[t.type].name + (t.note ? ` (${t.note})` : '')).join(', ') : ''
  ].filter(Boolean));
  add('🏆 เกียรติบัตร / รางวัล', [
    ...d.awards.map(a => [a.title, a.prize_name, LEVEL[a.level] || a.level, a.academic_year ? 'ปี ' + a.academic_year : ''].filter(Boolean).join(' · ')),
    ...(d.award_tags || []).map(t => { const p = parseAwardNote(t.note); return [p.title, LEVEL[p.level] || p.level, p.year ? 'ปี ' + p.year : '', p.extra].filter(Boolean).join(' · '); })
  ]);
  const tgTotal = Number(d.tgat_total || d.tgat.length);
  if (tgTotal) add('🎯 ฝึกข้อสอบ TGAT/TPAT', [`ทำไปแล้ว ${tgTotal} ครั้ง`, ...d.tgat.slice(0, 3).map(t => `${fmtTs(t.completed_at)} — ${(t.subjects || []).join('/')}: ${t.percentage != null ? Math.round(Number(t.percentage)) + '%' : '-'}`)]);
  add('🏫 สมัครโควตา', d.quotas.map(q => `${[q.name, q.university, q.applied_faculty || q.faculty, q.applied_major].filter(Boolean).join(' · ')} — ${QSTATUS[q.status] || q.status}`));
  add('💰 ทุนการศึกษา', d.scholarships.map(x => `${x.name} — ${SSTATUS[x.status] || x.status}`));
  add('💼 การทำงาน/ฝึกงาน', [
    ...d.work_permits.map(w => `${WP_TYPE[w.request_type] || ''} ${w.employer_name || '-'} — ${WP_STATUS[w.status] || w.status}`.trim()),
    ...d.work_experiences.map(w => `${w.job_title} (นักเรียนบันทึกเอง)`)
  ]);
  add('🎤 ฝึกซ้อมสัมภาษณ์', (d.interviews || []).map(x => `${x.category}${x.kind === 'mock' ? ' (นัดซ้อมกับครู)' : ''} — ${IV_STATUS[x.status] || x.status}`));
  if (d.vulnerable) add('🛟 ทะเบียนกลุ่มเปราะบาง', [`อยู่ในทะเบียน${d.vulnerable.urgency_level ? ' · ระดับความเร่งด่วน ' + d.vulnerable.urgency_level + '/5' : ''}`]);
  const head = `ข้อมูลนักเรียน: ${s.display_name}${s.nickname ? ' (' + s.nickname + ')' : ''} รหัส ${s.student_id || s.username || '-'} ห้อง ${s.class_room || '-'}`;
  return [head, ...(out.length ? out : ['', 'ยังไม่มีข้อมูลในระบบย่อยใด ๆ ของนักเรียนคนนี้'])].join('\n')
    + '\n\nโปรดช่วยวิเคราะห์ภาพรวมของนักเรียนคนนี้จากข้อมูลทุกด้านข้างต้น (จุดแข็ง ความสนใจ กิจกรรม/รางวัล เส้นทางการศึกษาต่อ) แล้วให้คำแนะนำเชิงแนะแนว (ตอบเป็นภาษาไทย ไม่เกิน 300 คำ)';
}

init();
</script>
