<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หนังสือฝึกงาน/อนุญาตทำงาน — จัดการ | แนะให้แนว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{
  --ink:#22313A; --ink-soft:#5B6B72; --board:#EFF3F1; --card:#FFFFFF;
  --pine:#0F6B5C; --pine-deep:#0A4F44; --pine-tint:#E2F0EC;
  --note:#FFD34D; --note-deep:#8A6D00; --line:#DCE4E1; --danger:#C0392B;
  --radius:14px; --shadow:0 2px 10px rgba(34,49,58,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:var(--board);color:var(--ink);font-size:16px;line-height:1.55;min-height:100vh}
h1,h2,h3,.brand{font-family:'Mitr',sans-serif;font-weight:600}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
:focus-visible{outline:3px solid var(--note);outline-offset:2px;border-radius:6px}

.wrap{max-width:1080px;margin:0 auto;padding:0 16px 64px}
header.app{background:var(--pine);color:#fff;padding:14px 0}
header.app .wrap{display:flex;align-items:center;gap:12px;padding-bottom:0;flex-wrap:wrap}
.brand{font-size:1.25rem;display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--note);color:var(--pine-deep);display:grid;place-items:center;font-size:1.05rem;flex:none}
.brand small{display:block;font-family:'Sarabun';font-weight:400;font-size:.72rem;opacity:.85}
.spacer{flex:1}
.userchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:999px;font-size:.85rem}
.iconbtn{background:rgba(255,255,255,.14);border:none;color:#fff;border-radius:999px;padding:7px 14px;font-size:.85rem}
.iconbtn:hover{background:rgba(255,255,255,.26)}

.folder-tabs{display:flex;gap:4px;overflow-x:auto;padding:22px 2px 0;scrollbar-width:none}
.ftab{flex:none;background:#fff;color:var(--ink-soft);font-family:'Mitr';font-size:.92rem;font-weight:500;
  padding:9px 18px 12px;border-radius:12px 12px 0 0;border:1px solid var(--line);border-bottom:none;position:relative;top:4px;opacity:.82}
.ftab.active{top:0;opacity:1;color:var(--ink);border-top:4px solid var(--pine);box-shadow:0 -3px 8px rgba(34,49,58,.06);z-index:2}
.folder-body{background:#fff;border:1px solid var(--line);border-radius:0 var(--radius) var(--radius) var(--radius);padding:16px;box-shadow:var(--shadow)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:.82rem;color:var(--ink-soft)}
.chip.active{background:var(--pine);border-color:var(--pine);color:#fff;font-weight:600}

.reqcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.reqcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.reqcard h3{font-size:1rem;font-weight:500}
.reqcard .meta{font-size:.82rem;color:var(--ink-soft);margin-top:4px}
.reqcard .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap}
.badge{font-size:.7rem;font-weight:700;border-radius:6px;padding:2px 8px}
.badge.type-work_permit{background:var(--pine-tint);color:var(--pine-deep)}
.badge.type-internship{background:#EDE7F6;color:#4527A0}
.pill{border-radius:999px;padding:3px 12px;font-size:.75rem;font-weight:700;white-space:nowrap}
.pill.submitted{background:#FBEAE7;color:var(--danger)}
.pill.processing{background:#FFF3CE;color:var(--note-deep)}
.pill.ready{background:var(--pine-tint);color:var(--pine-deep)}
.pill.received{background:#E8EEF7;color:#3D5A80}
.pill.cancelled{background:var(--board);color:var(--ink-soft)}
.btn{border:none;border-radius:9px;padding:9px 16px;font-size:.88rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--pine);color:#fff}
.btn.primary:hover{background:var(--pine-deep)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink-soft)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.sm{padding:6px 11px;font-size:.78rem}
.empty{padding:44px 16px;text-align:center;color:var(--ink-soft)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--pine-tint);border-radius:12px;padding:14px;text-align:center}
.stat .num{font-family:'Mitr';font-size:1.7rem;color:var(--pine-deep);line-height:1.1}
.stat .lab{font-size:.78rem;color:var(--ink-soft)}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.panel h2{font-size:1.05rem;color:var(--pine-deep);margin-bottom:12px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;padding:8px 10px;background:var(--board);color:var(--ink-soft);font-size:.76rem;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line)}

.login-stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(160deg,var(--pine) 0%,var(--pine-deep) 60%),var(--pine)}
.login-card{background:#fff;border-radius:20px;padding:30px 26px;max-width:400px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.login-card .logo-big{width:58px;height:58px;border-radius:16px;background:var(--note);color:var(--pine-deep);display:grid;place-items:center;font-size:1.5rem;font-weight:600;margin:0 auto 12px}
.login-card h1{text-align:center;font-size:1.35rem;color:var(--pine-deep)}
.login-card .sub{text-align:center;font-size:.83rem;color:var(--ink-soft);margin-bottom:20px}
.login-card .btn{width:100%;padding:12px;font-size:1rem}
.field{margin-bottom:13px}
.field label{display:block;font-size:.83rem;font-weight:700;margin-bottom:5px}
.field input,.field select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px}
.msg{border-radius:10px;padding:10px 13px;font-size:.85rem;margin-bottom:12px;display:none}
.msg.err{display:block;background:#FBEAE7;color:var(--danger)}
.msg.ok{display:block;background:var(--pine-tint);color:var(--pine-deep)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:11px 20px;border-radius:999px;font-size:.88rem;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
#toast.show{opacity:1}
.loading{text-align:center;padding:40px;color:var(--ink-soft)}
.hidden{display:none!important}
.expwrap{margin-top:8px;font-size:.8rem;color:var(--ink-soft)}
.scope{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.scope .field{margin:0;min-width:170px}
.rhead{background:var(--pine-tint);border-radius:12px;padding:12px 16px;margin-bottom:14px}
.rhead b{font-family:'Mitr',sans-serif;color:var(--pine-deep);font-weight:600}
.note{font-size:.82rem;color:var(--ink-soft)}
.barcell{display:flex;align-items:center;gap:8px;min-width:90px}
.barcell .bar{height:10px;border-radius:5px;background:var(--pine);flex:none}
td.num,th.num{text-align:right;white-space:nowrap}
.obs{padding-left:20px}
.obs li{margin:5px 0}
</style>
</head>
<body>

<div id="loginStage" class="login-stage hidden">
  <div class="login-card">
    <div class="logo-big">📋</div>
    <h1>หนังสือฝึกงาน/อนุญาตทำงาน</h1>
    <div class="sub">สำหรับครูแนะแนว · ใช้บัญชีเดียวกับคลังแนะแนว</div>
    <div id="liMsg" class="msg"></div>
    <div class="field"><label>ชื่อผู้ใช้</label><input id="liUser" autocomplete="username"></div>
    <div class="field"><label>รหัสผ่าน</label><input id="liPass" type="password" autocomplete="current-password"></div>
    <button id="btnLogin" class="btn primary">เข้าสู่ระบบ</button>
  </div>
</div>

<div id="appStage" class="hidden">
  <header class="app"><div class="wrap">
    <div class="brand"><span class="logo">📋</span><span>หนังสือฝึกงาน/อนุญาตทำงาน<small>แนะให้แนว · จัดการคำขอนักเรียน</small></span></div>
    <div class="spacer"></div>
    <a class="iconbtn" href="index.html" title="กลับหน้าหลัก" style="text-decoration:none">🏠</a>
    <div class="userchip"><span id="uName"></span></div>
    <button class="iconbtn" id="btnLogout">ออกจากระบบ</button>
  </div></header>

  <div class="wrap">
    <nav class="folder-tabs" id="tabs">
      <button class="ftab active" data-t="queue">📥 คิวคำขอ</button>
      <button class="ftab" data-t="stats">📊 สารสนเทศ</button>
    </nav>
    <div class="folder-body" id="body"><div class="loading">กำลังโหลด…</div></div>
  </div>
</div>

<div id="toast"></div>

<script>
const SUPABASE_URL = "https://ikkhjslmtjwrxzxvtokb.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlra2hqc2xtdGp3cnh6eHZ0b2tiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NDMzNjksImV4cCI6MjA5OTMxOTM2OX0.3OR_9mEv82Ns1LLjx5nnRwJYzrtKFtWCWd1bPuQfNKU";
const EMAIL_DOMAIN = "guidance-pcw.local";
const sb = supabase.createClient(SUPABASE_URL, ANON_KEY);

const TYPE_LABEL = {work_permit:"อนุญาตทำงาน", internship:"ฝึกงาน"};
const STATUS_LABEL = {submitted:"ยื่นแล้ว", processing:"กำลังดำเนินการ", ready:"พร้อมรับ", received:"รับเอกสารแล้ว", cancelled:"ยกเลิก"};
const NEXT_STATUS = {submitted:"processing", processing:"ready", ready:"received"};
const NEXT_LABEL = {submitted:"รับเรื่อง", processing:"เอกสารเสร็จแล้ว", ready:"รับเอกสารแล้ว"};

let profile = null, curTab = "queue", statusFilter = "all", queueRows = [];

const $ = id => document.getElementById(id);
const esc = s => (s??"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){ $("toast").textContent=t; $("toast").classList.add("show"); setTimeout(()=>$("toast").classList.remove("show"),2600); }
function msg(id,t,cls){ const el=$(id); el.textContent=t; el.className="msg "+cls; }
function fmtDate(d){ if(!d) return "—"; return new Date(d).toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"2-digit"}); }

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ $("loginStage").classList.remove("hidden"); return; }
  const {data:p} = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
  if(!p || !(p.is_guidance || p.role==="admin")){
    await sb.auth.signOut();
    $("loginStage").classList.remove("hidden");
    return toast("บัญชีนี้ไม่มีสิทธิ์เข้าหน้าครู");
  }
  profile = p;
  $("loginStage").classList.add("hidden");
  $("appStage").classList.remove("hidden");
  $("uName").textContent = p.display_name;
  $("tabs").querySelectorAll(".ftab").forEach(b=> b.onclick = ()=> go(b.dataset.t));
  go("queue");
}
$("btnLogin").onclick = async ()=>{
  const u=$("liUser").value.trim(), p=$("liPass").value;
  if(!u||!p) return msg("liMsg","กรอกชื่อผู้ใช้และรหัสผ่านก่อนนะคะ","err");
  $("btnLogin").disabled = true;
  const {error} = await sb.auth.signInWithPassword({email:u+"@"+EMAIL_DOMAIN, password:p});
  $("btnLogin").disabled = false;
  if(error) return msg("liMsg","เข้าสู่ระบบไม่สำเร็จ: ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง","err");
  location.reload();
};
$("liPass").addEventListener("keydown", e=>{ if(e.key==="Enter") $("btnLogin").click(); });
$("btnLogout").onclick = async ()=>{ await sb.auth.signOut(); location.reload(); };

function go(tab){
  curTab = tab;
  $("tabs").querySelectorAll(".ftab").forEach(b=> b.classList.toggle("active", b.dataset.t===tab));
  tab==="queue" ? renderQueue() : renderStats();
}

async function fetchRequests(){
  // PostgREST ตัดที่ 1,000 แถว จึงดึงทีละ 1,000 จนหมด (เรียงด้วย created_at แล้ว id เพื่อไม่ให้หน้าซ้ำ/ตกหล่น)
  const all = [], size = 1000;
  for(let from=0;;from+=size){
    const {data, error} = await sb.from("work_permit_requests")
      .select("*, profiles!work_permit_requests_student_id_fkey(display_name, class_room)")
      .order("created_at",{ascending:false}).order("id").range(from, from+size-1);
    if(error){ toast("โหลดข้อมูลไม่สำเร็จ: "+error.message); return null; }
    all.push(...(data||[]));
    if(!data || data.length<size) break;
  }
  return all;
}

async function renderQueue(){
  $("body").innerHTML = `<div class="loading">กำลังโหลด…</div>`;
  const rows = await fetchRequests();
  if(!rows){ $("body").innerHTML = `<div class="empty">โหลดข้อมูลไม่สำเร็จ กรุณารีเฟรชหน้านี้แล้วลองใหม่</div>`; return; }
  queueRows = rows;
  const filtered = statusFilter==="all" ? rows : rows.filter(r=>r.status===statusFilter);
  const chips = ["all","submitted","processing","ready","received","cancelled"];
  const chipHtml = chips.map(c=>`<button class="chip ${statusFilter===c?'active':''}" data-f="${c}">${c==="all"?"ทั้งหมด":STATUS_LABEL[c]}</button>`).join("");
  const cardsHtml = filtered.length ? filtered.map(r=>{
    const stu = r.profiles || {};
    const nextStatus = NEXT_STATUS[r.status];
    const actionBtn = nextStatus ? `<button class="btn primary sm" data-act="${r.id}|${nextStatus}">${NEXT_LABEL[r.status]}</button>` : "";
    const cancelBtn = r.status==="submitted" ? `<button class="btn ghost sm" data-act="${r.id}|cancelled">ยกเลิกคำขอ</button>` : "";
    const letterBtn = r.request_type==="internship" ? `<button class="btn ghost sm" data-letter="${r.id}">📄 หนังสือขอความอนุเคราะห์ (.docx)</button>` : "";
    const delBtn = `<button class="btn ghost sm" style="margin-left:auto;color:var(--danger)" data-del="${r.id}|${esc(stu.display_name||"")}|${esc(r.employer_name||"")}">ลบ</button>`;
    return `<div class="reqcard">
      <div class="top">
        <div>
          <h3>${esc(stu.display_name||"—")} ${stu.class_room? "· "+esc(stu.class_room):""}</h3>
          <div class="meta">${esc(r.employer_name)} · ${esc(r.job_description)}</div>
          <div class="meta">${fmtDate(r.work_start_date)} – ${fmtDate(r.work_end_date)} · ยื่นเมื่อ ${fmtDate(r.created_at)}</div>
          ${(r.contact_phone||r.contact_email) ? `<div class="meta">ติดต่อ: ${r.contact_phone?`📞 <a href="tel:${esc(r.contact_phone)}">${esc(r.contact_phone)}</a>`:""}${r.contact_phone&&r.contact_email?" · ":""}${r.contact_email?`✉ <a href="mailto:${esc(r.contact_email)}">${esc(r.contact_email)}</a>`:""}</div>` : `<div class="meta">ติดต่อ: — (คำขอเก่า ไม่ได้กรอกไว้)</div>`}
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
          <span class="badge type-${r.request_type}">${TYPE_LABEL[r.request_type]}</span>
          <span class="pill ${r.status}">${STATUS_LABEL[r.status]}</span>
        </div>
      </div>
      <div class="foot">${actionBtn}${cancelBtn}${letterBtn}${delBtn}</div>
    </div>`;
  }).join("") : `<div class="empty">ไม่มีคำขอในสถานะนี้</div>`;
  $("body").innerHTML = `<div class="toolbar"><div class="chips">${chipHtml}</div></div>${cardsHtml}`;
  $("body").querySelectorAll("[data-f]").forEach(b=> b.onclick = ()=>{ statusFilter=b.dataset.f; renderQueue(); });
  $("body").querySelectorAll("[data-act]").forEach(b=> b.onclick = ()=> updateStatus(b.dataset.act));
  $("body").querySelectorAll("[data-del]").forEach(b=> b.onclick = ()=> deleteRequest(b.dataset.del));
  $("body").querySelectorAll("[data-letter]").forEach(b=> b.onclick = ()=> downloadLetter(b.dataset.letter));
}

async function deleteRequest(payload){
  const [id, who, place] = payload.split("|");
  if(!confirm(`ลบคำขอของ ${who||"นักเรียน"} (${place||"-"}) ถาวรใช่ไหม?\nลบแล้วกู้คืนไม่ได้ และจะไม่นับในสถิติ\n(ถ้าแค่ไม่อยากให้นับ ใช้ "ยกเลิกคำขอ" แทนได้)`)) return;
  const {data, error} = await sb.from("work_permit_requests").delete().eq("id", id).select("id");
  if(error) return toast("ลบไม่สำเร็จ: "+error.message);
  if(!data || !data.length) return toast("ลบไม่ได้ ลองรีเฟรชหน้านี้แล้วทำใหม่");
  toast("ลบคำขอแล้ว");
  renderQueue();
}

async function updateStatus(payload){
  const [id, newStatus] = payload.split("|");
  const patch = {status:newStatus};
  if(newStatus==="processing") patch.processed_by = profile.id;
  const {error} = await sb.from("work_permit_requests").update(patch).eq("id", id);
  if(error) return toast("อัปเดตไม่สำเร็จ: "+error.message);
  if(newStatus==="ready"){
    // เมื่อกด "เอกสารเสร็จแล้ว" ระบบส่งอีเมลแจ้งนักเรียนเองจากอีเมลที่กรอกตอนยื่นคำขอ
    const r = queueRows.find(x=>x.id===id);
    toast(r && !r.contact_email
      ? "อัปเดตแล้ว แต่นักเรียนคนนี้ไม่มีอีเมลในคำขอ (คำขอเก่า) กรุณาแจ้งนักเรียนด้วยวิธีอื่น"
      : "อัปเดตสถานะแล้ว ระบบกำลังส่งอีเมลแจ้งนักเรียน");
  } else toast("อัปเดตสถานะแล้ว");
  renderQueue();
}

/* ===================== สารสนเทศ + รายงานสถานที่ ===================== */
// ปีการศึกษา (พ.ศ.) และภาคเรียน นับจากวันที่ยื่นคำขอ (เวลาไทย)
//   ภาคเรียนที่ 1 = พ.ค.–ต.ค.   ภาคเรียนที่ 2 = พ.ย.–เม.ย. (ม.ค.–เม.ย. นับเป็นปีการศึกษาก่อนหน้า)
function acadOf(iso){
  const d = new Date(new Date(iso).getTime() + 7*3600*1000);
  const y = d.getUTCFullYear(), m = d.getUTCMonth()+1;
  if(m>=5 && m<=10) return {year:y+543, term:1};
  if(m>=11)         return {year:y+543, term:2};
  return {year:y+542, term:2};
}
const LEVELS = ["ม.1","ม.2","ม.3","ม.4","ม.5","ม.6"];
function levelOf(room){
  const s = (room||"").toString();
  const m = /ม\.?\s*([1-6])/.exec(s) || /^\s*([1-6])\s*\//.exec(s);
  return m ? "ม."+m[1] : "ไม่ระบุ";
}
function normPlace(s){ return (s||"").toString().normalize("NFC").replace(/[​-‍﻿]/g,"").replace(/\s+/g," ").trim(); }
const termLabel = t => t==="all" ? "ทั้งปีการศึกษา" : "ภาคเรียนที่ "+t;
const pct = (n,t) => t ? (n*100/t).toFixed(1)+"%" : "—";
const thLongDate = d => d.toLocaleDateString("th-TH",{day:"numeric",month:"long",year:"numeric"});

function buildReport(rows, year, term){
  const inScope = []; let cancelled = 0;
  rows.forEach(r=>{
    const a = acadOf(r.created_at);
    if(a.year!==year) return;
    if(term!=="all" && a.term!==Number(term)) return;
    if(r.status==="cancelled"){ cancelled++; return; }
    inScope.push({...r, _term:a.term});
  });
  const total = inScope.length;
  const byType = {internship:0, work_permit:0};
  const byTerm = {1:{internship:0,work_permit:0}, 2:{internship:0,work_permit:0}};
  const lv = {}; LEVELS.forEach(l=>lv[l]=0);
  const students = new Set(); let done = 0;
  const pm = new Map(); let noPlace = 0;
  inScope.forEach(r=>{
    const t = r.request_type==="internship" ? "internship" : "work_permit";
    byType[t]++; byTerm[r._term][t]++;
    if(r.status==="received") done++;
    students.add(r.student_id);
    const l = levelOf(r.profiles?.class_room); lv[l] = (lv[l]||0)+1;
    const nm = normPlace(r.employer_name);
    if(!nm){ noPlace++; return; }
    const key = nm.toLowerCase();
    let p = pm.get(key);
    if(!p){ p = {names:{}, internship:0, work_permit:0, count:0, st:new Set()}; pm.set(key,p); }
    p.names[nm] = (p.names[nm]||0)+1;
    p[t]++; p.count++; p.st.add(r.student_id);
  });
  const places = [...pm.values()].map(p=>({
    name: Object.entries(p.names).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"th"))[0][0],
    internship:p.internship, work_permit:p.work_permit, count:p.count, students:p.st.size
  })).sort((a,b)=>b.count-a.count||b.students-a.students||a.name.localeCompare(b.name,"th"));
  const levels = LEVELS.map(l=>({label:l, count:lv[l]}));
  if(lv["ไม่ระบุ"]) levels.push({label:"ไม่ระบุ", count:lv["ไม่ระบุ"]});

  // ข้อสังเกต (ทุกข้อมาจากตัวเลขจริง ไม่ตีความเพิ่ม)
  const obs = [];
  if(places.length){
    const topN = places[0].count, tops = places.filter(p=>p.count===topN);
    if(tops.length===1) obs.push(`สถานที่ที่นักเรียนขอมากที่สุดคือ "${tops[0].name}" จำนวน ${topN} คำขอ (${pct(topN,total)} ของคำขอทั้งหมด)`);
    else obs.push(`มีสถานที่ที่นักเรียนขอมากที่สุดเท่ากัน ${tops.length} แห่ง แห่งละ ${topN} คำขอ ได้แก่ ${tops.slice(0,3).map(p=>'"'+p.name+'"').join(", ")}${tops.length>3?" และอื่น ๆ":""}`);
    const once = places.filter(p=>p.count===1).length;
    obs.push(`มีสถานที่ทั้งหมด ${places.length} แห่ง${once?` โดย ${once} แห่งมีนักเรียนขอเพียง 1 คำขอ`:""}`);
  }
  obs.push(`หนังสือฝึกงาน ${byType.internship} คำขอ (${pct(byType.internship,total)}) และหนังสืออนุญาตทำงาน ${byType.work_permit} คำขอ (${pct(byType.work_permit,total)})`);
  const topLv = [...levels].sort((a,b)=>b.count-a.count)[0];
  if(topLv && topLv.count>0) obs.push(`ระดับชั้นที่ยื่นคำขอมากที่สุดคือ ${topLv.label} จำนวน ${topLv.count} คำขอ (${pct(topLv.count,total)})`);
  if(noPlace) obs.push(`มี ${noPlace} คำขอที่ไม่ได้ระบุชื่อสถานที่ จึงไม่นับรวมในการจัดอันดับสถานที่`);
  obs.push(`ดำเนินการเสร็จและนักเรียนรับเอกสารแล้ว ${done} คำขอ (${pct(done,total)}) อยู่ระหว่างดำเนินการ ${total-done} คำขอ${cancelled?` และมีคำขอที่ยกเลิก ${cancelled} คำขอ (ไม่นับรวมในสถิติ)`:""}`);

  return {year, term, total, noPlace, byType, byTerm, levels, places, studentCount:students.size, done, pending:total-done, cancelled, obs};
}

let allRows = [], scope = {year:null, term:"all"}, showAllPlaces = false;

async function renderStats(){
  $("body").innerHTML = `<div class="loading">กำลังโหลด…</div>`;
  const rows = await fetchRequests();
  if(!rows){ $("body").innerHTML = `<div class="empty">โหลดข้อมูลไม่สำเร็จ กรุณารีเฟรชหน้านี้แล้วลองใหม่</div>`; return; }
  allRows = rows;
  paintStats();
}

  const cur = acadOf(new Date().toISOString()).year;
  const withData = [...new Set(rows.map(r=>acadOf(r.created_at).year))];
  const years = [...new Set([cur, ...withData])].sort((a,b)=>b-a);
  if(!scope.year || !years.includes(scope.year)) scope.year = withData.includes(cur) || !withData.length ? cur : Math.max(...withData);
  const rep = buildReport(rows, scope.year, scope.term);

  const yearOpts = years.map(y=>`<option value="${y}" ${y===scope.year?"selected":""}>ปีการศึกษา ${y}</option>`).join("");
  const termOpts = [["all","ทั้งปีการศึกษา"],["1","ภาคเรียนที่ 1 (พ.ค.–ต.ค.)"],["2","ภาคเรียนที่ 2 (พ.ย.–เม.ย.)"]]
    .map(([v,l])=>`<option value="${v}" ${String(scope.term)===v?"selected":""}>${l}</option>`).join("");

  let inner;
  if(!rep.total){
    inner = `<div class="empty">ยังไม่มีคำขอใน ปีการศึกษา ${rep.year} ${termLabel(rep.term)}${rep.cancelled?` (มีคำขอที่ยกเลิก ${rep.cancelled} รายการ ซึ่งไม่นับในสถิติ)`:""}</div>`;
  } else {
    const maxP = rep.places[0].count;
    const shown = showAllPlaces ? rep.places : rep.places.slice(0,10);
    const placeRows = shown.map((p,i)=>`<tr>
      <td class="num">${i+1}</td><td>${esc(p.name)}</td>
      <td class="num">${p.internship}</td><td class="num">${p.work_permit}</td>
      <td><div class="barcell"><div class="bar" style="width:${Math.max(2,Math.round(p.count*100/maxP))}px"></div><b>${p.count}</b></div></td>
      <td class="num">${p.students}</td><td class="num">${pct(p.count,rep.total)}</td></tr>`).join("");
    const moreBtn = rep.places.length>10 ? `<button class="btn ghost sm" id="btnMorePlaces" style="margin-top:10px">${showAllPlaces?"แสดงเฉพาะ 10 อันดับแรก":"แสดงทั้งหมด "+rep.places.length+" แห่ง"}</button>` : "";
    const maxL = Math.max(1,...rep.levels.map(l=>l.count));
    const lvRows = rep.levels.map(l=>`<tr><td>${esc(l.label)}</td><td><div class="barcell"><div class="bar" style="width:${Math.round(l.count*100/maxL)*1.2+2}px"></div><b>${l.count}</b></div></td><td class="num">${pct(l.count,rep.total)}</td></tr>`).join("");
    const termPanel = String(rep.term)==="all" ? `<div class="panel"><h2>เปรียบเทียบรายภาคเรียน</h2><div class="tbl-wrap"><table>
      <thead><tr><th>ภาคเรียน</th><th class="num">ฝึกงาน</th><th class="num">อนุญาตทำงาน</th><th class="num">รวม</th></tr></thead><tbody>
      ${[1,2].map(t=>{const x=rep.byTerm[t];return `<tr><td>ภาคเรียนที่ ${t}</td><td class="num">${x.internship}</td><td class="num">${x.work_permit}</td><td class="num"><b>${x.internship+x.work_permit}</b></td></tr>`;}).join("")}
      </tbody></table></div></div>` : "";

    // นักเรียนที่ยื่นบ่อย (ดูในหน้าจอเท่านั้น ไม่ใส่ในรายงานที่เสนอผู้บริหาร)
    const byStudent = {};
    rows.filter(r=>{ const a=acadOf(r.created_at); return a.year===rep.year && (rep.term==="all"||a.term===Number(rep.term)) && r.status!=="cancelled"; })
      .forEach(r=>{ const k=r.student_id; if(!byStudent[k]) byStudent[k]={name:r.profiles?.display_name||"—", room:r.profiles?.class_room||"", count:0}; byStudent[k].count++; });
    const topStudents = Object.values(byStudent).sort((a,b)=>b.count-a.count).slice(0,8);
    const topHtml = topStudents.map(s=>`<tr><td>${esc(s.name)}${s.room?" · "+esc(s.room):""}</td><td class="num"><b>${s.count} ครั้ง</b></td></tr>`).join("");

    inner = `
    <div class="stats">
      <div class="stat"><div class="num">${rep.total}</div><div class="lab">คำขอทั้งหมด</div></div>
      <div class="stat"><div class="num">${rep.places.length}</div><div class="lab">สถานที่ทั้งหมด (แห่ง)</div></div>
      <div class="stat"><div class="num">${rep.studentCount}</div><div class="lab">นักเรียนที่ยื่น (คน)</div></div>
      <div class="stat"><div class="num">${rep.done}</div><div class="lab">รับเอกสารแล้ว</div></div>
      <div class="stat"><div class="num">${rep.byType.internship}</div><div class="lab">ฝึกงาน</div></div>
      <div class="stat"><div class="num">${rep.byType.work_permit}</div><div class="lab">อนุญาตทำงาน</div></div>
    </div>
    <div class="panel"><h2>สถานที่ที่นักเรียนขอมากที่สุด</h2>
      <div class="note" style="margin-bottom:8px">ชื่อสถานที่ที่สะกดต่างกันเล็กน้อย (เว้นวรรค ตัวพิมพ์เล็ก/ใหญ่) จะนับรวมเป็นแห่งเดียวกัน</div>
      <div class="tbl-wrap"><table>
        <thead><tr><th class="num">#</th><th>สถานที่</th><th class="num">ฝึกงาน</th><th class="num">อนุญาตทำงาน</th><th>รวมคำขอ</th><th class="num">นักเรียน (คน)</th><th class="num">ร้อยละ</th></tr></thead>
        <tbody>${placeRows}</tbody></table></div>${moreBtn}
    </div>
    <div class="panel"><h2>แยกตามระดับชั้น</h2><div class="tbl-wrap"><table>
      <thead><tr><th>ระดับชั้น</th><th>จำนวนคำขอ</th><th class="num">ร้อยละ</th></tr></thead><tbody>${lvRows}</tbody></table></div></div>
    ${termPanel}
    <div class="panel"><h2>ข้อสังเกตจากข้อมูล</h2><ul class="obs">${rep.obs.map(o=>`<li>${esc(o)}</li>`).join("")}</ul></div>
    <div class="panel"><h2>นักเรียนที่ยื่นคำขอบ่อยที่สุด</h2><div class="note" style="margin-bottom:8px">ดูได้เฉพาะในหน้านี้ ไม่แสดงในไฟล์รายงานที่เสนอผู้บริหาร</div>
      <div class="tbl-wrap"><table><tbody>${topHtml}</tbody></table></div></div>`;
  }

  $("body").innerHTML = `
    <div class="scope">
      <div class="field"><label>ปีการศึกษา</label><select id="selYear">${yearOpts}</select></div>
      <div class="field"><label>ภาคเรียน</label><select id="selTerm">${termOpts}</select></div>
      <div class="spacer"></div>
      <button class="btn primary" id="btnDocx" ${rep.total?"":"disabled"}>⬇ ดาวน์โหลดรายงาน (.docx)</button>
    </div>
    <div class="rhead"><b>รายงานปีการศึกษา ${rep.year} · ${termLabel(rep.term)}</b>
      <div class="note">นับจากวันที่ยื่นคำขอ ไม่นับคำขอที่ยกเลิก</div></div>
    ${inner}`;
  $("selYear").onchange = e=>{ scope.year = Number(e.target.value); showAllPlaces=false; paintStats(); };
  $("selTerm").onchange = e=>{ scope.term = e.target.value; showAllPlaces=false; paintStats(); };
  const mb = $("btnMorePlaces"); if(mb) mb.onclick = ()=>{ showAllPlaces=!showAllPlaces; paintStats(); };
  $("btnDocx").onclick = async ()=>{
    const b = $("btnDocx"); b.disabled = true; const old = b.textContent; b.textContent = "กำลังสร้างไฟล์…";
    try{ await downloadReport(buildReport(allRows, scope.year, scope.term)); }
    catch(e){ console.error(e); toast("สร้างไฟล์ไม่สำเร็จ ลองใหม่อีกครั้ง หรือตรวจว่าเชื่อมต่ออินเทอร์เน็ตอยู่"); }
    b.disabled = false; b.textContent = old;
  };
}

/* ---------- สร้างไฟล์ Word ---------- */
// ใส่ตัวคั่นความกว้างศูนย์ (U+200B) ระหว่างคำไทย เพื่อให้ Word ตัดบรรทัดถูกที่ (ใช้ตัวตัดคำของเบราว์เซอร์)
let _seg = null; try{ _seg = new Intl.Segmenter("th",{granularity:"word"}); }catch(e){}
function zw(t){
  if(!_seg || !t) return t;
  return t.replace(/[฀-๿]+/g, run=>{ const out=[]; for(const s of _seg.segment(run)) out.push(s.segment); return out.join("​"); });
}
const DOCX_FONT = "TH Sarabun New";

function dxRun(text, o={}){
  const sz = o.size||32;
  return new docx.TextRun({text:zw(String(text)), font:{ascii:DOCX_FONT,hAnsi:DOCX_FONT,cs:DOCX_FONT,eastAsia:DOCX_FONT},
    size:sz, sizeComplexScript:sz, bold:!!o.bold, boldComplexScript:!!o.bold, color:o.color||"000000"});
}
function dxPara(children, o={}){
  return new docx.Paragraph({children, alignment:o.align||docx.AlignmentType.LEFT,
    spacing:{before:o.before||0, after:o.after===undefined?120:o.after, line:o.line||300, lineRule:docx.LineRuleType.AUTO},
    indent:o.indent, keepNext:!!o.keepNext, keepLines:true, pageBreakBefore:!!o.pageBreak});
}
function dxTable(headers, rows, widths, aligns){
  const D = docx, line = {style:D.BorderStyle.SINGLE, size:4, color:"8FA39D"};
  const borders = {top:line,bottom:line,left:line,right:line};
  const cell = (txt,i,hdr)=> new D.TableCell({
    width:{size:widths[i], type:D.WidthType.DXA}, borders, verticalAlign:D.VerticalAlign.CENTER,
    shading: hdr ? {type:D.ShadingType.CLEAR, fill:"E2F0EC", color:"auto"} : undefined,
    margins:{top:40,bottom:40,left:80,right:80},
    children:[dxPara([dxRun(txt,{size:30,bold:hdr})],{align: hdr ? D.AlignmentType.CENTER : aligns[i], after:0, line:250})]});
  return new D.Table({
    width:{size:widths.reduce((a,b)=>a+b,0), type:D.WidthType.DXA}, columnWidths:widths,
    rows:[ new D.TableRow({tableHeader:true, cantSplit:true, children:headers.map((h,i)=>cell(h,i,true))}),
           ...rows.map(r=>new D.TableRow({cantSplit:true, children:r.map((c,i)=>cell(c,i,false))})) ]});
}
function fitText(g, text, maxW){
  if(g.measureText(text).width<=maxW) return text;
  let s = text; while(s.length>1 && g.measureText(s+"…").width>maxW) s = s.slice(0,-1);
  return s+"…";
}
async function placeChart(places){
  try{
    const top = places.slice(0,10); if(!top.length) return null;
    try{ await document.fonts.load("400 28px Sarabun"); await document.fonts.load("600 28px Sarabun"); }catch(e){}
    const W=1200, rowH=56, padV=20, labelW=480, valW=90, H=padV*2+rowH*top.length;
    const c = document.createElement("canvas"); c.width=W; c.height=H;
    const g = c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,W,H); g.textBaseline="middle";
    const max = Math.max(...top.map(p=>p.count)), barX = labelW+16, barMax = W-barX-valW-20;
    const F = "Sarabun, 'Noto Sans Thai', Tahoma, sans-serif";
    top.forEach((p,i)=>{
      const y = padV+i*rowH+rowH/2;
      g.font = "400 28px "+F; g.fillStyle="#22313A"; g.textAlign="right";
      g.fillText(fitText(g,(i+1)+". "+p.name,labelW), labelW, y);
      const w = Math.max(4, Math.round(barMax*p.count/max));
      g.fillStyle="#0F6B5C"; g.fillRect(barX, y-14, w, 28);
      g.font = "600 28px "+F; g.fillStyle="#0A4F44"; g.textAlign="left"; g.fillText(String(p.count), barX+w+10, y);
    });
    const blob = await new Promise(res=>c.toBlob(res,"image/png"));
    return {data:new Uint8Array(await blob.arrayBuffer()), w:600, h:Math.round(600*H/W)};
  }catch(e){ return null; }
}

  if(chart){
    kids.push(dxPara([new D.ImageRun({data:chart.data, transformation:{width:chart.w, height:chart.h}})],{after:40,keepNext:true,line:240}));
    kids.push(dxPara([dxRun(`แผนภาพที่ 1 สถานที่ที่นักเรียนขอมากที่สุด ${topK} อันดับแรก (จำนวนคำขอ)`,{size:28})],{after:160,align:A.CENTER}));
  }
  const prow = (p,i)=>[String(i+1),p.name,String(p.internship),String(p.work_permit),String(p.count),String(p.students),pct(p.count,rep.total)];
  const pHead = ["ลำดับ","สถานที่","ฝึกงาน","อนุญาตทำงาน","รวมคำขอ","นักเรียน (คน)","ร้อยละ"];
  const pW = [800,2500,1050,1250,1000,1250,1176], pA = [A.CENTER,A.LEFT,A.CENTER,A.CENTER,A.CENTER,A.CENTER,A.CENTER];
  kids.push(dxTable(pHead, rep.places.slice(0,10).map(prow), pW, pA));
  if(rep.places.length>10) kids.push(dxPara([dxRun(`หมายเหตุ รายชื่อสถานที่ทั้งหมด ${rep.places.length} แห่ง อยู่ในภาคผนวก`,{size:28})],{before:80}));

  H("จำนวนคำขอแยกตามระดับชั้น");
  kids.push(dxTable(["ระดับชั้น","จำนวนคำขอ","ร้อยละ"], rep.levels.map(l=>[l.label,String(l.count),pct(l.count,rep.total)]),[3026,3000,3000],[A.CENTER,A.CENTER,A.CENTER]));

  if(rep.term==="all"){
    H("เปรียบเทียบรายภาคเรียน");
    kids.push(dxTable(["ภาคเรียน","ฝึกงาน","อนุญาตทำงาน","รวม"],
      [1,2].map(t=>{const x=rep.byTerm[t]; return ["ภาคเรียนที่ "+t,String(x.internship),String(x.work_permit),String(x.internship+x.work_permit)];}),
      [3026,2000,2000,2000],[A.CENTER,A.CENTER,A.CENTER,A.CENTER]));
  }

  H("ข้อสังเกตจากข้อมูล");
  rep.obs.forEach((o,i)=>kids.push(dxPara([dxRun(`${i+1}) ${o}`)],{indent:{left:360}})));

  // ช่องลงนาม
  const R = {left:4400};
  kids.push(dxPara([dxRun("ผู้รายงาน",{bold:true})],{before:360,keepNext:true,indent:R,after:60}));
  kids.push(dxPara([dxRun("ลงชื่อ .................................")],{keepNext:true,indent:R,after:0,before:240}));
  kids.push(dxPara([dxRun(`( ${who||"................................."} )`)],{keepNext:true,indent:R,after:0}));
  kids.push(dxPara([dxRun("ครูแนะแนว")],{indent:R,after:240}));
  kids.push(dxPara([dxRun("ความเห็นของผู้บริหารโรงเรียน",{bold:true})],{keepNext:true,after:60}));
  kids.push(dxPara([dxRun(".................................................................................")],{keepNext:true,after:0}));
  kids.push(dxPara([dxRun(".................................................................................")],{keepNext:true,after:0}));
  kids.push(dxPara([dxRun("ลงชื่อ .................................")],{keepNext:true,indent:R,after:0,before:240}));
  kids.push(dxPara([dxRun("( ................................. )")],{keepNext:true,indent:R,after:0}));
  kids.push(dxPara([dxRun("ผู้อำนวยการโรงเรียนพูลเจริญวิทยาคม")],{indent:R,after:0}));

  if(rep.places.length>10){
    kids.push(dxPara([dxRun("ภาคผนวก  รายชื่อสถานที่ทั้งหมด",{size:36,bold:true})],{pageBreak:true,after:60}));
    kids.push(dxPara([dxRun(`${scopeTxt} จำนวน ${rep.places.length} แห่ง เรียงตามจำนวนคำขอ`,{size:30})],{after:120}));
    kids.push(dxTable(pHead, rep.places.map(prow), pW, pA));
  }

  const footer = new D.Footer({children:[new D.Paragraph({alignment:A.CENTER, children:[
    new D.TextRun({text:"รายงานจากระบบแนะให้แนว · หน้า ", font:DOCX_FONT, size:26, sizeComplexScript:26}),
    new D.TextRun({children:[D.PageNumber.CURRENT], font:DOCX_FONT, size:26, sizeComplexScript:26}),
    new D.TextRun({text:" จาก ", font:DOCX_FONT, size:26, sizeComplexScript:26}),
    new D.TextRun({children:[D.PageNumber.TOTAL_PAGES], font:DOCX_FONT, size:26, sizeComplexScript:26}),
  ]})]});

  return new D.Document({
    creator:"ระบบแนะให้แนว", title:"รายงานสรุปสถิติการขอหนังสือฝึกงานและหนังสืออนุญาตทำงาน "+scopeTxt,
    styles:{default:{document:{run:{font:{ascii:DOCX_FONT,hAnsi:DOCX_FONT,cs:DOCX_FONT,eastAsia:DOCX_FONT}, size:32, sizeComplexScript:32}}}},
    sections:[{properties:{page:{size:{width:11906,height:16838}, margin:{top:1440,bottom:1300,left:1440,right:1440}}},
      footers:{default:footer}, children:kids}]
  });
}

async function downloadReport(rep){
  if(typeof docx==="undefined") return toast("โหลดตัวสร้างไฟล์ไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่");
  if(!rep.total) return toast("ไม่มีข้อมูลในช่วงที่เลือก");
  const chart = await placeChart(rep.places);
  const doc = await buildDocx(rep, profile?.display_name, chart);
  const blob = await docx.Packer.toBlob(doc);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `work-permit-report_${rep.year}_${rep.term==="all"?"full-year":"term"+rep.term}.docx`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast("ดาวน์โหลดรายงานแล้ว");
}

const SIGNER_KEY = "wp_letter_signer";
const SIGNER_DEFAULT = "นางสุภาพร  รัตน์น้อย";

const THAI_DIGITS = "๐๑๒๓๔๕๖๗๘๙";
function thNum(s){ return String(s??"").replace(/[0-9]/g, d=>THAI_DIGITS[+d]); }
const TH_MONTHS = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
function ymd(iso){ const [y,m,d] = String(iso).slice(0,10).split("-").map(Number); return {y:y+543, m:m-1, d}; }
function thDateOne(iso){ const x = ymd(iso); return thNum(x.d)+" "+TH_MONTHS[x.m]+" "+thNum(x.y); }
// ช่วงวันที่แบบหนังสือราชการ: ๒๗-๒๙ ตุลาคม ๒๕๖๙ / ๓๐ ตุลาคม - ๒ พฤศจิกายน ๒๕๖๙
function thDateRange(a,b){
  if(!a) return "…………………";
  if(!b || b===a) return thDateOne(a);
  const x = ymd(a), y = ymd(b);
  if(x.y===y.y && x.m===y.m) return thNum(x.d)+"-"+thNum(y.d)+" "+TH_MONTHS[x.m]+" "+thNum(x.y);
  if(x.y===y.y) return thNum(x.d)+" "+TH_MONTHS[x.m]+" - "+thNum(y.d)+" "+TH_MONTHS[y.m]+" "+thNum(x.y);
  return thDateOne(a)+" - "+thDateOne(b);
}
const xmlEsc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function askLetterFields(r){
  const ask = (q, def) => { const v = prompt(q, def||""); return v===null ? null : v.trim(); };
  const docNo = ask("เลขที่หนังสือ เฉพาะเลขท้ายหลัง ศธ ๐๔๓๓๙.๑๐/ (เว้นว่างไว้ได้ ถ้าจะเขียนด้วยมือ)", "");
  if(docNo===null) return null;
  const recipient = ask("เรียน (ชื่อผู้รับหนังสือ / ตำแหน่ง) แก้ได้", r.employer_name||"");
  if(recipient===null) return null;
  const time = ask("เวลาฝึก", "๐๙.๐๐ - ๑๕.๐๐ น.");
  if(time===null) return null;
  let signer = SIGNER_DEFAULT;
  try{ signer = localStorage.getItem(SIGNER_KEY) || SIGNER_DEFAULT; }catch(e){}
  signer = ask("ชื่อผู้อำนวยการที่ลงนาม (จะจำไว้ในเครื่องนี้)", signer);
  if(signer===null) return null;
  try{ localStorage.setItem(SIGNER_KEY, signer); }catch(e){}
  return {docNo, recipient, time, signer};
}

function b64ToBytes(b64){ const bin = atob(b64), u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }

async function buildLetterBlob(r, stu, f){
  const zip = await JSZip.loadAsync(b64ToBytes(LETTER_TEMPLATE_B64));
  let xml = await zip.file("word/document.xml").async("string");
  const place = (r.employer_name||"").trim();
  const cls = String(stu.class_room||"").replace(/^ม\.?\s*/,"");          // "ม.6/4" -> "6/4"
  const today = new Date().toISOString().slice(0,10);
  const vals = {
    DOCNO: f.docNo ? thNum(f.docNo) : "……..",
    DATE: thDateOne(today),
    RECIPIENT: f.recipient || place,
    STUDENT: stu.display_name || "………………………",
    CLASS: thNum(cls) || "……",
    PLACE: place || "………………………",
    DATES: thDateRange(r.work_start_date, r.work_end_date),
    TIME: f.time || "๐๙.๐๐ - ๑๕.๐๐ น.",
    SIGNER: f.signer || SIGNER_DEFAULT
  };
  for(const k in vals) xml = xml.split("{{"+k+"}}").join(xmlEsc(vals[k]));
  zip.file("word/document.xml", xml);
  return zip.generateAsync({type:"blob", mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document", compression:"DEFLATE"});
}

async function downloadLetter(id){
  if(typeof JSZip==="undefined") return toast("โหลดตัวสร้างไฟล์ไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่");
  const r = queueRows.find(x=>x.id===id);
  if(!r) return toast("ไม่พบคำขอ ลองรีเฟรชหน้านี้");
  const f = askLetterFields(r);
  if(!f) return;
  const stu = r.profiles || {};
  const blob = await buildLetterBlob(r, stu, f);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `หนังสือขอความอนุเคราะห์ฝึกงาน_${(stu.display_name||"นักเรียน").replace(/\s+/g,"_")}.docx`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast("ดาวน์โหลดหนังสือแล้ว");
}
